<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0A0A;
      --surface-1: #111111;
      --surface-2: #161616;
      --surface-3: #1B1B1B;
      --primary:   #3ECF8E;
      --secondary: #4F46E5;
      --text-1:    #FFFFFF;
      --text-2:    #A1A1AA;
      --text-3:    #52525B;
      --border:    rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  8px;
      --radius-input: 6px;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Topbar ─── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
    .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      background: transparent;
      color: var(--text-2);
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-outline:hover {
      border-color: var(--border-hover);
      color: var(--text-1);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #0A0A0A;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: transparent;
      border: none;
      border-radius: var(--radius-input);
      color: var(--text-3);
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .btn-ghost:hover { color: var(--text-2); background: var(--surface-2); }

    /* ─── Telas ─── */
    .tela { display: none; max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
    .tela.ativa { display: block; }

    /* ─── Tela Login / Loading ─── */
    .login-box {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 32px;
      text-align: center;
      margin-top: 32px;
    }
    .login-box .login-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-3);
      border-radius: 12px;
      margin: 0 auto 20px;
      color: var(--primary);
    }
    .login-box h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 6px;
    }
    .login-box p {
      color: var(--text-2);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .spinner-inline {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 20px auto 0;
    }

    /* ─── Tela Lista ─── */
    .greeting-block {
      margin-bottom: 28px;
    }
    .greeting-block h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }
    .greeting-block .greeting-date {
      font-size: 0.85rem;
      color: var(--text-2);
      margin-top: 4px;
    }

    .list-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 24px;
    }

    .date-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 20px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-group-label:first-child { margin-top: 0; }

    .badge-pendente-label {
      font-size: 10px;
      font-weight: 700;
      color: #F59E0B;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }

    .card-agenda {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .card-agenda:hover { border-color: var(--border-hover); }
    .card-agenda.disabled { opacity: 0.65; cursor: default; }
    .card-agenda.disabled:hover { border-color: var(--border); }

    .ca-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .ca-cliente {
      font-weight: 600;
      color: var(--text-1);
      font-size: 0.9rem;
    }
    .ca-detalhe {
      font-size: 0.8rem;
      color: var(--text-2);
      margin-top: 3px;
    }
    .ca-servico {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 6px;
    }
    .ca-badge-row { margin-top: 10px; }

    /* Status badges inline */
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-status i { width: 12px; height: 12px; }
    .badge-aprovada {
      background: rgba(62,207,142,0.1);
      color: var(--primary);
      border: 1px solid rgba(62,207,142,0.2);
    }
    .badge-reprovada {
      background: rgba(239,68,68,0.1);
      color: #EF4444;
      border: 1px solid rgba(239,68,68,0.2);
    }
    .badge-pendente {
      background: rgba(245,158,11,0.1);
      color: #F59E0B;
      border: 1px solid rgba(245,158,11,0.2);
    }

    /* Card status dot (confirmado etc.) */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .dot-confirmado { background: var(--primary); }
    .dot-nao_confirmado { background: #F59E0B; }
    .dot-viagem { background: #3B82F6; }
    .dot-cuiaba { background: #8B5CF6; }
    .dot-default { background: var(--text-3); }

    /* Lista vazia */
    .lista-vazia {
      text-align: center;
      padding: 56px 24px;
      color: var(--text-3);
    }
    .lista-vazia i { width: 40px; height: 40px; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
    .lista-vazia p { font-size: 0.9rem; color: var(--text-2); margin-bottom: 4px; }
    .lista-vazia small { font-size: 0.8rem; color: var(--text-3); }

    /* ─── Tela Formulário ─── */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 20px;
      padding: 0;
      transition: color 0.15s;
    }
    .btn-back:hover { color: var(--text-2); }
    .btn-back i { width: 14px; height: 14px; }

    .os-header {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .os-numero {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .os-cliente {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
    }
    .os-meta {
      font-size: 0.78rem;
      color: var(--text-2);
      margin-top: 3px;
    }

    .secao {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 20px;
      margin-bottom: 12px;
    }
    .secao-titulo {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 10px 12px;
      color: var(--text-1);
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      appearance: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: rgba(62,207,142,0.5);
    }
    .form-group select { cursor: pointer; }
    .form-group select option { background: var(--surface-2); }
    .form-group textarea { resize: vertical; min-height: 72px; }
    .form-group input[type="time"] { color-scheme: dark; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Toggle sim/não */
    .toggle-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text-3);
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .toggle-btn:hover { border-color: var(--border-hover); color: var(--text-2); }
    .toggle-btn.ativo-sim {
      background: var(--primary);
      border-color: var(--primary);
      color: #0A0A0A;
    }
    .toggle-btn.ativo-nao {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text-2);
    }

    .campo-condicional { display: none; margin-top: 8px; }
    .campo-condicional.visivel { display: block; }

    /* Upload de fotos */
    .upload-area {
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: var(--radius-input);
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      background: var(--bg);
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-area:hover,
    .upload-area.dragover {
      border-color: rgba(62,207,142,0.3);
      background: rgba(62,207,142,0.03);
    }
    .upload-area i { width: 24px; height: 24px; color: var(--text-3); margin-bottom: 8px; }
    .upload-texto {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-2);
    }
    .upload-sub {
      font-size: 0.72rem;
      color: var(--text-3);
      margin-top: 3px;
    }
    #foto-input { display: none; }

    .fotos-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .foto-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius-input);
      overflow: hidden;
      background: var(--surface-2);
    }
    .foto-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .foto-thumb .remover {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.75);
      color: #EF4444;
      border: none;
      border-radius: 4px;
      width: 20px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .foto-thumb .remover:hover { background: rgba(239,68,68,0.3); }
    .foto-uploading {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-1);
      font-weight: 700;
    }

    /* Botão enviar */
    .btn-enviar {
      width: 100%;
      height: 44px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #0A0A0A;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }
    .btn-enviar:hover { opacity: 0.88; }
    .btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-enviar i { width: 16px; height: 16px; }

    /* ─── Tela Sucesso ─── */
    .sucesso-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 64px 24px;
    }
    .sucesso-icon {
      width: 64px;
      height: 64px;
      background: rgba(62,207,142,0.1);
      border: 1px solid rgba(62,207,142,0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--primary);
    }
    .sucesso-icon i { width: 32px; height: 32px; }
    .sucesso-box h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .sucesso-box p {
      color: var(--text-2);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 320px;
    }
    .sucesso-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-sucesso-secondary {
      padding: 9px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      background: transparent;
      color: var(--text-2);
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-sucesso-secondary:hover { border-color: var(--border-hover); color: var(--text-1); }
    .btn-sucesso-primary {
      padding: 9px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #0A0A0A;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-sucesso-primary:hover { opacity: 0.88; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<!-- TELA 1: CARREGANDO / IDENTIFICAÇÃO -->
<div class="tela ativa" id="tela-login">
  <div class="login-box">
    <div class="login-icon">
      <i data-lucide="hard-hat"></i>
    </div>
    <h2>Ordem de Serviço</h2>
    <p id="login-msg">Verificando autenticação...</p>
    <div class="spinner-inline" id="login-spinner"></div>
  </div>
</div>

<!-- TELA 2: AGENDAMENTOS -->
<div class="tela" id="tela-lista">
  <div class="greeting-block">
    <h2 id="saudacao">Bom dia!</h2>
    <div class="greeting-date" id="data-hoje"></div>
  </div>
  <div id="lista-agendamentos"></div>
</div>

<!-- TELA 3: FORMULÁRIO OS -->
<div class="tela" id="tela-form">
  <button class="btn-back" onclick="voltarLista()">
    <i data-lucide="arrow-left"></i>
    Voltar
  </button>

  <div class="os-header" id="os-cabecalho">
    <div class="os-numero" id="os-numero">Nova OS</div>
    <div class="os-cliente" id="os-cliente">—</div>
    <div class="os-meta" id="os-meta">—</div>
  </div>

  <!-- Identificação -->
  <div class="secao">
    <div class="secao-titulo">Informações gerais</div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo de serviço</label>
        <select id="f-tipo">
          <option value="execucao">Execução de projeto</option>
          <option value="assistencia">Assistência técnica</option>
        </select>
      </div>
      <div class="form-group">
        <label>Auxiliar (opcional)</label>
        <select id="f-auxiliar"><option value="">Nenhum</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Horário início</label>
        <input type="time" id="f-inicio"/>
      </div>
      <div class="form-group">
        <label>Horário fim</label>
        <input type="time" id="f-fim"/>
      </div>
    </div>
  </div>

  <!-- Serviços -->
  <div class="secao">
    <div class="secao-titulo">Serviços</div>
    <div class="form-group">
      <label>O que foi realizar</label>
      <textarea id="f-planejado" rows="2" placeholder="Descreva o serviço planejado..."></textarea>
    </div>
    <div class="form-group">
      <label>O que foi realizado</label>
      <textarea id="f-realizado" rows="3" placeholder="Descreva o que foi feito..."></textarea>
    </div>
  </div>

  <!-- Ocorrências -->
  <div class="secao">
    <div class="secao-titulo">Materiais e Problemas</div>

    <div class="form-group">
      <label>Houve algum problema?</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="prob-sim" onclick="toggle('prob','sim')">Sim</button>
        <button class="toggle-btn ativo-nao" id="prob-nao" onclick="toggle('prob','nao')">Não</button>
      </div>
      <div class="campo-condicional" id="campo-prob">
        <textarea id="f-problema" rows="2" placeholder="Descreva o problema..."></textarea>
      </div>
    </div>

    <div class="form-group">
      <label>Faltou material?</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="mat-sim" onclick="toggle('mat','sim')">Sim</button>
        <button class="toggle-btn ativo-nao" id="mat-nao" onclick="toggle('mat','nao')">Não</button>
      </div>
      <div class="campo-condicional" id="campo-mat">
        <textarea id="f-material" rows="2" placeholder="Liste os materiais que faltaram..."></textarea>
      </div>
    </div>

    <div class="form-group">
      <label>Retornou material?</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="ret-sim" onclick="toggle('ret','sim')">Sim</button>
        <button class="toggle-btn ativo-nao" id="ret-nao" onclick="toggle('ret','nao')">Não</button>
      </div>
      <div class="campo-condicional" id="campo-ret">
        <textarea id="f-retorno" rows="2" placeholder="Liste os materiais retornados..."></textarea>
      </div>
    </div>

    <div class="form-group">
      <label>Retornou equipamento para assistência?</label>
      <div class="toggle-group">
        <button class="toggle-btn" id="eqp-sim" onclick="toggle('eqp','sim')">Sim</button>
        <button class="toggle-btn ativo-nao" id="eqp-nao" onclick="toggle('eqp','nao')">Não</button>
      </div>
      <div class="campo-condicional" id="campo-eqp">

// ── Agendamentos do dia ──────────────────────────────────────
async function carregarAgendamentosHoje() {
  const hoje = new Date().toISOString().split('T')[0];
  const passado = new Date();
  passado.setDate(passado.getDate() - 14);
  const dataInicio = passado.toISOString().split('T')[0];

  // Busca agendamentos E OSs do técnico em paralelo
  const [{ data, error }, { data: minhasOS }] = await Promise.all([
    db.from('agendamentos')
      .select('*, obras(id, nome_cliente, endereco, consultores(id))')
      .gte('data', dataInicio)
      .or(`tecnico_id.eq.${tecnicoLogado.id},auxiliar_id.eq.${tecnicoLogado.id}`)
      .order('data', { ascending: true })
      .order('hora_inicio', { ascending: true }),
    db.from('ordens_de_servico')
      .select('obra_id, status_aprovacao, data_servico, criado_em')
      .eq('tecnico_id', tecnicoLogado.id)
      .gte('criado_em', dataInicio + 'T00:00:00')
  ]);

  const lista = document.getElementById('lista-agendamentos');

  if (error || !data || data.length === 0) {
    lista.innerHTML = `
      <div class="lista-vazia">
        <i data-lucide="calendar-x"></i>
        <p>Nenhum agendamento a partir de hoje.</p>
        <small>Use "+ Nova OS" se necessário.</small>
      </div>`;
    lucide.createIcons();
    return;
  }

  // Monta mapa: "obra_id|data" → status_aprovacao
  const osMap = {};
  (minhasOS || []).forEach(os => {
    const dataRef = os.data_servico || (os.criado_em ? os.criado_em.slice(0,10) : null);
    if (os.obra_id && dataRef) {
      const chave = `${os.obra_id}|${dataRef}`;
      // Prioriza concluida > pendente
      const prioridade = { concluida: 3, aprovada: 3, pendente: 2, reprovada: 1 };
      if (!osMap[chave] || (prioridade[os.status_aprovacao] || 0) > (prioridade[osMap[chave]] || 0)) {
        osMap[chave] = os.status_aprovacao === 'aprovada' ? 'concluida' : os.status_aprovacao;
      }
    }
  });

  // Agrupa por data
  const porData = {};
  data.forEach(ag => {
    if (!porData[ag.data]) porData[ag.data] = [];
    porData[ag.data].push(ag);
  });

  const DIAS  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  let html = '';
  Object.entries(porData).forEach(([dataAg, ags]) => {
    const d = new Date(dataAg + 'T12:00:00');
    const isHoje    = dataAg === hoje;
    const isPassado = dataAg < hoje;

    // Verifica cards desta data que não foram aprovados
    const cardsHtml = ags.map(ag => {
      const obraId = ag.obras?.id;
      const chave  = `${obraId}|${dataAg}`;
      const statusOS = obraId ? osMap[chave] : undefined;

      // OS aprovada → não mostra o card
      if (statusOS === 'aprovada') return '';

      const hora    = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '';
      const cliente = ag.obras?.nome_cliente || '—';
      const end     = ag.obras?.endereco || '';

      const dotClass = {
        confirmado: 'dot-confirmado',
        nao_confirmado: 'dot-nao_confirmado',
        viagem: 'dot-viagem',
        cuiaba: 'dot-cuiaba'
      }[ag.status] || 'dot-default';

      let badgeHtml = '';
      if (statusOS === 'reprovada') {
        badgeHtml = `<div class="ca-badge-row"><span class="badge-status badge-reprovada"><i data-lucide="x-circle"></i>OS reprovada — refazer</span></div>`;
      } else if (statusOS === 'pendente') {
        badgeHtml = `<div class="ca-badge-row"><span class="badge-status badge-pendente"><i data-lucide="clock"></i>Aguardando aprovação</span></div>`;
      }

      const isPendente = statusOS === 'pendente';

      return `
        <div class="card-agenda${isPendente ? ' disabled' : ''}" ${isPendente ? '' : `onclick="abrirFormulario(${ag.id})"`}>
          <div class="ca-top">
            <div>
              <div class="ca-cliente">${cliente}</div>
              <div class="ca-detalhe">${hora ? hora + ' &middot; ' : ''}${end || 'Endereço não informado'}</div>
              ${ag.servico ? `<div class="ca-servico">${ag.servico}</div>` : ''}
            </div>
            <span class="status-dot ${dotClass}"></span>
          </div>
          ${badgeHtml}
        </div>`;
    }).join('');

    // Se todos os cards desta data foram aprovados, não mostra a seção do dia
    if (!cardsHtml.trim()) return;

    // Verifica se há OS pendente neste dia para o label
    const temPendente = ags.some(ag => {
      const chave = `${ag.obras?.id}|${dataAg}`;
      return isPassado && !osMap[chave];
    });

    let labelData = '';
    let labelExtra = '';

    if (isHoje) {
      labelData = 'Hoje';
    } else if (isPassado && temPendente) {
      labelData = `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`;
      labelExtra = `<span class="badge-pendente-label">PENDENTE</span>`;
    } else {
      labelData = `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`;
    }

    html += `
      <div class="date-group-label">${labelData}${labelExtra}</div>
      ${cardsHtml}`;
  });

  lista.innerHTML = html || `
    <div class="lista-vazia">
      <i data-lucide="calendar-check"></i>
      <p>Todos os agendamentos foram concluídos.</p>
      <small>Use "+ Nova OS" se necessário.</small>
    </div>`;

  lucide.createIcons();
}

// ── Toggles sim/não ──────────────────────────────────────────
const toggleState = {prob:'nao', mat:'nao', ret:'nao', eqp:'nao'};
function toggle(campo, valor) {
  toggleState[campo] = valor;
  document.getElementById(`${campo}-sim`).className = 'toggle-btn' + (valor==='sim'?' ativo-sim':'');
  document.getElementById(`${campo}-nao`).className = 'toggle-btn' + (valor==='nao'?' ativo-nao':'');
  const cond = document.getElementById(`campo-${campo}`);
  cond.classList.toggle('visivel', valor==='sim');
}

function resetarForm() {
  ['prob','mat','ret','eqp'].forEach(c => toggle(c,'nao'));
  ['f-planejado','f-realizado','f-problema','f-material','f-retorno','f-equipamentos','f-proximas','f-obs']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-auxiliar').value = '';
  document.getElementById('f-tipo').value = 'execucao';
  document.getElementById('f-automacao').value = '';
  document.getElementById('f-inicio').value = '';
  document.getElementById('f-fim').value = '';
  document.getElementById('os-numero').textContent = 'Nova OS';
  document.getElementById('os-cliente').textContent = '—';
  document.getElementById('os-meta').textContent = '—';
  // Reset fotos
  fotosSelecionadas = [];
  document.getElementById('fotos-grid').innerHTML = '';
}

// ── Upload de fotos ──────────────────────────────────────────
function adicionarFotos(files) {
  Array.from(files).forEach(file => {
    if (file.size > 10 * 1024 * 1024) { alert(`${file.name} é maior que 10MB.`); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const entry = { file, preview: e.target.result, id: Date.now() + Math.random() };
      fotosSelecionadas.push(entry);
      renderFotos();
    };
    reader.readAsDataURL(file);
  });
}

function renderFotos() {
  document.getElementById('fotos-grid').innerHTML = fotosSelecionadas.map(f => `
    <div class="foto-thumb" id="thumb-${f.id}">
      <img src="${f.preview}" alt="foto">
      <button class="remover" onclick="removerFoto(${f.id})">&#x2715;</button>
    </div>
  `).join('');
}

function removerFoto(id) {
  fotosSelecionadas = fotosSelecionadas.filter(f => f.id !== id);
  renderFotos();
}

async function uploadFotos(obraId) {
  const urls = [];
  for (let i = 0; i < fotosSelecionadas.length; i++) {
    const f = fotosSelecionadas[i];
    const ext = f.file.name.split('.').pop().toLowerCase() || 'jpg';
    const path = `obras/${obraId}/${Date.now()}_${i}.${ext}`;

    const thumb = document.getElementById(`thumb-${f.id}`);
    if (thumb) thumb.innerHTML += `<div class="foto-uploading">${i+1}/${fotosSelecionadas.length}</div>`;

    const { error } = await db.storage.from('fotos-os').upload(path, f.file, { contentType: f.file.type });
    if (!error) {
      const { data: urlData } = db.storage.from('fotos-os').getPublicUrl(path);
      urls.push(urlData.publicUrl);
    }
  }
  return urls;
}

// ── Enviar OS ────────────────────────────────────────────────
async function enviarOS() {
  const btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    // Upload de fotos
    let fotoUrls = [];
    const obraId = agendamentoSelecionado?.obras?.id || null;
    if (fotosSelecionadas.length > 0 && obraId) {
      btn.textContent = `Enviando ${fotosSelecionadas.length} foto(s)...`;
      fotoUrls = await uploadFotos(obraId);
    }

    const payload = {
      obra_id:             obraId,
      tecnico_id:          tecnicoLogado?.id || null,
      auxiliar_id:         document.getElementById('f-auxiliar').value || null,
      consultor_id:        agendamentoSelecionado?.obras?.consultores?.id || null,
      tipo_servico:        document.getElementById('f-tipo').value,
      horario_inicio:      document.getElementById('f-inicio').value || null,
      horario_fim:         document.getElementById('f-fim').value || null,
      servico_planejado:   document.getElementById('f-planejado').value || null,
      servicos_realizados: document.getElementById('f-realizado').value || null,
      houve_problema:      toggleState.prob === 'sim',
      descricao_problema:  toggleState.prob === 'sim' ? document.getElementById('f-problema').value : null,
      faltou_material:     toggleState.mat  === 'sim',
      lista_material:      toggleState.mat  === 'sim' ? document.getElementById('f-material').value : null,
      retornou_material:   toggleState.ret  === 'sim',
      lista_retorno:       toggleState.ret  === 'sim' ? document.getElementById('f-retorno').value : null,
      sistema_automacao:   document.getElementById('f-automacao').value || null,
      retorno_equipamento: toggleState.eqp  === 'sim',
      lista_equipamentos:  toggleState.eqp  === 'sim' ? document.getElementById('f-equipamentos').value : null,
      proximas_atividades: document.getElementById('f-proximas').value || null,
      observacoes:         document.getElementById('f-obs').value || null,
      fotos_urls:          fotoUrls.length > 0 ? fotoUrls : null,
      data_servico:        agendamentoSelecionado?.data || new Date().toISOString().split('T')[0],
      status_aprovacao:    'concluida',
      criado_em:           new Date().toISOString(),
    };

    btn.textContent = 'Salvando...';
    let { error } = await db.from('ordens_de_servico').insert(payload);

    // Fallback: se data_servico não existe no banco, tenta sem ela
    if (error && error.message && error.message.includes('data_servico')) {
      const payloadSemData = { ...payload };
      delete payloadSemData.data_servico;
      const res2 = await db.from('ordens_de_servico').insert(payloadSemData);
      error = res2.error;
    }

    if (error) { alert('Erro ao enviar OS: ' + error.message); return; }

    const num = document.getElementById('os-numero').textContent;
    document.getElementById('sucesso-msg').textContent =
      `${num} registrada com sucesso para ${agendamentoSelecionado?.obras?.nome_cliente || 'o cliente'}.`
      + (fotoUrls.length > 0 ? ` ${fotoUrls.length} foto(s) anexada(s).` : '');
    mostrarTela('tela-sucesso');

  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="send"></i> Enviar Ordem de Serviço';
    lucide.createIcons();
  }
}

function novaOS() { mostrarTela('tela-lista'); }
function voltarLista() { mostrarTela('tela-lista'); }
function irHistorico() { window.location.href = 'tecnico_dashboard.html'; }

function mostrarTela(id) {
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
  window.scrollTo(0, 0);
}

// Drag & drop
const uploadArea = document.getElementById('upload-area');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('dragover'); adicionarFotos(e.dataTransfer.files); });

init();
</script>
