<!DOCTYPE html>
<!-- build: 2026-05-31d -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetista — Solução Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #0A0A0A;
    --surface-1: #111111;
    --surface-2: #161616;
    --surface-3: #1B1B1B;
    --primary:   #3ECF8E;
    --primary-hover: #2EBF7E;
    --primary-muted: rgba(62,207,142,0.1);
    --text-1:    #FFFFFF;
    --text-2:    #A1A1AA;
    --text-3:    #52525B;
    --border:    rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.12);
    --radius:    8px;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Topbar ── */
  .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
  .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
  .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
  .topbar-links { display:flex; align-items:center; gap:4px; }
  .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
  .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
  .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
  .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
  .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

  /* ── Layout ── */
  .container { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

  /* ── Page header ── */
  .page-header { margin-bottom: 28px; }
  .page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
  .page-header p { font-size: 14px; color: var(--text-2); }

  /* ── Stats row ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-label i { width: 13px; height: 13px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--text-1); letter-spacing: -0.5px; line-height: 1; }
  .stat-sub { font-size: 12px; color: var(--text-3); margin-top: 6px; }

  /* ── Cards ── */
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }

  .card-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .card-title { font-size: 14px; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
  .card-title i { width: 15px; height: 15px; color: var(--text-3); }

  /* ── Search ── */
  .search-bar { display: flex; gap: 10px; }
  .search-bar input {
    padding: 7px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-1);
    outline: none;
    min-width: 220px;
    transition: border-color .15s;
  }
  .search-bar input::placeholder { color: var(--text-3); }
  .search-bar input:focus { border-color: rgba(62,207,142,0.4); }

  /* ── Obras grid ── */
  .obras-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    padding: 20px;
  }

  .obra-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    text-decoration: none;
    display: block;
    color: inherit;
  }

  .obra-card:hover { border-color: var(--border-strong); background: var(--surface-3); }

  .obra-nome { font-size: 14px; font-weight: 600; color: var(--text-1); margin-bottom: 4px; }
  .obra-cliente { font-size: 12px; color: var(--text-3); margin-bottom: 14px; }

  .obra-meta { display: flex; flex-direction: column; gap: 7px; }

  .obra-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }

  .meta-label { color: var(--text-3); display: flex; align-items: center; gap: 5px; }
  .meta-label i { width: 12px; height: 12px; }
  .meta-value { color: var(--text-2); font-weight: 500; }

  /* ── Badges ── */
  .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-andamento  { background: rgba(62,207,142,0.1); color: #3ECF8E; }
  .badge-pausada    { background: rgba(245,158,11,0.12); color: #FBBF24; }
  .badge-concluida  { background: rgba(99,102,241,0.12); color: #818CF8; }
  .badge-entregue   { background: rgba(20,184,166,0.12); color: #2DD4BF; }
  .badge-pre_vistoria { background: rgba(234,88,12,0.12); color: #FB923C; }
  .badge-pos_vistoria { background: rgba(6,182,212,0.12); color: #67E8F9; }
  .badge-default    { background: rgba(255,255,255,0.06); color: var(--text-3); }

  /* ── OS bar ── */
  .os-bar-wrap { margin-top: 12px; }
  .os-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-bottom: 5px; }
  .os-bar { height: 4px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .os-bar-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }

  /* ── States ── */
  .state-msg { padding: 40px 20px; text-align: center; color: var(--text-3); font-size: 13px; }

  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .obras-grid { grid-template-columns: 1fr; }
  }

  /* ── TEMA CLARO ── */
  :root[data-theme="light"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); }
  @media (prefers-color-scheme: light) { :root[data-theme="auto"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); } }
  .tema-btn { background:transparent; border:1px solid var(--border-strong,rgba(255,255,255,.12)); border-radius:6px; color:var(--text-2,#A1A1AA); font-size:15px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-right:8px; flex-shrink:0; }
  .tema-btn:hover { background:rgba(128,128,128,.1); }

  /* ── RESPONSIVO ── */
  @media (max-width: 1024px) {
    .topbar-links a { font-size: 12px; padding: 5px 9px; }
  }
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; }
    .topbar-greeting { display: none !important; }
    .topbar-links { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .topbar-links a { font-size: 12px; padding: 5px 8px; white-space: nowrap; }
    .container { padding: 0 12px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    main { padding: 20px 12px !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .card { padding: 16px !important; }
    .page-header h1 { font-size: 18px !important; }
    .modal, .modal-content { border-radius: 0 !important; max-width: 100% !important; max-height: 100dvh !important; }
    .modal-overlay, .overlay { padding: 0 !important; align-items: flex-end !important; }
    table { font-size: 12px; min-width: 500px; }
    .table-wrap, .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  @media (max-width: 480px) {
    .topbar-logo { font-size: 13px; }
    .stats-grid { grid-template-columns: 1fr !important; }
    .stat-card { padding: 14px !important; }
    .btn, button { font-size: 12px; }
  }

  /* ── Mobile: evita auto-zoom iOS (inputs precisam de 16px) ── */
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<div class="container">

  <div class="page-header">
    <h1>Painel do Projetista</h1>
    <p>Acompanhe obras e ordens de serviço do seu escopo</p>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label"><i data-lucide="layers"></i> Total de Obras</div>
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-sub">no sistema</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i data-lucide="activity"></i> Em Andamento</div>
      <div class="stat-value" id="statAndamento" style="color:var(--primary)">—</div>
      <div class="stat-sub">obras ativas</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><i data-lucide="clipboard-check"></i> OSs Executadas</div>
      <div class="stat-value" id="statOs" style="color:#818CF8">—</div>
      <div class="stat-sub">ordens concluídas</div>
    </div>
  </div>

  <!-- Grid de obras -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <i data-lucide="grid-3x3"></i>
        Obras
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nome ou cliente...">
      </div>
    </div>

    <div id="loadingState" class="state-msg">Carregando obras...</div>
    <div id="obrasGrid" class="obras-grid" style="display:none;"></div>
    <div id="emptyState" class="state-msg" style="display:none;">Nenhuma obra encontrada.</div>
  </div>

</div>

<script>

let allObras = [];
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();
  if (!eu || eu.role !== 'projetista') {
    window.location.href = 'obras.html';
    return;
  }

  renderTopbar(eu.nome, eu.role, 'projetista');
  await carregarObras();

  document.getElementById('searchInput').addEventListener('input', debounce(renderGrid));
})();

async function carregarObras() {
  const { data, error } = await db
    .from('obras')
    .select('id, nome_cliente, endereco, fase_atual, ordens_de_servico(id, status_aprovacao)')
    .order('criado_em', { ascending: false });

  if (error || !data) { document.getElementById('loadingState').textContent = 'Erro ao carregar obras.'; return; }

  allObras = data;

  const totalOs = data.reduce((acc, o) => acc + (o.ordens_de_servico || []).filter(s => s.status_aprovacao === 'concluida').length, 0);
  document.getElementById('statTotal').textContent = data.length;
  document.getElementById('statAndamento').textContent = data.filter(o => !['entrega_comercial'].includes(o.fase_atual)).length;
  document.getElementById('statOs').textContent = totalOs;

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('obrasGrid').style.display = 'grid';
  renderGrid();
}

function renderGrid() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allObras.filter(o =>
    !search || (o.nome_cliente || '').toLowerCase().includes(search)
  );

  const grid = document.getElementById('obrasGrid');
  grid.innerHTML = '';

  if (filtered.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    grid.style.display = 'none';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  grid.style.display = 'grid';

  filtered.forEach(o => {
    const os = o.ordens_de_servico || [];
    const osConcluidas = os.filter(s => s.status_aprovacao === 'concluida').length;
    const osTotal = os.length;
    const pct = osTotal > 0 ? Math.round((osConcluidas / osTotal) * 100) : 0;
    const etapaBadge = badgeEtapa(o.fase_atual);

    grid.innerHTML += `
      <a class="obra-card" href="obra_detail.html?id=${o.id}">
        <div class="obra-nome">${escHtml(o.nome_cliente || '—')}</div>
        <div class="obra-cliente">${escHtml(o.endereco || 'Endereço não informado')}</div>
        <div class="obra-meta">
          <div class="obra-meta-row">
            <span class="meta-label"><i data-lucide="map-pin"></i> Endereço</span>
            <span class="meta-value">${escHtml(o.endereco || '—')}</span>
          </div>
          <div class="obra-meta-row">
            <span class="meta-label"><i data-lucide="layers"></i> Etapa</span>
            <span>${etapaBadge}</span>
          </div>
        </div>
        ${osTotal > 0 ? `
        <div class="os-bar-wrap">
          <div class="os-bar-labels">
            <span>OSs concluídas</span>
            <span>${osConcluidas}/${osTotal} (${pct}%)</span>
          </div>
          <div class="os-bar"><div class="os-bar-fill" style="width:${pct}%"></div></div>
        </div>` : ''}
      </a>`;
  });

  lucide.createIcons();
}

function badgeEtapa(fase_atual) {
  const map = {
    'nao_iniciado':      ['badge-default','Não iniciado'],
    'projeto_iniciado':  ['badge-andamento','Projeto iniciado'],
    'projeto_concluido': ['badge-concluida','Projeto concluído'],
    'cabeamento':        ['badge-andamento','Cabeamento'],
    'eletrica':          ['badge-andamento','Elétrica'],
    'audio_video':       ['badge-andamento','Áudio e vídeo'],
    'automacao':         ['badge-andamento','Automação'],
    'em_finalizacao':    ['badge-pausada','Em finalização'],
    'entrega_comercial': ['badge-entregue','Entrega comercial'],
  };
  const [cls, label] = map[fase_atual] || ['badge-default', fase_atual || '—'];
  return `<span class="badge ${escHtml(cls)}">${escHtml(label)}</span>`;
}
</script>
<script>lucide.createIcons(); applyTheme(localStorage.getItem('tema') || 'auto');</script>
</body>
</html>
