<!DOCTYPE html>
<!-- build: 2026-06-18 — RH: aba Dashboard (aniversarios mes/semana/dia + vagas) + empresa nos colab + lembrete flutuante -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH — Solução Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme = localStorage.getItem('tema') || 'dark';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0A;--surface-1:#111111;--surface-2:#161616;--surface-3:#1B1B1B;
  --primary:#3ECF8E;--secondary:#4F46E5;
  --text-1:#FFFFFF;--text-2:#A1A1AA;--text-3:#52525B;
  --border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.16);
  --amber:#F59E0B;--amber-text:#FCD34D;--red:#EF4444;--red-text:#F87171;--radius:8px;
}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{background:var(--surface-1);border-bottom:1px solid var(--border);height:56px;padding:0 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:15px;font-weight:700;flex:1;letter-spacing:-.2px;color:var(--text-1);text-decoration:none}
.topbar-greeting{font-size:13px;color:var(--text-2)}
.topbar-links{display:flex;align-items:center;gap:4px}
.topbar-links a{color:var(--text-2);text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:6px;transition:color .15s,background .15s}
.topbar-links a:hover{color:var(--text-1);background:rgba(255,255,255,.06)}
.topbar-links a.active{color:var(--primary)}
.topbar-links a.nav-sair{border:1px solid rgba(255,255,255,.12);margin-left:8px}

.page{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
.page-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex:1;line-height:1}
.page-title i{width:22px;height:22px;color:var(--primary);flex-shrink:0}

/* Abas internas */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tab{background:none;border:none;color:var(--text-2);font-family:inherit;font-size:14px;font-weight:600;padding:11px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px}
.tab i{width:15px;height:15px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-pane{display:none}
.tab-pane.active{display:block}

.btn-nova{padding:10px 20px;background:var(--primary);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
.btn-nova:hover{opacity:.88}
.btn-nova i{width:15px;height:15px}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sk{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.sk-val{font-size:22px;font-weight:800;line-height:1;margin-bottom:5px}
.sk-lbl{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
@media(max-width:720px){.stats-row{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.card h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h2 i{width:16px;height:16px;color:var(--primary)}

.aniv-list{display:flex;flex-direction:column;gap:8px}
.aniv-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px}
.aniv-item .av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex-shrink:0}
.aniv-item .nm{font-weight:600;font-size:13.5px}
.aniv-item .cg{font-size:12px;color:var(--text-3)}
.aniv-item .dt{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--amber-text);text-align:right}
.aniv-hoje{border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.06)}
.aniv-hoje .dt{color:var(--primary)}

.busca-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.busca-bar input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);color:var(--text-1);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none}
.busca-bar input:focus{border-color:var(--border-hover)}

.colab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.colab{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.colab:hover{border-color:var(--border-hover)}
.colab-top{display:flex;align-items:center;gap:12px}
.colab-foto{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex-shrink:0;border:1px solid var(--border)}
.colab-foto-ph{width:52px;height:52px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:18px;flex-shrink:0;border:1px solid var(--border)}
.colab-nome{font-weight:700;font-size:14px;line-height:1.2}
.colab-cargo{font-size:12.5px;color:var(--primary);font-weight:600;margin-top:2px}
.colab-info{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border);padding-top:10px}
.colab-info span{display:flex;align-items:center;gap:6px}
.colab-info i{width:13px;height:13px;color:var(--text-3)}
.badge-inativo{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:rgba(239,68,68,.12);color:var(--red-text);padding:2px 7px;border-radius:5px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.aberto{display:flex}
.modal{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:24px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.modal-head i{width:20px;height:20px;color:var(--primary)}
.modal-head h2{font-size:17px;font-weight:700}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text-1);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--border-hover)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo-row{display:grid;grid-template-columns:34% 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.campo-row input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text-1);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none}
.campo-row input:focus{border-color:var(--border-hover)}
.campo-label{font-weight:600}
.campo-del{background:var(--bg);border:1px solid var(--border);color:var(--text-3);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.campo-del:hover{color:#f87171;border-color:rgba(239,68,68,.4)}
.btn-add-campo{margin-top:4px;background:transparent;border:1px dashed var(--border-hover);color:var(--text-2);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-add-campo:hover{color:var(--text-1);border-color:var(--primary)}
/* Filtros de aniversário */
.aniv-filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.periodo-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px}
.periodo-toggle .pt{background:transparent;border:none;color:var(--text-2);font-size:13px;font-weight:600;padding:7px 16px;border-radius:7px;cursor:pointer;font-family:inherit}
.periodo-toggle .pt.active{background:var(--primary);color:#000}
.aniv-filtros select,.aniv-filtros input{background:var(--bg);border:1px solid var(--border);color:var(--text-1);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none}
.aniv-filtros input{flex:1;min-width:160px}
/* Vagas */
.vaga-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;margin-bottom:8px}
.vaga-item.vaga-fechada{opacity:.55}
.vaga-cargo{font-size:14px;font-weight:600;color:var(--text-1)}
.vaga-emp{font-size:12px;color:var(--text-3);margin-top:2px}
/* Lembrete flutuante */
.aniv-flut{position:fixed;right:20px;bottom:20px;z-index:900;display:flex;align-items:center;gap:12px;max-width:320px;background:linear-gradient(135deg,#1c1c1c,#111);border:1px solid var(--primary);border-radius:14px;padding:14px 16px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;animation:flutIn .35s ease}
@keyframes flutIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.aniv-flut-ico{font-size:26px;line-height:1}
.aniv-flut-txt{font-size:13px;color:var(--text-1);line-height:1.45}
.aniv-flut-x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer;line-height:1}
.aniv-flut-x:hover{color:var(--text-1)}
.foto-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.foto-edit img,.foto-edit .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn-sec{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-pri{background:var(--primary);border:none;color:#000;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.btn-del{background:none;border:1px solid rgba(239,68,68,.4);color:var(--red-text);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;margin-right:auto}
.empty{text-align:center;color:var(--text-3);padding:40px 20px}

/* Cards */
.cards-tipos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.ctipo{flex:1;min-width:200px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:border-color .15s;text-align:left}
.ctipo:hover{border-color:var(--border-hover)}
.ctipo.active{border-color:var(--primary);background:rgba(62,207,142,.05)}
.ctipo .ci{width:26px;height:26px;color:var(--primary);margin-bottom:8px}
.ctipo .ct{font-weight:700;font-size:14px}
.ctipo .cd{font-size:12px;color:var(--text-3);margin-top:3px}
.cards-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:880px){.cards-layout{grid-template-columns:1fr}}
#card-canvas-wrap{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
#card-canvas{width:100%;max-width:420px;border-radius:8px;background:#fff}
</style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<div class="page">
  <div class="page-header">
    <h2 class="page-title"><i data-lucide="briefcase"></i> Recursos Humanos</h2>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-dashboard" onclick="trocarTab('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</button>
    <button class="tab" id="tab-colab" onclick="trocarTab('colab')"><i data-lucide="users-round"></i> Colaboradores</button>
    <button class="tab" id="tab-cards" onclick="trocarTab('cards')"><i data-lucide="image"></i> Cards</button>
  </div>

  <!-- ABA DASHBOARD -->
  <div class="tab-pane active" id="pane-dashboard">
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="sk"><div class="sk-val" id="db-total">0</div><div class="sk-lbl">Colaboradores</div></div>
      <div class="sk"><div class="sk-val" id="db-mes" style="color:var(--amber-text)">0</div><div class="sk-lbl">Aniversários no mês</div></div>
      <div class="sk"><div class="sk-val" id="db-vagas" style="color:var(--primary)">0</div><div class="sk-lbl">Vagas em aberto</div></div>
    </div>

    <div class="card">
      <h2><i data-lucide="cake"></i> Aniversariantes</h2>
      <div class="aniv-filtros">
        <div class="periodo-toggle">
          <button class="pt active" data-per="mes" onclick="setPeriodo('mes')">Mês</button>
          <button class="pt" data-per="semana" onclick="setPeriodo('semana')">Semana</button>
          <button class="pt" data-per="dia" onclick="setPeriodo('dia')">Dia</button>
        </div>
        <select id="aniv-mes-sel" onchange="renderAniversarios()"></select>
        <input type="text" id="aniv-busca" placeholder="Buscar por nome..." oninput="renderAniversarios()">
      </div>
      <div class="aniv-list" id="aniv-list"><div class="empty">Carregando...</div></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0"><i data-lucide="briefcase"></i> Vagas em aberto</h2>
        <button class="btn-nova" onclick="abrirModalVaga()"><i data-lucide="plus"></i> Nova vaga</button>
      </div>
      <div id="vagas-list" style="margin-top:14px"><div class="empty">Carregando...</div></div>
    </div>
  </div>

  <!-- ABA COLABORADORES -->
  <div class="tab-pane" id="pane-colab">
    <div class="page-header">
      <div style="flex:1"></div>
      <button class="btn-nova" onclick="abrirModal()"><i data-lucide="user-plus"></i> Novo colaborador</button>
    </div>
    <div class="stats-row" id="quant-empresas" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
      <div class="sk"><div class="sk-val" id="st-total">0</div><div class="sk-lbl">Total</div></div>
    </div>
    <div class="busca-bar">
      <input type="text" id="busca" placeholder="Buscar por nome ou cargo..." oninput="renderColabs()">
    </div>
    <div class="colab-grid" id="colab-grid"></div>
  </div>

  <!-- ABA CARDS -->
  <div class="tab-pane" id="pane-cards">
    <div class="cards-tipos">
      <button class="ctipo active" data-tipo="aniversario" onclick="selecionarTipo('aniversario')">
        <i data-lucide="cake" class="ci"></i><div class="ct">Card de Aniversário</div><div class="cd">Foto + mensagem de parabéns</div>
      </button>
      <button class="ctipo" data-tipo="promocao" onclick="selecionarTipo('promocao')">
        <i data-lucide="trending-up" class="ci"></i><div class="ct">Card de Promoção</div><div class="cd">Início de uma nova jornada</div>
      </button>
      <button class="ctipo" data-tipo="bemvindo" onclick="selecionarTipo('bemvindo')">
        <i data-lucide="hand" class="ci"></i><div class="ct">Card de Boas-vindas</div><div class="cd">Seja bem-vindo</div>
      </button>
      <button class="ctipo" data-tipo="contratacao" onclick="selecionarTipo('contratacao')">
        <i data-lucide="user-check" class="ci"></i><div class="ct">Card de Contratação</div><div class="cd">Modelo por vaga, editável</div>
      </button>
    </div>

    <div class="cards-layout">
      <div>
        <div class="card" style="margin:0">
          <h2><i data-lucide="settings-2"></i> Dados do card</h2>
          <div id="card-form"></div>
          <button class="btn-nova" style="width:100%;justify-content:center;margin-top:6px" onclick="gerarCard()"><i data-lucide="image-down"></i> Gerar / Atualizar</button>
        </div>
      </div>
      <div id="card-canvas-wrap">
        <canvas id="card-canvas" width="1080" height="1350"></canvas>
        <button class="btn-sec" onclick="baixarCard()"><i data-lucide="download" style="width:13px;height:13px"></i> Baixar imagem (PNG)</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal cadastro/edição colaborador -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-head"><i data-lucide="user-round"></i><h2 id="modal-titulo">Novo colaborador</h2></div>
    <div class="foto-edit">
      <img id="foto-preview" style="display:none" alt="Foto">
      <div class="ph" id="foto-ph"><i data-lucide="image"></i></div>
      <div>
        <input type="file" id="foto-input" accept="image/*" style="display:none" onchange="_selecionarFoto(this)">
        <button class="btn-sec" type="button" onclick="document.getElementById('foto-input').click()"><i data-lucide="upload" style="width:13px;height:13px"></i> Foto</button>
        <div style="font-size:11px;color:var(--text-3);margin-top:6px">JPG/PNG · usada nos cards</div>
      </div>
    </div>
    <div class="fg"><label>Nome completo *</label><input type="text" id="f-nome" placeholder="Nome do colaborador"></div>
    <div class="fg"><label>Cargo</label>
      <input type="text" id="f-cargo" list="cargos-list" placeholder="Digite o cargo">
      <datalist id="cargos-list">
        <option>Coordenador de Serviço Solução</option><option>Consultor Comercial</option>
        <option>Estoquista</option><option>Analista de Estoque</option>
        <option>Técnico de Cabeamento</option><option>Técnico de Elétrica e Hardware</option>
        <option>Técnico de Áudio e Vídeo</option><option>Técnico de Automação</option>
        <option>Auxiliar Técnico</option><option>Coordenador</option><option>Supervisor</option>
        <option>Vistoriador Técnico</option><option>Eletricista Predial</option>
        <option>Motorista</option><option>Serviços Gerais</option><option>Administrativo</option><option>RH</option>
      </datalist>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Empresa</label><select id="f-empresa"></select></div>
      <div class="fg"><label>Data de admissão</label><input type="date" id="f-admissao"></div>
    </div>
    <div class="fg"><label>Telefone</label><input type="text" id="f-telefone" placeholder="(00) 00000-0000"></div>
    <div class="fg">
      <label>Aniversário (dia / mês)</label>
      <div style="display:flex;gap:10px">
        <select id="f-aniv-dia" style="flex:1"></select>
        <select id="f-aniv-mes" style="flex:2"></select>
      </div>
    </div>
    <div class="fg"><label>E-mail</label><input type="email" id="f-email" placeholder="email@..."></div>
    <div class="fg"><label>Observações</label><textarea id="f-obs" rows="2" placeholder="Opcional"></textarea></div>
    <div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="f-ativo" checked style="appearance:auto;-webkit-appearance:auto;width:auto;accent-color:var(--primary)"> Ativo</label></div>
    <div id="modal-erro" style="display:none;color:var(--red-text);font-size:13px;margin-bottom:12px"></div>
    <div class="modal-actions">
      <button class="btn-del" id="btn-del" style="display:none" onclick="excluirColab()"><i data-lucide="trash-2" style="width:13px;height:13px"></i> Excluir</button>
      <button class="btn-sec" onclick="fecharModal()">Cancelar</button>
      <button class="btn-pri" id="btn-salvar" onclick="salvarColab()"><i data-lucide="save" style="width:14px;height:14px"></i> Salvar</button>
    </div>
  </div>
</div>

<!-- Modal cadastro/edição de vaga -->
<div class="overlay" id="overlay-vaga" onclick="if(event.target===this)fecharModalVaga()">
  <div class="modal">
    <div class="modal-head"><i data-lucide="briefcase"></i><h2 id="vaga-titulo">Nova vaga</h2></div>
    <div class="fg-row">
      <div class="fg"><label>Empresa</label><select id="v-empresa"></select></div>
      <div class="fg"><label>Status</label><select id="v-status"><option value="aberta">Aberta</option><option value="fechada">Fechada</option></select></div>

    <div class="fg"><label>Cargo / Vaga *</label><input type="text" id="v-cargo" list="cargos-list" placeholder="Ex: Técnico de Automação"></div>
    <div class="fg"><label>Campos do card <span style="color:var(--text-3);font-weight:400">(personalizável)</span></label>
      <div id="vaga-campos"></div>
      <button type="button" class="btn-add-campo" onclick="_vagaAddCampo()"><i data-lucide="plus" style="width:13px;height:13px"></i> Adicionar campo</button>
    </div>
    <div id="vaga-erro" style="display:none;color:var(--red-text);font-size:13px;margin-bottom:12px"></div>
    <div class="modal-actions">
      <button class="btn-del" id="vaga-del" style="display:none" onclick="excluirVaga()"><i data-lucide="trash-2" style="width:13px;height:13px"></i> Excluir</button>
      <button class="btn-sec" onclick="fecharModalVaga()">Cancelar</button>
      <button class="btn-pri" onclick="salvarVaga()"><i data-lucide="save" style="width:14px;height:14px"></i> Salvar</button>

</div>

<!-- Lembrete flutuante de próximo aniversário (só no módulo RH) -->
<div id="aniv-flut" class="aniv-flut" style="display:none" onclick="trocarTab('dashboard')">
  <button class="aniv-flut-x" onclick="event.stopPropagation();_fecharFlutuante()" title="Dispensar">&times;</button>
  <div class="aniv-flut-ico">🎂</div>
  <div class="aniv-flut-txt" id="aniv-flut-txt"></div>
</div>

<script>
let _authToken = '';
let _colabs = [];
let _editColab = null;
let _fotoFile = null;
let _fotoRemovida = false;
let _cardTipo = 'aniversario';
let _vagas = [];
let _editVaga = null;
let _periodo = 'mes';
const GRUPO_EMPRESAS = ['Solução','Breton','Bontempo']; // colaboradores
const EMPRESAS_VAGA  = ['Solução','Breton'];            // vagas (Bontempo não tem vaga aqui)
function _optsEmpresa(sel, lista){ return '<option value="">—</option>' + (lista||GRUPO_EMPRESAS).map(e=>`<option${sel===e?' selected':''}>${e}</option>`).join(''); }

function fotoSrc(url){ if(!url||!_authToken) return url; return url + (url.includes('?')?'&':'?') + 't=' + encodeURIComponent(_authToken); }
function escH(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iniciais(n){ const p=(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'?').toUpperCase() + ((p[1]||'')[0]||'').toUpperCase(); }
function nomeCurto(n){ const p=(n||'').trim().split(/\s+/).filter(Boolean); if(p.length<=1) return p.join(' '); return p[0]+' '+p[p.length-1]; }

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  _authToken = session.access_token || '';
  db.auth.onAuthStateChange((_e, s) => { if (s?.access_token) _authToken = s.access_token; });

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();
  if (!eu || !['rh', 'admin_geral'].includes(eu.role)) { location.href = 'obras.html'; return; }

  renderTopbar(eu.nome, eu.role, 'rh');
  lucide.createIcons();
  _popularDiaMes();
  await carregar();
  selecionarTipo('aniversario');
})();

function trocarTab(t){
  ['dashboard','colab','cards'].forEach(x=>{
    document.getElementById('tab-'+x)?.classList.toggle('active', x===t);
    document.getElementById('pane-'+x)?.classList.toggle('active', x===t);
  });
  lucide.createIcons();
}

async function carregar() {
  // selects de empresa (modal colaborador e vaga) e de mês (aniversários)
  document.getElementById('f-empresa').innerHTML = _optsEmpresa();
  document.getElementById('v-empresa').innerHTML = _optsEmpresa('Solução', EMPRESAS_VAGA);
  const MM=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesSel=document.getElementById('aniv-mes-sel');
  if(mesSel) mesSel.innerHTML = MM.map((m,i)=>`<option value="${i+1}"${(i+1)===(new Date().getMonth()+1)?' selected':''}>${m}</option>`).join('');

  const [colabRes, vagasRes] = await Promise.all([
    db.from('colaboradores').select('*').order('nome'),
    db.from('vagas_abertas').select('*').order('criado_em', { ascending:false }),
  ]);
  if (colabRes.error) { document.getElementById('aniv-list').innerHTML = `<div class="empty">Erro: ${escH(colabRes.error.message)}</div>`; return; }
  _colabs = (colabRes.data || []).map(c => ({ ...c, _key: 'c' + c.id }))
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  _vagas = vagasRes.error ? [] : (vagasRes.data || []);

  renderDashboardKPIs();
  renderAniversarios();
  renderVagas();
  renderColabs();
  renderQuantEmpresas();
  _renderFlutuante();
  _popularSelectColab();
}

// Popula os selects de dia/mês do modal
function _popularDiaMes() {
  const dia = document.getElementById('f-aniv-dia'), mes = document.getElementById('f-aniv-mes');
  if (dia && !dia.options.length) {
    dia.innerHTML = '<option value="">Dia</option>' + Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  }
  if (mes && !mes.options.length) {
    const MM=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    mes.innerHTML = '<option value="">Mês</option>' + MM.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  }
}

// ── Dashboard ────────────────────────────────────────────────
function _diaMes(d){ if(!d) return null; const [,m,dia]=d.split('-'); return {m:+m,d:+dia}; }
function _diasAte(d){ const dm=_diaMes(d); if(!dm) return null; const hoje=new Date(); hoje.setHours(0,0,0,0); let prox=new Date(hoje.getFullYear(),dm.m-1,dm.d); if(prox<hoje) prox=new Date(hoje.getFullYear()+1,dm.m-1,dm.d); return Math.round((prox-hoje)/86400000); }
function renderDashboardKPIs() {
  const ativos = _colabs.filter(c => c.ativo !== false);
  const mesAtual = new Date().getMonth()+1;
  document.getElementById('db-total').textContent = ativos.length;
  document.getElementById('db-mes').textContent   = ativos.filter(c=>_diaMes(c.data_aniversario)?.m===mesAtual).length;
  document.getElementById('db-vagas').textContent = _vagas.filter(v=>v.status!=='fechada').length;
}

function setPeriodo(p){
  _periodo = p;
  document.querySelectorAll('.periodo-toggle .pt').forEach(b=>b.classList.toggle('active', b.dataset.per===p));
  document.getElementById('aniv-mes-sel').style.display = (p==='mes') ? '' : 'none';
  renderAniversarios();
}

function renderAniversarios(){
  const termo=(document.getElementById('aniv-busca')?.value||'').toLowerCase().trim();
  const mesSel=+(document.getElementById('aniv-mes-sel')?.value || (new Date().getMonth()+1));
  let lista=_colabs.filter(c=>c.ativo!==false && c.data_aniversario);
  if(termo) lista=lista.filter(c=>(c.nome||'').toLowerCase().includes(termo));
  if(_periodo==='mes')         lista=lista.filter(c=>_diaMes(c.data_aniversario)?.m===mesSel);
  else if(_periodo==='semana') lista=lista.filter(c=>{const d=_diasAte(c.data_aniversario); return d!=null && d<=7;});
  else                         lista=lista.filter(c=>_diasAte(c.data_aniversario)===0);
  lista.sort((a,b)=> _periodo==='mes'
    ? (_diaMes(a.data_aniversario).d - _diaMes(b.data_aniversario).d)
    : (_diasAte(a.data_aniversario) - _diasAte(b.data_aniversario)));

  const el=document.getElementById('aniv-list');
  if(!lista.length){ el.innerHTML='<div class="empty">Nenhum aniversariante neste período.</div>'; return; }
  el.innerHTML=lista.map(c=>{
    const dm=_diaMes(c.data_aniversario); const dataTxt=String(dm.d).padStart(2,'0')+'/'+String(dm.m).padStart(2,'0');
    const dias=_diasAte(c.data_aniversario);
    const quando=dias===0?'HOJE 🎉':dias===1?'amanhã':`em ${dias} dias`;
    const foto=c.foto_url?`<img class="av" src="${escH(fotoSrc(c.foto_url))}" alt="">`:`<div class="av" style="display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:13px">${iniciais(c.nome)}</div>`;
    return `<div class="aniv-item ${dias===0?'aniv-hoje':''}">${foto}
      <div><div class="nm">${escH(nomeCurto(c.nome))}</div><div class="cg">${escH(c.empresa?c.empresa+' · ':'')}${escH(c.cargo||'—')}</div></div>
      <div class="dt">${dataTxt}<br><span style="font-weight:500;color:var(--text-3);font-size:11px">${quando}</span></div></div>`;
  }).join('');
  lucide.createIcons();
}

function renderQuantEmpresas(){
  const ativos=_colabs.filter(c=>c.ativo!==false);
  const box=document.getElementById('quant-empresas'); if(!box) return;
  let html=`<div class="sk"><div class="sk-val" id="st-total">${ativos.length}</div><div class="sk-lbl">Total</div></div>`;
  GRUPO_EMPRESAS.forEach(e=>{
    const n=ativos.filter(c=>(c.empresa||'')===e).length;
    html+=`<div class="sk"><div class="sk-val">${n}</div><div class="sk-lbl">${escH(e)}</div></div>`;
  });
  const semEmp=ativos.filter(c=>!c.empresa).length;
  if(semEmp) html+=`<div class="sk"><div class="sk-val" style="color:var(--text-3)">${semEmp}</div><div class="sk-lbl">Sem empresa</div></div>`;
  box.innerHTML=html;
}

// ── Lembrete flutuante (só no RH) ──
function _renderFlutuante(){
  if(sessionStorage.getItem('rh_flut_dispensado')==='1') return;
  const ativos=_colabs.filter(c=>c.ativo!==false && c.data_aniversario);
  const prox=ativos.map(c=>({c,dias:_diasAte(c.data_aniversario)})).filter(x=>x.dias!=null&&x.dias<=7).sort((a,b)=>a.dias-b.dias);
  if(!prox.length) return;
  const {c,dias}=prox[0];
  const quando=dias===0?'é HOJE! 🎉':dias===1?'é amanhã':`em ${dias} dias`;
  document.getElementById('aniv-flut-txt').innerHTML=`<strong>Atenção: próximo aniversário</strong><br>${escH(nomeCurto(c.nome))} — ${quando}`;
  document.getElementById('aniv-flut').style.display='flex';
}
function _fecharFlutuante(){ sessionStorage.setItem('rh_flut_dispensado','1'); document.getElementById('aniv-flut').style.display='none'; }

// ── Vagas em aberto ──
function _vagaCampoRow(label,valor){
  return `<div class="campo-row">
    <input type="text" class="campo-label" value="${escH(label||'')}" placeholder="Título">
    <input type="text" class="campo-valor" value="${escH(valor||'')}" placeholder="Conteúdo">
    <button type="button" class="campo-del" onclick="this.parentElement.remove()" title="Remover"><i data-lucide="x" style="width:14px;height:14px"></i></button>
  </div>`;
}
function _vagaSetCampos(campos){
  const padrao=[{label:'Salário',valor:''},{label:'Benefícios',valor:''},{label:'Horário',valor:''},{label:'Requisitos',valor:''}];
  const arr=(campos&&campos.length)?campos:padrao;
  document.getElementById('vaga-campos').innerHTML=arr.map(c=>_vagaCampoRow(c.label,c.valor)).join(''); lucide.createIcons();
}
function _vagaAddCampo(){ document.getElementById('vaga-campos').insertAdjacentHTML('beforeend', _vagaCampoRow('','')); lucide.createIcons(); }
function _vagaLerCampos(){ return [...document.querySelectorAll('#vaga-campos .campo-row')].map(r=>({label:r.querySelector('.campo-label')?.value.trim()||'',valor:r.querySelector('.campo-valor')?.value.trim()||''})).filter(c=>c.label||c.valor); }

function abrirModalVaga(id){
  const v=id?_vagas.find(x=>x.id===id):null; _editVaga=v||null;
  document.getElementById('vaga-titulo').textContent=v?'Editar vaga':'Nova vaga';
  document.getElementById('v-empresa').innerHTML=_optsEmpresa(v?.empresa||'Solução');
  document.getElementById('v-cargo').value=v?.cargo||'';
  document.getElementById('v-status').value=v?.status||'aberta';
  _vagaSetCampos(v?.campos||null);
  document.getElementById('vaga-erro').style.display='none';
  document.getElementById('vaga-del').style.display=v?'inline-flex':'none';
  document.getElementById('overlay-vaga').classList.add('aberto');
  lucide.createIcons();
}
function fecharModalVaga(){ document.getElementById('overlay-vaga').classList.remove('aberto'); }
async function salvarVaga(){
  const cargo=document.getElementById('v-cargo').value.trim();
  const erro=document.getElementById('vaga-erro');
  if(!cargo){ erro.textContent='Informe o cargo/vaga.'; erro.style.display='block'; return; }
  const payload={ empresa:document.getElementById('v-empresa').value||null, cargo, status:document.getElementById('v-status').value, campos:_vagaLerCampos(), atualizado_em:new Date().toISOString() };
  try{
    if(_editVaga){ const {error}=await db.from('vagas_abertas').update(payload).eq('id',_editVaga.id); if(error) throw error; }
    else{ payload.criado_em=new Date().toISOString(); const {error}=await db.from('vagas_abertas').insert(payload); if(error) throw error; }
    fecharModalVaga(); await carregar();
  }catch(e){ erro.textContent='Erro: '+e.message; erro.style.display='block'; }
}
async function excluirVaga(){
  if(!_editVaga) return; if(!confirm('Excluir esta vaga?')) return;
  const {error}=await db.from('vagas_abertas').delete().eq('id',_editVaga.id);
  if(error){ alert('Erro: '+error.message); return; }
  fecharModalVaga(); await carregar();
}
function renderVagas(){
  const el=document.getElementById('vagas-list'); if(!el) return;
  if(!_vagas.length){ el.innerHTML='<div class="empty">Nenhuma vaga cadastrada.</div>'; return; }
  el.innerHTML=_vagas.map(v=>{
    const fechada=v.status==='fechada';
    return `<div class="vaga-item ${fechada?'vaga-fechada':''}">
      <div style="flex:1;min-width:0">
        <div class="vaga-cargo">${escH(v.cargo)} ${fechada?'<span class="badge-inativo">fechada</span>':''}</div>
        <div class="vaga-emp">${escH(v.empresa||'—')}</div>
      </div>
      <button class="btn-sec" onclick="baixarCardVaga(${v.id})" title="Gerar card desta vaga"><i data-lucide="image-down" style="width:13px;height:13px"></i> Card</button>
      <button class="btn-sec" onclick="abrirModalVaga(${v.id})" title="Editar"><i data-lucide="pencil" style="width:13px;height:13px"></i></button>
    </div>`;
  }).join('');
  lucide.createIcons();
}
function baixarCardVaga(id){
  const v=_vagas.find(x=>x.id===id); if(!v) return;
  trocarTab('cards');
  selecionarTipo('contratacao');
  const empKey = (v.empresa==='Breton') ? 'breton' : 'solucao';
  const empSel=document.getElementById('card-empresa'); if(empSel) empSel.value=empKey;
  const vagaSel=document.getElementById('card-vaga');
  if(vagaSel){ if(![...vagaSel.options].some(o=>o.value===v.cargo)) vagaSel.add(new Option(v.cargo, v.cargo)); vagaSel.value=v.cargo; }
  _setCampos(v.campos&&v.campos.length?v.campos:[]);
  gerarCard();
}

// ── Lista ────────────────────────────────────────────────────
function _fmtData(d){ if(!d) return '—'; const [y,m,dia]=d.split('-'); return `${dia}/${m}/${y}`; }
function _fmtAniv(d){ const dm=_diaMes(d); return dm ? String(dm.d).padStart(2,'0')+'/'+String(dm.m).padStart(2,'0') : '—'; }
function renderColabs() {
  const termo = (document.getElementById('busca').value||'').toLowerCase().trim();
  const lista = _colabs.filter(c => !termo || (c.nome||'').toLowerCase().includes(termo) || (c.cargo||'').toLowerCase().includes(termo));
  const grid = document.getElementById('colab-grid');
  if (!lista.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhum colaborador encontrado.</div>'; return; }
  grid.innerHTML = lista.map(c => {
    const foto = c.foto_url ? `<img class="colab-foto" src="${escH(fotoSrc(c.foto_url))}" alt="">` : `<div class="colab-foto-ph">${iniciais(c.nome)}</div>`;
    const tag = c.ativo===false?'<span class="badge-inativo">inativo</span>':'';
    return `<div class="colab" onclick="abrirModal('${c._key}')">
      <div class="colab-top">${foto}
        <div><div class="colab-nome">${escH(nomeCurto(c.nome))} ${tag}</div><div class="colab-cargo">${escH(c.cargo||'—')}</div></div></div>
      <div class="colab-info">
        <span><i data-lucide="calendar-plus"></i> Admissão: ${_fmtData(c.data_admissao)}</span>
        <span><i data-lucide="cake"></i> Aniversário: ${_fmtAniv(c.data_aniversario)}</span>
      </div></div>`;
  }).join('');
  lucide.createIcons();
}

// ── Modal colaborador ────────────────────────────────────────
function abrirModal(key) {
  const c = key ? _colabs.find(x => x._key === key) : null;
  _editColab = c || null; _fotoFile = null; _fotoRemovida = false;
  _popularDiaMes();
  document.getElementById('modal-erro').style.display = 'none';
  document.getElementById('foto-input').value = '';
  document.getElementById('modal-titulo').textContent = c ? 'Editar colaborador' : 'Novo colaborador';
  document.getElementById('f-nome').value = c?.nome||''; document.getElementById('f-cargo').value = c?.cargo||'';
  document.getElementById('f-empresa').value = c?.empresa || '';
  document.getElementById('f-admissao').value = c?.data_admissao||'';
  const dm = _diaMes(c?.data_aniversario);
  document.getElementById('f-aniv-dia').value = dm ? dm.d : '';
  document.getElementById('f-aniv-mes').value = dm ? dm.m : '';
  document.getElementById('f-telefone').value = c?.telefone||'';
  document.getElementById('f-email').value = c?.email||''; document.getElementById('f-obs').value = c?.observacoes||'';
  document.getElementById('f-ativo').checked = c ? c.ativo!==false : true;
  document.getElementById('btn-del').style.display = c ? 'inline-flex' : 'none';
  _renderFotoPreview(c?.foto_url ? fotoSrc(c.foto_url) : null);
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}
function fecharModal(){ document.getElementById('overlay').classList.remove('aberto'); }
function _renderFotoPreview(src){ const img=document.getElementById('foto-preview'),ph=document.getElementById('foto-ph'); if(src){img.src=src;img.style.display='';ph.style.display='none';}else{img.style.display='none';ph.style.display='flex';} }
function _selecionarFoto(input){ const f=input.files?.[0]; if(!f) return; _fotoFile=f; _fotoRemovida=false; _renderFotoPreview(URL.createObjectURL(f)); }

async function _comprimirImagem(file, maxDim=1024, quality=0.85){
  try{ let bmp=null; if(window.createImageBitmap) bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
    if(!bmp) bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
    const w0=bmp.width,h0=bmp.height; if(!w0||!h0) return file; const sc=Math.min(1,maxDim/Math.max(w0,h0));
    const w=Math.round(w0*sc),h=Math.round(h0*sc); const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h); if(bmp.close)bmp.close();
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',quality)); return (blob&&blob.size<file.size)?blob:file;
  }catch(e){ return file; }
}
async function _uploadFoto(colabId, nome){
  const blob=await _comprimirImagem(_fotoFile);
  const nomeSeguro=(nome||'colaborador').replace(/[\/\\:*?"<>|#%~]/g,'').trim().substring(0,40)||'colaborador';
  const filename=`${nomeSeguro} ${colabId}.jpg`; const folderPath='Colaboradores/Fotos';
  const { data:{session} } = await db.auth.getSession();
  const hdrs={'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`};
  const initRes=await fetch('/api/upload',{method:'POST',headers:hdrs,body:JSON.stringify({path:folderPath,filename,contentType:'image/jpeg'})});
  if(!initRes.ok) throw new Error('Upload (proxy): '+await initRes.text());
  const {uploadUrl,filePath}=await initRes.json();
  const CHUNK=10*1024*1024; let start=0;
  while(start<blob.size){ const end=Math.min(start+CHUNK,blob.size);
    const put=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${start}-${end-1}/${blob.size}`,'Content-Type':'image/jpeg'},body:blob.slice(start,end)});
    if(!put.ok&&put.status!==202) throw new Error('Upload chunk: '+put.status); start=end; }
  return `/api/foto?path=${encodeURIComponent(filePath)}`;
}

async function salvarColab() {
  const nome=document.getElementById('f-nome').value.trim();
  const erroEl=document.getElementById('modal-erro');
  if(!nome){ erroEl.textContent='Informe o nome.'; erroEl.style.display='block'; return; }
  const btn=document.getElementById('btn-salvar'); btn.disabled=true; btn.innerHTML='Salvando...';
  const diaA=document.getElementById('f-aniv-dia').value, mesA=document.getElementById('f-aniv-mes').value;
  const aniv = (diaA && mesA) ? `2000-${String(mesA).padStart(2,'0')}-${String(diaA).padStart(2,'0')}` : null;
  const payload={
    nome, cargo:document.getElementById('f-cargo').value||null,
    empresa:document.getElementById('f-empresa').value||null,
    data_admissao:document.getElementById('f-admissao').value||null,
    data_aniversario:aniv,
    telefone:document.getElementById('f-telefone').value.trim()||null,
    email:document.getElementById('f-email').value.trim()||null,
    observacoes:document.getElementById('f-obs').value.trim()||null,

// Cor de texto (preto/branco) com melhor contraste sobre uma cor de fundo hex.
function _corContraste(hex){
  const h=String(hex).replace('#',''); const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b) > 150 ? '#0A0A0A' : '#FFFFFF';
}

// Clareia uma cor hex misturando com branco (amt 0..1).
function _clarear(hex,amt){ const h=String(hex).replace('#',''); let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt); return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }

// Tinge uma imagem (logo preta/transparente) com uma cor sólida, preservando o alfa.
function _tingir(img, cor){
  const c=document.createElement('canvas'); c.width=img.naturalWidth||img.width; c.height=img.naturalHeight||img.height;
  const x=c.getContext('2d'); x.drawImage(img,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=cor; x.fillRect(0,0,c.width,c.height);
  return c;
}

// Desenho do card no canvas
function _carregarImg(src){ return new Promise(res=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
// Carrega arte de fundo (raiz) com cache na sessão — evita re-baixar a cada "Gerar / Atualizar".
const _tplCache = {};
async function _carregarArte(nome){ if(_tplCache[nome]!==undefined) return _tplCache[nome]; const img=await _carregarImg(nome); _tplCache[nome]=img; return img; }
function _wrap(ctx,texto,x,y,maxW,lh){ const ps=String(texto).split(' '); let linha=''; for(const p of ps){ const t=linha?linha+' '+p:p; if(ctx.measureText(t).width>maxW && linha){ ctx.fillText(linha,x,y); linha=p; y+=lh; } else linha=t; } if(linha) ctx.fillText(linha,x,y); return y; }
// Igual ao _wrap mas só MEDE (não desenha) — retorna o array de linhas. Use a fonte já setada no ctx.
function _medirLinhas(ctx,texto,maxW){ const ps=String(texto).split(' '); const out=[]; let linha=''; for(const p of ps){ const t=linha?linha+' '+p:p; if(ctx.measureText(t).width>maxW && linha){ out.push(linha); linha=p; } else linha=t; } if(linha) out.push(linha); return out; }
function _roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function _desenharFotoCover(ctx,img,x,y,w,h){ const s=Math.max(w/img.width,h/img.height); const dw=img.width*s,dh=img.height*s; ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); }

// Card de aniversário — usa a arte oficial como fundo; só sobrepõe FOTO e NOME
async function _carregarTemplate(){
  // Tenta vários nomes/extensões — o arquivo precisa estar na raiz do projeto
  for (const nome of ['card-aniversario.jpg','card-aniversario.png','card-aniversario.jpeg','card-aniversario.webp']) {
    const img = await _carregarImg(nome + '?v=' + Date.now());
    if (img) return img;
  }
  return null;
}

async function _cardAniversario(ctx, cv){
  const tpl = await _carregarTemplate();
  let W, H;
  if (tpl) {
    cv.width = tpl.naturalWidth || 1080; cv.height = tpl.naturalHeight || 1920;
    W = cv.width; H = cv.height; ctx.drawImage(tpl, 0, 0, W, H);
  } else {
    cv.width = 1080; cv.height = 1920; W = cv.width; H = cv.height;
    ctx.fillStyle = '#f2f2f2'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#555'; ctx.font='400 70px Inter'; ctx.fillText('Feliz Aniversário!', W/2, 0.27*H);
    ctx.fillStyle='#999'; ctx.font='400 24px Inter'; ctx.fillText('(envie card-aniversario.jpg para a arte oficial)', W/2, 0.27*H+45);
  }
  const key=document.getElementById('card-sel-colab')?.value; const c=_colabs.find(x=>x._key===key);

  // MOLDURA desenhada pelo sistema (ideal: arte SEM moldura). Foto + moldura juntas = sempre alinhadas.
  const fw=0.545*W, fh=0.392*H, fx=(W-fw)/2, fy=0.242*H, frad=0.010*W;
  const borda=0.018*W; // espessura da moldura
  // Sombra + moldura branca
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.22)'; ctx.shadowBlur=0.035*W; ctx.shadowOffsetY=0.012*W;
  ctx.fillStyle='#FFFFFF'; _roundRect(ctx,fx,fy,fw,fh,frad); ctx.fill();
  ctx.restore();
  // Foto dentro da moldura (recuada pela espessura da borda)
  const px=fx+borda, py=fy+borda, pw=fw-2*borda, ph=fh-2*borda, pr=Math.max(0,frad-borda*0.5);
  ctx.save(); _roundRect(ctx,px,py,pw,ph,pr); ctx.clip();
  let img=null; if(c?.foto_url) img=await _carregarImg(fotoSrc(c.foto_url));
  if(img){ _desenharFotoCover(ctx,img,px,py,pw,ph); }
  else{ ctx.fillStyle='#2e4046'; ctx.fillRect(px,py,pw,ph); ctx.fillStyle='#7d9099'; ctx.font='800 120px Inter'; ctx.textAlign='center'; ctx.fillText(iniciais(c?.nome||'?'),W/2,py+ph/2+42); }
  ctx.restore();

  // Nome (logo abaixo da moldura) — Roboto, texto ESCURO (fundo claro). Nome + 1 sobrenome.
  ctx.textAlign='center'; ctx.fillStyle='#2B2B2B';
  ctx.font='700 ' + Math.round(0.046*W) + 'px Roboto, sans-serif';
  ctx.fillText(nomeCurto(c?.nome) || 'Nome do colaborador', W/2, 0.695*H);

  // Cargo (logo abaixo do nome)
  if (c?.cargo) {
    ctx.fillStyle='#6b6b6b'; ctx.font='500 ' + Math.round(0.030*W) + 'px Roboto, sans-serif';
    ctx.fillText(c.cargo, W/2, 0.726*H);
  }

  // Mensagem (abaixo do cargo, acima da logo da arte)
  const msg = document.getElementById('card-msg')?.value || '';
  if (msg) {
    ctx.fillStyle='#5a5a5a'; ctx.font='400 ' + Math.round(0.027*W) + 'px Roboto, sans-serif';
    _wrap(ctx, msg, W/2, 0.765*H, W*0.72, Math.round(0.037*W));
  }
  ctx.textAlign='left';
}

// Card de Contratação — foto de produto da empresa desfocada + textos por cima (story 1080x1920)
async function _cardContratacao(ctx, cv){
  cv.width=1080; cv.height=1920;
  const W=cv.width, H=cv.height;
  const empKey=document.getElementById('card-empresa')?.value || 'solucao';
  const emp=EMPRESAS[empKey] || EMPRESAS.solucao;
  const accent=emp.cor;
  // Variante clara da cor da marca para texto/linhas sobre o fundo escuro (bordô puro fica apagado)
  const accentTxt = _corContraste(accent)==='#FFFFFF' ? _clarear(accent,0.6) : accent;

  // Fundo: foto do produto em COVER + desfoque (desenha maior pra o blur não vazar bordas)
  const bg = await _carregarImg(emp.bg + '?v=' + Date.now());
  if(bg){
    ctx.save(); ctx.filter='blur(10px)';
    const m=50; _desenharFotoCover(ctx, bg, -m, -m, W+2*m, H+2*m);
    ctx.restore();
  } else {
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1b1b1b'); g.addColorStop(1,'#000');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // Escurecimento para legibilidade
  const ov=ctx.createLinearGradient(0,0,0,H);
  ov.addColorStop(0,'rgba(0,0,0,0.58)'); ov.addColorStop(0.45,'rgba(0,0,0,0.46)'); ov.addColorStop(1,'rgba(0,0,0,0.84)');
  ctx.fillStyle=ov; ctx.fillRect(0,0,W,H);

  // Faixas de destaque (topo e base)
  ctx.fillStyle=accent; ctx.fillRect(0,0,W,16); ctx.fillRect(0,H-16,W,16);

  ctx.textAlign='center';

  // Logo no topo — wordmark de texto (Breton) ou imagem tingida de branco (Solução)
  let topY=160;
  if(emp.logoTexto){
    ctx.fillStyle='#FFFFFF'; ctx.font='800 86px Poppins, sans-serif';
    const prevLS = ctx.letterSpacing; try{ ctx.letterSpacing='18px'; }catch(e){}
    ctx.fillText(emp.logoTexto, W/2, topY+80);
    try{ ctx.letterSpacing=prevLS||'0px'; }catch(e){}
    topY += 160;
  } else {
    const logo = await _carregarImg((emp.logo||'') + '?v=' + Date.now());
    if(logo){
      const lw=Math.min(420, logo.naturalWidth||logo.width); const dh=lw*((logo.naturalHeight||logo.height)/(logo.naturalWidth||logo.width));
      const src = emp.logoBranca ? _tingir(logo,'#FFFFFF') : logo;
      ctx.drawImage(src, (W-lw)/2, topY, lw, dh);
      topY += dh + 48;
    } else {
      ctx.fillStyle='#FFFFFF'; ctx.font='800 64px Poppins, sans-serif'; ctx.fillText(emp.nome.toUpperCase(), W/2, topY+50);
      topY += 120;
    }
  }

  // Selo "ESTAMOS CONTRATANDO"
  const selo='ESTAMOS CONTRATANDO';
  ctx.font='700 38px Poppins, sans-serif';
  const sw=ctx.measureText(selo).width+72, sh=72, sx=(W-sw)/2;
  ctx.fillStyle=accent; _roundRect(ctx,sx,topY,sw,sh,sh/2); ctx.fill();
  ctx.fillStyle=_corContraste(accent); ctx.textBaseline='middle'; ctx.fillText(selo, W/2, topY+sh/2+2); ctx.textBaseline='alphabetic';
  let y=topY+sh+96;

  // Título da vaga
  const vaga=document.getElementById('card-vaga')?.value||'';
  ctx.fillStyle='#FFFFFF'; ctx.font='900 80px Poppins, sans-serif';
  y=_wrap(ctx, vaga.toUpperCase(), W/2, y, W-150, 88)+34;

  // Linha decorativa
  ctx.strokeStyle=accentTxt; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(W/2-80,y); ctx.lineTo(W/2+80,y); ctx.stroke();
  y+=80;

  // Painel translúcido com os detalhes
  const padX=72, panelX=80, panelW=W-160;
  ctx.textAlign='left';
  const blocks=_lerCampos().map(cp=>{
    ctx.font='400 34px Poppins, sans-serif';
    return {lbl:cp.label||'', linhas:_medirLinhas(ctx, cp.valor||'', panelW-2*padX)};
  });
  let panelH=58; blocks.forEach(b=>{ panelH += 46 + b.linhas.length*46 + 30; });
  ctx.fillStyle='rgba(255,255,255,0.09)'; _roundRect(ctx, panelX, y, panelW, panelH, 30); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=2; _roundRect(ctx, panelX, y, panelW, panelH, 30); ctx.stroke();

  let ty=y+62;
  blocks.forEach(b=>{
    ctx.fillStyle=accentTxt; ctx.font='700 28px Poppins, sans-serif'; ctx.fillText(b.lbl.toUpperCase(), panelX+padX, ty); ty+=46;
    ctx.fillStyle='#F4F4F5'; ctx.font='400 34px Poppins, sans-serif';
    b.linhas.forEach(l=>{ ctx.fillText(l, panelX+padX, ty); ty+=46; });
    ty+=30;
  });

  // Rodapé
  ctx.textAlign='center';
  ctx.fillStyle=accentTxt; ctx.font='600 30px Poppins, sans-serif'; ctx.fillText('TRABALHE CONOSCO', W/2, H-185);
  ctx.fillStyle='#FFFFFF'; ctx.font='500 32px Poppins, sans-serif'; ctx.fillText('Envie seu currículo para o e-mail:', W/2, H-130);
  // E-mail — reduz a fonte se necessário para caber na largura
  const emailTxt = emp.email || EMAIL_VAGAS;
  let efs=38; ctx.font='700 '+efs+'px Poppins, sans-serif';
  while(ctx.measureText(emailTxt).width > W-120 && efs>22){ efs-=2; ctx.font='700 '+efs+'px Poppins, sans-serif'; }
  ctx.fillStyle='#FFFFFF'; ctx.fillText(emailTxt, W/2, H-78);
  ctx.textAlign='left';
}

// Templates com FOTO no círculo central — fundo é arte pronta (título e logo embutidos).
// AJUSTAR posições (cy/r/nomeY/cargoY) conforme a arte real.
// fyR/fhR/nomeR/cargoR = posições em fração da altura (a foto NÃO pode cobrir o título da arte)
const TEMPLATES = {

  bemvindo: { bg:'bemvindo.jpg', corNome:'#FFFFFF', corCargo:'#CBD6E8', cargoId:'card-cargo',       fyR:0.305, fhR:0.34, nomeR:0.705, cargoR:0.742 },
};

async function _cardTemplateFoto(ctx, cv, cfg){
  const tpl = await _carregarArte(cfg.bg);
  let W,H;
  if(tpl){ cv.width=tpl.naturalWidth||1080; cv.height=tpl.naturalHeight||1920; W=cv.width; H=cv.height; ctx.drawImage(tpl,0,0,W,H); }
  else { cv.width=1080; cv.height=1920; W=cv.width; H=cv.height; ctx.fillStyle='#1b1b1b'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#888'; ctx.font='400 30px Poppins, sans-serif'; ctx.fillText('(envie '+cfg.bg+' para a raiz do projeto)', W/2, 0.5*H); ctx.textAlign='left'; }

  const key=document.getElementById('card-sel-colab')?.value; const c=_colabs.find(x=>x._key===key);

  // Foto — moldura branca (retângulo arredondado), POSIÇÃO abaixo do título da arte
  const fh=(cfg.fhR||0.34)*H, fw=fh*0.835, fx=(W-fw)/2, fy=(cfg.fyR||0.30)*H, frad=0.010*W;
  const borda=0.018*W;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.22)'; ctx.shadowBlur=0.035*W; ctx.shadowOffsetY=0.012*W;
  ctx.fillStyle='#FFFFFF'; _roundRect(ctx,fx,fy,fw,fh,frad); ctx.fill();
  ctx.restore();
  const px=fx+borda, py=fy+borda, pw=fw-2*borda, ph=fh-2*borda, pr=Math.max(0,frad-borda*0.5);
  ctx.save(); _roundRect(ctx,px,py,pw,ph,pr); ctx.clip();
  let img=null; if(c?.foto_url) img=await _carregarImg(fotoSrc(c.foto_url));
  if(img){ _desenharFotoCover(ctx,img,px,py,pw,ph); }
  else{ ctx.fillStyle='#2e4046'; ctx.fillRect(px,py,pw,ph); ctx.fillStyle='#7d9099'; ctx.font='800 120px Poppins, sans-serif'; ctx.textAlign='center'; ctx.fillText(iniciais(c?.nome||'?'),W/2,py+ph/2+42); }
  ctx.restore();

  // Nome + cargo abaixo da moldura
  ctx.textAlign='center';
  ctx.fillStyle=cfg.corNome; ctx.font='700 '+Math.round(0.046*W)+'px Poppins, sans-serif';
  ctx.fillText(nomeCurto(c?.nome) || 'Nome do colaborador', W/2, (cfg.nomeR||0.70)*H);
  const cargo=document.getElementById(cfg.cargoId)?.value || '';
  if(cargo){ ctx.fillStyle=cfg.corCargo; ctx.font='500 '+Math.round(0.030*W)+'px Poppins, sans-serif'; ctx.fillText(cargo, W/2, (cfg.cargoR||0.74)*H); }
  ctx.textAlign='left';
}

async function gerarCard(){
  const cv=document.getElementById('card-canvas'); const ctx=cv.getContext('2d');

  // Garante que as fontes estejam carregadas antes de desenhar no canvas
  try { if (document.fonts) { await Promise.all([
    document.fonts.load('700 48px Roboto'),
    document.fonts.load('500 32px Roboto'),
    document.fonts.load('400 28px Roboto'),
    document.fonts.load('900 96px Poppins'),
    document.fonts.load('800 72px Poppins'),
    document.fonts.load('600 36px Poppins'),
    document.fonts.load('500 32px Poppins'),
    document.fonts.load('400 30px Poppins'),
  ]); await document.fonts.ready; } } catch(e){}

  if(_cardTipo==='aniversario'){ ctx.clearRect(0,0,cv.width,cv.height); await _cardAniversario(ctx, cv); return; }
  if(_cardTipo==='contratacao'){ ctx.clearRect(0,0,cv.width,cv.height); await _cardContratacao(ctx, cv); return; }
  if(_cardTipo==='promocao'){ ctx.clearRect(0,0,cv.width,cv.height); await _cardTemplateFoto(ctx, cv, TEMPLATES.promocao); return; }
  if(_cardTipo==='bemvindo'){ ctx.clearRect(0,0,cv.width,cv.height); await _cardTemplateFoto(ctx, cv, TEMPLATES.bemvindo); return; }
}

function baixarCard(){
  const cv=document.getElementById('card-canvas');
  const nome = (_cardTipo==='contratacao')
    ? ((EMPRESAS[document.getElementById('card-empresa')?.value]?.nome||'') + '-' + (document.getElementById('card-vaga')?.value||'vaga'))
    : (_colabs.find(x=>x._key===document.getElementById('card-sel-colab')?.value)?.nome || 'card');
  const a=document.createElement('a'); a.download=`card-${_cardTipo}-${nome}.png`.replace(/[^a-zA-Z0-9.\-]/g,'_'); a.href=cv.toDataURL('image/png'); a.click();
}
