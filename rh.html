<!DOCTYPE html>
<!-- build: 2026-06-11a — RH: Colaboradores + Dashboard de aniversários (Fase 1) -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colaboradores — Solução Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme = localStorage.getItem('tema') || 'dark';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0A;--surface-1:#111111;--surface-2:#161616;--surface-3:#1B1B1B;
  --primary:#3ECF8E;--secondary:#4F46E5;
  --text-1:#FFFFFF;--text-2:#A1A1AA;--text-3:#52525B;
  --border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.16);
  --amber:#F59E0B;--amber-text:#FCD34D;--red:#EF4444;--red-text:#F87171;--radius:8px;
}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{background:var(--surface-1);border-bottom:1px solid var(--border);height:56px;padding:0 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:15px;font-weight:700;flex:1;letter-spacing:-.2px;color:var(--text-1);text-decoration:none}
.topbar-greeting{font-size:13px;color:var(--text-2)}
.topbar-links{display:flex;align-items:center;gap:4px}
.topbar-links a{color:var(--text-2);text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:6px;transition:color .15s,background .15s}
.topbar-links a:hover{color:var(--text-1);background:rgba(255,255,255,.06)}
.topbar-links a.active{color:var(--primary)}
.topbar-links a.nav-sair{border:1px solid rgba(255,255,255,.12);margin-left:8px}

.page{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
.page-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex:1;line-height:1}
.page-title i{width:22px;height:22px;color:var(--primary);flex-shrink:0}

.btn-nova{padding:10px 20px;background:var(--primary);color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
.btn-nova:hover{opacity:.88}
.btn-nova i{width:15px;height:15px}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sk{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.sk-val{font-size:22px;font-weight:800;line-height:1;margin-bottom:5px}
.sk-lbl{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
@media(max-width:720px){.stats-row{grid-template-columns:repeat(2,1fr)}}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.card h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h2 i{width:16px;height:16px;color:var(--primary)}

/* Lembretes de aniversário */
.aniv-list{display:flex;flex-direction:column;gap:8px}
.aniv-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px}
.aniv-item .av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex-shrink:0}
.aniv-item .nm{font-weight:600;font-size:13.5px}
.aniv-item .cg{font-size:12px;color:var(--text-3)}
.aniv-item .dt{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--amber-text);text-align:right}
.aniv-hoje{border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.06)}
.aniv-hoje .dt{color:var(--primary)}

/* Busca */
.busca-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.busca-bar input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);color:var(--text-1);border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none}
.busca-bar input:focus{border-color:var(--border-hover)}

/* Grid de colaboradores */
.colab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.colab{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.colab:hover{border-color:var(--border-hover)}
.colab-top{display:flex;align-items:center;gap:12px}
.colab-foto{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex-shrink:0;border:1px solid var(--border)}
.colab-foto-ph{width:52px;height:52px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:18px;flex-shrink:0;border:1px solid var(--border)}
.colab-nome{font-weight:700;font-size:14px;line-height:1.2}
.colab-cargo{font-size:12.5px;color:var(--primary);font-weight:600;margin-top:2px}
.colab-info{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--border);padding-top:10px}
.colab-info span{display:flex;align-items:center;gap:6px}
.colab-info i{width:13px;height:13px;color:var(--text-3)}
.badge-inativo{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:rgba(239,68,68,.12);color:var(--red-text);padding:2px 7px;border-radius:5px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.aberto{display:flex}
.modal{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:24px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.modal-head i{width:20px;height:20px;color:var(--primary)}
.modal-head h2{font-size:17px;font-weight:700}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text-1);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--border-hover)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foto-edit{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.foto-edit img,.foto-edit .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.btn-sec{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:8px;padding:9px 18px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-pri{background:var(--primary);border:none;color:#000;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.btn-del{background:none;border:1px solid rgba(239,68,68,.4);color:var(--red-text);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;margin-right:auto}
.empty{text-align:center;color:var(--text-3);padding:40px 20px}
</style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<div class="page">
  <div class="page-header">
    <h2 class="page-title"><i data-lucide="users-round"></i> Colaboradores</h2>
    <button class="btn-nova" onclick="abrirModal()"><i data-lucide="user-plus"></i> Novo colaborador</button>
  </div>

  <!-- Dashboard RH -->
  <div class="stats-row">
    <div class="sk"><div class="sk-val" id="st-total">0</div><div class="sk-lbl">Colaboradores</div></div>
    <div class="sk"><div class="sk-val" id="st-mes" style="color:var(--amber-text)">0</div><div class="sk-lbl">Aniversários no mês</div></div>
    <div class="sk"><div class="sk-val" id="st-hoje" style="color:var(--primary)">0</div><div class="sk-lbl">Aniversários hoje</div></div>
    <div class="sk"><div class="sk-val" id="st-ferias">0</div><div class="sk-lbl">Dias de férias a vencer</div></div>
  </div>

  <div class="card">
    <h2><i data-lucide="cake"></i> Próximos aniversários (30 dias)</h2>
    <div class="aniv-list" id="aniv-list"><div class="empty">Carregando...</div></div>
  </div>

  <div class="busca-bar">
    <input type="text" id="busca" placeholder="Buscar por nome ou cargo..." oninput="renderColabs()">
  </div>

  <div class="colab-grid" id="colab-grid"></div>
</div>

<!-- Modal cadastro/edição -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-head"><i data-lucide="user-round"></i><h2 id="modal-titulo">Novo colaborador</h2></div>

    <div class="foto-edit">
      <img id="foto-preview" style="display:none" alt="Foto">
      <div class="ph" id="foto-ph"><i data-lucide="image"></i></div>
      <div>
        <input type="file" id="foto-input" accept="image/*" style="display:none" onchange="_selecionarFoto(this)">
        <button class="btn-sec" type="button" onclick="document.getElementById('foto-input').click()"><i data-lucide="upload" style="width:13px;height:13px"></i> Foto</button>
        <div style="font-size:11px;color:var(--text-3);margin-top:6px">JPG/PNG · usada nos cards</div>
      </div>
    </div>

    <div class="fg"><label>Nome completo *</label><input type="text" id="f-nome" placeholder="Nome do colaborador"></div>
    <div class="fg"><label>Cargo</label>
      <select id="f-cargo">
        <option value="">— Selecionar —</option>
        <option>Consultor Comercial</option>
        <option>Estoquista</option>
        <option>Analista de Estoque</option>
        <option>Técnico de Cabeamento</option>
        <option>Técnico de Elétrica e Hardware</option>
        <option>Técnico de Áudio e Vídeo</option>
        <option>Técnico de Automação</option>
        <option>Auxiliar Técnico</option>
        <option>Coordenador</option>
        <option>Supervisor</option>
        <option>Administrativo</option>
        <option>RH</option>
        <option>Outro</option>
      </select>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Data de admissão</label><input type="date" id="f-admissao"></div>
      <div class="fg"><label>Aniversário</label><input type="date" id="f-aniversario"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Férias restantes (dias)</label><input type="number" id="f-ferias" min="0" placeholder="0"></div>
      <div class="fg"><label>Telefone</label><input type="text" id="f-telefone" placeholder="(00) 00000-0000"></div>
    </div>
    <div class="fg"><label>E-mail</label><input type="email" id="f-email" placeholder="email@..."></div>
    <div class="fg"><label>Observações</label><textarea id="f-obs" rows="2" placeholder="Opcional"></textarea></div>
    <div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="f-ativo" checked style="width:auto;accent-color:var(--primary)"> Ativo</label></div>

    <div id="modal-erro" style="display:none;color:var(--red-text);font-size:13px;margin-bottom:12px"></div>

    <div class="modal-actions">
      <button class="btn-del" id="btn-del" style="display:none" onclick="excluirColab()"><i data-lucide="trash-2" style="width:13px;height:13px"></i> Excluir</button>
      <button class="btn-sec" onclick="fecharModal()">Cancelar</button>
      <button class="btn-pri" id="btn-salvar" onclick="salvarColab()"><i data-lucide="save" style="width:14px;height:14px"></i> Salvar</button>
    </div>
  </div>
</div>

<script>
let _authToken = '';
let _colabs = [];
let _editId = null;
let _fotoFile = null;       // arquivo novo selecionado
let _fotoRemovida = false;

function fotoSrc(url){ if(!url||!_authToken) return url; return url + (url.includes('?')?'&':'?') + 't=' + encodeURIComponent(_authToken); }
function escH(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iniciais(n){ const p=(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'?').toUpperCase() + ((p[1]||'')[0]||'').toUpperCase(); }

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }
  _authToken = session.access_token || '';
  db.auth.onAuthStateChange((_e, s) => { if (s?.access_token) _authToken = s.access_token; });

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();
  if (!eu || !['rh', 'admin_geral'].includes(eu.role)) { location.href = 'obras.html'; return; }

  renderTopbar(eu.nome, eu.role, 'rh');
  lucide.createIcons();
  await carregar();
})();

async function carregar() {
  const { data, error } = await db.from('colaboradores').select('*').order('nome');
  if (error) { document.getElementById('aniv-list').innerHTML = `<div class="empty">Erro: ${escH(error.message)}</div>`; return; }
  _colabs = data || [];
  renderDashboard();
  renderColabs();
}

// ── Dashboard ────────────────────────────────────────────────
function _diaMes(d){ if(!d) return null; const [,m,dia]=d.split('-'); return {m:+m,d:+dia}; }
function _diasAte(d){ // dias até o próximo aniversário
  const dm=_diaMes(d); if(!dm) return null;
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  let prox=new Date(hoje.getFullYear(), dm.m-1, dm.d);
  if(prox<hoje) prox=new Date(hoje.getFullYear()+1, dm.m-1, dm.d);
  return Math.round((prox-hoje)/86400000);
}
function renderDashboard() {
  const ativos = _colabs.filter(c => c.ativo !== false);
  const mesAtual = new Date().getMonth()+1;
  const noMes = ativos.filter(c => _diaMes(c.data_aniversario)?.m === mesAtual);
  const hoje = ativos.filter(c => _diasAte(c.data_aniversario) === 0);
  document.getElementById('st-total').textContent  = ativos.length;
  document.getElementById('st-mes').textContent    = noMes.length;
  document.getElementById('st-hoje').textContent   = hoje.length;
  document.getElementById('st-ferias').textContent = ativos.reduce((s,c)=>s+(parseInt(c.ferias_restantes)||0),0);

  // Próximos 30 dias, ordenados por proximidade
  const prox = ativos
    .map(c => ({ c, dias: _diasAte(c.data_aniversario) }))
    .filter(x => x.dias != null && x.dias <= 30)
    .sort((a,b) => a.dias - b.dias);

  const el = document.getElementById('aniv-list');
  if (!prox.length) { el.innerHTML = '<div class="empty">Nenhum aniversário nos próximos 30 dias.</div>'; return; }
  el.innerHTML = prox.map(({c,dias}) => {
    const dm = _diaMes(c.data_aniversario);
    const dataTxt = String(dm.d).padStart(2,'0')+'/'+String(dm.m).padStart(2,'0');
    const quando = dias===0 ? 'HOJE 🎉' : dias===1 ? 'amanhã' : `em ${dias} dias`;
    const foto = c.foto_url
      ? `<img class="av" src="${escH(fotoSrc(c.foto_url))}" alt="">`
      : `<div class="av" style="display:flex;align-items:center;justify-content:center;color:var(--text-3);font-weight:700;font-size:13px">${iniciais(c.nome)}</div>`;
    return `<div class="aniv-item ${dias===0?'aniv-hoje':''}">
      ${foto}
      <div><div class="nm">${escH(c.nome)}</div><div class="cg">${escH(c.cargo||'—')}</div></div>
      <div class="dt">${dataTxt}<br><span style="font-weight:500;color:var(--text-3);font-size:11px">${quando}</span></div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

// ── Lista de colaboradores ───────────────────────────────────
function _fmtData(d){ if(!d) return '—'; const [y,m,dia]=d.split('-'); return `${dia}/${m}/${y}`; }
function renderColabs() {
  const termo = (document.getElementById('busca').value||'').toLowerCase().trim();
  const lista = _colabs.filter(c =>
    !termo || (c.nome||'').toLowerCase().includes(termo) || (c.cargo||'').toLowerCase().includes(termo));
  const grid = document.getElementById('colab-grid');
  if (!lista.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhum colaborador encontrado.</div>'; return; }
  grid.innerHTML = lista.map(c => {
    const foto = c.foto_url
      ? `<img class="colab-foto" src="${escH(fotoSrc(c.foto_url))}" alt="">`
      : `<div class="colab-foto-ph">${iniciais(c.nome)}</div>`;
    return `<div class="colab" onclick="abrirModal(${c.id})">
      <div class="colab-top">
        ${foto}
        <div>
          <div class="colab-nome">${escH(c.nome)} ${c.ativo===false?'<span class="badge-inativo">inativo</span>':''}</div>
          <div class="colab-cargo">${escH(c.cargo||'—')}</div>
        </div>
      </div>
      <div class="colab-info">
        <span><i data-lucide="calendar-plus"></i> Admissão: ${_fmtData(c.data_admissao)}</span>
        <span><i data-lucide="cake"></i> Aniversário: ${_fmtData(c.data_aniversario)}</span>
        <span><i data-lucide="palmtree"></i> Férias restantes: ${c.ferias_restantes!=null?c.ferias_restantes+' dia(s)':'—'}</span>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

// ── Modal ────────────────────────────────────────────────────
function abrirModal(id) {
  _editId = id || null;
  _fotoFile = null; _fotoRemovida = false;
  document.getElementById('modal-erro').style.display = 'none';
  document.getElementById('foto-input').value = '';
  const c = id ? _colabs.find(x => x.id === id) : null;

  document.getElementById('modal-titulo').textContent = c ? 'Editar colaborador' : 'Novo colaborador';
  document.getElementById('f-nome').value        = c?.nome || '';
  document.getElementById('f-cargo').value       = c?.cargo || '';
  document.getElementById('f-admissao').value    = c?.data_admissao || '';
  document.getElementById('f-aniversario').value = c?.data_aniversario || '';
  document.getElementById('f-ferias').value      = c?.ferias_restantes ?? '';
  document.getElementById('f-telefone').value    = c?.telefone || '';
  document.getElementById('f-email').value       = c?.email || '';
  document.getElementById('f-obs').value         = c?.observacoes || '';
  document.getElementById('f-ativo').checked     = c ? c.ativo !== false : true;
  document.getElementById('btn-del').style.display = c ? 'inline-flex' : 'none';

  _renderFotoPreview(c?.foto_url ? fotoSrc(c.foto_url) : null);
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}
function fecharModal(){ document.getElementById('overlay').classList.remove('aberto'); }

function _renderFotoPreview(src) {
  const img = document.getElementById('foto-preview');
  const ph  = document.getElementById('foto-ph');
  if (src) { img.src = src; img.style.display = ''; ph.style.display = 'none'; }
  else { img.style.display = 'none'; ph.style.display = 'flex'; }
}
function _selecionarFoto(input) {
  const f = input.files?.[0];
  if (!f) return;
  _fotoFile = f; _fotoRemovida = false;
  _renderFotoPreview(URL.createObjectURL(f));
}

// Compressão (igual os.html) — reduz a foto antes de subir
async function _comprimirImagem(file, maxDim = 1024, quality = 0.85) {
  try {
    let bmp = null;
    if (window.createImageBitmap) bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
    if (!bmp) bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const w0 = bmp.width, h0 = bmp.height; if (!w0 || !h0) return file;
    const sc = Math.min(1, maxDim / Math.max(w0, h0));
    const w = Math.round(w0*sc), h = Math.round(h0*sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
    return (blob && blob.size < file.size) ? blob : file;
  } catch (e) { return file; }
}

async function _uploadFoto(colabId, nome) {
  const blob = await _comprimirImagem(_fotoFile);
  const nomeSeguro = (nome || 'colaborador').replace(/[\/\\:*?"<>|#%~]/g, '').trim().substring(0, 40) || 'colaborador';
  const filename = `${nomeSeguro} ${colabId}.jpg`;
  const folderPath = 'Colaboradores/Fotos';

  const { data: { session } } = await db.auth.getSession();
  const hdrs = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` };
  const initRes = await fetch('/api/upload', { method: 'POST', headers: hdrs,
    body: JSON.stringify({ path: folderPath, filename, contentType: 'image/jpeg' }) });
  if (!initRes.ok) throw new Error('Upload (proxy): ' + await initRes.text());
  const { uploadUrl, filePath } = await initRes.json();

  const CHUNK = 10 * 1024 * 1024; let start = 0;
  while (start < blob.size) {
    const end = Math.min(start + CHUNK, blob.size);
    const put = await fetch(uploadUrl, { method: 'PUT',
      headers: { 'Content-Range': `bytes ${start}-${end-1}/${blob.size}`, 'Content-Type': 'image/jpeg' },
      body: blob.slice(start, end) });
    if (!put.ok && put.status !== 202) throw new Error('Upload chunk: ' + put.status);
    start = end;
  }
  return `/api/foto?path=${encodeURIComponent(filePath)}`;
}

async function salvarColab() {
  const nome = document.getElementById('f-nome').value.trim();
  const erroEl = document.getElementById('modal-erro');
  if (!nome) { erroEl.textContent = 'Informe o nome.'; erroEl.style.display = 'block'; return; }

  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.innerHTML = 'Salvando...';

  const payload = {
    nome,
    cargo:            document.getElementById('f-cargo').value || null,
    data_admissao:    document.getElementById('f-admissao').value || null,
    data_aniversario: document.getElementById('f-aniversario').value || null,
    ferias_restantes: document.getElementById('f-ferias').value !== '' ? parseInt(document.getElementById('f-ferias').value) : null,
    telefone:         document.getElementById('f-telefone').value.trim() || null,
    email:            document.getElementById('f-email').value.trim() || null,
    observacoes:      document.getElementById('f-obs').value.trim() || null,
    ativo:            document.getElementById('f-ativo').checked,
    atualizado_em:    new Date().toISOString(),
  };

  try {
    let colabId = _editId;
    if (_editId) {
      const { error } = await db.from('colaboradores').update(payload).eq('id', _editId);
      if (error) throw new Error(error.message);
    } else {
      payload.criado_em = new Date().toISOString();
      const { data, error } = await db.from('colaboradores').insert(payload).select('id').single();
      if (error) throw new Error(error.message);
      colabId = data.id;
    }

    // Foto: sobe se houver nova, ou limpa se removida
    if (_fotoFile && colabId) {
      btn.innerHTML = 'Enviando foto...';
      try {
        const url = await _uploadFoto(colabId, nome);
        await db.from('colaboradores').update({ foto_url: url }).eq('id', colabId);
      } catch (e) { console.warn('Foto não salva:', e.message); showToast('Salvo, mas a foto falhou: ' + e.message, 'warning'); }
    } else if (_fotoRemovida && colabId) {
      await db.from('colaboradores').update({ foto_url: null }).eq('id', colabId);
    }

    showToast('Colaborador salvo.', 'success');
    fecharModal();
    await carregar();
  } catch (e) {
    erroEl.textContent = 'Erro: ' + e.message; erroEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.innerHTML = '<i data-lucide="save" style="width:14px;height:14px"></i> Salvar'; lucide.createIcons();
  }
}

async function excluirColab() {
  if (!_editId) return;
  const c = _colabs.find(x => x.id === _editId);
  if (!confirm(`Excluir o colaborador "${c?.nome || ''}"?\n\nAção irreversível.`)) return;
  const { error } = await db.from('colaboradores').delete().eq('id', _editId);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  showToast('Colaborador excluído.', 'success');
  fecharModal();
  await carregar();
}
