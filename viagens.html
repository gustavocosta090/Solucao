<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viagens — Solução Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0A0A;--surface-1:#111;--surface-2:#161616;--primary:#3ECF8E;--text-1:#fff;--text-2:#A1A1AA;--text-3:#52525B;--border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.16);--amber-text:#FCD34D;}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{background:var(--surface-1);border-bottom:1px solid var(--border);height:56px;padding:0 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.topbar-logo{font-size:15px;font-weight:700;flex:1;letter-spacing:-.2px}
.topbar-greeting{font-size:13px;color:var(--text-2)}
.topbar-links{display:flex;align-items:center;gap:4px}
.topbar-links a{color:var(--text-2);text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:6px;transition:color .15s,background .15s}
.topbar-links a:hover{color:var(--text-1);background:rgba(255,255,255,.06)}
.topbar-links a.active{color:var(--text-1);background:rgba(255,255,255,.07)}
.topbar-links a.nav-sair{border:1px solid rgba(255,255,255,.12);margin-left:8px}
.tema-btn{background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:6px;color:var(--text-2);font-size:15px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.page{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
.page-header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;flex:1}
.sem-nav{display:flex;align-items:center;gap:8px}
.sem-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;font-size:16px}
.sem-btn:hover{border-color:var(--border-hover);color:var(--text-1)}
#sem-label{font-size:13px;font-weight:600;min-width:230px;text-align:center}
.btn-exp{padding:8px 16px;background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);border-radius:7px;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.sc-val{font-size:26px;font-weight:800;line-height:1;margin-bottom:5px}
.sc-lbl{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.vcard{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.vcard:hover{border-color:var(--border-hover)}
.vtop{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.vdata{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.vcliente{font-size:15px;font-weight:700}
.vtec{font-size:12px;color:var(--text-3);margin-top:3px}
.vservico{font-size:12px;color:var(--text-2);margin-top:2px;font-style:italic}
.vhora{font-size:20px;font-weight:800;color:var(--amber-text);margin-left:auto;flex-shrink:0}
.vbody{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;padding:18px}
.vf label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);margin-bottom:7px}
.vf input[type=text],.vf input[type=number]{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-1);font-family:inherit;font-size:13px;padding:8px 11px;outline:none}
.vf input:focus{border-color:rgba(62,207,142,.4)}
.hchk{display:flex;align-items:center;gap:8px;margin-bottom:9px;cursor:pointer}
.hchk input{accent-color:var(--primary);width:15px;height:15px}
.hchk span{font-size:13px;font-weight:600;color:var(--text-2)}
.vfoot{padding:10px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vok{font-size:11px;color:var(--primary);display:none;align-items:center;gap:4px;margin-right:auto}
.bv{height:34px;padding:0 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;border:none}
.bsalvar{background:var(--primary);color:#000}.bsalvar:hover{opacity:.88}
.bpdf{background:transparent;border:1px solid var(--border)!important;color:var(--text-2)}.bpdf:hover{border-color:var(--border-hover)!important;color:var(--text-1)}
.empty{text-align:center;padding:60px;color:var(--text-3)}
.spin-wrap{text-align:center;padding:60px}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.vbody{grid-template-columns:1fr}}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<div class="page">
  <div class="page-header">
    <h1 class="page-title"><i data-lucide="plane"></i> Viagens e Hotel</h1>
    <div class="sem-nav">
      <button class="sem-btn" onclick="mudarSemana(-1)">‹</button>
      <span id="sem-label">—</span>
      <button class="sem-btn" onclick="mudarSemana(1)">›</button>
    </div>
    <button class="btn-exp" onclick="exportarSemana()">Exportar PDF Semana</button>
  </div>
  <div class="stats">
    <div class="sc"><div class="sc-val" id="st">0</div><div class="sc-lbl">Viagens na semana</div></div>
    <div class="sc"><div class="sc-val" id="sh">0</div><div class="sc-lbl">Com hotel</div></div>
    <div class="sc"><div class="sc-val" id="sr" style="font-size:18px;line-height:1.5">R$ 0</div><div class="sc-lbl">Saldo refeição total</div></div>
    <div class="sc"><div class="sc-val" id="stc">0</div><div class="sc-lbl">Técnicos viajando</div></div>
  </div>
  <div id="vlista"><div class="spin-wrap"><div class="spin"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div></div>
</div>

<script>
// ── Configuração ──────────────────────────────────────────────
const SUPA_URL = 'https://kxtjqudpnmdqkzqhyhmz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dGpxdWRwbm1kcWt6cWh5aG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDYzMzEsImV4cCI6MjA5NTIyMjMzMX0.tba066RGNwDbXaNEy3w_OHbblll_bky6Dx10mXnxVQ0';

// db já criado pelo utils.js (usa o mesmo supabase global)
// Se não existir, cria aqui
const _db = (typeof db !== 'undefined') ? db : supabase.createClient(SUPA_URL, SUPA_KEY);

let _off = 0, _ags = [], _dets = {}, _tecs = [];
const DIAS  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const _iso  = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const _brl  = v => 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2});

function _semana(off){
  const h=new Date(), dow=h.getDay()||7, s=new Date(h);
  s.setDate(h.getDate()-dow+1+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d;});
}

// ── Init (IIFE no final do body — padrão de todas as páginas) ──
(async()=>{
  applyTheme();
  lucide.createIcons();

  const {data:{session}} = await _db.auth.getSession();
  if(!session){location.href='login.html';return;}

  const {data:eu} = await _db.from('tecnicos').select('role,nome').eq('auth_user_id',session.user.id).single();
  if(!eu||!['supervisor','coordenador','agendamento'].includes(eu.role)){location.href='obras.html';return;}

  renderTopbar(eu.nome,eu.role,'viagens');
  lucide.createIcons();

  const {data:tList} = await _db.from('tecnicos').select('id,nome');
  _tecs = tList||[];

  await _carregar();
})();

function mudarSemana(d){_off+=d;_carregar();}

async function _carregar(){
  const el = document.getElementById('vlista');
  el.innerHTML = '<div class="spin-wrap"><div class="spin"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>';

  // Semana
  const dias = _semana(_off);
  const d0=dias[0], d6=dias[6];
  document.getElementById('sem-label').textContent =
    d0.getDate()+' de '+MESES[d0.getMonth()]+' — '+d6.getDate()+' de '+MESES[d6.getMonth()]+' '+d6.getFullYear();

  // Agendamentos de viagem
  const {data:aList, error:aErr} = await _db.from('agendamentos')
    .select('id,data,hora_inicio,tecnico_id,auxiliar_id,auxiliar2_id,auxiliar3_id,servico,cliente_outro,obra_id')
    .eq('status','viagem').gte('data',_iso(d0)).lte('data',_iso(d6))
    .order('data').order('hora_inicio');

  _ags = aList||[];

  // Obras (sem join para evitar erro de schema cache)
  const obraIds = [...new Set(_ags.map(a=>a.obra_id).filter(Boolean))];
  if(obraIds.length){
    const {data:obList} = await _db.from('obras').select('id,nome_cliente,endereco').in('id',obraIds);
    const obMap = {};
    (obList||[]).forEach(o=>{obMap[o.id]=o;});
    _ags.forEach(a=>{a._ob=obMap[a.obra_id]||null;});
  }

  // Detalhes (ignora se tabela não existir)
  _dets = {};
  if(_ags.length){
    try{
      const {data:dList} = await _db.from('viagens_detalhe').select('*').in('agendamento_id',_ags.map(a=>a.id));
      (dList||[]).forEach(d=>{_dets[d.agendamento_id]=d;});
    }catch(e){console.warn('viagens_detalhe não existe ainda',(e.message||''));}
  }

  _renderLista(dias);
  _stats();
}

function _renderLista(dias){
  const el = document.getElementById('vlista');
  if(!_ags.length){
    el.innerHTML='<div class="empty"><p style="font-size:14px">Nenhuma viagem nesta semana.</p><p style="font-size:12px;margin-top:8px;color:var(--text-3)">Agendamentos com status "Viagem" aparecerão aqui.</p></div>';
    return;
  }
  el.innerHTML = _ags.map(ag=>{
    const d   = new Date(ag.data+'T12:00');
    const idx = dias.findIndex(x=>_iso(x)===ag.data);
    const dTxt= (idx>=0?DIAS[idx]+', ':'')+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    const hora= ag.hora_inicio?ag.hora_inicio.slice(0,5):'';
    const cli = (ag._ob&&ag._ob.nome_cliente)||ag.cliente_outro||'(sem obra)';
    const tIds= [ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
    const tNm = tIds.map(id=>{const t=_tecs.find(t=>t.id===id);return t?t.nome:'';}).filter(Boolean).join(' · ')||'A definir';
    const det = _dets[ag.id]||{};
    const eid = 'v'+ag.id;
    return '<div class="vcard">'+
      '<div class="vtop">'+
        '<div style="flex:1;min-width:0">'+
          '<div class="vdata">'+dTxt+'</div>'+
          '<div class="vcliente">'+escHtml(cli)+'</div>'+
          '<div class="vtec">'+escHtml(tNm)+'</div>'+
          (ag.servico?'<div class="vservico">'+escHtml(ag.servico)+'</div>':'')+
        '</div>'+
        (hora?'<div class="vhora">'+hora+'</div>':'')+
      '</div>'+
      '<div class="vbody">'+
        '<div class="vf"><label>Cidade de destino</label>'+
          '<input type="text" id="c'+eid+'" value="'+escHtml(det.cidade||'')+'" placeholder="Ex: Cuiabá, MT"></div>'+
        '<div class="vf"><label>Saldo refeição (R$)</label>'+
          '<input type="number" id="s'+eid+'" value="'+(det.saldo_refeicao||'')+'" placeholder="0,00" step="0.01" min="0"></div>'+
        '<div class="vf"><label>Hotel</label>'+
          '<label class="hchk"><input type="checkbox" id="h'+eid+'" '+(det.hotel?'checked':'')+' onchange="tObs(\''+eid+'\')">'+
          '<span>Precisa de hotel</span></label>'+
          '<input type="text" id="o'+eid+'" value="'+escHtml(det.hotel_obs||'')+'" placeholder="Nome, preferências..." style="display:'+(det.hotel?'block':'none')+'">'+
        '</div>'+
      '</div>'+
      '<div class="vfoot">'+
        '<span class="vok" id="ok'+eid+'">✓ Salvo</span>'+
        '<button class="bv bpdf" onclick="_pdf('+ag.id+')">PDF</button>'+
        '<button class="bv bsalvar" onclick="_salvar('+ag.id+')">Salvar</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function tObs(eid){
  document.getElementById('o'+eid).style.display=document.getElementById('h'+eid).checked?'block':'none';
}

async function _salvar(agId){
  const eid='v'+agId;
  const p={agendamento_id:agId,
    cidade:document.getElementById('c'+eid).value.trim()||null,
    saldo_refeicao:parseFloat(document.getElementById('s'+eid).value)||null,
    hotel:document.getElementById('h'+eid).checked,
    hotel_obs:document.getElementById('o'+eid).value.trim()||null,
    atualizado_em:new Date().toISOString()};
  const res=_dets[agId]?.id
    ?await _db.from('viagens_detalhe').update(p).eq('id',_dets[agId].id).select().single()
    :await _db.from('viagens_detalhe').insert(p).select().single();
  if(res.data){
    _dets[agId]=res.data;
    const ok=document.getElementById('ok'+eid);
    ok.style.display='flex';setTimeout(()=>{ok.style.display='none';},2500);
    _stats();
  }else if(res.error){alert('Erro: '+res.error.message);}
}

function _stats(){
  document.getElementById('st').textContent=_ags.length;
  document.getElementById('sh').textContent=_ags.filter(a=>_dets[a.id]?.hotel).length;
  document.getElementById('sr').textContent=_brl(_ags.reduce((s,a)=>s+(parseFloat(_dets[a.id]?.saldo_refeicao)||0),0));
  const ts=new Set(_ags.flatMap(a=>[a.tecnico_id,a.auxiliar_id,a.auxiliar2_id,a.auxiliar3_id].filter(Boolean)));
  document.getElementById('stc').textContent=ts.size;
}

function _pdf(agId){
  const ag=_ags.find(a=>a.id===agId);if(!ag)return;
  const det=_dets[agId]||{};
  const cli=(ag._ob&&ag._ob.nome_cliente)||ag.cliente_outro||'—';
  const tIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
  const tNm=tIds.map(id=>{const t=_tecs.find(t=>t.id===id);return t?t.nome:'';}).filter(Boolean).join(', ')||'—';
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  doc.setFillColor(15,15,15);doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);
  doc.text('Solução Técnica — Autorização de Viagem',14,12);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(150,150,150);
  doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),14,20);
  let y=36;
  const campo=(lbl,val)=>{
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(130,130,130);doc.text(lbl.toUpperCase(),14,y);
    doc.setFont('helvetica','normal');doc.setFontSize(12);doc.setTextColor(20,20,20);doc.text(String(val||'—').slice(0,80),14,y+6);y+=18;
  };
  doc.setFillColor(240,255,248);doc.rect(10,y-4,190,14,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(10,80,40);
  doc.text(cli.slice(0,55),14,y+5);y+=18;
  campo('Data',ag.data);
  campo('Horário',ag.hora_inicio?ag.hora_inicio.slice(0,5):'—');
  campo('Técnico(s)',tNm);
  campo('Cidade de destino',det.cidade||'—');
  campo('Endereço / Obra',ag._ob?ag._ob.endereco:'—');
  campo('Serviço',ag.servico||'—');
  y+=4;
  doc.setFillColor(det.hotel?235:248,det.hotel?252:248,det.hotel?242:248);
  doc.rect(10,y-4,190,det.hotel&&det.hotel_obs?22:14,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(11);
  doc.setTextColor(det.hotel?10:100,det.hotel?90:100,det.hotel?40:100);
  doc.text(det.hotel?'✓  Hotel necessário':'✗  Sem necessidade de hotel',14,y+4);
  if(det.hotel&&det.hotel_obs){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(40,80,40);doc.text(det.hotel_obs,14,y+12);y+=8;}
  y+=20;
  doc.setFillColor(255,252,220);doc.rect(10,y-4,190,14,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(80,60,0);
  doc.text('Saldo para refeição: '+_brl(det.saldo_refeicao||0),14,y+5);y+=24;
  y+=8;doc.setDrawColor(180,180,180);doc.setLineWidth(.3);
  doc.line(14,y,90,y);doc.line(120,y,196,y);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(130,130,130);
  doc.text('Gestor / Aprovação',14,y+5);doc.text('Técnico responsável',120,y+5);
  doc.save('Viagem-'+cli.slice(0,25)+'-'+ag.data+'.pdf');
}

function exportarSemana(){
  if(!_ags.length){alert('Nenhuma viagem para exportar.');return;}
  const dias=_semana(_off);
  const d0=dias[0],d6=dias[6];
  const periodo=d0.getDate()+' a '+d6.getDate()+' de '+MESES[d6.getMonth()]+' '+d6.getFullYear();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
  doc.setFillColor(15,15,15);doc.rect(0,0,297,24,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(13);
  doc.text('Solução Técnica — Programação de Viagens',12,11);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(150,150,150);
  doc.text('Semana: '+periodo+' · Gerado em '+new Date().toLocaleString('pt-BR'),12,18);
  doc.setTextColor(62,207,142);doc.setFont('helvetica','bold');
  doc.text(_ags.length+' viagem'+(_ags.length!==1?'s':''),285,11,{align:'right'});
  const rows=_ags.map(ag=>{
    const d=new Date(ag.data+'T12:00');
    const idx=dias.findIndex(x=>_iso(x)===ag.data);
    const tIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
    const tNm=tIds.map(id=>{const t=_tecs.find(t=>t.id===id);return t?t.nome.split(' ')[0]:'';}).filter(Boolean).join(', ');
    const det=_dets[ag.id]||{};
    const cli=(ag._ob&&ag._ob.nome_cliente)||ag.cliente_outro||'—';
    return [(idx>=0?DIAS[idx]:'')+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),
      ag.hora_inicio?ag.hora_inicio.slice(0,5):'—',cli.slice(0,40),tNm||'—',
      det.cidade||'—',det.hotel?'Sim':'Não',det.saldo_refeicao?_brl(det.saldo_refeicao):'—',(ag.servico||'—').slice(0,50)];
  });
  doc.autoTable({startY:30,
    head:[['Dia','Hora','Cliente / Obra','Técnico(s)','Cidade','Hotel','Saldo Ref.','Serviço']],
    body:rows,margin:{left:10,right:10},
