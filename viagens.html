<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Viagens — Solução Técnica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="utils.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0A0A0A; --surface-1:#111; --surface-2:#161616; --surface-3:#1B1B1B;
      --primary:#3ECF8E; --text-1:#FFF; --text-2:#A1A1AA; --text-3:#52525B;
      --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.16);
      --amber-text:#FCD34D; --red-text:#F87171;
    }

    /* ── Topbar ── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); flex:1; letter-spacing:-.2px; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,.07); }
    .topbar-links a.nav-sair { border:1px solid rgba(255,255,255,.12); margin-left:8px; }

    /* ── Página ── */
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text-1); min-height:100vh; -webkit-font-smoothing:antialiased; }
    main { max-width:1200px; margin:0 auto; padding:32px 24px 80px; }

    /* ── Cabeçalho da página ── */
    .pg-header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
    .pg-titulo { font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px; flex:1; }
    .pg-titulo i { width:22px; height:22px; color:var(--primary); }

    /* ── Nav semana ── */
    .sem-nav { display:flex; align-items:center; gap:8px; }
    .sem-nav button { width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--text-2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .15s,color .15s; }
    .sem-nav button:hover { border-color:var(--border-hover); color:var(--text-1); }
    .sem-nav button i { width:15px; height:15px; }
    .sem-label { font-size:13px; font-weight:600; color:var(--text-1); min-width:220px; text-align:center; }

    /* ── Btn exportar ── */
    .btn-exp-sem { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; background:rgba(62,207,142,.1); border:1px solid rgba(62,207,142,.3); border-radius:7px; color:var(--primary); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:background .15s; }
    .btn-exp-sem:hover { background:rgba(62,207,142,.18); }
    .btn-exp-sem i { width:14px; height:14px; }

    /* ── Summary ── */
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
    .sc { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:16px 20px; }
    .sc-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-3); margin-bottom:8px; }
    .sc-val { font-size:26px; font-weight:800; line-height:1; }

    /* ── Cards ── */
    .vcard { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; overflow:hidden; }
    .vcard-top { display:flex; align-items:flex-start; gap:14px; padding:16px 20px; background:var(--surface-2); border-bottom:1px solid var(--border); }
    .vct-main { flex:1; min-width:0; }
    .vct-data { font-size:11px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
    .vct-cliente { font-size:16px; font-weight:700; }
    .vct-tec { font-size:12px; color:var(--text-3); margin-top:3px; }
    .vct-servico { font-size:12px; color:var(--text-2); margin-top:2px; font-style:italic; }
    .vct-hora { font-size:20px; font-weight:800; color:var(--amber-text); flex-shrink:0; }

    .vcard-body { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; padding:20px; }
    .vf label { display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-3); margin-bottom:7px; }
    .vf input[type=text], .vf input[type=number] {
      width:100%; background:var(--surface-2); border:1px solid var(--border);
      border-radius:7px; color:var(--text-1); font-family:inherit; font-size:13px;
      padding:9px 12px; outline:none; transition:border-color .15s;
    }
    .vf input:focus { border-color:rgba(62,207,142,.4); }
    .hotel-chk { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .hotel-chk input { accent-color:var(--primary); width:15px; height:15px; cursor:pointer; }
    .hotel-chk span { font-size:13px; font-weight:600; color:var(--text-2); cursor:pointer; }
    .hotel-chk span:hover { color:var(--text-1); }

    .vcard-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; align-items:center; gap:8px; justify-content:flex-end; }
    .saved-ok { font-size:11px; color:var(--primary); display:none; align-items:center; gap:4px; margin-right:auto; }
    .saved-ok i { width:12px; height:12px; }
    .btn-vcard { height:34px; padding:0 16px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:5px; border:none; transition:opacity .15s; }
    .btn-vcard i { width:12px; height:12px; }
    .btn-salvar { background:var(--primary); color:#000; }
    .btn-salvar:hover { opacity:.88; }
    .btn-pdf { background:transparent; border:1px solid var(--border) !important; color:var(--text-2); }
    .btn-pdf:hover { border-color:var(--border-hover) !important; color:var(--text-1); }

    /* ── Empty / spinner ── */
    .vazio { text-align:center; padding:72px 24px; color:var(--text-3); }
    .vazio i { width:44px; height:44px; margin:0 auto 14px; display:block; opacity:.3; }
    .vazio p { font-size:14px; }
    .carregando { text-align:center; padding:72px; }
    .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media(max-width:900px) {
      .summary { grid-template-columns:repeat(2,1fr); }
      .vcard-body { grid-template-columns:1fr; }
      .pg-header { flex-direction:column; align-items:flex-start; }
      .sem-label { min-width:160px; font-size:12px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema" style="display:none">🌙</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<main>

  <!-- Cabeçalho -->
  <div class="pg-header">
    <h1 class="pg-titulo"><i data-lucide="plane"></i> Viagens e Hotel</h1>

    <div class="sem-nav">
      <button onclick="mudarSemana(-1)"><i data-lucide="chevron-left"></i></button>
      <span class="sem-label" id="sem-label">—</span>
      <button onclick="mudarSemana(1)"><i data-lucide="chevron-right"></i></button>
    </div>

    <button class="btn-exp-sem" onclick="exportarSemana()">
      <i data-lucide="file-down"></i> Exportar Semana
    </button>
  </div>

  <!-- Summary -->
  <div class="summary">
    <div class="sc"><div class="sc-lbl">Viagens na semana</div><div class="sc-val" id="s-total">—</div></div>
    <div class="sc"><div class="sc-lbl">Com hotel</div><div class="sc-val" id="s-hotel">—</div></div>
    <div class="sc"><div class="sc-lbl">Saldo refeição total</div><div class="sc-val" id="s-ref" style="font-size:18px;line-height:1.5">—</div></div>
    <div class="sc"><div class="sc-lbl">Técnicos viajando</div><div class="sc-val" id="s-tecs">—</div></div>
  </div>

  <!-- Lista -->
  <div id="lista"></div>

</main>

<script>
const db = supabase.createClient(
  'https://kxtjqudpnmdqkzqhyhmz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dGpxdWRwbm1kcWt6cWh5aG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDYzMzEsImV4cCI6MjA5NTIyMjMzMX0.tba066RGNwDbXaNEy3w_OHbblll_bky6Dx10mXnxVQ0'
);

let semanaOffset = 0, agendamentos = [], detalhes = {}, tecnicos = [];

const DIAS  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const brl = v => `R$ ${(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;

function diasSemana(off) {
  const h=new Date(), dow=h.getDay()||7, s=new Date(h);
  s.setDate(h.getDate()-dow+1+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return d;});
}

// ── Init ──────────────────────────────────────────────────────
(async()=>{
  const {data:{session}} = await db.auth.getSession();
  if(!session){location.href='login.html';return;}

  const {data:eu} = await db.from('tecnicos').select('role,nome').eq('auth_user_id',session.user.id).single();
  if(!eu||!['supervisor','coordenador','agendamento'].includes(eu.role)){location.href='obras.html';return;}

  renderTopbar(eu.nome, eu.role, 'viagens');
  applyTheme();
  lucide.createIcons();

  const {data:tecs} = await db.from('tecnicos').select('id,nome');
  tecnicos = tecs||[];

  await carregarSemana();
})();

function mudarSemana(d){ semanaOffset+=d; carregarSemana(); }

async function carregarSemana(){
  const listaEl = document.getElementById('lista');
  try {
    const dias=diasSemana(semanaOffset);
    const d0=dias[0], d6=dias[6];

    document.getElementById('sem-label').textContent =
      `${d0.getDate()} de ${MESES[d0.getMonth()]} — ${d6.getDate()} de ${MESES[d6.getMonth()]} ${d6.getFullYear()}`;

    listaEl.innerHTML =
      '<div class="carregando"><div class="spinner"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>';

    // 1. Agendamentos de viagem da semana
    const {data:ags, error:agErr} = await db.from('agendamentos')
      .select('id,data,hora_inicio,status,tecnico_id,auxiliar_id,auxiliar2_id,auxiliar3_id,servico,cliente_outro,obra_id,obras(nome_cliente,endereco)')
      .eq('status','viagem')
      .gte('data',iso(d0)).lte('data',iso(d6))
      .order('data').order('hora_inicio');

    if(agErr) console.warn('[Viagens] agendamentos:', agErr.message);
    agendamentos = ags||[];

    // 2. Detalhes de viagem (silencia se tabela não existir)
    detalhes = {};
    if(agendamentos.length){
      try {
        const ids = agendamentos.map(a=>a.id);
        const {data:det} = await db.from('viagens_detalhe').select('*').in('agendamento_id',ids);
        (det||[]).forEach(d=>{ detalhes[d.agendamento_id]=d; });
      } catch(e){ console.warn('[Viagens] viagens_detalhe:', e.message); }
    }

    renderLista(dias);
    atualizarSummary();
  } catch(e) {
    console.error('[Viagens] carregarSemana:', e);
    listaEl.innerHTML = `<div class="vazio"><i data-lucide="alert-triangle"></i><p>Erro ao carregar: ${e.message}</p></div>`;
    lucide.createIcons();
  }
}

function renderLista(dias){
  const el = document.getElementById('lista');
  if(!agendamentos.length){
    el.innerHTML='<div class="vazio"><i data-lucide="plane-off"></i><p>Nenhuma viagem marcada nesta semana.</p></div>';
    lucide.createIcons(); return;
  }

  el.innerHTML = agendamentos.map(ag=>{
    const d   = new Date(ag.data+'T12:00');
    const idx = dias.findIndex(x=>iso(x)===ag.data);
    const dataFmt = `${idx>=0?DIAS[idx]:''}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    const hora    = ag.hora_inicio?.slice(0,5)||'';
    const cliente = ag.obras?.nome_cliente||ag.cliente_outro||'—';
    const tecIds  = [ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
    const tecStr  = tecIds.map(id=>tecnicos.find(t=>t.id===id)?.nome||'').filter(Boolean).join(' · ');
    const det     = detalhes[ag.id]||{};

    return `<div class="vcard">
      <div class="vcard-top">
        <div class="vct-main">
          <div class="vct-data">${escHtml(dataFmt)}</div>
          <div class="vct-cliente">${escHtml(cliente)}</div>
          <div class="vct-tec">${escHtml(tecStr||'Técnico a definir')}</div>
          ${ag.servico?`<div class="vct-servico">${escHtml(ag.servico)}</div>`:''}
        </div>
        ${hora?`<div class="vct-hora">${hora}</div>`:''}
      </div>

      <div class="vcard-body">
        <div class="vf">
          <label>Cidade de destino</label>
          <input type="text" id="v-cidade-${ag.id}" value="${escHtml(det.cidade||'')}" placeholder="Ex: Cuiabá, MT">
        </div>
        <div class="vf">
          <label>Saldo para refeição (R$)</label>
          <input type="number" id="v-saldo-${ag.id}" value="${det.saldo_refeicao||''}" placeholder="0,00" step="0.01" min="0">
        </div>
        <div class="vf">
          <label>Hotel</label>
          <div class="hotel-chk">
            <input type="checkbox" id="v-hotel-${ag.id}" ${det.hotel?'checked':''} onchange="toggleObs(${ag.id})">
            <span onclick="document.getElementById('v-hotel-${ag.id}').click()">Precisa de hotel</span>
          </div>
          <input type="text" id="v-obs-${ag.id}" value="${escHtml(det.hotel_obs||'')}"
            placeholder="Nome, preferências..." style="display:${det.hotel?'block':'none'}">
        </div>
      </div>

      <div class="vcard-footer">
        <span class="saved-ok" id="v-ok-${ag.id}"><i data-lucide="check-circle-2"></i> Salvo</span>
        <button class="btn-vcard btn-pdf" onclick="exportarViagem(${ag.id})">
          <i data-lucide="file-text"></i> Exportar PDF
        </button>
        <button class="btn-vcard btn-salvar" onclick="salvar(${ag.id})">
          <i data-lucide="save"></i> Salvar
        </button>
      </div>
    </div>`;
  }).join('');

  lucide.createIcons();
}

function toggleObs(id){
  document.getElementById(`v-obs-${id}`).style.display =
    document.getElementById(`v-hotel-${id}`).checked ? 'block' : 'none';
}

async function salvar(agId){
  const cidade   = document.getElementById(`v-cidade-${agId}`).value.trim()||null;
  const saldo    = parseFloat(document.getElementById(`v-saldo-${agId}`).value)||null;
  const hotel    = document.getElementById(`v-hotel-${agId}`).checked;
  const hotel_obs= document.getElementById(`v-obs-${agId}`).value.trim()||null;
  const payload  = {agendamento_id:agId, cidade, saldo_refeicao:saldo, hotel, hotel_obs, atualizado_em:new Date().toISOString()};

  let res;
  if(detalhes[agId]?.id){
    res = await db.from('viagens_detalhe').update(payload).eq('id',detalhes[agId].id).select().single();
  } else {
    res = await db.from('viagens_detalhe').insert(payload).select().single();
  }

  if(res.data){
    detalhes[agId]=res.data;
    const ok=document.getElementById(`v-ok-${agId}`);
    ok.style.display='flex'; setTimeout(()=>ok.style.display='none',2500);
    atualizarSummary(); lucide.createIcons();
  } else if(res.error) {
    alertModal('Erro','Não foi possível salvar: '+res.error.message,'erro');
  }
}

function atualizarSummary(){
  const total = agendamentos.length;
  const hotel = agendamentos.filter(a=>detalhes[a.id]?.hotel).length;
  const saldo = agendamentos.reduce((s,a)=>s+(parseFloat(detalhes[a.id]?.saldo_refeicao)||0),0);
  const tecs  = new Set(agendamentos.flatMap(a=>[a.tecnico_id,a.auxiliar_id,a.auxiliar2_id,a.auxiliar3_id].filter(Boolean)));
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-hotel').textContent = hotel;
  document.getElementById('s-ref').textContent   = brl(saldo);
  document.getElementById('s-tecs').textContent  = tecs.size;
}

// ── Exportar viagem ───────────────────────────────────────────
function exportarViagem(agId){
  const ag=agendamentos.find(a=>a.id===agId); if(!ag) return;
  const det=detalhes[agId]||{};
  const dias=diasSemana(semanaOffset);
  const idx=dias.findIndex(x=>iso(x)===ag.data);
  const d=new Date(ag.data+'T12:00');
  const dataFmt=`${idx>=0?DIAS[idx]:''}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const cliente=ag.obras?.nome_cliente||ag.cliente_outro||'—';
  const tecIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
  const tecStr=tecIds.map(id=>tecnicos.find(t=>t.id===id)?.nome||'').filter(Boolean).join(', ');

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});

  doc.setFillColor(15,15,15); doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Solução Técnica — Autorização de Viagem',14,12);
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(150,150,150);
  doc.text('Gerado em '+new Date().toLocaleString('pt-BR'),14,20);

  let y=36;
  const campo=(lbl,val)=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(130,130,130);
    doc.text(lbl.toUpperCase(),14,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(20,20,20);
    doc.text(String(val||'—').slice(0,80),14,y+6); y+=18;
  };

  doc.setFillColor(240,255,248); doc.rect(10,y-4,190,14,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(10,80,40);
  doc.text(cliente.slice(0,55),14,y+5); y+=18;

  campo('Data e horário', dataFmt+(ag.hora_inicio?' — '+ag.hora_inicio.slice(0,5):''));
  campo('Técnico(s)', tecStr||'—');
  campo('Cidade de destino', det.cidade||'—');
  campo('Endereço / Obra', ag.obras?.endereco||'—');
  campo('Serviço', ag.servico||'—');

  y+=4;
  doc.setFillColor(det.hotel?235:248,det.hotel?252:248,det.hotel?242:248);
  doc.rect(10,y-4,190,det.hotel&&det.hotel_obs?22:14,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.setTextColor(det.hotel?10:100, det.hotel?90:100, det.hotel?40:100);
  doc.text(det.hotel?'✓  Hotel necessário':'✗  Sem necessidade de hotel',14,y+4);
  if(det.hotel&&det.hotel_obs){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(40,80,40);
    doc.text(det.hotel_obs,14,y+12); y+=8;
  }
  y+=20;

  doc.setFillColor(255,252,220); doc.rect(10,y-4,190,14,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(80,60,0);
  doc.text('Saldo para refeição: '+brl(det.saldo_refeicao||0),14,y+5); y+=24;

  y+=8;
  doc.setDrawColor(180,180,180); doc.setLineWidth(.3);
  doc.line(14,y,90,y); doc.line(120,y,196,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(130,130,130);
  doc.text('Gestor / Aprovação',14,y+5); doc.text('Técnico responsável',120,y+5);

  doc.save(`Viagem - ${cliente.slice(0,30)} - ${ag.data}.pdf`);
}

// ── Exportar semana ───────────────────────────────────────────
function exportarSemana(){
  if(!agendamentos.length){alertModal('Sem viagens','Nenhuma viagem para exportar nesta semana.','info');return;}
  const dias=diasSemana(semanaOffset);
  const d0=dias[0],d6=dias[6];
  const periodo=`${d0.getDate()} a ${d6.getDate()} de ${MESES[d6.getMonth()]} ${d6.getFullYear()}`;

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});

  doc.setFillColor(15,15,15); doc.rect(0,0,297,24,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Solução Técnica — Programação de Viagens',12,11);
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(150,150,150);
  doc.text('Semana: '+periodo+'  ·  Gerado em '+new Date().toLocaleString('pt-BR'),12,18);
  doc.setTextColor(62,207,142); doc.setFont('helvetica','bold');
  doc.text(agendamentos.length+' viagem'+(agendamentos.length!==1?'s':''),285,11,{align:'right'});

  const rows=agendamentos.map(ag=>{
    const d=new Date(ag.data+'T12:00');
    const idx=dias.findIndex(x=>iso(x)===ag.data);
    const tecIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
    const tecStr=tecIds.map(id=>tecnicos.find(t=>t.id===id)?.nome?.split(' ')[0]||'').filter(Boolean).join(', ');
    const det=detalhes[ag.id]||{};
    return [
      (idx>=0?DIAS[idx]:'')+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),
      ag.hora_inicio?.slice(0,5)||'—',
      (ag.obras?.nome_cliente||ag.cliente_outro||'—').slice(0,40),
      tecStr||'—',
      det.cidade||'—',
      det.hotel?'Sim'+(det.hotel_obs?'\n'+det.hotel_obs.slice(0,30):''):'Não',
      det.saldo_refeicao?brl(det.saldo_refeicao):'—',
      (ag.servico||'—').slice(0,50),
    ];
  });

  doc.autoTable({
    startY:30, head:[['Dia','Hora','Cliente / Obra','Técnico(s)','Cidade','Hotel','Saldo Ref.','Serviço']],
    body:rows, margin:{left:10,right:10},
    styles:{fontSize:8,cellPadding:2.5,lineColor:[60,60,60],lineWidth:.1,textColor:[30,30,30],fillColor:[255,255,255]},
    headStyles:{fillColor:[15,15,15],textColor:[200,200,200],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[248,248,248]},
    columnStyles:{0:{cellWidth:22},1:{cellWidth:13},2:{cellWidth:50},3:{cellWidth:32},4:{cellWidth:24},5:{cellWidth:22,textColor:[0,100,50]},6:{cellWidth:24,textColor:[80,60,0]},7:{cellWidth:90}},
  });

  doc.save('Viagens - Semana '+periodo+'.pdf');
}

lucide.createIcons();
</script>
