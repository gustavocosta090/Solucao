<!-- SAOS: viagens.html — Controle de Viagens e Hotel -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viagens — Solução Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0A;--surface-1:#111111;--surface-2:#161616;--surface-3:#1B1B1B;
  --primary:#3ECF8E;--text-1:#FFFFFF;--text-2:#A1A1AA;--text-3:#52525B;
  --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.12);--border-hover:rgba(255,255,255,0.16);
  --amber:#F59E0B;--amber-text:#FCD34D;--red:#EF4444;--red-text:#F87171;--radius:8px;
}

/* ── Navegação de semana ── */
.semana-nav{display:flex;align-items:center;gap:10px}
.semana-nav button{background:var(--surface-1);border:1px solid var(--border);color:var(--text-2);width:32px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 150ms,color 150ms}
.semana-nav button:hover{border-color:var(--border-hover);color:var(--text-1)}
.semana-nav button i{width:16px;height:16px}
.semana-nav span{font-size:14px;font-weight:600;color:var(--text-1);min-width:260px;text-align:center}

/* ── Summary ── */
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.sc{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:16px 20px}
.sc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:6px}
.sc-val{font-size:26px;font-weight:800;color:var(--text-1);line-height:1}

/* ── Cards de viagem ── */
.viagem-card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden;transition:border-color 150ms}
.viagem-card:hover{border-color:var(--border-hover)}
.viagem-header{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.vh-data{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;margin-bottom:4px}
.vh-cliente{font-size:16px;font-weight:700;color:var(--text-1);line-height:1.3}
.vh-tec{font-size:12px;color:var(--text-3);margin-top:4px}
.vh-servico{font-size:12px;color:var(--text-2);margin-top:2px;font-style:italic}
.vh-right{margin-left:auto;text-align:right}
.vh-hora{font-size:18px;font-weight:800;color:var(--amber-text)}

.viagem-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:20px}
.vf label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:7px}
.vf input[type=text],.vf input[type=number]{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;color:var(--text-1);font-family:inherit;font-size:13px;
  padding:9px 12px;outline:none;transition:border-color .15s;
}
.vf input:focus{border-color:rgba(62,207,142,.4)}
.hotel-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hotel-row input[type=checkbox]{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;flex-shrink:0}
.hotel-row span{font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;user-select:none}
.hotel-row span:hover{color:var(--text-1)}

.viagem-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px}
.btn-sv{height:36px;padding:0 18px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
.btn-sv i{width:12px;height:12px}
.btn-sv-salvar{background:var(--primary);color:#000}
.btn-sv-salvar:hover{opacity:.88}
.btn-sv-exp{background:transparent;border:1px solid var(--border);color:var(--text-2)}
.btn-sv-exp:hover{border-color:var(--border-hover);color:var(--text-1)}
.saved-ok{font-size:11px;color:var(--primary);display:none;align-items:center;gap:4px;margin-right:auto}
.saved-ok i{width:12px;height:12px}

/* ── Btn exportar semana ── */
.btn-export-semana{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);border-radius:8px;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-export-semana:hover{background:rgba(62,207,142,.18)}
.btn-export-semana i{width:14px;height:14px}

/* ── Empty / spinner ── */
.empty-state{text-align:center;padding:72px 24px;color:var(--text-3)}
.empty-state i{width:44px;height:44px;margin:0 auto 16px;display:block;opacity:.3}
.empty-state p{font-size:14px}
.spinner-wrap{text-align:center;padding:72px}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .summary-bar{grid-template-columns:repeat(2,1fr)}
  .viagem-body{grid-template-columns:1fr}
  .semana-nav span{min-width:160px;font-size:12px}
}
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">
      <i data-lucide="plane"></i>
      Viagens e Hotel
    </h1>

    <div class="semana-nav">
      <button onclick="mudarSemana(-1)" title="Semana anterior"><i data-lucide="chevron-left"></i></button>
      <span id="semana-label">—</span>
      <button onclick="mudarSemana(1)" title="Próxima semana"><i data-lucide="chevron-right"></i></button>
    </div>

    <button class="btn-export-semana" onclick="exportarSemana()">
      <i data-lucide="file-down"></i> Exportar Semana
    </button>
  </div>

  <!-- Summary -->
  <div class="summary-bar">
    <div class="sc"><div class="sc-label">Viagens na semana</div><div class="sc-val" id="sum-total">—</div></div>
    <div class="sc"><div class="sc-label">Com hotel</div><div class="sc-val" id="sum-hotel">—</div></div>
    <div class="sc"><div class="sc-label">Saldo refeição total</div><div class="sc-val" id="sum-ref" style="font-size:18px;margin-top:4px">—</div></div>
    <div class="sc"><div class="sc-label">Técnicos viajando</div><div class="sc-val" id="sum-tecs">—</div></div>
  </div>

  <!-- Lista -->
  <div id="lista-viagens">
    <div class="spinner-wrap"><div class="spinner"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>
  </div>
</div>

<script>
const db = supabase.createClient(
  'https://kxtjqudpnmdqkzqhyhmz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dGpxdWRwbm1kcWt6cWh5aG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDYzMzEsImV4cCI6MjA5NTIyMjMzMX0.tba066RGNwDbXaNEy3w_OHbblll_bky6Dx10mXnxVQ0'
);

let semanaOffset = 0;
let agendamentos = [];
let detalhes     = {}; // agendamento_id → viagem_detalhe
let tecnicos     = [];

const DIAS_PT  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function fmtISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function diasDaSemana(offset){
  const hoje=new Date(), dow=hoje.getDay()||7;
  const seg=new Date(hoje); seg.setDate(hoje.getDate()-dow+1+offset*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(seg); d.setDate(seg.getDate()+i); return d; });
}

function brl(v){ v=parseFloat(v)||0; return `R$ ${v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`; }

// ── Init ──────────────────────────────────────────────────────
(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session){window.location.href='login.html';return;}

  const {data:eu}=await db.from('tecnicos').select('role,nome').eq('auth_user_id',session.user.id).single();
  if(!eu||!['supervisor','agendamento','coordenador'].includes(eu.role)){window.location.href='obras.html';return;}

  renderTopbar(eu.nome, eu.role, 'viagens');
  applyTheme();
  lucide.createIcons();

  const {data:tecs}=await db.from('tecnicos').select('id,nome');
  tecnicos=tecs||[];

  await carregarSemana();
})();

// ── Semana ────────────────────────────────────────────────────
function mudarSemana(delta){ semanaOffset+=delta; carregarSemana(); }

async function carregarSemana(){
  const dias=diasDaSemana(semanaOffset);
  const d0=dias[0], d6=dias[6];
  const ini=fmtISO(d0), fim=fmtISO(d6);

  document.getElementById('semana-label').textContent=
    `${d0.getDate()} de ${MESES_PT[d0.getMonth()]} — ${d6.getDate()} de ${MESES_PT[d6.getMonth()]} ${d6.getFullYear()}`;

  document.getElementById('lista-viagens').innerHTML=
    '<div class="spinner-wrap"><div class="spinner"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>';

  const {data:ags}=await db.from('agendamentos')
    .select('*,obras(nome_cliente,endereco)')
    .eq('status','viagem')
    .gte('data',ini).lte('data',fim)
    .order('data').order('hora_inicio');

  agendamentos=ags||[];

  if(agendamentos.length){
    const ids=agendamentos.map(a=>a.id);
    const {data:det}=await db.from('viagens_detalhe').select('*').in('agendamento_id',ids);
    detalhes={};
    (det||[]).forEach(d=>{detalhes[d.agendamento_id]=d;});
  } else { detalhes={}; }

  renderLista(diasDaSemana(semanaOffset));
  atualizarSummary();
}

// ── Render ────────────────────────────────────────────────────
function renderLista(dias){
  const el=document.getElementById('lista-viagens');
  if(!agendamentos.length){
    el.innerHTML=`<div class="empty-state"><i data-lucide="plane-off"></i><p>Nenhuma viagem marcada nesta semana.</p></div>`;
    lucide.createIcons(); return;
  }

  el.innerHTML=agendamentos.map(ag=>{
    const d=new Date(ag.data+'T12:00');
    const idx=dias.findIndex(x=>fmtISO(x)===ag.data);
    const diaNome=idx>=0?DIAS_PT[idx]:'';
    const dataFmt=`${diaNome}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    const hora=ag.hora_inicio?.slice(0,5)||'';
    const cliente=ag.obras?.nome_cliente||ag.cliente_outro||'—';
    const tecIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
    const tecNomes=tecIds.map(id=>tecnicos.find(t=>t.id===id)?.nome||'').filter(Boolean).join(' · ');
    const det=detalhes[ag.id]||{};

    return `<div class="viagem-card">
      <div class="viagem-header">
        <div style="flex:1;min-width:0">
          <div class="vh-data">${escHtml(dataFmt)}</div>
          <div class="vh-cliente">${escHtml(cliente)}</div>
          <div class="vh-tec"><i data-lucide="users" style="display:inline-block;width:11px;height:11px;vertical-align:middle;margin-right:4px"></i>${escHtml(tecNomes||'—')}</div>
          ${ag.servico?`<div class="vh-servico">${escHtml(ag.servico)}</div>`:''}
        </div>
        ${hora?`<div class="vh-right"><div class="vh-hora">${hora}</div><div style="font-size:10px;color:var(--text-3);margin-top:3px">hora</div></div>`:''}
      </div>

      <div class="viagem-body">
        <div class="vf">
          <label>Cidade de destino</label>
          <input type="text" id="v-cidade-${ag.id}" value="${escHtml(det.cidade||'')}" placeholder="Ex: Cuiabá, MT">
        </div>
        <div class="vf">
          <label>Saldo para refeição (R$)</label>
          <input type="number" id="v-saldo-${ag.id}" value="${det.saldo_refeicao||''}" placeholder="0,00" step="0.01" min="0">
        </div>
        <div class="vf">
          <label>Hotel</label>
          <div class="hotel-row">
            <input type="checkbox" id="v-hotel-${ag.id}" ${det.hotel?'checked':''} onchange="toggleHotelObs(${ag.id})">
            <span onclick="document.getElementById('v-hotel-${ag.id}').click()">Precisa de hotel</span>
          </div>
          <input type="text" id="v-hotel-obs-${ag.id}" value="${escHtml(det.hotel_obs||'')}"
            placeholder="Observações (nome, preferências...)"
            style="${det.hotel?'':'display:none'}">
        </div>
      </div>

      <div class="viagem-footer">
        <span class="saved-ok" id="v-saved-${ag.id}"><i data-lucide="check-circle-2"></i> Salvo com sucesso</span>
        <button class="btn-sv btn-sv-exp" onclick="exportarViagem(${ag.id})">
          <i data-lucide="file-text"></i> Exportar PDF
        </button>
        <button class="btn-sv btn-sv-salvar" onclick="salvarDetalhe(${ag.id})">
          <i data-lucide="save"></i> Salvar
        </button>
      </div>
    </div>`;
  }).join('');

  lucide.createIcons();
}

function toggleHotelObs(agId){
  const obs=document.getElementById(`v-hotel-obs-${agId}`);
  obs.style.display=document.getElementById(`v-hotel-${agId}`).checked?'block':'none';
}

// ── Salvar ────────────────────────────────────────────────────
async function salvarDetalhe(agId){
  const cidade   =document.getElementById(`v-cidade-${agId}`).value.trim()||null;
  const saldo    =parseFloat(document.getElementById(`v-saldo-${agId}`).value)||null;
  const hotel    =document.getElementById(`v-hotel-${agId}`).checked;
  const hotel_obs=document.getElementById(`v-hotel-obs-${agId}`).value.trim()||null;
  const payload={agendamento_id:agId,cidade,saldo_refeicao:saldo,hotel,hotel_obs,atualizado_em:new Date().toISOString()};

  let res;
  if(detalhes[agId]?.id){
    res=await db.from('viagens_detalhe').update(payload).eq('id',detalhes[agId].id).select().single();
  } else {
    res=await db.from('viagens_detalhe').insert(payload).select().single();
  }

  if(res.data){
    detalhes[agId]=res.data;
    const msg=document.getElementById(`v-saved-${agId}`);
    if(msg){msg.style.display='flex';setTimeout(()=>msg.style.display='none',2500);}
    atualizarSummary();
    lucide.createIcons();
  }
}

// ── Summary ───────────────────────────────────────────────────
function atualizarSummary(){
  const total  =agendamentos.length;
  const hotel  =agendamentos.filter(a=>detalhes[a.id]?.hotel).length;
  const saldo  =agendamentos.reduce((s,a)=>s+(parseFloat(detalhes[a.id]?.saldo_refeicao)||0),0);
  const tecsSet=new Set();
  agendamentos.forEach(a=>[a.tecnico_id,a.auxiliar_id,a.auxiliar2_id,a.auxiliar3_id].filter(Boolean).forEach(id=>tecsSet.add(id)));
  document.getElementById('sum-total').textContent=total;
  document.getElementById('sum-hotel').textContent=hotel;
  document.getElementById('sum-ref').textContent=brl(saldo);
  document.getElementById('sum-tecs').textContent=tecsSet.size;
}

// ── Exportar viagem individual ────────────────────────────────
async function exportarViagem(agId){
  const ag=agendamentos.find(a=>a.id===agId); if(!ag) return;
  const det=detalhes[agId]||{};
  const dias=diasDaSemana(semanaOffset);
  const idx=dias.findIndex(x=>fmtISO(x)===ag.data);
  const d=new Date(ag.data+'T12:00');
  const dataFmt=`${idx>=0?DIAS_PT[idx]:''}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const cliente=ag.obras?.nome_cliente||ag.cliente_outro||'—';
  const tecIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
  const tecNomes=tecIds.map(id=>tecnicos.find(t=>t.id===id)?.nome||'').filter(Boolean).join(', ');

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});

  // Header
  doc.setFillColor(15,15,15); doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Solução Técnica — Autorização de Viagem',14,12);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(161,161,170);
  doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')}`,14,20);

  let y=38;
  const linha=(lbl,val)=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(130,130,130);
    doc.text(lbl.toUpperCase(),14,y);
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(20,20,20);
    doc.text(String(val||'—'),14,y+6); y+=18;
  };

  // Cliente em destaque
  doc.setFillColor(240,255,247); doc.rect(10,y-4,190,16,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(10,80,40);
  doc.text(cliente.slice(0,60),14,y+6); y+=20;

  linha('Data',dataFmt);
  linha('Horário',ag.hora_inicio?.slice(0,5)||'—');
  linha('Técnico(s)',tecNomes||'—');
  linha('Cidade de destino',det.cidade||'—');
  linha('Endereço / Obra',ag.obras?.endereco||'—');
  linha('Serviço',ag.servico||'—');

  y+=4;
  // Hotel
  const hotelColor=det.hotel?[230,255,240]:[250,250,250];
  doc.setFillColor(...hotelColor); doc.rect(10,y-4,190,det.hotel&&det.hotel_obs?24:16,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.setTextColor(det.hotel?10:100, det.hotel?80:100, det.hotel?40:100);
  doc.text(det.hotel?'✓  Hotel necessário':'✗  Sem necessidade de hotel',14,y+5);
  if(det.hotel&&det.hotel_obs){
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(50,80,50);
    doc.text(det.hotel_obs,14,y+14); y+=8;
  }
  y+=22;

  // Saldo
  doc.setFillColor(255,252,220); doc.rect(10,y-4,190,16,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(80,60,0);
  doc.text(`Saldo para refeição: ${brl(det.saldo_refeicao||0)}`,14,y+5); y+=24;

  // Assinaturas
  y+=8;
  doc.setDrawColor(180,180,180); doc.setLineWidth(0.3);
  doc.line(14,y,90,y); doc.line(120,y,196,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(130,130,130);
  doc.text('Gestor / Aprovação',14,y+5);
  doc.text('Técnico responsável',120,y+5);

  doc.save(`Viagem - ${cliente.slice(0,30)} - ${ag.data}.pdf`);
}

// ── Exportar semana ───────────────────────────────────────────
async function exportarSemana(){
  if(!agendamentos.length){alertModal('Sem viagens','Nenhuma viagem para exportar nesta semana.','info');return;}
  const dias=diasDaSemana(semanaOffset);
  const d0=dias[0],d6=dias[6];
  const periodoLabel=`${d0.getDate()} a ${d6.getDate()} de ${MESES_PT[d6.getMonth()]} ${d6.getFullYear()}`;

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',orientation:'landscape'});

  doc.setFillColor(15,15,15); doc.rect(0,0,297,24,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Solução Técnica — Programação de Viagens',12,11);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(161,161,170);
  doc.text(`Semana: ${periodoLabel}  ·  Gerado em ${new Date().toLocaleString('pt-BR')}`,12,18);
  doc.setTextColor(62,207,142); doc.setFont('helvetica','bold');
  doc.text(`${agendamentos.length} viagem${agendamentos.length!==1?'s':''}`,285,11,{align:'right'});

  const rows=agendamentos.map(ag=>{
    const d=new Date(ag.data+'T12:00');
    const idx=dias.findIndex(x=>fmtISO(x)===ag.data);
    const dataFmt=`${idx>=0?DIAS_PT[idx]:''} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
    const cliente=ag.obras?.nome_cliente||ag.cliente_outro||'—';
    const tecIds=[ag.tecnico_id,ag.auxiliar_id,ag.auxiliar2_id,ag.auxiliar3_id].filter(Boolean);
    const tecNomes=tecIds.map(id=>tecnicos.find(t=>t.id===id)?.nome?.split(' ')[0]||'').filter(Boolean).join(', ');
    const det=detalhes[ag.id]||{};
    return [
      dataFmt, ag.hora_inicio?.slice(0,5)||'—', cliente, tecNomes||'—',
      det.cidade||'—',
      det.hotel?'Sim'+(det.hotel_obs?`\n${det.hotel_obs}`:''): 'Não',
      det.saldo_refeicao?brl(det.saldo_refeicao):'—',
      ag.servico||'—',
    ];
  });

  doc.autoTable({
    startY:30,
    head:[['Dia','Hora','Cliente / Obra','Técnico(s)','Cidade','Hotel','Saldo Refeição','Serviço']],
    body:rows,
    margin:{left:10,right:10},
    styles:{fontSize:8,cellPadding:2.5,lineColor:[60,60,60],lineWidth:0.1,textColor:[30,30,30],fillColor:[255,255,255]},
    headStyles:{fillColor:[15,15,15],textColor:[200,200,200],fontStyle:'bold',fontSize:8},
    alternateRowStyles:{fillColor:[248,248,248]},
    columnStyles:{
      0:{cellWidth:24},1:{cellWidth:14},2:{cellWidth:52},3:{cellWidth:34},
      4:{cellWidth:26},5:{cellWidth:22,textColor:[0,100,50]},
      6:{cellWidth:28,textColor:[80,60,0]},7:{cellWidth:87},
    },
  });

  doc.save(`Viagens - Semana ${periodoLabel}.pdf`);
}

lucide.createIcons();
</script>
</body>
</html>
