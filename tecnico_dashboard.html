<!DOCTYPE html>
<!-- build: 2026-07-09a — card "Agenda noturna p/ pagamento" (quantidade + valor) -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solução Técnica — Minhas OSs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<style>
  :root {
    --bg: #0A0A0A;
    --surface-1: #111111;
    --surface-2: #161616;
    --surface-3: #1B1B1B;
    --primary: #3ECF8E;
    --text-1: #FFFFFF;
    --text-2: #A1A1AA;
    --text-3: #52525B;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.12);
    --border-hover: rgba(255,255,255,0.16);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Topbar (padrão universal) ── */
  .topbar { background:var(--surface-1,#111111); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
  .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
  .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
  .topbar-links { display:flex; align-items:center; gap:4px; }
  .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
  .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
  .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.08); }
  .topbar-links a.nav-sair { color:var(--text-2); border:1px solid var(--border-strong); margin-left:8px; }
  .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

  /* ── Layout principal ── */
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .stat-num {
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 6px;
    color: var(--text-1);
  }

  .stat-num.verde { color: #3ECF8E; }
  .stat-num.amarelo { color: #F59E0B; }
  .stat-num.roxo { color: #A78BFA; }

  .stat-sub {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-2);
    margin-top: 2px;
  }

  .stat-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── Filtros ── */
  .filtros-wrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .filtros-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }

  .filtros-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-3);
    margin-right: 4px;
    white-space: nowrap;
  }

  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: 'Inter', system-ui, sans-serif;
    appearance: none;
    -webkit-appearance: none;
    line-height: 1.4;
    display: inline-flex;
    align-items: center;
  }
  .chip:hover { border-color: rgba(255,255,255,0.2); color: var(--text-1); background: rgba(255,255,255,0.04); }
  .chip.ativo { border-color: #3ECF8E; color: #3ECF8E; background: rgba(62,207,142,0.08); }

  .date-group {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .date-group label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-3);
  }

  .date-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text-1);
    font-size: 0.82rem;
    font-family: 'Inter', system-ui, sans-serif;
    outline: none;
    transition: border-color 0.15s;
    color-scheme: dark;
  }
  .date-group input:focus { border-color: rgba(255,255,255,0.25); }

  /* ── Busca ── */
  .busca-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .busca-wrap i {
    position: absolute;
    left: 10px;
    width: 14px;
    height: 14px;
    color: var(--text-3);
    pointer-events: none;
  }
  .busca-wrap input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px 6px 32px;
    color: var(--text-1);
    font-size: 0.82rem;
    font-family: 'Inter', system-ui, sans-serif;
    outline: none;
    transition: border-color 0.15s;
    width: 200px;
  }
  .busca-wrap input:focus { border-color: rgba(255,255,255,0.25); }
  .busca-wrap input::placeholder { color: var(--text-3); }

  /* ── Tabela (desktop) ── */
  .tabela-wrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.83rem;
  }

  thead {
    background: var(--bg);
  }

  th {
    padding: 10px 16px;
    text-align: left;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
    color: var(--text-2);
  }

  tr:last-child td { border-bottom: none; }

  tbody tr {
    transition: background 0.1s;
    cursor: pointer;
  }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }

  .empty-table {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-3);
    font-size: 0.85rem;
  }

  .empty-table i {
    display: block;
    margin: 0 auto 12px;
    width: 28px;
    height: 28px;
    color: var(--text-3);
  }

  /* ── Cards mobile ── */
  .cards-lista { display: none; }

  .os-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .os-card:hover { border-color: rgba(255,255,255,0.18); }

  .os-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .os-obra {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-1);
  }

  .os-data {
    font-size: 0.72rem;
    color: var(--text-3);
    white-space: nowrap;
    text-align: right;
  }

  .os-obs {
    font-size: 0.8rem;
    color: var(--text-2);
    margin: 6px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.5;
  }

  .os-footer {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    align-items: center;
  }

  /* ── Badges ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge i { width: 10px; height: 10px; }

  .badge-pendente { background: rgba(245,158,11,0.12); color: #F59E0B; border: 1px solid rgba(245,158,11,0.2); }
  .badge-aprovado, .badge-aprovada { background: rgba(62,207,142,0.1); color: #3ECF8E; border: 1px solid rgba(62,207,142,0.2); }
  .badge-rejeitado, .badge-reprovada { background: rgba(239,68,68,0.1); color: #EF4444; border: 1px solid rgba(239,68,68,0.2); }

  .badge-fotos {
    background: rgba(79,70,229,0.1);
    color: #818CF8;
    border: 1px solid rgba(79,70,229,0.2);
  }

  /* ── Spinner ── */
  .spinner-wrap {
    text-align: center;
    padding: 48px;
    color: var(--text-3);
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid rgba(255,255,255,0.08);
    border-top-color: #3ECF8E;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  .spinner-wrap p {
    font-size: 0.82rem;
    color: var(--text-3);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Modal detalhe ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
    backdrop-filter: blur(4px);
  }
  .overlay.aberto { display: flex; }

  .modal {
    background: var(--surface-2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .modal-header h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-1);
    letter-spacing: -0.01em;
  }

  .btn-modal-fechar {
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  .btn-modal-fechar:hover { color: var(--text-1); }
  .btn-modal-fechar i { width: 16px; height: 16px; }

  .detail-row { margin-bottom: 16px; }

  .detail-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-3);
    letter-spacing: 0.07em;
    margin-bottom: 4px;
  }

  .detail-value {
    font-size: 0.85rem;
    color: var(--text-1);
    line-height: 1.5;
  }

  .obs-supervisor {
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.82rem;
    color: #F59E0B;
    margin: 8px 0 16px;
    line-height: 1.5;
  }

  .obs-supervisor .obs-sup-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 4px;
    color: #F59E0B;
    opacity: 0.7;
  }

  .btn-fechar {
    width: 100%;
    padding: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-2);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    margin-top: 20px;
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 0.15s, color 0.15s;
  }
  .btn-fechar:hover { background: rgba(255,255,255,0.08); color: var(--text-1); }

  /* ── Fotos no modal ── */
  .fotos-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 8px;
  }

  .foto-item {
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .foto-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
  }
  .foto-item:hover img { transform: scale(1.05); }

  /* ── Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .lightbox.aberto { display: flex; }

  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 8px;
    object-fit: contain;
  }

  .lb-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--text-1);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    transition: background 0.15s;
  }
  .lb-close:hover { background: rgba(255,255,255,0.15); }
  .lb-close i { width: 18px; height: 18px; }

  /* ── Divisor modal ── */
  .modal-section-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 16px 0;
  }

  /* ── Texto célula tabela ── */
  .cell-primary {
    font-weight: 600;
    color: var(--text-1);
    font-size: 0.83rem;
  }
  .cell-secondary {
    font-size: 0.72rem;
    color: var(--text-3);
    margin-top: 2px;
  }
  .cell-obs {
    color: var(--text-2);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    main { padding: 16px 12px; }
    .stats { gap: 8px; grid-template-columns: repeat(2, 1fr); }
    .stat-card { padding: 14px; }
    .stat-num { font-size: 1.5rem; }
    .tabela-wrap { display: none; }
    .cards-lista { display: block; }
    .filtros-wrap { padding: 12px; }
    .date-group { width: 100%; }
    .busca-wrap input { width: 100%; }
    nav a { display: none; }
    nav a.ativo { display: block; }
  }

  @media (min-width: 701px) {
    .tabela-wrap { display: block; }
    .cards-lista { display: none; }
  }

  /* ── TEMA CLARO ── */
  :root[data-theme="light"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); }
  @media (prefers-color-scheme: light) { :root[data-theme="auto"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); } }
  .tema-btn { background:transparent; border:1px solid var(--border-strong,rgba(255,255,255,.12)); border-radius:6px; color:var(--text-2,#A1A1AA); font-size:15px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-right:8px; flex-shrink:0; }
  .tema-btn:hover { background:rgba(128,128,128,.1); }

  /* ── RESPONSIVO ── */
  @media (max-width: 1024px) {
    .topbar-links a { font-size: 12px; padding: 5px 9px; }
  }
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; }
    .topbar-greeting { display: none !important; }
    .topbar-links { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .topbar-links a { font-size: 12px; padding: 5px 8px; white-space: nowrap; }
    .container { padding: 0 12px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    main { padding: 20px 12px !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .form-row { grid-template-columns: 1fr !important; }
    .fotos-grid { grid-template-columns: repeat(2, 1fr); }
    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .card { padding: 16px !important; }
    .page-header h1 { font-size: 18px !important; }
    .modal, .modal-content { border-radius: 0 !important; max-width: 100% !important; max-height: 100dvh !important; }
    .modal-overlay, .overlay { padding: 0 !important; align-items: flex-end !important; }
    table { font-size: 12px; min-width: 500px; }
    .table-wrap, .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  @media (max-width: 480px) {
    .topbar-logo { font-size: 13px; }
    .stats-grid { grid-template-columns: 1fr !important; }
    .stat-card { padding: 14px !important; }
    .btn, button { font-size: 12px; }
  }

  /* ── Mobile: evita auto-zoom iOS (inputs precisam de 16px) ── */
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<main>
  <!-- Alerta de OS atrasadas do técnico -->
  <div id="alerta-atrasadas" style="display:none;align-items:center;gap:10px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#FCD34D;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px;font-weight:600;">
    <i data-lucide="alert-triangle" style="width:18px;height:18px"></i>
    <span id="alerta-atrasadas-txt"></span>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-num verde" id="statAprovadas">—</div>
      <div class="stat-label">Concluídas</div>
    </div>
    <div class="stat-card">
      <div class="stat-num amarelo" id="statPendentes">—</div>
      <div class="stat-label">Pendentes</div>
    </div>
    <div class="stat-card">
      <div class="stat-num roxo" id="statNoturnas">—</div>
      <div class="stat-label">Agenda noturna p/ pagamento</div>
      <div class="stat-sub" id="statNoturnasValor"></div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros-wrap">
    <div class="filtros-left">
      <span class="filtros-label">Status</span>
      <div class="chips">
        <button class="chip ativo" onclick="setFiltro('todos',this)" type="button">Todas</button>
        <button class="chip" onclick="setFiltro('pendente',this)" type="button">Pendentes</button>
        <button class="chip" onclick="setFiltro('concluida',this)" type="button">Concluídas</button>
      </div>
    </div>
    <div class="date-group">
      <label>De</label>
      <input type="date" id="dataInicio" onchange="filtrar()">
      <label>Até</label>
      <input type="date" id="dataFim" onchange="filtrar()">
    </div>
    <div class="busca-wrap">
      <i data-lucide="search"></i>
      <input type="text" id="busca" placeholder="Buscar obra..." oninput="if(!this._dFn)this._dFn=debounce(filtrar);this._dFn()">
    </div>
  </div>

  <!-- Tabela (desktop) -->
  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">Data serviço / Envio</th>
          <th scope="col">Obra</th>
          <th scope="col">Observações</th>
          <th scope="col">Status</th>
          <th scope="col">Fotos</th>
        </tr>
      </thead>
      <tbody id="tabelaBody">
        <tr>
          <td colspan="5">
            <div class="spinner-wrap">
              <div class="spinner"></div>
              <p>Carregando...</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Cards (mobile) -->
  <div class="cards-lista" id="cardLista">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p>Carregando...</p>
    </div>
  </div>
</main>

<!-- Modal detalhe OS -->
<div class="overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitulo"></h2>
      <button class="btn-modal-fechar" onclick="fecharModal()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div id="modalConteudo"></div>
    <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="fecharLightbox()">
    <i data-lucide="x"></i>
  </button>
  <img id="lbImg" src="" alt="" style="display:none">
  <video id="lbVideo" src="" controls playsinline style="display:none;max-width:90vw;max-height:80vh;border-radius:8px;"></video>
</div>

<script>

let todasOSs = [];
let filtroStatus = 'todos';
let tecnicoAtual = null;
let tdTecMap = {};  // id → { nome } para exibir equipe completa
let authToken = '';  // JWT da sessão, anexado às URLs de /api/foto (tags <img>/<video>)
// Anexa o token de sessão à URL do /api/foto para que tags <img>/<video> autentiquem
function fotoSrc(url) {
  if (!url || !authToken) return url;
  return url + (url.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(authToken);
}
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  authToken = session.access_token || '';
  // Mantém o token atualizado quando o Supabase o renova (evita 401 nas fotos após ~1h)
  db.auth.onAuthStateChange((_e, s) => { if (s?.access_token) authToken = s.access_token; });

  const { data: tec } = await db
    .from('tecnicos').select('id, nome, role')
    .eq('auth_user_id', session.user.id).single();

  if (!tec) { window.location.href = 'login.html'; return; }
  if (!['tecnico','auxiliar','lider','admin_geral'].includes(tec.role)) { window.location.href = 'supervisor.html'; return; }

  tecnicoAtual = tec;
  renderTopbar(tec.nome, tec.role, 'minhas-os');

  // Carrega todos os técnicos para mostrar equipe completa no modal
  const { data: todosT } = await db.from('tecnicos').select('id, nome');
  (todosT || []).forEach(t => { tdTecMap[t.id] = t; });

  const hoje = new Date();
  const inicio = new Date(hoje); inicio.setDate(inicio.getDate() - 90);
  document.getElementById('dataInicio').value = inicio.toISOString().split('T')[0];
  document.getElementById('dataFim').value = hoje.toISOString().split('T')[0];

  await carregarOSs();
})();

// ── Agenda noturna (mesma lógica de supervisor.html) ──────────
function _minutosDoHorario(horario) {
  const valor = String(horario || '').slice(0, 5);
  const [h, m] = valor.split(':').map(Number);
  if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
  return h * 60 + m;
}
function _agendaNoturnaInfo(o) {
  if (o.noturna_manual === 'meia')     return { tipo: 'meia',     valor: 75  };
  if (o.noturna_manual === 'completa') return { tipo: 'completa', valor: 150 };
  const fim = _minutosDoHorario(o.horario_fim);
  if (fim === null) return null;
  if (fim >= (18 * 60) && fim <= (21 * 60)) return { tipo: 'meia', valor: 75 };
  if (fim >= (21 * 60 + 1) || fim <= (5 * 60)) return { tipo: 'completa', valor: 150 };
  return null;
}

async function carregarOSs() {
  const id = tecnicoAtual.id;
  let data = null;

  // Tentativa 1 — OR nos 4 campos (inclui auxiliar2_id/auxiliar3_id)
  const r1 = await db
    .from('ordens_de_servico')
    .select('*, obras(nome_cliente, endereco)')
    .or(`tecnico_id.eq.${id},auxiliar_id.eq.${id},auxiliar2_id.eq.${id},auxiliar3_id.eq.${id}`)
    .order('criado_em', { ascending: false });

  if (!r1.error) {
    data = r1.data;
  } else {
    // Tentativa 2 — OR nos 2 campos básicos (sem auxiliar2/3, caso não existam)
    const r2 = await db
      .from('ordens_de_servico')
      .select('*, obras(nome_cliente, endereco)')
      .or(`tecnico_id.eq.${id},auxiliar_id.eq.${id}`)
      .order('criado_em', { ascending: false });

    if (!r2.error) {
      data = r2.data;
    } else {
      // Tentativa 3 — mínimo absoluto: só tecnico_id
      const r3 = await db
        .from('ordens_de_servico')
        .select('*, obras(nome_cliente, endereco)')
        .eq('tecnico_id', id)
        .order('criado_em', { ascending: false });
      if (r3.error) {
        document.getElementById('tabelaBody').innerHTML =
          `<tr><td colspan="5" class="empty-table">Erro ao carregar OSs: ${r3.error.message}</td></tr>`;
        return;
      }
      data = r3.data;
    }
  }

  const hojeISO = new Date().toISOString().split('T')[0];
  // Técnico só vê OS do dia atual ou anteriores (agendas futuras não contam como pendente)
  todasOSs = (data || []).filter(o => !o.data_servico || o.data_servico <= hojeISO);

  // Assistências têm obra_id null — cliente vem de agendamentos.cliente_outro
  const semObra = todasOSs.filter(o => !o.obra_id && o.agendamento_id).map(o => o.agendamento_id);
  if (semObra.length) {
    const { data: agList } = await db.from('agendamentos').select('id, cliente_outro').in('id', semObra);
    const agMap = {};
    (agList || []).forEach(a => { agMap[a.id] = a.cliente_outro; });
    todasOSs.forEach(o => { o._cliente_outro = agMap[o.agendamento_id] || null; });
  }

  document.getElementById('statTotal').textContent     = todasOSs.length;
  document.getElementById('statAprovadas').textContent = todasOSs.filter(o => o.status_aprovacao === 'concluida' || o.status_aprovacao === 'aprovada').length;
  document.getElementById('statPendentes').textContent = todasOSs.filter(o => !o.status_aprovacao || o.status_aprovacao === 'pendente' || o.status_aprovacao === 'reprovada').length;

  // Agendas noturnas já aprovadas pra pagamento (conta e soma o valor)
  const noturnasAprovadas = todasOSs.filter(o =>
    o.status_aprovacao !== 'cancelada' && o.noturna_status === 'aprovada' && _agendaNoturnaInfo(o));
  const valorNoturnas = noturnasAprovadas.reduce((s, o) => s + (_agendaNoturnaInfo(o)?.valor || 0), 0);
  document.getElementById('statNoturnas').textContent = noturnasAprovadas.length;
  document.getElementById('statNoturnasValor').textContent = noturnasAprovadas.length
    ? valorNoturnas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
    : '';

  // Alerta de OS atrasadas (pendente + data_servico < hoje)
  const atrasadas = todasOSs.filter(o =>
    (!o.status_aprovacao || o.status_aprovacao === 'pendente' || o.status_aprovacao === 'reprovada')
    && o.data_servico && o.data_servico < hojeISO).length;
  const alerta = document.getElementById('alerta-atrasadas');
  if (alerta) {
    if (atrasadas > 0) {
      document.getElementById('alerta-atrasadas-txt').textContent =
        `Você tem ${atrasadas} OS atrasada(s) para preencher.`;
      alerta.style.display = 'flex';
      if (window.lucide) lucide.createIcons();
    } else { alerta.style.display = 'none'; }
  }

  filtrar();
}

function setFiltro(status, el) {
  filtroStatus = status;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
  el.classList.add('ativo');
  filtrar();
}

function filtrar() {
  const dataInicio = document.getElementById('dataInicio').value;
  const dataFim    = document.getElementById('dataFim').value;
  const busca      = (document.getElementById('busca').value || '').toLowerCase().trim();

  const filtradas = todasOSs.filter(o => {
    const dataOS   = (o.data_servico || o.criado_em || '').slice(0, 10);
    const stOS = o.status_aprovacao || 'pendente';
    // Normalizar: aprovada antiga = concluida, reprovada = pendente
    const stNorm = stOS === 'aprovada' ? 'concluida' : stOS === 'reprovada' ? 'pendente' : stOS;
    const matchStatus = filtroStatus === 'todos' || stNorm === filtroStatus;
    const matchInicio = !dataInicio || dataOS >= dataInicio;
    const matchFim    = !dataFim    || dataOS <= dataFim;
    const matchBusca  = !busca || (o.obras?.nome_cliente || o._cliente_outro || '').toLowerCase().includes(busca)
                               || (o.obras?.endereco || '').toLowerCase().includes(busca);
    return matchStatus && matchInicio && matchFim && matchBusca;
  });

  renderTabela(filtradas);
  renderCards(filtradas);
}

function fmtData(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
}

function badgeHTML(status) {
  const map = {
    pendente:  '<span class="badge badge-pendente"><i data-lucide="clock"></i>Pendente</span>',
    concluida: '<span class="badge badge-aprovada"><i data-lucide="check"></i>Concluída</span>',
    // retrocompatibilidade com status antigos
    aprovada:  '<span class="badge badge-aprovada"><i data-lucide="check"></i>Concluída</span>',
    reprovada: '<span class="badge badge-pendente"><i data-lucide="clock"></i>Pendente</span>',
  };
  return map[status] || '<span class="badge badge-pendente"><i data-lucide="clock"></i>Pendente</span>';
}

/* ── Tabela (desktop) ── */
function renderTabela(lista) {
  const tbody = document.getElementById('tabelaBody');
  if (!lista.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-table">
      <i data-lucide="inbox"></i>
      Nenhuma OS encontrada.
    </td></tr>`;
    lucide.createIcons();
    return;
  }
  tbody.innerHTML = lista.map(os => {
    const nFotos = (os.fotos_urls || []).length;
    return `<tr onclick="verDetalhe(${os.id})">
      <td style="white-space:nowrap">
        ${os.data_servico
          ? `<div class="cell-primary">${fmtData(os.data_servico + 'T12:00')}</div><div class="cell-secondary">enviado ${fmtData(os.criado_em)}</div>`
          : `<div class="cell-secondary">${fmtData(os.criado_em)}</div>`}
      </td>
      <td>
        <div class="cell-primary">${escHtml(os.obras?.nome_cliente || os._cliente_outro || '—')}</div>
        ${os.obras?.endereco ? `<div class="cell-secondary">${escHtml(os.obras.endereco)}</div>` : ''}
      </td>
      <td class="cell-obs">${escHtml((os.observacoes || os.servicos_realizados || '—').slice(0,80))}</td>
      <td>${badgeHTML(os.status_aprovacao)}</td>
      <td>${nFotos > 0 ? `<span class="badge badge-fotos"><i data-lucide="image"></i>${nFotos}</span>` : '<span style="color:#52525B">—</span>'}</td>
    </tr>`;
  }).join('');
  lucide.createIcons();
}

/* ── Cards (mobile) ── */
function renderCards(lista) {
  const container = document.getElementById('cardLista');
  if (!lista.length) {
    container.innerHTML = '<div class="spinner-wrap" style="padding:40px;text-align:center;color:#52525B">Nenhuma OS encontrada.</div>';
    return;
  }
  container.innerHTML = lista.map(os => `
    <div class="os-card" onclick="verDetalhe(${os.id})">
      <div class="os-card-header">
        <div class="os-obra">${escHtml(os.obras?.nome_cliente || os._cliente_outro || '—')}</div>
        <div class="os-data">
          ${os.data_servico
            ? `<div style="font-weight:600;color:#FFFFFF">${fmtData(os.data_servico + 'T12:00')}</div><div>env. ${fmtData(os.criado_em)}</div>`
            : fmtData(os.criado_em)}
        </div>
      </div>
      <div class="os-obs">${escHtml(os.observacoes || os.servicos_realizados || 'Sem observações')}</div>
      <div class="os-footer">
        ${badgeHTML(os.status_aprovacao)}
        ${(os.fotos_urls||[]).length > 0 ? `<span class="badge badge-fotos"><i data-lucide="image"></i>${os.fotos_urls.length} foto(s)</span>` : ''}
      </div>
    </div>`).join('');
  lucide.createIcons();
}

/* ── Modal detalhe (OS completa) ── */
function verDetalhe(id) {
  const os = todasOSs.find(o => o.id === id);
  if (!os) return;

  const DR = (label, valor) => valor
    ? `<div class="detail-row"><div class="detail-label">${escHtml(label)}</div><div class="detail-value" style="white-space:pre-line">${escHtml(valor)}</div></div>`
    : '';

  const equipeIds   = [os.tecnico_id, os.auxiliar_id, os.auxiliar2_id, os.auxiliar3_id].filter(Boolean);
  const equipeNomes = equipeIds.map(id => tdTecMap[id]?.nome || `#${id}`).join(' · ') || '—';
  const horario     = [os.horario_inicio?.slice(0,5), os.horario_fim?.slice(0,5)].filter(Boolean).join(' – ') || null;

  let html = `
    ${DR('Equipe', equipeNomes)}
    ${os.data_servico ? DR('Data do serviço', fmtData(os.data_servico + 'T12:00')) : ''}
    ${DR('Horário', horario)}
    <div class="detail-row"><div class="detail-label">Obra</div><div class="detail-value">${escHtml(os.obras?.nome_cliente || os._cliente_outro || '—')}${os.obras?.endereco ? `<br><span style="color:#52525B;font-size:0.78rem">${escHtml(os.obras.endereco)}</span>` : ''}</div></div>
    <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${badgeHTML(os.status_aprovacao)}</div></div>
    ${os.observacao_supervisor ? `<div class="obs-supervisor"><div class="obs-sup-label">Obs. do supervisor</div>${escHtml(os.observacao_supervisor)}</div>` : ''}
    <div class="modal-section-divider"></div>
    ${DR('Serviço planejado', os.servico_planejado)}
    ${DR('Serviços realizados', os.servicos_realizados)}
    ${os.houve_problema ? DR('Problema reportado', os.descricao_problema || 'Sim') : ''}
    ${os.faltou_material ? DR('Material faltante', os.lista_material) : ''}
    ${os.retornou_material ? DR('Material retornado', os.lista_retorno) : ''}
    ${os.retorno_equipamento ? DR('Equipamento retornado', os.lista_equipamentos) : ''}
    ${DR('Sistema de automação', os.sistema_automacao)}
    ${DR('Próximas atividades', os.proximas_atividades)}
    ${DR('Observações finais', os.observacoes)}
  `;

  if (os.fotos_urls && os.fotos_urls.length > 0) {
    html += `<div class="modal-section-divider"></div>
    <div class="detail-row">
      <div class="detail-label">Fotos (${os.fotos_urls.length})</div>
      <div class="fotos-grid">
        ${os.fotos_urls.map(url => isVideoUrl(url)
            ? `<div class="foto-item"><video src="${escHtml(fotoSrc(url))}" controls playsinline style="width:100%;height:100%;object-fit:cover;" onclick="event.stopPropagation()"></video></div>`
            : `<div class="foto-item" onclick="event.stopPropagation();abrirLightbox('${escHtml(url)}')"><img src="${escHtml(fotoSrc(url))}" loading="lazy" alt="foto"></div>`
          ).join('')}
      </div>
    </div>`;
  }

  document.getElementById('modalTitulo').textContent = `OS — ${os.obras?.nome_cliente || os._cliente_outro || 'Obra'}`;
  document.getElementById('modalConteudo').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('aberto');
  lucide.createIcons();
}

function fecharModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || e.target.classList.contains('btn-fechar')) {
    document.getElementById('modalOverlay').classList.remove('aberto');
  }
}

// Detecta se uma URL aponta para vídeo (SharePoint proxy ou Supabase)
function isVideoUrl(url) {
  const decoded = decodeURIComponent((url || '').split('path=').pop() || url);
  return /\.(mp4|mov|avi|webm)(\?|$)/i.test(decoded);
}

function abrirLightbox(url) {
  const img   = document.getElementById('lbImg');
  const video = document.getElementById('lbVideo');
  const urlT = fotoSrc(url);
  if (isVideoUrl(url)) {
    img.style.display   = 'none';   img.src = '';
    video.style.display = 'block';  video.src = urlT;
  } else {
    video.style.display = 'none';   video.src = ''; video.pause?.();
    img.style.display   = 'block';  img.src = urlT;
  }
  document.getElementById('lightbox').classList.add('aberto');
}
function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('aberto');
  const video = document.getElementById('lbVideo');
  if (video) { video.pause(); video.src = ''; video.style.display = 'none'; }
  const img = document.getElementById('lbImg');
  if (img)  { img.src = ''; img.style.display = 'none'; }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fecharModal(); fecharLightbox(); }
});
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
