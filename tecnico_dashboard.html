<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solução Técnica — Minhas OSs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}

  /* ── Header ── */
  header{background:#1a1d2e;border-bottom:1px solid #2d3148;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{font-size:1.2rem;font-weight:700;color:#fff}
  nav{display:flex;gap:6px;align-items:center}
  nav a{padding:6px 14px;border-radius:8px;font-size:0.82rem;color:#9ba3cc;text-decoration:none;transition:all .2s}
  nav a:hover,nav a.ativo{background:#3b5bdb;color:#fff}
  .btn-logout{padding:6px 14px;border-radius:8px;font-size:0.82rem;color:#9ba3cc;background:none;border:none;cursor:pointer;transition:all .2s}
  .btn-logout:hover{background:#7f1d1d;color:#fca5a5}

  /* ── Layout principal ── */
  main{max-width:1100px;margin:0 auto;padding:24px 20px}

  /* ── Stats ── */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .stat-card{background:#1a1d2e;border:1px solid #2d3148;border-radius:10px;padding:16px;text-align:center}
  .stat-num{font-size:2rem;font-weight:700;color:#3b5bdb}
  .stat-num.verde{color:#22c55e}
  .stat-num.amarelo{color:#f59e0b}
  .stat-label{font-size:0.72rem;color:#7c85b0;margin-top:4px}

  /* ── Filtros ── */
  .filtros-wrap{background:#1a1d2e;border:1px solid #2d3148;border-radius:12px;padding:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 14px;border-radius:20px;border:1px solid #2d3148;background:#12152a;color:#9ba3cc;font-size:0.78rem;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chip:hover,.chip.ativo{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
  .date-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .date-group label{font-size:0.78rem;color:#7c85b0}
  .date-group input{background:#12152a;border:1px solid #2d3148;border-radius:8px;padding:7px 10px;color:#e2e8f0;font-size:0.82rem;outline:none}
  .date-group input:focus{border-color:#3b5bdb}

  /* ── Tabela desktop ── */
  .tabela-wrap{background:#1a1d2e;border:1px solid #2d3148;border-radius:12px;overflow:hidden;margin-bottom:20px}
  table{width:100%;border-collapse:collapse;font-size:0.83rem}
  th{background:#12152a;padding:10px 16px;text-align:left;font-size:0.7rem;font-weight:700;color:#7c85b0;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #2d3148}
  td{padding:12px 16px;border-bottom:1px solid #1e2240;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1e2240;cursor:pointer}
  .empty-table{text-align:center;padding:40px;color:#4a5080;font-size:0.88rem}

  /* ── Cards mobile ── */
  .cards-lista{display:none}
  .os-card{background:#1a1d2e;border:1px solid #2d3148;border-radius:10px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
  .os-card:hover{border-color:#3b5bdb}
  .os-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
  .os-obra{font-size:0.95rem;font-weight:700;color:#fff}
  .os-data{font-size:0.75rem;color:#7c85b0;white-space:nowrap}
  .os-obs{font-size:0.8rem;color:#a0aec0;margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .os-footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

  /* ── Badges ── */
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:0.7rem;font-weight:700}
  .badge-pendente{background:#3d2700;color:#fbbf24}
  .badge-aprovado,.badge-aprovada{background:#14532d;color:#86efac}
  .badge-rejeitado,.badge-reprovada{background:#450a0a;color:#fca5a5}

  /* ── Spinner ── */
  .spinner-wrap{text-align:center;padding:40px;color:#4a5080}
  .spinner{width:28px;height:28px;border:3px solid #2d3148;border-top-color:#3b5bdb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Modal detalhe ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:16px}
  .overlay.aberto{display:flex}
  .modal{background:#1a1d2e;border:1px solid #2d3148;border-radius:16px;padding:28px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
  .modal h2{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:20px}
  .detail-row{margin-bottom:14px}
  .detail-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;color:#7c85b0;letter-spacing:.06em;margin-bottom:3px}
  .detail-value{font-size:0.88rem;color:#e2e8f0}
  .obs-supervisor{background:#3d2700;border:1px solid #f59e0b;border-radius:8px;padding:10px 12px;font-size:0.82rem;color:#fbbf24;margin:8px 0}
  .btn-fechar{width:100%;padding:12px;background:#2d3148;border:none;border-radius:8px;color:#e2e8f0;font-size:0.9rem;font-weight:600;cursor:pointer;margin-top:16px}
  .btn-fechar:hover{background:#3b5bdb}

  /* ── Fotos no modal ── */
  .fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
  .foto-item{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;background:#12152a}
  .foto-item img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
  .foto-item:hover img{transform:scale(1.05)}

  /* ── Lightbox ── */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;align-items:center;justify-content:center}
  .lightbox.aberto{display:flex}
  .lightbox img{max-width:90vw;max-height:85vh;border-radius:8px;object-fit:contain}
  .lb-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer}

  /* ── Responsive ── */
  @media(max-width:700px){
    main{padding:16px 12px}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px}
    .stat-num{font-size:1.4rem}
    .tabela-wrap{display:none}          /* esconde tabela no mobile */
    .cards-lista{display:block}         /* mostra cards no mobile */
    .filtros-wrap{padding:12px}
    .date-group{width:100%}
  }
  @media(min-width:701px){
    .tabela-wrap{display:block}         /* tabela no desktop */
    .cards-lista{display:none}          /* esconde cards no desktop */
  }
</style>
</head>
<body>

<header>
  <h1>Solução Técnica</h1>
  <nav>
    <a href="obras.html">Obras</a>
    <a href="agenda.html">Agenda</a>
    <a href="os.html">OS</a>
    <a href="tecnico_dashboard.html" class="ativo">Minhas OSs</a>
    <button class="btn-logout" onclick="logout()">↩ Sair</button>
  </nav>
</header>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statTotal">—</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num verde" id="statAprovadas">—</div><div class="stat-label">Aprovadas</div></div>
    <div class="stat-card"><div class="stat-num amarelo" id="statPendentes">—</div><div class="stat-label">Pendentes</div></div>
  </div>

  <!-- Filtros -->
  <div class="filtros-wrap">
    <div class="chips">
      <div class="chip ativo" onclick="setFiltro('todos',this)">Todas</div>
      <div class="chip" onclick="setFiltro('pendente',this)">⏳ Pendentes</div>
      <div class="chip" onclick="setFiltro('aprovado',this)">✅ Aprovadas</div>
      <div class="chip" onclick="setFiltro('rejeitado',this)">❌ Rejeitadas</div>
    </div>
    <div class="date-group">
      <label>De:</label>
      <input type="date" id="dataInicio" onchange="filtrar()">
      <label>Até:</label>
      <input type="date" id="dataFim" onchange="filtrar()">
    </div>
  </div>

  <!-- Tabela (desktop) -->
  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Obra / Cliente</th>
          <th>Observações</th>
          <th>Status</th>
          <th>Fotos</th>
        </tr>
      </thead>
      <tbody id="tabelaBody">
        <tr><td colspan="5" class="empty-table"><div class="spinner"></div> Carregando...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Cards (mobile) -->
  <div class="cards-lista" id="cardLista">
    <div class="spinner-wrap"><div class="spinner"></div><p>Carregando...</p></div>
  </div>
</main>

<!-- Modal detalhe OS -->
<div class="overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <h2 id="modalTitulo"></h2>
    <div id="modalConteudo"></div>
    <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="fecharLightbox()">✕</button>
  <img id="lbImg" src="" alt="">
</div>

<script>
const SUPABASE_URL = 'https://kxtjqudpnmdqkzqhyhmz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dGpxdWRwbm1kcWt6cWh5aG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDYzMzEsImV4cCI6MjA5NTIyMjMzMX0.tba066RGNwDbXaNEy3w_OHbblll_bky6Dx10mXnxVQ0';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let todasOSs = [];
let filtroStatus = 'todos';
let tecnicoAtual = null;

async function logout() {
  await db.auth.signOut();
  window.location.href = 'login.html';
}

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: tec } = await db
    .from('tecnicos').select('id, nome, role')
    .eq('auth_user_id', session.user.id).single();

  if (!tec) { window.location.href = 'login.html'; return; }
  if (tec.role !== 'tecnico') { window.location.href = 'supervisor.html'; return; }

  tecnicoAtual = tec;

  const hoje = new Date();
  const inicio = new Date(hoje); inicio.setDate(inicio.getDate() - 90);
  document.getElementById('dataInicio').value = inicio.toISOString().split('T')[0];
  document.getElementById('dataFim').value = hoje.toISOString().split('T')[0];

  await carregarOSs();
})();

async function carregarOSs() {
  const { data, error } = await db
    .from('ordens_de_servico')
    .select('*, obras(nome_cliente, endereco)')
    .eq('tecnico_id', tecnicoAtual.id)
    .order('criado_em', { ascending: false });

  if (error) {
    document.getElementById('tabelaBody').innerHTML =
      `<tr><td colspan="5" class="empty-table">Erro: ${error.message}</td></tr>`;
    return;
  }

  todasOSs = data || [];

  document.getElementById('statTotal').textContent     = todasOSs.length;
  document.getElementById('statAprovadas').textContent = todasOSs.filter(o => o.status_aprovacao === 'aprovado').length;
  document.getElementById('statPendentes').textContent = todasOSs.filter(o => o.status_aprovacao === 'pendente').length;

  filtrar();
}

function setFiltro(status, el) {
  filtroStatus = status;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
  el.classList.add('ativo');
  filtrar();
}

function filtrar() {
  const dataInicio = document.getElementById('dataInicio').value;
  const dataFim    = document.getElementById('dataFim').value;

  const filtradas = todasOSs.filter(o => {
    const dataOS = (o.criado_em || '').slice(0, 10);
    const matchStatus  = filtroStatus === 'todos' || o.status_aprovacao === filtroStatus;
    const matchInicio  = !dataInicio || dataOS >= dataInicio;
    const matchFim     = !dataFim    || dataOS <= dataFim;
    return matchStatus && matchInicio && matchFim;
  });

  renderTabela(filtradas);
  renderCards(filtradas);
}

function fmtData(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
}

function badgeHTML(status) {
  const map = {
    pendente:  '<span class="badge badge-pendente">⏳ Pendente</span>',
    aprovado:  '<span class="badge badge-aprovado">✅ Aprovado</span>',
    rejeitado: '<span class="badge badge-rejeitado">❌ Rejeitado</span>',
  };
  return map[status] || `<span class="badge">${status || '—'}</span>`;
}

/* ── Tabela (desktop) ── */
function renderTabela(lista) {
  const tbody = document.getElementById('tabelaBody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-table">Nenhuma OS encontrada.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(os => {
    const nFotos = (os.fotos_urls || []).length;
    return `<tr onclick="verDetalhe(${os.id})">
      <td style="color:#7c85b0;white-space:nowrap">${fmtData(os.criado_em)}</td>
      <td><strong>${os.obras?.nome_cliente || '—'}</strong>
        ${os.obras?.endereco ? `<div style="font-size:.72rem;color:#7c85b0">${os.obras.endereco}</div>` : ''}</td>
      <td style="color:#a0aec0;max-width:280px">${(os.observacoes || os.servicos_realizados || '—').slice(0,80)}</td>
      <td>${badgeHTML(os.status_aprovacao)}</td>
      <td style="color:#7c85b0">${nFotos > 0 ? `📸 ${nFotos}` : '—'}</td>
    </tr>`;
  }).join('');
}

/* ── Cards (mobile) ── */
function renderCards(lista) {
  const container = document.getElementById('cardLista');
  if (!lista.length) {
    container.innerHTML = '<div class="spinner-wrap" style="padding:40px;text-align:center;color:#4a5080">Nenhuma OS encontrada.</div>';
    return;
  }
  container.innerHTML = lista.map(os => `
    <div class="os-card" onclick="verDetalhe(${os.id})">
      <div class="os-card-header">
        <div class="os-obra">${os.obras?.nome_cliente || '—'}</div>
        <div class="os-data">${fmtData(os.criado_em)}</div>
      </div>
      <div class="os-obs">${os.observacoes || os.servicos_realizados || 'Sem observações'}</div>
      <div class="os-footer">
        ${badgeHTML(os.status_aprovacao)}
        ${(os.fotos_urls||[]).length > 0 ? `<span class="badge" style="background:#1e3a5f;color:#93c5fd">📸 ${os.fotos_urls.length} foto(s)</span>` : ''}
      </div>
    </div>`).join('');
}

/* ── Modal detalhe ── */
function verDetalhe(id) {
  const os = todasOSs.find(o => o.id === id);
  if (!os) return;

  document.getElementById('modalTitulo').textContent = `OS — ${os.obras?.nome_cliente || 'Obra'}`;

  let html = `
    <div class="detail-row"><div class="detail-label">Data</div><div class="detail-value">${fmtData(os.criado_em)}</div></div>
    <div class="detail-row"><div class="detail-label">Obra / Endereço</div><div class="detail-value">${os.obras?.nome_cliente || '—'}${os.obras?.endereco ? ` · 📍 ${os.obras.endereco}` : ''}</div></div>
    <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${badgeHTML(os.status_aprovacao)}</div></div>
    ${os.observacao_supervisor ? `<div class="obs-supervisor">💬 Supervisor: "${os.observacao_supervisor}"</div>` : ''}
    ${os.servicos_realizados ? `<div class="detail-row"><div class="detail-label">Serviços realizados</div><div class="detail-value">${os.servicos_realizados}</div></div>` : ''}
    ${os.observacoes ? `<div class="detail-row"><div class="detail-label">Observações</div><div class="detail-value">${os.observacoes}</div></div>` : ''}
    ${os.proximas_atividades ? `<div class="detail-row"><div class="detail-label">Próximas atividades</div><div class="detail-value">${os.proximas_atividades}</div></div>` : ''}
    ${os.houve_problema ? `<div class="detail-row"><div class="detail-label">Problema reportado</div><div class="detail-value">${os.descricao_problema || 'Sim'}</div></div>` : ''}
  `;

  if (os.fotos_urls && os.fotos_urls.length > 0) {
    html += `<div class="detail-row">
      <div class="detail-label">Fotos (${os.fotos_urls.length})</div>
      <div class="fotos-grid">
        ${os.fotos_urls.map(url => `<div class="foto-item" onclick="event.stopPropagation();abrirLightbox('${url}')"><img src="${url}" loading="lazy" alt="foto"></div>`).join('')}
      </div></div>`;
  }

  document.getElementById('modalConteudo').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('aberto');
}

function fecharModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || e.target.classList.contains('btn-fechar')) {
    document.getElementById('modalOverlay').classList.remove('aberto');
  }
}

function abrirLightbox(url) {
  document.getElementById('lbImg').src = url;
  document.getElementById('lightbox').classList.add('aberto');
}
function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('aberto');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fecharModal(); fecharLightbox(); }
});
</script>
</body>
</html>
