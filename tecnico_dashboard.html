<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solução Técnica — Minhas OSs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0A0A0A;
    color: #FFFFFF;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Topbar (padrão universal) ── */
  .topbar { background:var(--surface-1,#111111); border-bottom:1px solid rgba(255,255,255,0.08); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
  .topbar-logo { font-size:15px; font-weight:700; color:#fff; letter-spacing:-0.2px; flex:1; }
  .topbar-greeting { font-size:13px; color:#A1A1AA; margin-right:16px; }
  .topbar-links { display:flex; align-items:center; gap:4px; }
  .topbar-links a { color:#A1A1AA; text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
  .topbar-links a:hover { color:#fff; background:rgba(255,255,255,0.06); }
  .topbar-links a.active { color:#fff; background:rgba(255,255,255,0.08); }
  .topbar-links a.nav-sair { color:#A1A1AA; border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
  .topbar-links a.nav-sair:hover { color:#fff; background:rgba(255,255,255,0.06); }

  /* ── Layout principal ── */
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: #111111;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 20px;
  }

  .stat-num {
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 6px;
    color: #FFFFFF;
  }

  .stat-num.verde { color: #3ECF8E; }
  .stat-num.amarelo { color: #F59E0B; }

  .stat-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #52525B;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── Filtros ── */
  .filtros-wrap {
    background: #111111;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .filtros-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }

  .filtros-label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #52525B;
    margin-right: 4px;
    white-space: nowrap;
  }

  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
    background: transparent;
    color: #A1A1AA;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .chip:hover { border-color: rgba(255,255,255,0.2); color: #FFFFFF; background: rgba(255,255,255,0.04); }
  .chip.ativo { border-color: #3ECF8E; color: #3ECF8E; background: rgba(62,207,142,0.08); }

  .date-group {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .date-group label {
    font-size: 0.75rem;
    font-weight: 500;
    color: #52525B;
  }

  .date-group input {
    background: #0A0A0A;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 6px 10px;
    color: #FFFFFF;
    font-size: 0.82rem;
    font-family: 'Inter', system-ui, sans-serif;
    outline: none;
    transition: border-color 0.15s;
    color-scheme: dark;
  }
  .date-group input:focus { border-color: rgba(255,255,255,0.25); }

  /* ── Busca ── */
  .busca-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .busca-wrap i {
    position: absolute;
    left: 10px;
    width: 14px;
    height: 14px;
    color: #52525B;
    pointer-events: none;
  }
  .busca-wrap input {
    background: #0A0A0A;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 6px 10px 6px 32px;
    color: #FFFFFF;
    font-size: 0.82rem;
    font-family: 'Inter', system-ui, sans-serif;
    outline: none;
    transition: border-color 0.15s;
    width: 200px;
  }
  .busca-wrap input:focus { border-color: rgba(255,255,255,0.25); }
  .busca-wrap input::placeholder { color: #52525B; }

  /* ── Tabela (desktop) ── */
  .tabela-wrap {
    background: #111111;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.83rem;
  }

  thead {
    background: #0A0A0A;
  }

  th {
    padding: 10px 16px;
    text-align: left;
    font-size: 0.68rem;
    font-weight: 600;
    color: #52525B;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
    color: #A1A1AA;
  }

  tr:last-child td { border-bottom: none; }

  tbody tr {
    transition: background 0.1s;
    cursor: pointer;
  }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }

  .empty-table {
    text-align: center;
    padding: 48px 16px;
    color: #52525B;
    font-size: 0.85rem;
  }

  .empty-table i {
    display: block;
    margin: 0 auto 12px;
    width: 28px;
    height: 28px;
    color: #52525B;
  }

  /* ── Cards mobile ── */
  .cards-lista { display: none; }

  .os-card {
    background: #111111;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .os-card:hover { border-color: rgba(255,255,255,0.18); }

  .os-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .os-obra {
    font-size: 0.9rem;
    font-weight: 600;
    color: #FFFFFF;
  }

  .os-data {
    font-size: 0.72rem;
    color: #52525B;
    white-space: nowrap;
    text-align: right;
  }

  .os-obs {
    font-size: 0.8rem;
    color: #A1A1AA;
    margin: 6px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.5;
  }

  .os-footer {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    align-items: center;
  }

  /* ── Badges ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .badge i { width: 10px; height: 10px; }

  .badge-pendente { background: rgba(245,158,11,0.12); color: #F59E0B; border: 1px solid rgba(245,158,11,0.2); }
  .badge-aprovado, .badge-aprovada { background: rgba(62,207,142,0.1); color: #3ECF8E; border: 1px solid rgba(62,207,142,0.2); }
  .badge-rejeitado, .badge-reprovada { background: rgba(239,68,68,0.1); color: #EF4444; border: 1px solid rgba(239,68,68,0.2); }

  .badge-fotos {
    background: rgba(79,70,229,0.1);
    color: #818CF8;
    border: 1px solid rgba(79,70,229,0.2);
  }

  /* ── Spinner ── */
  .spinner-wrap {
    text-align: center;
    padding: 48px;
    color: #52525B;
  }

  .spinner {
    width: 24px;
    height: 24px;
    border: 2px solid rgba(255,255,255,0.08);
    border-top-color: #3ECF8E;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }

  .spinner-wrap p {
    font-size: 0.82rem;
    color: #52525B;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Modal detalhe ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
    backdrop-filter: blur(4px);
  }
  .overlay.aberto { display: flex; }

  .modal {
    background: #161616;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .modal-header h2 {
    font-size: 1rem;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: -0.01em;
  }

  .btn-modal-fechar {
    background: none;
    border: none;
    color: #52525B;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color 0.15s;
  }
  .btn-modal-fechar:hover { color: #FFFFFF; }
  .btn-modal-fechar i { width: 16px; height: 16px; }

  .detail-row { margin-bottom: 16px; }

  .detail-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    color: #52525B;
    letter-spacing: 0.07em;
    margin-bottom: 4px;
  }

  .detail-value {
    font-size: 0.85rem;
    color: #FFFFFF;
    line-height: 1.5;
  }

  .obs-supervisor {
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.82rem;
    color: #F59E0B;
    margin: 8px 0 16px;
    line-height: 1.5;
  }

  .obs-supervisor .obs-sup-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 4px;
    color: #F59E0B;
    opacity: 0.7;
  }

  .btn-fechar {
    width: 100%;
    padding: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: #A1A1AA;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    margin-top: 20px;
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 0.15s, color 0.15s;
  }
  .btn-fechar:hover { background: rgba(255,255,255,0.08); color: #FFFFFF; }

  /* ── Fotos no modal ── */
  .fotos-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 8px;
  }

  .foto-item {
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    background: #0A0A0A;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .foto-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
  }
  .foto-item:hover img { transform: scale(1.05); }

  /* ── Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .lightbox.aberto { display: flex; }

  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 8px;
    object-fit: contain;
  }

  .lb-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #FFFFFF;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    transition: background 0.15s;
  }
  .lb-close:hover { background: rgba(255,255,255,0.15); }
  .lb-close i { width: 18px; height: 18px; }

  /* ── Divisor modal ── */
  .modal-section-divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 16px 0;
  }

  /* ── Texto célula tabela ── */
  .cell-primary {
    font-weight: 600;
    color: #FFFFFF;
    font-size: 0.83rem;
  }
  .cell-secondary {
    font-size: 0.72rem;
    color: #52525B;
    margin-top: 2px;
  }
  .cell-obs {
    color: #A1A1AA;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    main { padding: 16px 12px; }
    .stats { gap: 8px; }
    .stat-card { padding: 14px; }
    .stat-num { font-size: 1.5rem; }
    .tabela-wrap { display: none; }
    .cards-lista { display: block; }
    .filtros-wrap { padding: 12px; }
    .date-group { width: 100%; }
    .busca-wrap input { width: 100%; }
    nav a { display: none; }
    nav a.ativo { display: block; }
  }

  @media (min-width: 701px) {
    .tabela-wrap { display: block; }
    .cards-lista { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<main>
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-num verde" id="statAprovadas">—</div>
      <div class="stat-label">Concluídas</div>
    </div>
    <div class="stat-card">
      <div class="stat-num amarelo" id="statPendentes">—</div>
      <div class="stat-label">Pendentes</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros-wrap">
    <div class="filtros-left">
      <span class="filtros-label">Status</span>
      <div class="chips">
        <div class="chip ativo" onclick="setFiltro('todos',this)">Todas</div>
        <div class="chip" onclick="setFiltro('pendente',this)">Pendentes</div>
        <div class="chip" onclick="setFiltro('concluida',this)">Concluídas</div>
      </div>
    </div>
    <div class="date-group">
      <label>De</label>
      <input type="date" id="dataInicio" onchange="filtrar()">
      <label>Até</label>
      <input type="date" id="dataFim" onchange="filtrar()">
    </div>
    <div class="busca-wrap">
      <i data-lucide="search"></i>
      <input type="text" id="busca" placeholder="Buscar obra..." oninput="filtrar()">
    </div>
  </div>

  <!-- Tabela (desktop) -->
  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>Data serviço / Envio</th>
          <th>Obra</th>
          <th>Observações</th>
          <th>Status</th>
          <th>Fotos</th>
        </tr>
      </thead>
      <tbody id="tabelaBody">
        <tr>
          <td colspan="5">
            <div class="spinner-wrap">
              <div class="spinner"></div>
              <p>Carregando...</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Cards (mobile) -->
  <div class="cards-lista" id="cardLista">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <p>Carregando...</p>
    </div>
  </div>
</main>

<!-- Modal detalhe OS -->
<div class="overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitulo"></h2>
      <button class="btn-modal-fechar" onclick="fecharModal()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div id="modalConteudo"></div>
    <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="fecharLightbox()">
    <i data-lucide="x"></i>
  </button>
  <img id="lbImg" src="" alt="">
</div>

<script>
const SUPABASE_URL = 'https://kxtjqudpnmdqkzqhyhmz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dGpxdWRwbm1kcWt6cWh5aG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDYzMzEsImV4cCI6MjA5NTIyMjMzMX0.tba066RGNwDbXaNEy3w_OHbblll_bky6Dx10mXnxVQ0';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let todasOSs = [];
let filtroStatus = 'todos';
let tecnicoAtual = null;
let tdTecMap = {};  // id → { nome } para exibir equipe completa

function escHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderTopbar(nome, role, paginaAtiva) {
  const h = new Date().getHours();
  const s = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const primeiro = (nome || '').split(' ')[0];
  const greetEl = document.getElementById('topbar-greeting');
  if (greetEl && primeiro) greetEl.textContent = `${s}, ${primeiro}`;
  const links = [
    { href:'obras.html',                label:'Obras',       id:'obras',                roles:['tecnico','auxiliar','supervisor','coordenador','agendamento','gerente_comercial','projetista','coordenador_projetos'] },
    { href:'agenda.html',               label:'Agenda',      id:'agenda',               roles:['supervisor','coordenador','agendamento','tecnico','auxiliar','gerente_comercial','projetista','coordenador_projetos'] },
    { href:'os.html',                   label:'Fazer OS',    id:'os',                   roles:['tecnico','auxiliar'] },
    { href:'supervisor.html',           label:'Supervisor',  id:'supervisor',           roles:['supervisor','coordenador','agendamento','coordenador_projetos'] },
    { href:'admin.html',                label:'Admin',       id:'admin',                roles:['coordenador'] },
    { href:'tecnico_dashboard.html',    label:'Minhas OSs',  id:'minhas-os',            roles:['tecnico','auxiliar'] },
    { href:'gerente_comercial.html',    label:'Comercial',   id:'comercial',            roles:['gerente_comercial'] },
    { href:'projetista.html',           label:'Meu Painel',  id:'projetista',           roles:['projetista'] },
    { href:'coordenador_projetos.html', label:'Projetos',    id:'coordenador-projetos', roles:['coordenador_projetos'] },
  ];
  const nav = document.getElementById('topbar-nav');
  if (!nav) return;
  nav.innerHTML = links.filter(l => l.roles.includes(role))
    .map(l => `<a href="${l.href}" ${l.id === paginaAtiva ? 'class="active"' : ''}>${l.label}</a>`)
    .join('') + `<a href="#" class="nav-sair" onclick="logout()">Sair</a>`;
}

async function logout() {
  await db.auth.signOut();
  window.location.href = 'login.html';
}

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: tec } = await db
    .from('tecnicos').select('id, nome, role')
    .eq('auth_user_id', session.user.id).single();

  if (!tec) { window.location.href = 'login.html'; return; }
  if (tec.role !== 'tecnico' && tec.role !== 'auxiliar') { window.location.href = 'supervisor.html'; return; }

  tecnicoAtual = tec;
  renderTopbar(tec.nome, tec.role, 'minhas-os');

  // Carrega todos os técnicos para mostrar equipe completa no modal
  const { data: todosT } = await db.from('tecnicos').select('id, nome');
  (todosT || []).forEach(t => { tdTecMap[t.id] = t; });

  const hoje = new Date();
  const inicio = new Date(hoje); inicio.setDate(inicio.getDate() - 90);
  const futuro = new Date(hoje); futuro.setDate(futuro.getDate() + 60);
  document.getElementById('dataInicio').value = inicio.toISOString().split('T')[0];
  document.getElementById('dataFim').value = futuro.toISOString().split('T')[0];

  await carregarOSs();
})();

async function carregarOSs() {
  const id = tecnicoAtual.id;
  let data = null;

  // Tentativa 1 — OR nos 4 campos (inclui auxiliar2_id/auxiliar3_id)
  const r1 = await db
    .from('ordens_de_servico')
    .select('*, obras(nome_cliente, endereco)')
    .or(`tecnico_id.eq.${id},auxiliar_id.eq.${id},auxiliar2_id.eq.${id},auxiliar3_id.eq.${id}`)
    .order('criado_em', { ascending: false });

  if (!r1.error) {
    data = r1.data;
  } else {
    // Tentativa 2 — OR nos 2 campos básicos (sem auxiliar2/3, caso não existam)
    const r2 = await db
      .from('ordens_de_servico')
      .select('*, obras(nome_cliente, endereco)')
      .or(`tecnico_id.eq.${id},auxiliar_id.eq.${id}`)
      .order('criado_em', { ascending: false });

    if (!r2.error) {
      data = r2.data;
    } else {
      // Tentativa 3 — mínimo absoluto: só tecnico_id
      const r3 = await db
        .from('ordens_de_servico')
        .select('*, obras(nome_cliente, endereco)')
        .eq('tecnico_id', id)
        .order('criado_em', { ascending: false });
      if (r3.error) {
        document.getElementById('tabelaBody').innerHTML =
          `<tr><td colspan="5" class="empty-table">Erro ao carregar OSs: ${r3.error.message}</td></tr>`;
        return;
      }
      data = r3.data;
    }
  }

  todasOSs = data || [];

  document.getElementById('statTotal').textContent     = todasOSs.length;
  document.getElementById('statAprovadas').textContent = todasOSs.filter(o => o.status_aprovacao === 'concluida' || o.status_aprovacao === 'aprovada').length;
  document.getElementById('statPendentes').textContent = todasOSs.filter(o => !o.status_aprovacao || o.status_aprovacao === 'pendente' || o.status_aprovacao === 'reprovada').length;

  filtrar();
}

function setFiltro(status, el) {
  filtroStatus = status;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
  el.classList.add('ativo');
  filtrar();
}

function filtrar() {
  const dataInicio = document.getElementById('dataInicio').value;
  const dataFim    = document.getElementById('dataFim').value;
  const busca      = (document.getElementById('busca').value || '').toLowerCase().trim();

  const filtradas = todasOSs.filter(o => {
    const dataOS   = (o.data_servico || o.criado_em || '').slice(0, 10);
    const stOS = o.status_aprovacao || 'pendente';
    // Normalizar: aprovada antiga = concluida, reprovada = pendente
    const stNorm = stOS === 'aprovada' ? 'concluida' : stOS === 'reprovada' ? 'pendente' : stOS;
    const matchStatus = filtroStatus === 'todos' || stNorm === filtroStatus;
    const matchInicio = !dataInicio || dataOS >= dataInicio;
    const matchFim    = !dataFim    || dataOS <= dataFim;
    const matchBusca  = !busca || (o.obras?.nome_cliente || '').toLowerCase().includes(busca)
                               || (o.obras?.endereco || '').toLowerCase().includes(busca);
    return matchStatus && matchInicio && matchFim && matchBusca;
  });

  renderTabela(filtradas);
  renderCards(filtradas);
}

function fmtData(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
}

function badgeHTML(status) {
  const map = {
    pendente:  '<span class="badge badge-pendente"><i data-lucide="clock"></i>Pendente</span>',
    concluida: '<span class="badge badge-aprovada"><i data-lucide="check"></i>Concluída</span>',
    // retrocompatibilidade com status antigos
    aprovada:  '<span class="badge badge-aprovada"><i data-lucide="check"></i>Concluída</span>',
    reprovada: '<span class="badge badge-pendente"><i data-lucide="clock"></i>Pendente</span>',
  };
  return map[status] || '<span class="badge badge-pendente"><i data-lucide="clock"></i>Pendente</span>';
}

/* ── Tabela (desktop) ── */
function renderTabela(lista) {
  const tbody = document.getElementById('tabelaBody');
  if (!lista.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-table">
      <i data-lucide="inbox"></i>
      Nenhuma OS encontrada.
    </td></tr>`;
    lucide.createIcons();
    return;
  }
  tbody.innerHTML = lista.map(os => {
    const nFotos = (os.fotos_urls || []).length;
    return `<tr onclick="verDetalhe(${os.id})">
      <td style="white-space:nowrap">
        ${os.data_servico
          ? `<div class="cell-primary">${fmtData(os.data_servico + 'T12:00')}</div><div class="cell-secondary">enviado ${fmtData(os.criado_em)}</div>`
          : `<div class="cell-secondary">${fmtData(os.criado_em)}</div>`}
      </td>
      <td>
        <div class="cell-primary">${escHtml(os.obras?.nome_cliente || '—')}</div>
        ${os.obras?.endereco ? `<div class="cell-secondary">${escHtml(os.obras.endereco)}</div>` : ''}
      </td>
      <td class="cell-obs">${escHtml((os.observacoes || os.servicos_realizados || '—').slice(0,80))}</td>
      <td>${badgeHTML(os.status_aprovacao)}</td>
      <td>${nFotos > 0 ? `<span class="badge badge-fotos"><i data-lucide="image"></i>${nFotos}</span>` : '<span style="color:#52525B">—</span>'}</td>
    </tr>`;
  }).join('');
  lucide.createIcons();
}

/* ── Cards (mobile) ── */
function renderCards(lista) {
  const container = document.getElementById('cardLista');
  if (!lista.length) {
    container.innerHTML = '<div class="spinner-wrap" style="padding:40px;text-align:center;color:#52525B">Nenhuma OS encontrada.</div>';
    return;
  }
  container.innerHTML = lista.map(os => `
    <div class="os-card" onclick="verDetalhe(${os.id})">
      <div class="os-card-header">
        <div class="os-obra">${escHtml(os.obras?.nome_cliente || '—')}</div>
        <div class="os-data">
          ${os.data_servico
            ? `<div style="font-weight:600;color:#FFFFFF">${fmtData(os.data_servico + 'T12:00')}</div><div>env. ${fmtData(os.criado_em)}</div>`
            : fmtData(os.criado_em)}
        </div>
      </div>
      <div class="os-obs">${escHtml(os.observacoes || os.servicos_realizados || 'Sem observações')}</div>
      <div class="os-footer">
        ${badgeHTML(os.status_aprovacao)}
        ${(os.fotos_urls||[]).length > 0 ? `<span class="badge badge-fotos"><i data-lucide="image"></i>${os.fotos_urls.length} foto(s)</span>` : ''}
      </div>
    </div>`).join('');
  lucide.createIcons();
}

/* ── Modal detalhe (OS completa) ── */
function verDetalhe(id) {
  const os = todasOSs.find(o => o.id === id);
  if (!os) return;

  const DR = (label, valor) => valor
    ? `<div class="detail-row"><div class="detail-label">${escHtml(label)}</div><div class="detail-value" style="white-space:pre-line">${escHtml(valor)}</div></div>`
    : '';

  const equipeIds   = [os.tecnico_id, os.auxiliar_id, os.auxiliar2_id, os.auxiliar3_id].filter(Boolean);
  const equipeNomes = equipeIds.map(id => tdTecMap[id]?.nome || `#${id}`).join(' · ') || '—';
  const horario     = [os.horario_inicio?.slice(0,5), os.horario_fim?.slice(0,5)].filter(Boolean).join(' – ') || null;

  let html = `
    ${DR('Equipe', equipeNomes)}
    ${os.data_servico ? DR('Data do serviço', fmtData(os.data_servico + 'T12:00')) : ''}
    ${DR('Horário', horario)}
    <div class="detail-row"><div class="detail-label">Obra</div><div class="detail-value">${escHtml(os.obras?.nome_cliente || '—')}${os.obras?.endereco ? `<br><span style="color:#52525B;font-size:0.78rem">${escHtml(os.obras.endereco)}</span>` : ''}</div></div>
    <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${badgeHTML(os.status_aprovacao)}</div></div>
    ${os.observacao_supervisor ? `<div class="obs-supervisor"><div class="obs-sup-label">Obs. do supervisor</div>${escHtml(os.observacao_supervisor)}</div>` : ''}
    <div class="modal-section-divider"></div>
    ${DR('Serviço planejado', os.servico_planejado)}
    ${DR('Serviços realizados', os.servicos_realizados)}
    ${os.houve_problema ? DR('Problema reportado', os.descricao_problema || 'Sim') : ''}
    ${os.faltou_material ? DR('Material faltante', os.lista_material) : ''}
    ${os.retornou_material ? DR('Material retornado', os.lista_retorno) : ''}
    ${os.retorno_equipamento ? DR('Equipamento retornado', os.lista_equipamentos) : ''}
    ${DR('Sistema de automação', os.sistema_automacao)}
    ${DR('Próximas atividades', os.proximas_atividades)}
    ${DR('Observações finais', os.observacoes)}
  `;

  if (os.fotos_urls && os.fotos_urls.length > 0) {
    html += `<div class="modal-section-divider"></div>
    <div class="detail-row">
      <div class="detail-label">Fotos (${os.fotos_urls.length})</div>
      <div class="fotos-grid">
        ${os.fotos_urls.map(url => `<div class="foto-item" onclick="event.stopPropagation();abrirLightbox('${escHtml(url)}')"><img src="${escHtml(url)}" loading="lazy" alt="foto"></div>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('modalTitulo').textContent = `OS — ${os.obras?.nome_cliente || 'Obra'}`;
  document.getElementById('modalConteudo').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('aberto');
  lucide.createIcons();
}

function fecharModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || e.target.classList.contains('btn-fechar')) {
    document.getElementById('modalOverlay').classList.remove('aberto');
  }
}

function abrirLightbox(url) {
  document.getElementById('lbImg').src = url;
  document.getElementById('lightbox').classList.add('aberto');
}
function fecharLightbox() {
  document.getElementById('lightbox').classList.remove('aberto');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fecharModal(); fecharLightbox(); }
});
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
