<!DOCTYPE html>
<!-- build: 2026-06-01g -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — Agenda de Vistorias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0A0A0A;
      --surface-1:    #111111;
      --surface-2:    #161616;
      --surface-3:    #1B1B1B;
      --primary:      #3ECF8E;
      --secondary:    #4F46E5;
      --text-1:       #FFFFFF;
      --text-2:       #A1A1AA;
      --text-3:       #52525B;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
    .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

    /* ── Barra de controles ── */
    .controles {
      max-width: 1400px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .semana-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .semana-nav button {
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms, color 150ms;
    }

    .semana-nav button i { width: 16px; height: 16px; }
    .semana-nav button:hover { border-color: var(--border-hover); color: var(--text-1); }

    .semana-nav span {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-1);
      min-width: 230px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .filtros-tipo {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filtro-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }

    .filtro-btn:hover { border-color: var(--border-hover); color: var(--text-1); }

    .filtro-btn.ativo {
      background: rgba(62,207,142,0.12);
      border-color: rgba(62,207,142,0.35);
      color: var(--primary);
    }

    .btn-novo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 150ms, transform 150ms;
      font-family: inherit;
    }

    .btn-novo i { width: 15px; height: 15px; }
    .btn-novo:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── Grade semanal ── */
    .grade {
      max-width: 1400px;
      margin: 20px auto 48px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 900px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .grade { grid-template-columns: 1fr; } }

    /* ── Coluna do dia ── */
    .coluna {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .coluna-header {
      padding: 12px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dia-nome {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    .dia-data {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .dia-data.hoje { color: var(--primary); }
    .coluna.bloqueada { border-color: rgba(239,68,68,.4); }
    .coluna.bloqueada .coluna-header { background: rgba(239,68,68,.1); border-bottom-color: rgba(239,68,68,.25); }
    .coluna.bloqueada .dia-nome { color: #f87171; }
    .coluna.bloqueada .dia-data { color: #f87171; }
    .bloqueio-tag { font-size:10px;font-weight:700;color:#f87171;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:4px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px; }
    .btn-lock { display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-3);transition:color .15s,border-color .15s,background .15s; }
    .btn-lock:hover { color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08); }
    .btn-lock.ativo { color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1); }
    .btn-lock i { width:12px;height:12px; }

    .btn-add {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 150ms, color 150ms, background 150ms;
    }

    .btn-add i { width: 14px; height: 14px; }
    .btn-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(62,207,142,0.08); }

    .coluna-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .coluna-vazia {
      text-align: center;
      padding: 24px 8px;
      color: var(--text-3);
      font-size: 0.75rem;
    }

    /* ── Cards de vistoria ── */
    .card-vis {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 3px solid;
      cursor: pointer;
      transition: opacity 150ms, transform 150ms;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .card-vis:hover { opacity: 0.85; transform: translateX(2px); }

    .card-cabeamento  { background: rgba(245,158,11,0.07);  border-color: #f59e0b; }
    .card-eletrica    { background: rgba(59,130,246,0.07);  border-color: #3b82f6; }
    .card-audio_video { background: rgba(139,92,246,0.07);  border-color: #8b5cf6; }
    .card-automacao   { background: rgba(16,185,129,0.07);  border-color: #10b981; }

    .ag-tecs    { font-weight: 700; color: var(--text-1); margin-bottom: 3px; }
    .ag-cliente { font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
    .ag-detalhe { color: var(--text-3); font-size: 0.72rem; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .ag-detalhe i { width: 11px; height: 11px; flex-shrink: 0; }

    .ag-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge-tipo-cabeamento  { background: rgba(120,53,15,0.5);  color: #fde68a; }
    .badge-tipo-eletrica    { background: rgba(30,58,138,0.5);  color: #bfdbfe; }
    .badge-tipo-audio_video { background: rgba(76,29,149,0.5);  color: #ddd6fe; }
    .badge-tipo-automacao   { background: rgba(6,78,59,0.5);    color: #a7f3d0; }

    .badge-confirmado     { background: rgba(30,58,138,0.4);  color: #93c5fd; }
    .badge-nao_confirmado { background: rgba(113,63,18,0.4);  color: #fef08a; }
    .badge-viagem         { background: rgba(20,83,45,0.4);   color: #86efac; }

    /* ── Spinner ── */
    .spinner-wrap { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-3); }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-header-icon i { width: 16px; height: 16px; color: var(--primary); }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      color: var(--text-1);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      font-family: inherit;
    }

    .form-group textarea { min-height: 80px; resize: vertical; }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--text-3); }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .form-group select option { background: var(--surface-2); color: var(--text-1); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .form-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .check-group {
      display: flex;
      gap: 20px;
      margin-top: 4px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
    }

    .check-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Footer do modal ── */
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .btn-cancelar {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 150ms, color 150ms;
    }

    .btn-cancelar:hover { border-color: var(--border-hover); color: var(--text-1); }

    .btn-salvar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: opacity 150ms;
    }

    .btn-salvar:hover { opacity: 0.88; }
    .btn-salvar:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-excluir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-input);
      color: #f87171;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      margin-right: auto;
      transition: background 150ms, border-color 150ms;
    }

    .btn-excluir:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.35); }
    .btn-excluir i { width: 14px; height: 14px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 9999;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s;
      opacity: 0;
      white-space: nowrap;
    }
    .toast.visivel { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast-icon.ok { background: rgba(62,207,142,0.15); color: #3ECF8E; }
    .toast-icon.err { background: rgba(239,68,68,0.15); color: #ef4444; }
    .toast-icon svg { width: 12px; height: 12px; }

    /* ── Card para WhatsApp (fora da tela) ── */
    #agenda-card {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 860px;
      background: #0D1117;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      border-radius: 12px;
      overflow: hidden;
    }
    .ac-footer { padding: 14px 24px; background: #f1f5f9; border-top: 1px solid #e2e8f0; text-align: center; }
    .ac-footer-txt { font-size: 11px; color: #94a3b8; font-weight: 500; letter-spacing: 0.03em; }

    /* ── Botão WhatsApp ── */
    .btn-whatsapp {
      display: none; /* mostrado via JS apenas para agendamento/coordenador/supervisor */
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.3);
      border-radius: var(--radius-input);
      color: #25D366;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms, border-color 150ms, transform 150ms;
      font-family: inherit;
    }
    .btn-whatsapp:hover { background: rgba(37,211,102,0.2); border-color: rgba(37,211,102,0.5); transform: translateY(-1px); }
    .btn-whatsapp svg { width: 15px; height: 15px; flex-shrink: 0; }
    .input-data-dispatch { height:36px; padding:0 10px; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-input); color:var(--text-1); font-size:0.82rem; font-family:inherit; outline:none; cursor:pointer; transition:border-color 150ms; width:140px; }
    .input-data-dispatch:hover,.input-data-dispatch:focus { border-color:var(--border-hover); }
    .input-data-dispatch::-webkit-calendar-picker-indicator { filter:invert(0.7); cursor:pointer; }
    .controles-acoes { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    /* ── Botão exportar agenda → SharePoint ── */
    .btn-exportar-sp {
      display: none; /* mostrado via JS apenas para agendamento/coordenador/supervisor */
      align-items: center; gap: 7px;
      padding: 7px 14px; border-radius: 7px;
      background: rgba(62,207,142,0.10);
      border: 1px solid rgba(62,207,142,0.30);
      color: var(--primary);
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s;
      white-space: nowrap;
    }
    .btn-exportar-sp:hover { background: rgba(62,207,142,0.18); border-color: rgba(62,207,142,0.55); transform: translateY(-1px); }
    .btn-exportar-sp:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-exportar-sp i { width: 15px; height: 15px; }
    .btn-bloqueio { display:flex;align-items:center;gap:6px;padding:0 14px;height:36px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:8px;color:#f87171;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,transform .15s; }
    .btn-bloqueio:hover { background:rgba(239,68,68,0.16);border-color:rgba(239,68,68,0.5);transform:translateY(-1px); }
    .btn-bloqueio i { width:15px;height:15px; }
    .bloqueio-item { display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:7px;margin-bottom:6px; }
    .bloqueio-nome { font-size:13px;font-weight:600;color:var(--text-1);flex:1;min-width:0; }
    .bloqueio-info { font-size:11px;color:var(--text-3); }
    .bloqueio-motivo { font-size:11px;color:#f87171;font-weight:600; }
    .bloqueio-del { background:none;border:none;cursor:pointer;color:var(--text-3);padding:4px;border-radius:4px;display:flex; }
    .bloqueio-del:hover { color:#f87171;background:rgba(239,68,68,.1); }

  /* ── TEMA CLARO ── */
  :root[data-theme="light"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); }
  @media (prefers-color-scheme: light) { :root[data-theme="auto"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); } }
  .tema-btn { background:transparent; border:1px solid var(--border-strong,rgba(255,255,255,.12)); border-radius:6px; color:var(--text-2,#A1A1AA); font-size:15px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-right:8px; flex-shrink:0; }
  .tema-btn:hover { background:rgba(128,128,128,.1); }

  /* ── RESPONSIVO ── */
  @media (max-width: 1024px) {
    .topbar-links a { font-size: 12px; padding: 5px 9px; }
  }
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; }
    .topbar-greeting { display: none !important; }
    .topbar-links { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .topbar-links a { font-size: 12px; padding: 5px 8px; white-space: nowrap; }
    .container { padding: 0 12px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    main { padding: 20px 12px !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .form-row { grid-template-columns: 1fr !important; }
    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .card { padding: 16px !important; }
    .page-header h1 { font-size: 18px !important; }
    .modal, .modal-content { border-radius: 0 !important; max-width: 100% !important; max-height: 100dvh !important; }
    .modal-overlay, .overlay { padding: 0 !important; align-items: flex-end !important; }
    table { font-size: 12px; min-width: 500px; }
    .table-wrap, .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  @media (max-width: 480px) {
    .topbar-logo { font-size: 13px; }
    .stats-grid { grid-template-columns: 1fr !important; }
    .stat-card { padding: 14px !important; }
    .btn, button { font-size: 12px; }
  }

  /* ── Mobile: evita auto-zoom iOS (inputs precisam de 16px) ── */
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<!-- Controles -->
<div class="controles">
  <div class="semana-nav">
    <button onclick="mudarSemana(-1)"><i data-lucide="chevron-left"></i></button>
    <span id="periodo-label">—</span>
    <button onclick="mudarSemana(1)"><i data-lucide="chevron-right"></i></button>

  <div class="filtros-tipo">

    <button class="filtro-btn" data-tipo="cabeamento">Cabeamento</button>
    <button class="filtro-btn" data-tipo="eletrica">Elétrica</button>
    <button class="filtro-btn" data-tipo="audio_video">Áudio e Vídeo</button>
    <button class="filtro-btn" data-tipo="automacao">Automação</button>
  </div>

  <div class="controles-acoes">
    <!-- Botão exportar agenda da semana para SharePoint -->
    <button class="btn-exportar-sp" id="btn-exportar-sp" onclick="exportarAgendaSharePoint()" title="Salvar PDF da semana no SharePoint">
      <i data-lucide="cloud-upload"></i>
      <span>Exportar → SharePoint</span>
    </button>

    <input type="date" id="data-dispatch" class="input-data-dispatch" title="Selecionar data para disparar vistorias">
    <button class="btn-whatsapp" id="btn-whatsapp" onclick="dispararAgendaWhatsapp()" title="Gerar imagem das vistorias do dia selecionado">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span>Disparar dia</span>
    </button>

    <button class="btn-bloqueio" onclick="abrirModalBloqueio()" title="Gerenciar bloqueios de vistoriadores">
      <i data-lucide="user-x"></i>
      Bloqueios
    </button>

    <button class="btn-novo" id="btn-novo" onclick="abrirModal()">
      <i data-lucide="plus"></i>
      Nova vistoria
    </button>
  </div>
</div>

<!-- Modal Bloqueio de Vistoriador -->
<div class="overlay" id="overlay-bloqueio-tec" style="display:none" onclick="if(event.target===this)fecharModalBloqueio()" role="presentation">
  <div class="modal" style="max-width:520px;max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px;display:flex;align-items:center;gap:8px"><i data-lucide="user-x"></i> Bloqueios de Vistoriadores</h2>
    <div id="bloqueios-lista"></div>
    <div style="border-top:1px solid var(--border);padding-top:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:12px">Novo bloqueio</div>
      <div class="form-group" style="margin-bottom:10px"><label>Vistoriador</label><select id="bl-tecnico"><option value="">Selecione...</option></select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="form-group" style="margin:0"><label>Data início</label><input type="date" id="bl-inicio"></div>
        <div class="form-group" style="margin:0"><label>Data fim</label><input type="date" id="bl-fim"></div>
      </div>
      <div class="form-group" style="margin-bottom:12px"><label>Motivo</label><input type="text" id="bl-motivo" placeholder="Ex.: Férias, Dispensa, Atestado..."></div>
      <div id="bl-erro" style="color:#f87171;font-size:12px;margin-bottom:8px;display:none"></div>
      <button onclick="salvarBloqueio()" style="width:100%;height:40px;background:var(--primary);border:none;border-radius:6px;color:#0A0A0A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Adicionar bloqueio</button>
    </div>
  </div>
</div>

<!-- Grade semanal -->
<div class="grade" id="grade">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <p>Carregando agenda...</p>
  </div>
</div>

<!-- Card oculto para geração de imagem -->
<div id="agenda-card"></div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-icon ok" id="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>
  <span id="toast-msg">Imagem copiada!</span>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="fecharModalFora(event)" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-icon">
        <i data-lucide="search" aria-hidden="true"></i>
      </div>
      <div class="modal-title" id="modal-titulo">Nova Vistoria</div>
    </div>

    <div id="modal-erro" role="alert" aria-live="assertive" style="display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:6px;padding:10px 14px;font-size:0.8rem;color:#f87171;margin-bottom:16px;"></div>

    <!-- OBRA -->
    <div class="form-section-label">Obra</div>

    <div class="form-group">
      <label for="f-obra">Obra / Cliente</label>
      <select id="f-obra">
        <option value="">Selecione a obra...</option>
      </select>
    </div>

    <!-- VISTORIADOR E TIPO -->
    <div class="form-section-label">Vistoria</div>

    <div class="form-row">
      <div class="form-group">
        <label for="f-vistoriador">Vistoriador</label>
        <select id="f-vistoriador" onchange="verificarBloqueioVistoriador(this.value)">
          <option value="">Selecione...</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-tipo">Tipo de vistoria</label>
        <select id="f-tipo">
          <option value="cabeamento">Cabeamento</option>
          <option value="eletrica">Elétrica</option>
          <option value="audio_video">Áudio e Vídeo</option>
          <option value="automacao">Automação</option>
        </select>
      </div>

    <!-- DATA E HORA -->
    <div class="form-section-label">Agendamento</div>

    <div class="form-row">
      <div class="form-group">
        <label for="f-data">Data</label>
        <input type="date" id="f-data"/>
      </div>
      <div class="form-group">
        <label for="f-hora">Hora início</label>
        <input type="time" id="f-hora"/>
      </div>
    </div>

    <div class="form-group">
      <label>Status</label>
      <div class="check-group">
        <label class="check-label">
          <input type="checkbox" id="f-confirmado"/>
          Confirmado
        </label>
        <label class="check-label">
          <input type="checkbox" id="f-viagem"/>
          Viagem
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="f-veiculo">Veículo (placa)</label>
      <input type="text" id="f-veiculo" placeholder="Ex: STRADA-TYR7C97"/>
    </div>

    <!-- OBSERVAÇÕES -->
    <div class="form-section-label">Detalhes</div>

    <div class="form-group">
      <label for="f-objetivo">Objetivo da vistoria</label>
      <textarea id="f-objetivo" placeholder="O que será avaliado nesta visita?"></textarea>
    </div>

    <div class="form-group">
      <label for="f-observacao">Observação</label>
      <textarea id="f-observacao" placeholder="Informações adicionais..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-excluir" id="btn-excluir" onclick="excluirVistoria()" style="display:none">
        <i data-lucide="trash-2" aria-hidden="true"></i>
        Excluir
      </button>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarVistoria()">
        <i data-lucide="save"></i>
        Salvar
      </button>
    </div>
  </div>
</div>

<script>

const ROLES_EDITAR = ['coordenador','supervisor','agendamento','projetista','gerente_comercial','coordenador_projetos'];

let semanaOffset    = 0;
let filtroTipo      = 'todas';
let vistorias       = [];
let jwtToken        = null;
let obras           = [];
let vistoriadores   = [];
let editandoId      = null;
let modoVisualizacao = false;
let diasBloqueados  = {}; // { 'YYYY-MM-DD': { id, motivo } }
let bloqueios       = []; // bloqueios de técnicos/vistoriadores
let roleAtual       = null;
const DIAS  = ['Segunda','Terça','Quarta','Quinta','Sexta'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const TIPO_INFO = {
  cabeamento:  { label: 'Cabeamento',    cor: '#d97706' },
  eletrica:    { label: 'Elétrica',      cor: '#2563eb' },
  audio_video: { label: 'Áudio e Vídeo', cor: '#7c3aed' },
  automacao:   { label: 'Automação',     cor: '#059669' },
};

// ── Init ────────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  jwtToken = session.access_token;

  const { data: eu } = await db.from('tecnicos').select('id, role, nome').eq('auth_user_id', session.user.id).single();
  roleAtual = eu?.role;
  modoVisualizacao = !ROLES_EDITAR.includes(roleAtual);

  renderTopbar(eu?.nome, roleAtual, 'agenda-vistorias');

  const podeDisparar = ['agendamento','coordenador','supervisor'].includes(roleAtual);

  if (modoVisualizacao) {
    const btnNovo = document.getElementById('btn-novo');
    if (btnNovo) btnNovo.style.display = 'none';
  }
  // Inicializa date picker com hoje
  const dpEl = document.getElementById('data-dispatch');
  if (dpEl) dpEl.value = fmtISO(new Date());

  if (podeDisparar) {
    const btnWa = document.getElementById('btn-whatsapp');
    if (btnWa) btnWa.style.display = 'inline-flex';
    if (dpEl) dpEl.style.display = 'inline-block';
    const btnSp = document.getElementById('btn-exportar-sp');
    if (btnSp) btnSp.style.display = 'inline-flex';
  } else {
    if (dpEl) dpEl.style.display = 'none';
  }

  await Promise.all([carregarObras(), carregarVistoriadores(), carregarBloqueios(), carregarDiasBloqueados()]);
  preencherSelects();
  await carregarVistorias();
}
// ── Datas ────────────────────────────────────────────────────────
function getSegunda(offset = 0) {
  const hoje = new Date();
  const dia  = hoje.getDay() || 7;
  const seg  = new Date(hoje);
  seg.setDate(hoje.getDate() - dia + 1 + offset * 7);
  seg.setHours(0,0,0,0);
  return seg;
}

function diasDaSemana(offset) {
  const seg = getSegunda(offset);
  return Array.from({length: 5}, (_, i) => {
    const d = new Date(seg);
    d.setDate(seg.getDate() + i);
    return d;
  });
}

function fmtISO(d) { return d.toISOString().split('T')[0]; }
function fmtBR(d)  { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }

function isHoje(d) {
  const h = new Date();
  return d.getDate()===h.getDate() && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
}

// ── Carregar dados ────────────────────────────────────────────────
async function carregarObras() {
  obras = await cachedQuery('av-obras', 300, async () => {
    const { data } = await db.from('obras').select('id, nome_cliente, endereco').order('nome_cliente');
    return data || [];
  });
}

async function carregarVistoriadores() {
  vistoriadores = await cachedQuery('av-vistoriadores', 600, async () => {
    const { data } = await db.from('tecnicos').select('id, nome').eq('role', 'vistoriador').order('nome');
    return data || [];
  });
}

async function carregarVistorias() {
  const dias = diasDaSemana(semanaOffset);
  const ini  = fmtISO(dias[0]);
  const fim  = fmtISO(dias[4]);

  document.getElementById('periodo-label').textContent =
    `${DIAS[0]}, ${fmtBR(dias[0])} — ${DIAS[4]}, ${fmtBR(dias[4])}`;

  const { data, error } = await db
    .from('agendamentos_vistoria')
    .select('*, obras(nome_cliente, endereco)')
    .gte('data', ini)
    .lte('data', fim)
    .order('hora_inicio');

  if (error) {
    document.getElementById('grade').innerHTML =
      `<div class="spinner-wrap"><p style="color:#f87171">Erro: ${error.message}</p></div>`;
    return;
  }

  vistorias = data || [];
  renderGrade(dias);
}

// ── Filtro ────────────────────────────────────────────────────────
function vistoriasVisiveis() {
  if (filtroTipo === 'todas') return vistorias;
  return vistorias.filter(v => v.tipo_vistoria === filtroTipo);
}

// ── Renderizar grade ──────────────────────────────────────────────
function renderGrade(dias) {
  const visiveis = vistoriasVisiveis();
  const grade    = document.getElementById('grade');

  grade.innerHTML = dias.map((dia, i) => {
    const dataStr  = fmtISO(dia);
    const vs       = visiveis.filter(v => v.data === dataStr);
    const bloqueio = diasBloqueados[dataStr] || null;
    const podeEditar = !modoVisualizacao;

    const cards = vs.length
      ? vs.map(cardHTML).join('')
      : `<div class="coluna-vazia">Sem vistorias</div>`;

    const lockBtn = podeEditar
      ? `<button class="btn-lock ${bloqueio?'ativo':''}" onclick="toggleBloqueioDia('${dataStr}')" title="${bloqueio?'Desbloquear dia':'Bloquear dia'}"><i data-lucide="${bloqueio?'lock':'lock-open'}"></i></button>`
      : '';

    return `
      <div class="coluna ${bloqueio ? 'bloqueada' : ''}">
        <div class="coluna-header">
          <div style="min-width:0;flex:1">
            <div class="dia-nome">${DIAS[i]}</div>
            <div class="dia-data ${isHoje(dia) ? 'hoje' : ''}">${fmtBR(dia)}</div>
            ${bloqueio ? `<div class="bloqueio-tag" title="${escHtml(bloqueio.motivo)}">🔒 ${escHtml(bloqueio.motivo)}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
            ${lockBtn}
            ${podeEditar ? `<button class="btn-add" onclick="abrirModal('${dataStr}')" title="Nova vistoria"><i data-lucide="plus"></i></button>` : ''}
          </div>
        </div>
        <div class="coluna-body">${cards}</div>
      </div>`;
  }).join('');

  lucide.createIcons();
}

// ── Card de vistoria ──────────────────────────────────────────────
function cardHTML(v) {
  const tipo  = v.tipo_vistoria || 'cabeamento';
  const info  = TIPO_INFO[tipo] || { label: tipo };
  const nome  = vistoriadorNome(v.vistoriador_id);
  const cliente = v.obras?.nome_cliente || '—';
  const hora  = v.hora_inicio ? v.hora_inicio.slice(0,5) : '';
  const statusClass = v.confirmado ? 'confirmado' : (v.viagem ? 'viagem' : 'nao_confirmado');
  const statusLabel = v.confirmado ? 'Confirmado' : (v.viagem ? 'Viagem' : 'Não confirmado');

  return `
    <div class="card-vis card-${tipo}" ${modoVisualizacao ? 'style="cursor:default"' : `onclick="editarVistoria(${v.id})" style="cursor:pointer"`}>
      <div class="ag-tecs">${escHtml(hora ? hora + ' · ' : '')}${escHtml(nome)}</div>
      <div class="ag-cliente">${escHtml(cliente)}</div>
      ${v.veiculo ? `<div class="ag-detalhe"><i data-lucide="car"></i>${escHtml(v.veiculo)}</div>` : ''}
      <br>
      <span class="ag-badge badge-tipo-${escHtml(tipo)}">${escHtml(info.label)}</span>
      <span class="ag-badge badge-${statusClass}" style="margin-left:4px">${escHtml(statusLabel)}</span>
    </div>`;
}

function vistoriadorNome(id) {
  const v = vistoriadores.find(v => v.id === id);
  return v ? v.nome : '—';
}

// ── Navegação de semana ───────────────────────────────────────────
function mudarSemana(delta) {
  semanaOffset += delta;
  carregarVistorias();
}

// ── Preencher selects ─────────────────────────────────────────────
function preencherSelects() {
  const selObra = document.getElementById('f-obra');
  selObra.innerHTML = '<option value="">Selecione a obra...</option>';
  obras.forEach(o => {
    const opt = document.createElement('option');
    opt.value       = String(o.id);
    opt.textContent = o.nome_cliente;
    selObra.appendChild(opt);
  });

  const selVist = document.getElementById('f-vistoriador');
  selVist.innerHTML = '<option value="">Selecione...</option>';
  vistoriadores.forEach(v => {
    const opt = document.createElement('option');
    opt.value       = String(v.id);
    opt.textContent = v.nome;
    selVist.appendChild(opt);
  });
}

// ── Abrir modal (novo) ────────────────────────────────────────────
function abrirModal(data = '') {
  editandoId = null;

  if (!obras.length || !vistoriadores.length) {
    Promise.all([carregarObras(), carregarVistoriadores()]).then(preencherSelects);
  }

  document.getElementById('modal-titulo').textContent  = 'Nova Vistoria';
  document.getElementById('modal-erro').style.display  = 'none';
  document.getElementById('f-obra').value              = '';
  document.getElementById('f-vistoriador').value       = '';
  document.getElementById('f-tipo').value              = 'cabeamento';
  document.getElementById('f-data').value              = data || fmtISO(new Date());
  document.getElementById('f-hora').value              = '';
  document.getElementById('f-confirmado').checked      = false;
  document.getElementById('f-viagem').checked          = false;
  document.getElementById('f-veiculo').value           = '';
  document.getElementById('f-objetivo').value          = '';
  document.getElementById('f-observacao').value        = '';
  document.getElementById('btn-excluir').style.display = 'none';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Abrir modal (editar) ──────────────────────────────────────────
function editarVistoria(id) {
  const v = vistorias.find(x => x.id === id);
  if (!v) return;
  editandoId = id;

  document.getElementById('modal-titulo').textContent  = 'Editar Vistoria';
  document.getElementById('modal-erro').style.display  = 'none';
  document.getElementById('f-obra').value              = v.obra_id ? String(v.obra_id) : '';
  document.getElementById('f-vistoriador').value       = v.vistoriador_id ? String(v.vistoriador_id) : '';
  document.getElementById('f-tipo').value              = v.tipo_vistoria   || 'cabeamento';
  document.getElementById('f-data').value              = v.data            || '';
  document.getElementById('f-hora').value              = v.hora_inicio     ? v.hora_inicio.slice(0,5) : '';
  document.getElementById('f-confirmado').checked      = !!v.confirmado;
  document.getElementById('f-viagem').checked          = !!v.viagem;
  document.getElementById('f-veiculo').value           = v.veiculo         || '';
  document.getElementById('f-objetivo').value          = v.objetivo        || '';
  document.getElementById('f-observacao').value        = v.observacao      || '';
  document.getElementById('btn-excluir').style.display = 'flex';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Fechar modal ──────────────────────────────────────────────────
function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
  editandoId = null;
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('overlay')) fecharModal();
}

// ── Salvar vistoria ───────────────────────────────────────────────
async function salvarVistoria() {
  if (modoVisualizacao) return;

  const btn    = document.getElementById('btn-salvar');
  const erroEl = document.getElementById('modal-erro');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  erroEl.style.display = 'none';

  const obraId      = document.getElementById('f-obra').value;
  const vistoriadorId = document.getElementById('f-vistoriador').value;
  const tipo        = document.getElementById('f-tipo').value;
  const data        = document.getElementById('f-data').value;
  const hora        = document.getElementById('f-hora').value;
  const confirmado  = document.getElementById('f-confirmado').checked;
  const viagem      = document.getElementById('f-viagem').checked;
  const veiculo     = document.getElementById('f-veiculo').value.trim();
  const objetivo    = document.getElementById('f-objetivo').value.trim();
  const observacao  = document.getElementById('f-observacao').value.trim();

  function mostrarErro(msg) {
    erroEl.textContent   = msg;
    erroEl.style.display = 'block';
    btn.disabled         = false;
    btn.innerHTML        = '<i data-lucide="save"></i> Salvar';
    lucide.createIcons();
  }

  if (!obraId)        { mostrarErro('Selecione a obra.'); return; }
  if (!vistoriadorId) { mostrarErro('Selecione o vistoriador.'); return; }
  if (!data)          { mostrarErro('Selecione a data.'); return; }

  const payload = {
    obra_id:        parseInt(obraId),
    vistoriador_id: parseInt(vistoriadorId),
    tipo_vistoria:  tipo,
    data,
    hora_inicio:    hora || null,
    confirmado,
    viagem,
    veiculo:        veiculo  || null,
    objetivo:       objetivo || null,
    observacao:     observacao || null,
  };

  let savedId = editandoId;

  if (editandoId) {
    const { error } = await db.from('agendamentos_vistoria').update(payload).eq('id', editandoId);
    if (error) { mostrarErro('Erro ao salvar: ' + error.message); return; }
  } else {
    const { data: novo, error } = await db.from('agendamentos_vistoria').insert(payload).select('id').single();
    if (error) { mostrarErro('Erro ao salvar: ' + error.message); return; }
    savedId = novo.id;

    // Auto-criar relatório de vistoria
    await db.from('relatorios_vistoria').insert({
      agendamento_vistoria_id: savedId,
      obra_id:                 payload.obra_id,
      vistoriador_id:          payload.vistoriador_id,
      data_vistoria:           payload.data,
      tipo_vistoria:           payload.tipo_vistoria,
      status:                  'pendente',
      objetivo_vistoria:       payload.objetivo || null,
    });
  }

  fecharModal();
  await carregarVistorias();

  btn.disabled  = false;
  btn.innerHTML = '<i data-lucide="save"></i> Salvar';
  lucide.createIcons();
}

// ── Excluir vistoria ──────────────────────────────────────────────
async function excluirVistoria() {
  if (!editandoId) return;
  confirmModal('Excluir esta vistoria e o relatório vinculado?', async () => {

  // Apagar relatórios de vistoria pendentes vinculados
  await db.from('relatorios_vistoria')
    .delete()
    .eq('agendamento_vistoria_id', editandoId)
    .eq('status', 'pendente');

  const { error } = await db.from('agendamentos_vistoria').delete().eq('id', editandoId);
  if (error) { showToast('Erro ao excluir: ' + error.message, 'error'); return; }
  fecharModal();
  await carregarVistorias();
  }); // confirmModal
}

let toastTimer = null;
function mostrarToast(msg, tipo = 'ok') {
  const el   = document.getElementById('toast');
  const icon = document.getElementById('toast-icon');
  document.getElementById('toast-msg').textContent = msg;
  icon.className = `toast-icon ${tipo}`;
  icon.innerHTML = tipo === 'ok'
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  el.classList.add('visivel');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visivel'), 4500);
}

// ── Disparar agenda de vistorias como imagem ──────────────────────
// ── Helpers de imagem ─────────────────────────────────────────
async function carregarImgBase64(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise(ok => {
      const reader = new FileReader();
      reader.onloadend = () => ok(reader.result);
      reader.onerror  = () => ok(null);
      reader.readAsDataURL(blob);
    });
  } catch { return null; }
}
async function carregarLogoBase64Branco(url) {
  const b64 = await carregarImgBase64(url);
  if (!b64) return null;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      ctx.globalCompositeOperation = 'source-in';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, c.width, c.height);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => resolve(null);
    img.src = b64;
  });
}

async function dispararAgendaWhatsapp() {

    return;
  }

  const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const dObj     = new Date(hoje + 'T12:00');

  const SURF   = '#161B22';

  const GOLD   = '#C4A882';
  const T1     = '#F0F6FC';
  const T2     = '#8B949E';
  const T3     = '#484F58';

      v.veiculo  ? `Veículo: ${escHtml(v.veiculo)}`  : '',

      <div style="display:flex;align-items:baseline;gap:13px;">

  } finally {
    btn.style.opacity = ''; btn.style.pointerEvents = '';
    if (span) span.textContent = 'Disparar dia';

// ── Exportar agenda de vistorias da semana para SharePoint ────────
async function exportarAgendaSharePoint() {
  const btn = document.getElementById('btn-exportar-sp');
  if (!jwtToken) { mostrarToast('Sessão expirada, recarregue a página.', 'err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2"></i><span>Gerando PDF...</span>';
  lucide.createIcons();

  try {
    const dias = diasDaSemana(semanaOffset); // 5 dias: seg–sex
    const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                      'agosto','setembro','outubro','novembro','dezembro'];
    const DIAS_PT  = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira'];

    const d0 = dias[0], d4 = dias[dias.length - 1];
    const mesNome    = MESES_PT[d0.getMonth()];
    const mesNomeCap = mesNome[0].toUpperCase() + mesNome.slice(1);
    const ano        = d0.getFullYear();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });

    // ── Cabeçalho ──
    doc.setFontSize(16); doc.setFont('helvetica', 'bold');
    doc.text(`Agenda de Vistorias — ${d0.getDate()} a ${d4.getDate()} de ${mesNomeCap} ${ano}`, 12, 16);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')}  ·  ${vistorias.length} vistoria(s)`, 12, 22);

    let yPos = 28;

    for (let i = 0; i < dias.length; i++) {
      const dia     = dias[i];
      const dataStr = fmtISO(dia);
      const vs      = vistorias.filter(v => v.data === dataStr);

      if (yPos > 162) { doc.addPage(); yPos = 14; }

      doc.setFillColor(20, 20, 20);
      doc.rect(12, yPos - 5, 249, 8, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      doc.setTextColor(103, 232, 249); // ciano para vistorias
      doc.text(
        `${DIAS_PT[i]}  —  ${String(dia.getDate()).padStart(2,'0')}/${String(dia.getMonth()+1).padStart(2,'0')}/${ano}`,
        14, yPos
      );
      doc.setTextColor(0, 0, 0);
      yPos += 5;

      if (!vs.length) {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
        doc.setTextColor(150, 150, 150);
        doc.text('Sem vistorias', 16, yPos + 5);
        doc.setTextColor(0, 0, 0);
        yPos += 12;
        continue;
      }

      doc.autoTable({
        startY: yPos + 2,
        head: [['Horário', 'Cliente / Endereço', 'Vistoriador', 'Tipo', 'Status']],
        body: vs.map(v => {
          const cliente = v.obras?.nome_cliente || '—';
          const end     = v.obras?.endereco || '';
          const tipo    = TIPO_INFO[v.tipo_vistoria]?.label || v.tipo_vistoria || '—';
          const status  = v.confirmado ? 'Confirmado' : (v.viagem ? 'Viagem' : 'Não confirmado');
          return [
            v.hora_inicio?.slice(0,5) || '—',
            end ? `${cliente}\n${end}` : cliente,
            vistoriadorNome(v.vistoriador_id),
            tipo,
            status,
          ];
        }),
        styles:             { fontSize: 7.5, cellPadding: 2, overflow: 'linebreak', valign: 'top' },
        headStyles:         { fillColor: [35, 35, 35], textColor: [240, 240, 240], fontStyle: 'bold', fontSize: 7 },
        alternateRowStyles: { fillColor: [248, 248, 248] },
        columnStyles: {
          0: { cellWidth: 18 }, 1: { cellWidth: 85 },
          2: { cellWidth: 65 }, 3: { cellWidth: 55 }, 4: { cellWidth: 26 },
        },
        margin:         { left: 12, right: 12 },
        tableLineColor: [220, 220, 220],
        tableLineWidth: 0.1,
      });

      yPos = doc.lastAutoTable.finalY + 6;
    }

    const pdfBlob = doc.output('blob');

    btn.innerHTML = '<i data-lucide="cloud-upload"></i><span>Enviando...</span>';
    lucide.createIcons();

    const nomeSemana = `${d0.getDate()} a ${d4.getDate()} de ${mesNome} ${ano}`;
    const pasta      = `Agenda Tecnica/${ano}/${mesNomeCap}`;
    const arquivo    = `Vistorias ${nomeSemana}.pdf`;

    const initRes = await fetch('/api/upload', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwtToken}` },
      body:    JSON.stringify({ path: pasta, filename: arquivo, contentType: 'application/pdf' }),
    });
    if (!initRes.ok) {
      const err = await initRes.json().catch(() => ({}));
      throw new Error(err.error || `Erro ${initRes.status}`);
    }

    const { uploadUrl } = await initRes.json();
    const putRes = await fetch(uploadUrl, {
      method:  'PUT',
      headers: { 'Content-Type': 'application/pdf', 'Content-Range': `bytes 0-${pdfBlob.size - 1}/${pdfBlob.size}` },
      body:    pdfBlob,
    });
    if (!putRes.ok && putRes.status !== 201 && putRes.status !== 200)
      throw new Error(`Upload falhou: ${putRes.status}`);

    mostrarToast(`✅ Vistorias salvas: "${arquivo}"`, 'ok');

  } catch (e) {
    console.error('[exportarAgendaSharePoint]', e);
    mostrarToast('Erro ao exportar: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="cloud-upload"></i><span>Exportar → SharePoint</span>';
    lucide.createIcons();
  }
}

async function carregarBloqueios() {
  const { data } = await db.from('tecnico_bloqueios').select('*').order('data_inicio');
  bloqueios = data || [];
}
function tecnicoBloqueadoNaData(tecnicoId, dataStr) {
  if (!dataStr) return null;
  return bloqueios.find(b =>
    String(b.tecnico_id) === String(tecnicoId) &&
    dataStr >= b.data_inicio && dataStr <= b.data_fim
  ) || null;
}
function abrirModalBloqueio() {
  const sel = document.getElementById('bl-tecnico');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    vistoriadores.map(t => `<option value="${t.id}">${escHtml(t.nome)}</option>`).join('');
  renderBloqueiosLista();
  document.getElementById('overlay-bloqueio-tec').style.display = 'flex';
  lucide.createIcons();
}
function fecharModalBloqueio() { document.getElementById('overlay-bloqueio-tec').style.display = 'none'; }
function renderBloqueiosLista() {
  const el = document.getElementById('bloqueios-lista');
  if (!bloqueios.length) { el.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:8px 0 16px">Nenhum bloqueio cadastrado.</div>'; return; }
  const fmt = d => new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  el.innerHTML = bloqueios.map(b => {
    const tec = vistoriadores.find(t => t.id === b.tecnico_id);
    return `<div class="bloqueio-item">
      <div style="flex:1;min-width:0">
        <div class="bloqueio-nome">${escHtml(tec?.nome||'—')}</div>
        <div class="bloqueio-info">${fmt(b.data_inicio)} → ${fmt(b.data_fim)}</div>
        <div class="bloqueio-motivo">${escHtml(b.motivo)}</div>
      </div>
      <button class="bloqueio-del" onclick="excluirBloqueio(${b.id})"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
    </div>`;
  }).join('');
  lucide.createIcons();
}
async function salvarBloqueio() {
  const tecId=document.getElementById('bl-tecnico').value, inicio=document.getElementById('bl-inicio').value, fim=document.getElementById('bl-fim').value, motivo=document.getElementById('bl-motivo').value.trim(), erroEl=document.getElementById('bl-erro');
  if(!tecId||!inicio||!fim||!motivo){erroEl.textContent='Preencha todos os campos.';erroEl.style.display='block';return;}
  if(fim<inicio){erroEl.textContent='Data fim deve ser igual ou posterior à data início.';erroEl.style.display='block';return;}
  erroEl.style.display='none';
  const{data,error}=await db.from('tecnico_bloqueios').insert({tecnico_id:parseInt(tecId),data_inicio:inicio,data_fim:fim,motivo}).select().single();
  if(error){erroEl.textContent='Erro: '+error.message;erroEl.style.display='block';return;}
  bloqueios.push(data);
  document.getElementById('bl-tecnico').value='';document.getElementById('bl-inicio').value='';document.getElementById('bl-fim').value='';document.getElementById('bl-motivo').value='';
  renderBloqueiosLista();
}
async function excluirBloqueio(id) {
  const{error}=await db.from('tecnico_bloqueios').delete().eq('id',id);
  if(!error){bloqueios=bloqueios.filter(b=>b.id!==id);renderBloqueiosLista();}
}
async function verificarBloqueioVistoriador(idStr) {
  const dataAg = document.getElementById('f-data')?.value;
  if (!idStr || !dataAg) return;
  const bloq = tecnicoBloqueadoNaData(idStr, dataAg);
  if (bloq) {
    await alertModal('Vistoriador bloqueado', `Este vistoriador não está disponível nesta data.\nMotivo: ${bloq.motivo}`, 'aviso');
    document.getElementById('f-vistoriador').value = '';
  }
}

// ── DIAS BLOQUEADOS ──────────────────────────────────────────────
function calcularPascoa(ano) {
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(ano,mes-1,dia);
}
function feriadosNacionais(ano) {
  const f=[], iso=d=>d.toISOString().slice(0,10), add=(d,m)=>f.push({data:d,motivo:m}), fx=(m,d,n)=>add(`${ano}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n);
  fx(1,1,'Feriado Nacional: Confraternização Universal');fx(4,21,'Feriado Nacional: Tiradentes');fx(5,1,'Feriado Nacional: Dia do Trabalho');fx(9,7,'Feriado Nacional: Independência do Brasil');fx(10,12,'Feriado Nacional: Nossa Senhora Aparecida');fx(11,2,'Feriado Nacional: Finados');fx(11,15,'Feriado Nacional: Proclamação da República');fx(11,20,'Feriado Nacional: Consciência Negra');fx(12,25,'Feriado Nacional: Natal');
  const p=calcularPascoa(ano);
  add(iso(new Date(p-47*864e5)),'Feriado Nacional: Carnaval (Segunda)');add(iso(new Date(p-46*864e5)),'Feriado Nacional: Carnaval (Terça)');add(iso(new Date(p-2*864e5)),'Feriado Nacional: Sexta-feira Santa');add(iso(p),'Feriado Nacional: Páscoa');add(iso(new Date(p.getTime()+60*864e5)),'Feriado Nacional: Corpus Christi');
  return f;
}
async function carregarDiasBloqueados() {
  const ano = new Date().getFullYear();
  const { data } = await db.from('dias_bloqueados').select('*');
  diasBloqueados = {};
  (data||[]).forEach(d=>{ diasBloqueados[d.data]=d; });
  for (const y of [ano,ano+1]) {
    for (const f of feriadosNacionais(y)) {
      if (!diasBloqueados[f.data]) {
        const {data:ins}=await db.from('dias_bloqueados').insert({data:f.data,motivo:f.motivo}).select().single();
        if(ins) diasBloqueados[ins.data]=ins;
      }
    }
  }
}
async function toggleBloqueioDia(dataStr) {
  if (diasBloqueados[dataStr]) {
    const {error}=await db.from('dias_bloqueados').delete().eq('id',diasBloqueados[dataStr].id);
    if(!error){delete diasBloqueados[dataStr];renderGrade(diasDaSemana(semanaOffset));}
  } else {
    const motivo=prompt('Motivo do bloqueio:');
    if(!motivo?.trim()) return;
    const {data,error}=await db.from('dias_bloqueados').insert({data:dataStr,motivo:motivo.trim()}).select().single();
    if(!error&&data){diasBloqueados[dataStr]=data;renderGrade(diasDaSemana(semanaOffset));}
  }
}
