<!DOCTYPE html>
<!-- build: 2026-05-31h -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendências — Solução Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0A;--surface-1:#111111;--surface-2:#161616;--surface-3:#1B1B1B;
  --primary:#3ECF8E;--text-1:#FFFFFF;--text-2:#A1A1AA;--text-3:#52525B;
  --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.12);--border-hover:rgba(255,255,255,0.16);
  --amber:#F59E0B;--amber-text:#FCD34D;--red:#EF4444;--red-text:#F87171;--radius:8px;
}
:root[data-theme="light"]{
  --bg:#F4F4F5;--surface-1:#FFFFFF;--surface-2:#FAFAFA;--surface-3:#F0F0F1;
  --text-1:#09090B;--text-2:#71717A;--text-3:#A1A1AA;
  --border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.14);--border-hover:rgba(0,0,0,0.16);
  --amber-text:#B45309;--red-text:#B91C1C;
}
@media(prefers-color-scheme:light){:root[data-theme="auto"]{
  --bg:#F4F4F5;--surface-1:#FFFFFF;--surface-2:#FAFAFA;--surface-3:#F0F0F1;
  --text-1:#09090B;--text-2:#71717A;--text-3:#A1A1AA;
  --border:rgba(0,0,0,0.08);--border-strong:rgba(0,0,0,0.14);--border-hover:rgba(0,0,0,0.16);
  --amber-text:#B45309;--red-text:#B91C1C;
}}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── Topbar ── */
.topbar{background:var(--surface-1);border-bottom:1px solid var(--border);height:56px;padding:0 24px;display:flex;align-items:center;position:sticky;top:0;z-index:100;gap:12px}
.topbar-logo{font-size:15px;font-weight:700;color:var(--text-1);letter-spacing:-.2px;flex:1}
.topbar-greeting{font-size:13px;color:var(--text-2)}
.topbar-links{display:flex;align-items:center;gap:4px}
.topbar-links a{color:var(--text-2);text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:6px;transition:color .15s,background .15s}
.topbar-links a:hover{color:var(--text-1);background:rgba(255,255,255,0.06)}
.topbar-links a.active{color:var(--text-1);background:rgba(255,255,255,0.07)}
.topbar-links a.nav-sair{color:var(--text-2);border:1px solid rgba(255,255,255,0.12);margin-left:8px}
.topbar-links a.nav-sair:hover{color:var(--text-1)}
.tema-btn{background:transparent;border:1px solid var(--border-strong);border-radius:6px;color:var(--text-2);font-size:15px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tema-btn:hover{background:rgba(128,128,128,.1)}

/* ── Page ── */
.page{max-width:1160px;margin:0 auto;padding:28px 24px 64px}

/* ── Page header ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-title i{width:20px;height:20px;color:var(--amber-text)}
.btn-cadastrar{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:var(--primary);border:none;border-radius:var(--radius);color:#0A0A0A;font-size:0.85rem;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .15s,transform .15s;white-space:nowrap}
.btn-cadastrar:hover{opacity:.88;transform:translateY(-1px)}
.btn-cadastrar i{width:15px;height:15px}

/* ── Tabs de equipe ── */
.tabs-equipe{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.tab-btn{padding:6px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:0.8rem;font-weight:500;cursor:pointer;font-family:inherit;transition:all 150ms;display:flex;align-items:center;gap:6px}
.tab-btn:hover{border-color:var(--border-hover);color:var(--text-1)}
.tab-btn.ativo{font-weight:600}
.tab-btn .tab-count{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.06)}
.tab-cab.ativo{background:rgba(29,78,216,.12);border-color:rgba(29,78,216,.35);color:#93C5FD}
.tab-ele.ativo{background:rgba(180,83,9,.12);border-color:rgba(180,83,9,.35);color:#FCD34D}
.tab-aud.ativo{background:rgba(109,40,217,.12);border-color:rgba(109,40,217,.35);color:#C4B5FD}
.tab-aut.ativo{background:rgba(6,95,70,.12);border-color:rgba(6,95,70,.35);color:#6EE7B7}
.tab-reg.ativo{background:rgba(159,18,57,.12);border-color:rgba(159,18,57,.35);color:#FDA4AF}
.tab-all.ativo{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3);color:var(--primary)}

/* ── Filtros bar ── */
.filtros-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.filtro-st{padding:5px 13px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:0.78rem;font-weight:500;cursor:pointer;font-family:inherit;transition:all 150ms}
.filtro-st:hover{border-color:var(--border-hover);color:var(--text-1)}
.filtro-st.ativo{background:rgba(255,255,255,.07);border-color:var(--border-hover);color:var(--text-1)}
.busca-wrap{flex:1;min-width:180px;max-width:280px;position:relative}
.busca-wrap input{width:100%;padding:7px 10px 7px 34px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-1);font-family:inherit;font-size:0.82rem;outline:none;transition:border-color 150ms}
.busca-wrap input:focus{border-color:var(--border-hover)}
.busca-wrap input::placeholder{color:var(--text-3)}
.busca-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}

/* ── Tabela de pendências ── */
.lista-grid{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.pend-table{width:100%;border-collapse:collapse;font-size:12.5px}
.pend-table thead{background:var(--bg)}
.pend-table th{padding:7px 12px;text-align:left;font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.pend-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;line-height:1.3}
.pend-table tr:last-child td{border-bottom:none}
.pend-table tbody tr:hover td{background:rgba(255,255,255,.02)}
.pend-table tbody tr.urgente td:first-child{border-left:3px solid var(--red)}
.pend-table tbody tr.resolvida{opacity:.45}
.td-obra{font-weight:600;color:var(--text-1);max-width:200px;font-size:12.5px}
.td-desc{color:var(--text-2);font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-meta{color:var(--text-3);font-size:11px;white-space:nowrap}
.pend-data-marcada{font-size:10px;font-weight:600;color:var(--primary);background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.2);border-radius:4px;padding:1px 6px;white-space:nowrap;display:inline-block;margin-top:2px}
.card-equipe-row{display:flex;flex-wrap:wrap;gap:3px}
.card-meta{font-size:11px;color:var(--text-3)}

/* Badges de status */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge-aberta{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:var(--amber-text)}
.badge-pendencia_cliente{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red-text)}
.badge-pendencia_solucao{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);color:#A5B4FC}
.badge-resolvida{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.25);color:var(--primary)}
.badge-urgente{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:var(--red-text);font-size:10px}
.badge-equipe{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px}

/* Ações inline */
.td-acoes{white-space:nowrap;text-align:right}
.btn-st{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-2);font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 150ms}
.btn-st:hover{border-color:var(--border-hover);color:var(--text-1)}
.btn-st.active-resolvida{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3);color:var(--primary)}
.btn-st.active-pendencia_cliente{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--red-text)}
.btn-st.active-pendencia_solucao{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.3);color:#A5B4FC}
.btn-st i{width:11px;height:11px}
.btn-excluir{display:inline-flex;align-items:center;padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-3);font-size:11px;font-family:inherit;cursor:pointer;transition:all 150ms}
.btn-excluir:hover{color:var(--red-text);border-color:rgba(239,68,68,.3)}
.btn-excluir i{width:11px;height:11px}

/* ── Empty / loading ── */
.empty-state{text-align:center;padding:64px 24px;color:var(--text-3)}
.empty-state i{width:38px;height:38px;margin:0 auto 14px;display:block;opacity:.4}
.spinner-wrap{text-align:center;padding:48px}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-1);border:1px solid var(--border-strong);border-radius:8px;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:9px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.visivel{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Overlay / Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;backdrop-filter:blur(4px)}
.modal-pend{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:12px;padding:28px;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto}
.modal-pend h2{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-pend h2 i{width:18px;height:18px;color:var(--primary)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);margin-bottom:6px}
.form-group select,.form-group input,.form-group textarea{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text-1);font-family:inherit;font-size:0.85rem;outline:none;transition:border-color 150ms;appearance:none}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{border-color:rgba(62,207,142,.4)}
.form-group select option{background:var(--surface-2)}
.form-group textarea{resize:vertical;min-height:88px;line-height:1.55}
.toggle-urgente{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;transition:border-color 150ms}
.toggle-urgente:hover{border-color:var(--border-hover)}
.toggle-urgente input{accent-color:var(--red);width:16px;height:16px}
.toggle-urgente span{font-size:13px;color:var(--text-2);font-weight:500}
.toggle-urgente strong{color:var(--red-text)}
.modal-footer{display:flex;gap:10px;margin-top:20px}
.btn-salvar{flex:1;height:42px;background:var(--primary);border:none;border-radius:6px;color:#0A0A0A;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .15s}
.btn-salvar:hover{opacity:.88}
.btn-salvar:disabled{opacity:.45;cursor:not-allowed}
.btn-cancelar{padding:0 18px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-family:inherit;font-size:14px;cursor:pointer;transition:border-color .15s}
.btn-cancelar:hover{border-color:var(--border-hover);color:var(--text-1)}
.erro-form{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:6px;padding:9px 13px;font-size:12px;color:var(--red-text);margin-bottom:14px;display:none}

/* ── Checkbox equipe no modal ── */
.equipe-check-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;padding:5px 10px;border:1px solid var(--border);border-radius:6px;transition:border-color 120ms,background 120ms}
.equipe-check-label:hover{border-color:var(--border-hover);color:var(--text-1)}
.equipe-check-label input[type=checkbox]{accent-color:var(--primary);width:14px;height:14px;cursor:pointer;flex-shrink:0}
.equipe-check-label:has(input:checked){border-color:var(--primary);background:rgba(62,207,142,.08);color:var(--text-1)}

/* ── Cores de equipe nos badges ── */
.eq-cabeamento{background:rgba(29,78,216,.12);border:1px solid rgba(29,78,216,.25);color:#93C5FD}
.eq-eletrica{background:rgba(180,83,9,.12);border:1px solid rgba(180,83,9,.25);color:#FCD34D}
.eq-audio_video{background:rgba(109,40,217,.12);border:1px solid rgba(109,40,217,.25);color:#C4B5FD}
.eq-automacao{background:rgba(6,95,70,.12);border:1px solid rgba(6,95,70,.25);color:#6EE7B7}
.eq-regional_norte{background:rgba(159,18,57,.12);border:1px solid rgba(159,18,57,.25);color:#FDA4AF}

/* ── Responsive ── */
@media(max-width:768px){
  .topbar{padding:0 12px} .topbar-greeting{display:none}
  .topbar-links{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .topbar-links a{font-size:12px;padding:5px 8px;white-space:nowrap}
  .page{padding:16px 12px 48px}
  .lista-grid{grid-template-columns:1fr}
  .tabs-equipe{gap:4px}
  .tab-btn{font-size:0.75rem;padding:5px 11px}
}
@media(max-width:480px){
  .topbar-logo{font-size:13px}
  .page-header{flex-direction:column;align-items:flex-start}
  .btn-cadastrar{width:100%;justify-content:center}
}

  /* ── Mobile: evita auto-zoom iOS (inputs precisam de 16px) ── */
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">
      <i data-lucide="clipboard-list"></i>
      Pendências
      <span id="badge-total" style="font-size:12px;padding:2px 8px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.2);border-radius:999px;color:var(--amber-text);font-weight:700">0</span>
    </h1>
    <button class="btn-cadastrar" onclick="abrirModal()">
      <i data-lucide="plus"></i>
      Cadastrar Pendência
    </button>
  </div>

  <!-- Tabs por equipe -->
  <div class="tabs-equipe">
    <button class="tab-btn tab-all ativo" data-eq="todas" onclick="setEquipe(this,'todas')">
      Todas <span class="tab-count" id="ct-todas">0</span>
    </button>
    <button class="tab-btn tab-cab" data-eq="cabeamento" onclick="setEquipe(this,'cabeamento')">
      Cabeamento <span class="tab-count" id="ct-cabeamento">0</span>
    </button>
    <button class="tab-btn tab-ele" data-eq="eletrica" onclick="setEquipe(this,'eletrica')">
      Elétrica <span class="tab-count" id="ct-eletrica">0</span>
    </button>
    <button class="tab-btn tab-aud" data-eq="audio_video" onclick="setEquipe(this,'audio_video')">
      Áudio e Vídeo <span class="tab-count" id="ct-audio_video">0</span>
    </button>
    <button class="tab-btn tab-aut" data-eq="automacao" onclick="setEquipe(this,'automacao')">
      Automação <span class="tab-count" id="ct-automacao">0</span>
    </button>
    <button class="tab-btn tab-reg" data-eq="regional_norte" onclick="setEquipe(this,'regional_norte')">
      Regional Norte <span class="tab-count" id="ct-regional_norte">0</span>
    </button>
  </div>

  <!-- Filtros -->
  <div class="filtros-bar">
    <button class="filtro-st ativo" data-st="todos" onclick="setStatus(this,'todos')">Todos</button>
    <button class="filtro-st" data-st="aberta" onclick="setStatus(this,'aberta')">Em aberto</button>
    <button class="filtro-st" data-st="pendencia_cliente" onclick="setStatus(this,'pendencia_cliente')">Pendência cliente</button>
    <button class="filtro-st" data-st="pendencia_solucao" onclick="setStatus(this,'pendencia_solucao')">Pendência Solução</button>
    <button class="filtro-st" data-st="resolvida" onclick="setStatus(this,'resolvida')">Resolvidas</button>
    <div class="busca-wrap">
      <i data-lucide="search" class="busca-icon" style="width:14px;height:14px"></i>
      <input type="text" id="busca" placeholder="Buscar obra, descrição..." oninput="if(!this._dFn)this._dFn=debounce(renderLista);this._dFn()">
    </div>
  </div>

  <!-- Lista -->
  <div class="lista-grid" id="lista-pend">
    <div class="spinner-wrap"><div class="spinner"></div><p style="font-size:13px;color:var(--text-3)">Carregando...</p></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toast-msg"></span>
</div>

<!-- Modal cadastro/edição -->
<div class="overlay" id="overlay-modal" style="display:none" onclick="fecharModalFora(event)" role="presentation">
  <div class="modal-pend" id="modal-pend" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <h2><i data-lucide="clipboard-list" aria-hidden="true"></i> <span id="modal-titulo">Cadastrar Pendência</span></h2>

    <div class="erro-form" id="erro-form"></div>

    <div class="form-group">
      <label>Equipe(s) <span style="font-size:11px;color:var(--text-3);font-weight:400">(selecione uma ou mais)</span></label>
      <div id="f-equipes-wrap" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
        <label class="equipe-check-label"><input type="checkbox" value="cabeamento"> Cabeamento</label>
        <label class="equipe-check-label"><input type="checkbox" value="eletrica"> Elétrica</label>
        <label class="equipe-check-label"><input type="checkbox" value="audio_video"> Áudio e Vídeo</label>
        <label class="equipe-check-label"><input type="checkbox" value="automacao"> Automação</label>
        <label class="equipe-check-label"><input type="checkbox" value="regional_norte"> Regional Norte</label>
      </div>
    </div>

    <div class="form-group">
      <label for="f-obra">Obra / Cliente</label>
      <select id="f-obra" onchange="onObraChange()">
        <option value="">Carregando obras...</option>
        <option value="outro">— Outro (assistência / avulso) —</option>
      </select>
    </div>

    <div id="outro-wrap" style="display:none">
      <div class="form-group">
        <label>Nome do cliente / descrição rápida</label>
        <input type="text" id="f-obra-outro" placeholder="Ex.: Assistência residencial João...">
      </div>
    </div>

    <div class="form-group">
      <label for="f-descricao">Pendências e solicitações</label>
      <textarea id="f-descricao" rows="4" placeholder="Descreva as pendências, solicitações do cliente, pontos a resolver..."></textarea>
    </div>

    <div class="form-group">
      <label for="f-data-marcada">Data marcada com cliente</label>
      <input type="date" id="f-data-marcada">
    </div>

    <label class="toggle-urgente">
      <input type="checkbox" id="f-urgente">
      <span><strong>Urgente</strong> — precisa de atenção imediata</span>
    </label>

    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarPendencia()">Salvar</button>
    </div>
  </div>
</div>

<script>

let pendencias  = [];
let obras       = [];
let meuTecId    = null;
let editandoId  = null;
let equipeAtiva = 'todas';
let statusAtivo = 'todos';
let toastTimer  = null;
const EQUIPE_LABEL = {
  cabeamento:'Cabeamento', eletrica:'Elétrica', audio_video:'Áudio e Vídeo',
  automacao:'Automação', regional_norte:'Regional Norte'
};
const STATUS_INFO = {
  aberta:             { label:'Em aberto',         cls:'badge-aberta',            icon:'clock' },
  pendencia_cliente:  { label:'Pendência cliente', cls:'badge-pendencia_cliente', icon:'user' },
  pendencia_solucao:  { label:'Pendência Solução', cls:'badge-pendencia_solucao', icon:'building-2' },
  resolvida:          { label:'Resolvida',          cls:'badge-resolvida',         icon:'check-circle-2' },
};
function setEquipe(el, eq){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.remove('ativo');
    b.style.fontWeight='';
  });
  el.classList.add('ativo');
  equipeAtiva = eq;
  renderLista();
}

function setStatus(el, st){
  document.querySelectorAll('.filtro-st').forEach(b=>b.classList.remove('ativo'));
  el.classList.add('ativo');
  statusAtivo = st;
  renderLista();
}

function onObraChange(){
  const v = document.getElementById('f-obra').value;
  document.getElementById('outro-wrap').style.display = v === 'outro' ? 'block' : 'none';
}

function renderLista(){
  const busca = (document.getElementById('busca')?.value||'').toLowerCase().trim();

  const filtradas = pendencias.filter(p=>{
    if(equipeAtiva !== 'todas' && !equipesDe(p).includes(equipeAtiva)) return false;
    if(statusAtivo !== 'todos' && p.status !== statusAtivo) return false;
    if(busca){
      const txt = [p.obras?.nome_cliente||'', p.obra_outro||'', p.descricao||''].join(' ').toLowerCase();
      if(!txt.includes(busca)) return false;
    }
    return true;
  });

  // Atualiza badge total (abertos, não resolvidos)
  const abertas = pendencias.filter(p=>p.status!=='resolvida').length;
  document.getElementById('badge-total').textContent = abertas;

  // Atualiza contadores das tabs
  ['todas','cabeamento','eletrica','audio_video','automacao','regional_norte'].forEach(eq=>{
    const el = document.getElementById(`ct-${eq}`);
    if(!el) return;
    const c = eq==='todas'
      ? pendencias.filter(p=>p.status!=='resolvida').length
      : pendencias.filter(p=>equipesDe(p).includes(eq) && p.status!=='resolvida').length;
    el.textContent = c;
  });

  const lista = document.getElementById('lista-pend');
  if(filtradas.length === 0){
    lista.innerHTML = `<div class="empty-state">
      <i data-lucide="inbox"></i>
      <p style="font-size:14px;color:var(--text-2);margin-bottom:4px">Nenhuma pendência encontrada</p>
      <p style="font-size:12px;color:var(--text-3)">Clique em "Cadastrar Pendência" para adicionar</p>
    </div>`;
    lucide.createIcons(); return;
  }

  // Ordena: urgentes primeiro, depois por data desc
  const ord = [...filtradas].sort((a,b)=>{
    if(a.urgente && !b.urgente) return -1;
    if(!a.urgente && b.urgente) return 1;
    return new Date(b.criado_em) - new Date(a.criado_em);
  });

  const rows = ord.map(p=>{
    const st     = STATUS_INFO[p.status] || STATUS_INFO.aberta;
    const obra   = p.obras?.nome_cliente || p.obra_outro || '—';
    const dataFmt = new Date(p.criado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    const equipesBadges = equipesDe(p).map(eq=>`<span class="badge badge-equipe eq-${eq}">${escHtml(EQUIPE_LABEL[eq]||eq)}</span>`).join('');
    const dataMarcadaFmt = p.data_marcada
      ? new Date(p.data_marcada+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})
      : null;

    return `<tr class="${p.urgente?'urgente':''} ${p.status==='resolvida'?'resolvida':''}" id="pcard-${p.id}">
      <td>
        <div class="card-equipe-row">
          ${equipesBadges}
          ${p.urgente?`<span class="badge badge-urgente">Urgente</span>`:''}
        </div>
      </td>
      <td>
        <div class="td-obra">${escHtml(obra)}</div>
        ${dataMarcadaFmt?`<div class="pend-data-marcada">📅 Data marcada: ${dataMarcadaFmt}</div>`:''}
      </td>
      <td><div class="td-desc" title="${escHtml(p.descricao)}">${escHtml(p.descricao)}</div></td>
      <td class="td-meta">${dataFmt}</td>
      <td><span class="badge ${st.cls}">${st.label}</span></td>
      <td class="td-acoes">
        <div style="display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap">
          <button class="btn-st ${p.status==='resolvida'?'active-resolvida':''}" onclick="mudarStatus(${p.id},'resolvida')" title="Resolvida"><i data-lucide="check-circle-2"></i></button>
          <button class="btn-st ${p.status==='pendencia_cliente'?'active-pendencia_cliente':''}" onclick="mudarStatus(${p.id},'pendencia_cliente')" title="Pend. cliente"><i data-lucide="user"></i></button>
          <button class="btn-st ${p.status==='pendencia_solucao'?'active-pendencia_solucao':''}" onclick="mudarStatus(${p.id},'pendencia_solucao')" title="Pend. Solução"><i data-lucide="building-2"></i></button>
          <button class="btn-st" onclick="editarPendencia(${p.id})" title="Editar"><i data-lucide="pencil"></i></button>
          <button class="btn-excluir" onclick="excluirPendencia(${p.id})" title="Excluir"><i data-lucide="trash-2"></i></button>
        </div>
      </td>
    </tr>`;
  }).join('');

  lista.innerHTML = `<table class="pend-table">
    <thead><tr>
      <th>Equipe</th>
      <th>Obra / Cliente</th>
      <th>Descrição</th>
      <th>Cadastrada</th>
      <th>Status</th>
      <th style="text-align:right">Ações</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  lucide.createIcons();
}

async function mudarStatus(id, novoStatus){
  const { error } = await db.from('pendencias').update({status:novoStatus,atualizado_em:new Date().toISOString()}).eq('id',id);
  if(error){showToast('Erro: '+error.message, 'error');return;}
  const p = pendencias.find(x=>x.id===id);
  if(p) p.status = novoStatus;
  renderLista();
  showToast('Status atualizado.', 'success');
}

async function excluirPendencia(id){
  confirmModal('Excluir esta pendência?', async () => {
    const {error} = await db.from('pendencias').delete().eq('id',id);
    if(error){showToast('Erro: '+error.message, 'error');return;}
    pendencias = pendencias.filter(x=>x.id!==id);
    renderLista();
    showToast('Pendência excluída.', 'success');
  });
}

function editarPendencia(id){
  const p = pendencias.find(x=>x.id===id);
  if(!p) return;
  editandoId = id;
  document.getElementById('modal-titulo').textContent = 'Editar Pendência';
  setEquipesModal(equipesDe(p));
  document.getElementById('f-descricao').value = p.descricao;
  document.getElementById('f-data-marcada').value = p.data_marcada || '';
  document.getElementById('f-urgente').checked = !!p.urgente;
  if(p.obra_id){
    document.getElementById('f-obra').value = p.obra_id;
    document.getElementById('outro-wrap').style.display='none';
  } else {
    document.getElementById('f-obra').value = 'outro';
    document.getElementById('outro-wrap').style.display='block';
    document.getElementById('f-obra-outro').value = p.obra_outro||'';
  }
  document.getElementById('erro-form').style.display='none';
  document.getElementById('overlay-modal').style.display='flex';
  lucide.createIcons();
}

function abrirModal(){
  editandoId = null;
  document.getElementById('modal-titulo').textContent = 'Cadastrar Pendência';
  setEquipesModal(equipeAtiva !== 'todas' ? [equipeAtiva] : []);
  document.getElementById('f-obra').value     = '';
  document.getElementById('f-obra-outro').value = '';
  document.getElementById('f-descricao').value = '';
  document.getElementById('f-data-marcada').value = '';
  document.getElementById('f-urgente').checked = false;
  document.getElementById('outro-wrap').style.display='none';
  document.getElementById('erro-form').style.display='none';
  document.getElementById('overlay-modal').style.display='flex';
  lucide.createIcons();
}

function fecharModal(){
  document.getElementById('overlay-modal').style.display='none';
  editandoId = null;
}

function fecharModalFora(e){
  if(e.target === document.getElementById('overlay-modal')) fecharModal();
}

// ── Helpers equipe multi-valor ───────────────────────────────────
function equipesDe(p) {
  if (!p.equipe) return [];
  return p.equipe.split(',').map(s=>s.trim()).filter(Boolean);
}
function getEquipesModal() {
  return [...document.querySelectorAll('#f-equipes-wrap input[type=checkbox]:checked')].map(c=>c.value);
}
function setEquipesModal(vals=[]) {
  document.querySelectorAll('#f-equipes-wrap input[type=checkbox]').forEach(c=>{
    c.checked = vals.includes(c.value);
  });
}

async function salvarPendencia(){
  const equipesArr = getEquipesModal();
  const equipe    = equipesArr.join(',');
  const obraVal   = document.getElementById('f-obra').value;
  const obraOutro = document.getElementById('f-obra-outro').value.trim();
  const descricao = document.getElementById('f-descricao').value.trim();
  const urgente   = document.getElementById('f-urgente').checked;
  const erroEl    = document.getElementById('erro-form');

  if(!equipe){erroEl.textContent='Selecione pelo menos uma equipe.';erroEl.style.display='block';return;}
  if(!descricao){erroEl.textContent='Descreva a pendência.';erroEl.style.display='block';return;}
  if(obraVal==='outro' && !obraOutro){erroEl.textContent='Informe o cliente/obra.';erroEl.style.display='block';return;}
  erroEl.style.display='none';

  const btn = document.getElementById('btn-salvar');
  btn.disabled=true; btn.textContent='Salvando...';

  const dataMarcada = document.getElementById('f-data-marcada').value || null;
  const payload = {
    equipe,
    obra_id:       obraVal && obraVal !== 'outro' ? Number(obraVal) : null,
    obra_outro:    obraVal === 'outro' ? obraOutro : null,
    descricao,
    data_marcada:  dataMarcada,
    urgente,
    atualizado_em: new Date().toISOString(),
  };

  let error;
  if(editandoId){
    ({error} = await db.from('pendencias').update(payload).eq('id',editandoId));
    if(!error){
      const idx = pendencias.findIndex(x=>x.id===editandoId);
      if(idx>=0){
        pendencias[idx]={...pendencias[idx],...payload};
        // recarga obra
        if(payload.obra_id){
          const obra = obras.find(o=>o.id===payload.obra_id);
          pendencias[idx].obras = obra ? {nome_cliente:obra.nome_cliente} : null;
        } else { pendencias[idx].obras = null; }
      }
    }
  } else {
    payload.status     = 'aberta';
    payload.criado_por = meuTecId;
    payload.criado_em  = new Date().toISOString();
    const {data, error:e} = await db.from('pendencias').insert(payload).select('*, obras(nome_cliente)').single();
    error = e;
    if(!error && data) pendencias.unshift(data);
  }

  btn.disabled=false; btn.textContent='Salvar';

  if(error){erroEl.textContent='Erro: '+error.message;erroEl.style.display='block';return;}

  fecharModal();
  renderLista();
  showToast(editandoId ? 'Pendência atualizada.' : 'Pendência cadastrada.', 'success');
}

async function carregarPendencias(){
  const {data,error} = await db.from('pendencias')
    .select('*, obras(nome_cliente)')
    .order('criado_em',{ascending:false});
  if(error){
    document.getElementById('lista-pend').innerHTML=`<div class="empty-state"><p style="color:var(--red-text)">Erro ao carregar: ${escHtml(error.message)}</p></div>`;
    lucide.createIcons(); return;
  }
  pendencias = data||[];
  renderLista();
}

async function carregarObras(){
  const {data} = await db.from('obras').select('id,nome_cliente').order('nome_cliente');
  obras = data||[];
  const sel = document.getElementById('f-obra');
  sel.innerHTML='<option value="">Selecione a obra...</option>'+
    obras.map(o=>`<option value="${o.id}">${escHtml(o.nome_cliente)}</option>`).join('')+
    '<option value="outro">— Outro (assistência / avulso) —</option>';
}
async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){window.location.href='login.html';return;}

  const {data:eu}=await db.from('tecnicos').select('id,role,nome').eq('auth_user_id',session.user.id).single();
  if(!eu||!['supervisor','coordenador','agendamento'].includes(eu.role)){
    window.location.href='supervisor.html';return;
  }
  meuTecId=eu.id;
  renderTopbar(eu.nome,eu.role,'pendencias');
  applyTheme(localStorage.getItem('tema')||'auto');
  await Promise.all([carregarObras(),carregarPendencias()]);
}

init();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
