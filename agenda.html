async function dispararAgendaWhatsapp() {
  const btn    = document.getElementById('btn-whatsapp');
  const dpEl   = document.getElementById('data-dispatch');
  const hoje   = dpEl?.value || fmtISO(new Date());
  const agHoje = agendamentos.filter(ag => ag.data === hoje);

  if (agHoje.length === 0) {
    const [y, m, d2] = hoje.split('-');
    mostrarToast(`Não há agendamentos para ${d2}/${m}/${y}.`, 'err');
    return;
  }

  btn.style.opacity = '0.5';
  btn.style.pointerEvents = 'none';
  btn.querySelector('span') && (btn.querySelector('span').textContent = 'Gerando...');

  const DIAS_PT  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d        = new Date(hoje + 'T12:00');
  const dataFmt  = `${DIAS_PT[d.getDay()]}, ${d.getDate()} de ${MESES_PT[d.getMonth()]} de ${d.getFullYear()}`;

  // Mapa de equipes: id → { nome, cor }
  const EQUIPE_INFO = {
    1: { nome: 'Cabeamento',    cor: '#1D4ED8' }, // azul
    2: { nome: 'Eletrica',      cor: '#B45309' }, // âmbar escuro
    3: { nome: 'Audio e Video', cor: '#6D28D9' }, // roxo
    4: { nome: 'Automacao',     cor: '#065F46' }, // verde escuro
    5: { nome: 'Regional Norte', cor: '#9F1239' }, // vermelho escuro
  };
  const COR_PADRAO = '#1e293b';

  // Descobre a equipe principal de um agendamento pelo técnico líder
  function equipeDoAg(ag) {
    const ids = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
    for (const tid of ids) {
      const te = tecnicoEquipes.find(e => e.tecnico_id === tid);
      if (te && EQUIPE_INFO[te.equipe_id]) return EQUIPE_INFO[te.equipe_id];
    }
    return null;
  }

  // Ordena todos os agendamentos de hoje por horário
  const ordenados = [...agHoje].sort((a, b) =>
    (a.hora_inicio || '00:00').localeCompare(b.hora_inicio || '00:00')
  );

  // Carregar logo já pré-processado como branco (html2canvas ignora CSS filter)
  const logoB64   = await carregarLogoBase64Branco('logosolucao.png');
  const geradoEm  = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });

  // Paleta profissional — dark minimal
  const BG     = '#0D1117';
  const SURF   = '#161B22';
  const HEADER = '#0A0E15';
  const GOLD   = '#C4A882';
  const T1     = '#F0F6FC';
  const T2     = '#8B949E';
  const T3     = '#484F58';
  const BRDR   = '#21262D';
  const COR_EQ = { 1:'#2563EB', 2:'#D97706', 3:'#7C3AED', 4:'#059669', 5:'#DC2626' };

  // Monta card de cada agendamento com inline styles
  const cardsHTML = ordenados.map((ag) => {
    const hora      = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '—';
    const cliente   = escHtml(ag.obras?.nome_cliente || ag.cliente_outro || '—');
    const end       = escHtml(ag.endereco_outro || ag.obras?.endereco || '');
    const serv      = escHtml(ag.servico || '');
    const veic      = escHtml(ag.veiculo || '');
    const consultor = escHtml(ag.obras?.consultores?.nome || '');
    const arquiteto = escHtml(ag.obras?.arquiteto_responsavel || '');
    const osNum     = ag.numero_os ? escHtml(String(ag.numero_os)) : '';

    const tecIds = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
    const tecStr = escHtml(tecIds.map(id => tecnicos.find(t => t.id === id)?.nome || '').filter(Boolean).join(' · '));

    const eq  = equipeDoAg(ag);
    const cor = eq ? (COR_EQ[Object.keys(EQUIPE_INFO).find(k => EQUIPE_INFO[k].nome === eq.nome)] || eq.cor) : '#334155';

    const LBL  = `color:${T3};font-weight:600;`;
    const ROW  = `font-size:11.5px;color:${T2};margin-top:3px;line-height:1.5;`;
    const lin  = (label, val) => val ? `<div style="${ROW}"><span style="${LBL}">${label} </span>${val}</div>` : '';

    return `<div style="background:${SURF};border-radius:7px;padding:13px 15px;margin-bottom:9px;border-left:3px solid ${cor};">
      <div style="display:flex;align-items:baseline;gap:13px;">
        <span style="font-size:14px;font-weight:700;color:${GOLD};flex-shrink:0;min-width:46px;font-variant-numeric:tabular-nums;">${hora}</span>
        <span style="font-size:15px;font-weight:700;color:${T1};flex:1;line-height:1.3;">${cliente}</span>
      </div>
      <div style="margin-top:6px;">
        ${lin('Técnico:',   tecStr)}
        ${lin('Endereço:',  end)}
        ${lin('N.OS:',      osNum)}
        ${lin('Consultor:', consultor)}
        ${lin('Arquiteto:', arquiteto)}
        ${lin('Serviço:',   serv)}
        ${lin('Veículo:',   veic)}
      </div>
    </div>`;
  }).join('');

  const card = document.getElementById('agenda-card');
  card.style.width = '860px';
  card.innerHTML = `<div style="width:860px;background:${BG};font-family:'Segoe UI',system-ui,Arial,sans-serif;border-radius:12px;overflow:hidden;">
    <div style="background:${HEADER};padding:20px 26px;display:flex;align-items:center;gap:18px;border-bottom:1px solid ${BRDR};">
      ${logoB64 ? `<img src="${logoB64}" style="height:26px;opacity:0.92;">` : `<span style="font-size:14px;font-weight:800;color:${T1};">SOLUÇÃO TÉCNICA</span>`}
      <div style="width:1px;height:32px;background:${BRDR};"></div>
      <div style="flex:1;">
        <div style="font-size:10px;font-weight:700;color:${GOLD};letter-spacing:0.09em;text-transform:uppercase;">Agenda do Dia</div>
        <div style="font-size:16px;font-weight:700;color:${T1};margin-top:3px;">${dataFmt}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:22px;font-weight:700;color:${T1};line-height:1;">${ordenados.length}</div>
        <div style="font-size:9px;color:${T2};margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;">serviço${ordenados.length !== 1 ? 's' : ''}</div>
      </div>
    </div>
    <div style="height:2px;background:linear-gradient(90deg,${GOLD} 0%,rgba(196,168,130,0.08) 100%);"></div>
    <div style="padding:14px 18px;">${cardsHTML}</div>
    ${(() => {
      const bloqDia = bloqueios.filter(b => hoje >= b.data_inicio && hoje <= b.data_fim);
      if (!bloqDia.length) return '';
      const fmt = d => new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      const itens = bloqDia.map(b => {
        const tec = tecnicos.find(t => t.id === b.tecnico_id);
        return `<span style="display:inline-block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:5px;padding:3px 8px;font-size:10px;color:#F87171;margin:2px;font-weight:600">${escHtml(tec?.nome||'—')} — ${escHtml(b.motivo)} (até ${fmt(b.data_fim)})</span>`;
      }).join('');
      return `<div style="background:rgba(239,68,68,.06);border-top:1px solid rgba(239,68,68,.2);padding:10px 18px">
        <div style="font-size:9px;font-weight:700;color:#F87171;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">🔒 Técnicos bloqueados</div>
        <div>${itens}</div>
      </div>`;
    })()}
    <div style="background:${HEADER};padding:9px 26px;border-top:1px solid ${BRDR};display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:8px;color:${T3};letter-spacing:0.06em;text-transform:uppercase;">Solução Técnica · Sistema de Gestão</div>
      <div style="font-size:8px;color:${T3};">${geradoEm}</div>
    </div>
  </div>`;

  try {
    await document.fonts.ready;

    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#0D1117',
      logging: false,
    });

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

    // Tenta copiar pro clipboard (requer permissão / HTTPS)
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      mostrarToast('✅ Imagem copiada! Abra o WhatsApp e cole (Ctrl+V) no grupo.', 'ok');
      setTimeout(() => window.open('https://web.whatsapp.com', '_blank'), 800);
    } catch (clipErr) {
      // Fallback: download da imagem
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href     = url;
      a.download = `agenda-${hoje}.png`;
      a.click();
      URL.revokeObjectURL(url);
      setTimeout(() => window.open('https://web.whatsapp.com', '_blank'), 400);
      mostrarToast('Imagem baixada! Anexe no grupo do WhatsApp.', 'ok');
    }
  } catch (err) {
    mostrarToast('Erro ao gerar imagem: ' + err.message, 'err');
    console.error(err);
  } finally {
    btn.style.opacity = '';
    btn.style.pointerEvents = '';
  }
}

// ── Carregar imagem como base64 via fetch (evita CORS/canvas taint) ──
async function carregarImgBase64(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise(ok => {
      const reader = new FileReader();
      reader.onloadend = () => ok(reader.result);
      reader.onerror  = () => ok(null);
      reader.readAsDataURL(blob);
    });
  } catch { return null; }
}

// ── Versão branca do logo (html2canvas não suporta CSS filter em imagens) ──
async function carregarLogoBase64Branco(url) {
  const b64 = await carregarImgBase64(url);
  if (!b64) return null;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c   = document.createElement('canvas');
      c.width   = img.naturalWidth;
      c.height  = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // Mantém apenas os pixels não-transparentes e pinta tudo de branco
      ctx.globalCompositeOperation = 'source-in';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, c.width, c.height);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => resolve(null);
    img.src = b64;
  });
}

async function gerarProgramacaoSemanal() {
  const tecId   = Number(document.getElementById('semana-tec-id').value);
  const refDate = document.getElementById('semana-data-ref').value;
  const erroEl  = document.getElementById('modal-semana-erro');

  if (!tecId)   { erroEl.textContent = 'Selecione um técnico.'; erroEl.style.display='block'; return; }
  if (!refDate) { erroEl.textContent = 'Informe a data de referência.'; erroEl.style.display='block'; return; }
  erroEl.style.display = 'none';

  const tec = tecnicos.find(t => t.id === tecId);
  if (!tec) return;

  fecharModalSemanaBtn();
  mostrarToast('⏳ Gerando imagem horizontal...', 'ok');

  // Calcula seg–sex da semana da data de referência
  const base = new Date(refDate + 'T12:00');
  const diaSemana = base.getDay() === 0 ? 7 : base.getDay();
  const seg = new Date(base); seg.setDate(base.getDate() - diaSemana + 1);
  const diasSemana = Array.from({length:5}, (_, i) => { const d = new Date(seg); d.setDate(seg.getDate()+i); return d; });
  const datasISO = diasSemana.map(fmtISO);

  // Filtra agendamentos dessa semana onde o técnico participa
  const agSemana = agendamentos.filter(ag =>
    datasISO.includes(ag.data) &&
    [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].includes(tecId)
  );

  const DIAS_PT  = ['Dom','Segunda','Terça','Quarta','Quinta','Sexta','Sáb'];
  const DIAS_ABR = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MESES_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  const [yy, mm, dd] = datasISO[0].split('-');
  const [ye, me, de] = datasISO[4].split('-');
  const periodoFmt = `${dd}/${mm}/${yy.slice(2)} – ${de}/${me}/${ye.slice(2)}`;
  const geradoEm   = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });

  // Carregar logo pré-processado como branco (sem depender de CSS filter)
  const logoB64 = await carregarLogoBase64Branco('logosolucao.png');

  // Paleta consistente — profissional, mínima
  const S_BG     = '#0D1117';
  const S_SURF   = '#161B22';
  const S_CARD   = '#0D1117';
  const S_HEADER = '#0A0E15';
  const S_GOLD   = '#C4A882';
  const S_T1     = '#F0F6FC';
  const S_T2     = '#8B949E';
  const S_T3     = '#484F58';
  const S_BRDR   = '#21262D';
  // Cores de equipe (apenas borda esquerda nos cards)
  const COR_EQ = { 1:'#2563EB', 2:'#D97706', 3:'#7C3AED', 4:'#059669', 5:'#DC2626' };

  // Gera HTML de uma coluna (um dia da semana)
  function colunaHTML(iso, idx) {
    const d      = diasSemana[idx];
    const ags    = agSemana.filter(ag => ag.data === iso);
    const diaN   = DIAS_PT[d.getDay()];
    const dataL  = `${String(d.getDate()).padStart(2,'0')} ${MESES_PT[d.getMonth()]}`;
    const temAgs = ags.length > 0;

    const cardsHTML = !temAgs
      ? `<div style="padding:24px 8px;text-align:center;font-size:11px;color:${S_T3};font-style:italic;">Sem serviços</div>`
      : ags.map(ag => {
          const hora      = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '—';
          const cliente   = escHtml(ag.obras?.nome_cliente || ag.cliente_outro || '—');
          const serv      = escHtml(ag.servico || '');
          const end       = escHtml(ag.endereco_outro || ag.obras?.endereco || '');
          const veic      = escHtml(ag.veiculo || '');
          const consultor = escHtml(ag.obras?.consultores?.nome || '');
          const arquiteto = escHtml(ag.obras?.arquiteto_responsavel || '');
          const osNum     = ag.numero_os ? escHtml(String(ag.numero_os)) : '';
          const tecIds    = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
          const tecStr    = escHtml(tecIds.map(id => tecnicos.find(t => t.id === id)?.nome?.split(' ')[0] || '').filter(Boolean).join(' · '));
          const corEq     = COR_EQ[ag.equipe_id] || '#334155';
          const LBL = `color:${S_T3};font-weight:600;font-size:10px;`;
          const VAL = `color:${S_T2};font-size:10px;`;
          const lin = (label, val) => val ? `<div style="display:flex;gap:5px;margin-top:2px;line-height:1.4;"><span style="${LBL}">${label}</span><span style="${VAL}">${val}</span></div>` : '';
          return `<div style="background:${S_BG};border-radius:6px;padding:10px 11px;margin-bottom:7px;border-left:3px solid ${corEq};">
            <div style="font-size:11px;font-weight:700;color:${S_GOLD};margin-bottom:4px;font-variant-numeric:tabular-nums;">${hora}</div>
            <div style="font-size:12px;font-weight:700;color:${S_T1};line-height:1.3;margin-bottom:5px;">${cliente}</div>
            <div style="border-top:1px solid ${S_BRDR};padding-top:5px;">
              ${lin('Técnico:',   tecStr)}
              ${lin('Endereço:',  end)}
              ${lin('N.OS:',      osNum)}
              ${lin('Consultor:', consultor)}
              ${lin('Arquiteto:', arquiteto)}
              ${lin('Serviço:',   serv)}
              ${lin('Veículo:',   veic)}
            </div>
          </div>`;
        }).join('');

    return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;">
      <div style="background:${S_SURF};border-radius:7px 7px 0 0;padding:11px 13px;border-bottom:2px solid ${S_GOLD};">
        <div style="font-size:12px;font-weight:700;color:${S_T1};text-transform:uppercase;letter-spacing:0.07em;">${diaN}</div>
        <div style="font-size:10px;color:${S_T2};margin-top:3px;">${dataL}${temAgs ? ` · ${ags.length} serv.` : ''}</div>
      </div>
      <div style="background:${S_SURF};border-radius:0 0 7px 7px;padding:9px;flex:1;">${cardsHTML}</div>
    </div>`;
  }

  const colunasHTML = datasISO.map((iso, i) => colunaHTML(iso, i)).join('');

  const card = document.getElementById('agenda-card');
  card.style.width = '1500px';
  card.innerHTML = `<div style="width:1500px;background:${S_BG};font-family:'Segoe UI',system-ui,Arial,sans-serif;border-radius:12px;overflow:hidden;">
    <div style="background:${S_HEADER};padding:20px 26px;display:flex;align-items:center;gap:18px;border-bottom:1px solid ${S_BRDR};">
      ${logoB64
        ? `<img src="${logoB64}" style="height:27px;opacity:0.92;">`
        : `<span style="font-size:15px;font-weight:800;color:${S_T1};">SOLUÇÃO TÉCNICA</span>`}
      <div style="width:1px;height:34px;background:${S_BRDR};"></div>
      <div style="flex:1;">
        <div style="font-size:10px;font-weight:700;color:${S_GOLD};letter-spacing:0.09em;text-transform:uppercase;">Programação Semanal</div>
        <div style="font-size:18px;font-weight:700;color:${S_T1};margin-top:3px;">${escHtml(tec.nome)}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:13px;color:${S_T2};">${periodoFmt}</div>
        <div style="font-size:9px;color:${S_T3};margin-top:4px;">${agSemana.length} serviço${agSemana.length !== 1 ? 's' : ''} · Gerado em ${geradoEm}</div>
      </div>
    </div>
    <div style="height:2px;background:linear-gradient(90deg,${S_GOLD} 0%,rgba(196,168,130,0.08) 100%);"></div>
    <div style="display:flex;gap:8px;padding:12px;">
      ${colunasHTML}
    </div>
    ${(() => {
      const ini = datasISO[0], fim = datasISO[datasISO.length-1];
      const bloqSemana = bloqueios.filter(b => b.data_fim >= ini && b.data_inicio <= fim);
      if (!bloqSemana.length) return '';
      const fmt = d => new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
      const itens = bloqSemana.map(b => {
        const t = tecnicos.find(x => x.id === b.tecnico_id);
        return `<span style="display:inline-block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);border-radius:5px;padding:3px 8px;font-size:10px;color:#F87171;margin:2px;font-weight:600">${escHtml(t?.nome||'—')} — ${escHtml(b.motivo)} (${fmt(b.data_inicio)}→${fmt(b.data_fim)})</span>`;
      }).join('');
      return `<div style="background:rgba(239,68,68,.06);border-top:1px solid rgba(239,68,68,.2);padding:10px 18px">
        <div style="font-size:9px;font-weight:700;color:#F87171;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">🔒 Técnicos bloqueados neste período</div>
        <div>${itens}</div>
      </div>`;
    })()}
    <div style="background:${S_HEADER};padding:9px 26px;border-top:1px solid ${S_BRDR};display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:8px;color:${S_T3};letter-spacing:0.06em;text-transform:uppercase;">Solução Técnica · Sistema de Gestão de Obras</div>
      <div style="font-size:8px;color:${S_T3};">${geradoEm}</div>
    </div>
  </div>`;

  try {
    await document.fonts.ready;
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#0D1117',
      logging: false,
      width: 1500,
    });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    try {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      mostrarToast('✅ Imagem copiada! Abra o WhatsApp e cole (Ctrl+V).', 'ok');
      setTimeout(() => window.open('https://web.whatsapp.com', '_blank'), 800);
    } catch {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href = url;
      a.download = `prog-semanal-${tec.nome.replace(/\s+/g,'-')}-${datasISO[0]}.png`;
      a.click();
      URL.revokeObjectURL(url);
      mostrarToast('📥 Imagem baixada! Anexe no WhatsApp.', 'ok');
    }
  } catch(err) {
    mostrarToast('Erro ao gerar imagem: ' + err.message, 'err');
  }
}

// ── Exportar agenda da semana para SharePoint ────────────────
async function exportarAgendaSharePoint() {
  const btn = document.getElementById('btn-exportar-sp');
  if (!jwtToken) { mostrarToast('Sessão expirada, recarregue a página.', 'err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2"></i><span>Gerando PDF...</span>';
  lucide.createIcons();

  try {
    const dias = diasDaSemana(semanaOffset);
    const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                      'agosto','setembro','outubro','novembro','dezembro'];
    const DIAS_PT  = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira',
                      'Sexta-feira','Sábado','Domingo'];

    const d0 = dias[0], d6 = dias[6];
    const mesNome    = MESES_PT[d0.getMonth()];
    const mesNomeCap = mesNome[0].toUpperCase() + mesNome.slice(1);
    const ano        = d0.getFullYear();

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });

    // ── Cabeçalho ──
    doc.setFontSize(16); doc.setFont('helvetica', 'bold');
    doc.text(`Agenda Técnica — ${d0.getDate()} a ${d6.getDate()} de ${mesNomeCap} ${ano}`, 12, 16);
    doc.setFontSize(9); doc.setFont('helvetica', 'normal');
    doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')}  ·  ${agendamentos.length} agendamento(s)`, 12, 22);

    let yPos = 28;

    for (let i = 0; i < dias.length; i++) {
      const dia     = dias[i];
      const dataStr = fmtISO(dia);
      const ags     = agendamentos.filter(ag => ag.data === dataStr);

      if (yPos > 162) { doc.addPage(); yPos = 14; }

      // Barra do dia
      doc.setFillColor(20, 20, 20);
      doc.rect(12, yPos - 5, 249, 8, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      doc.setTextColor(62, 207, 142);
      doc.text(
        `${DIAS_PT[i]}  —  ${String(dia.getDate()).padStart(2,'0')}/${String(dia.getMonth()+1).padStart(2,'0')}/${ano}`,
        14, yPos
      );
      doc.setTextColor(0, 0, 0);
      yPos += 5;

      if (!ags.length) {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5);
        doc.setTextColor(150, 150, 150);
        doc.text('Sem agendamentos', 16, yPos + 5);
        doc.setTextColor(0, 0, 0);
        yPos += 12;
        continue;
      }

      doc.autoTable({
        startY: yPos + 2,
        head: [['Horário', 'Cliente / Endereço', 'Técnico\nN.OS', 'Consultor\nArquiteto', 'Serviço\nVeículo', 'Status']],
        body: ags.map(ag => {
          const ids       = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
          const nomes     = ids.map(id => tecnicos.find(t => t.id === id)?.nome || '').filter(Boolean).join(' · ');
          const cliente   = ag.obras?.nome_cliente || ag.cliente_outro || '—';
          const end       = ag.endereco_outro || ag.obras?.endereco || '';
          const osNum     = ag.numero_os ? `N.OS: ${ag.numero_os}` : '';
          const consultor = ag.obras?.consultores?.nome ? `Consultor: ${ag.obras.consultores.nome}` : '';
          const arquiteto = ag.obras?.arquiteto_responsavel ? `Arquiteto: ${ag.obras.arquiteto_responsavel}` : '';
          const veic      = ag.veiculo ? `Veículo: ${ag.veiculo}` : '';
          return [
            ag.hora_inicio?.slice(0,5) || '—',
            end ? `${cliente}\n${end}` : cliente,
            [nomes, osNum].filter(Boolean).join('\n') || '—',
            [consultor, arquiteto].filter(Boolean).join('\n') || '—',
            [ag.servico, veic].filter(Boolean).join('\n') || '—',
            STATUS_LABEL[ag.status] || ag.status || '—',
          ];
        }),
        styles:             { fontSize: 7, cellPadding: 2.5, overflow: 'linebreak', valign: 'top', lineHeight: 1.4 },
        headStyles:         { fillColor: [35, 35, 35], textColor: [240, 240, 240], fontStyle: 'bold', fontSize: 6.5 },
        alternateRowStyles: { fillColor: [248, 248, 248] },
        columnStyles: {
          0: { cellWidth: 16 },
          1: { cellWidth: 65 },
          2: { cellWidth: 52 },
          3: { cellWidth: 58 },
          4: { cellWidth: 62 },
          5: { cellWidth: 20 },
        },
        margin:          { left: 12, right: 12 },
        tableLineColor:  [220, 220, 220],
        tableLineWidth:  0.1,
      });

      yPos = doc.lastAutoTable.finalY + 6;
    }

    const pdfBlob = doc.output('blob');

    // ── Upload para SharePoint ──
    btn.innerHTML = '<i data-lucide="cloud-upload"></i><span>Enviando...</span>';
    lucide.createIcons();

    const ts         = new Date().toISOString().slice(0,19).replace('T','-').replace(':','h').replace(':','m');
    const nomeSemana = `${d0.getDate()} a ${d6.getDate()} de ${mesNome} ${ano}`;
    const pasta      = `Agenda Tecnica/${ano}/${mesNomeCap}`;
    const arquivo    = `${nomeSemana} (${ts}).pdf`;

    btn.innerHTML = '<i data-lucide="cloud-upload"></i><span>Enviando...</span>';
    lucide.createIcons();
    await uploadPDFServidor(pdfBlob, pasta, arquivo);
    mostrarToast(`✅ Agenda salva: "${arquivo}"`, 'ok');

  } catch (e) {
    console.error('[exportarAgendaSharePoint]', e);
    mostrarToast('Erro ao exportar: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="cloud-upload"></i><span>Exportar → SharePoint</span>';
    lucide.createIcons();
  }
}

// ── HELPER: Equipe de um agendamento (global) ────────────────
const EQUIPE_NOMES = {
  1:'Cabeamento', 2:'Elétrica', 3:'Áudio e Vídeo', 4:'Automação', 5:'Regional Norte'
};
function equipeDoAgGlobal(ag) {
  const ids = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
  for (const tid of ids) {
    const te = tecnicoEquipes.find(e => e.tecnico_id === tid);
    if (te && EQUIPE_NOMES[te.equipe_id]) return EQUIPE_NOMES[te.equipe_id];
  }
  return '—';
}

// ── HELPER: Upload PDF via servidor (evita CORS) ─────────────
async function uploadPDFServidor(pdfBlob, pasta, arquivo) {
  // Converte blob para base64
  const arrayBuf = await pdfBlob.arrayBuffer();
  const bytes    = new Uint8Array(arrayBuf);
  let binary     = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  const base64   = btoa(binary);

  const res = await fetch('/api/upload-pdf', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${jwtToken}` },
    body:    JSON.stringify({ path: pasta, filename: arquivo, contentBase64: base64 }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Erro ${res.status}`);
  }
  return res.json();
}

async function exportarProgramacaoEstoque() {
  const btn = document.getElementById('btn-estoque');

  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2"></i><span>Gerando...</span>';
  lucide.createIcons();

  try {
    const dias = diasDaSemana(semanaOffset);
    const MESES_PT  = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const DIAS_PT   = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
    const d0 = dias[0], d6 = dias[6];
    const mesNome    = MESES_PT[d0.getMonth()];
    const mesNomeCap = mesNome[0].toUpperCase() + mesNome.slice(1);
    const ano        = d0.getFullYear();

    // Busca CPFs dos técnicos (campo cpf na tabela tecnicos)

    const cpfMap = {};

    doc.text(`Semana: ${d0.getDate()} a ${d6.getDate()} de ${mesNomeCap} ${ano}  ·  Gerado em ${new Date().toLocaleString('pt-BR')}`, 12, 17);

    const montarRow = (ag) => {

      const diaSemana = DIAS_PT[dias.findIndex(d => fmtISO(d) === ag.data)];

        equipeDoAgGlobal(ag),
        equipeStr,
        ag.obras?.consultores?.nome || '—',
        ag.servico || '—',
        ag.veiculo || '—',
        motoristaStr,
      ];
    };

    const COL_STYLES = {
      0: { cellWidth: 20 }, 1: { cellWidth: 12 }, 2: { cellWidth: 48 },
      3: { cellWidth: 26 }, 4: { cellWidth: 42 }, 5: { cellWidth: 24 },
      6: { cellWidth: 52 }, 7: { cellWidth: 20 }, 8: { cellWidth: 33, fontStyle: 'bold' },
    };
    const HEAD = [['Dia', 'Hora', 'Cliente / Obra', 'Equipe', 'Técnicos', 'Consultor', 'Serviço', 'Veículo', 'Motorista / CPF']];

    // Agrupa todas as agendas da semana por status
    const todasAgs = agendamentos.filter(ag => {
      const d = ag.data;
      return d >= fmtISO(dias[0]) && d <= fmtISO(dias[6]);
    });

    const semanaLabel = `Semana ${d0.getDate()} a ${d6.getDate()} de ${mesNomeCap} ${ano}`;

    const secoes = [
      {
        label: 'VIAGENS', statusFiltro: ['viagem'],
        bannerBg: [18, 38, 72], bannerTxt: [147, 197, 253],
        rowBg: [240, 246, 255], rowAltBg: [220, 235, 255], rowTxt: [20, 40, 80],
      },
      {
        label: 'CONFIRMADOS', statusFiltro: ['confirmado'],
        bannerBg: [10, 35, 20], bannerTxt: [52, 211, 153],
        rowBg: [240, 255, 247], rowAltBg: [210, 245, 228], rowTxt: [10, 50, 25],
      },
      {
        label: 'NÃO CONFIRMADOS', statusFiltro: ['nao_confirmado'],
        bannerBg: [60, 48, 0], bannerTxt: [253, 224, 71],
        rowBg: [255, 253, 230], rowAltBg: [255, 246, 180], rowTxt: [70, 55, 0],
      },
    ];

    let yPos = 28;
    let primeiraSecao = true;

    for (const secao of secoes) {
      const ags = todasAgs
        .filter(ag => secao.statusFiltro.includes(ag.status || 'confirmado'))
        .sort((a, b) => (a.data + (a.hora_inicio||'')).localeCompare(b.data + (b.hora_inicio||'')));
      if (!ags.length) continue;

      // Nova página para cada seção (exceto a primeira)
      if (!primeiraSecao) { doc.addPage(); yPos = 14; }
      primeiraSecao = false;

      // ── Banner da seção ─────────────────────────────────────
      doc.setFillColor(...secao.bannerBg);
      doc.rect(0, yPos - 6, 297, 18, 'F');

      doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
      doc.setTextColor(...secao.bannerTxt);
      doc.text(secao.label, 12, yPos + 4);

      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      doc.setTextColor(200, 200, 200);
      doc.text(semanaLabel, 12, yPos + 10);

      doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
      doc.setTextColor(...secao.bannerTxt);
      doc.text(`${ags.length} agendamento${ags.length !== 1 ? 's' : ''}`, 285, yPos + 4, { align: 'right' });

      yPos += 18;

      // ── Tabela ──────────────────────────────────────────────
      doc.autoTable({
        startY: yPos,
        head: HEAD,
        body: ags.map(montarRow),
        margin: { left: 10, right: 10 },
        styles: {
          fontSize: 7.5, cellPadding: 2.5,
          lineColor: [180, 180, 180], lineWidth: 0.15,
          textColor: secao.rowTxt,
          fillColor: secao.rowBg,
        },
        headStyles: {
          fillColor: secao.bannerBg, textColor: secao.bannerTxt,
          fontStyle: 'bold', fontSize: 8, cellPadding: 3,
        },
        alternateRowStyles: { fillColor: secao.rowAltBg },
        columnStyles: COL_STYLES,
      });
      yPos = doc.lastAutoTable.finalY + 6;
    }

    const pdfBlob = doc.output('blob');

    // Upload SharePoint via servidor
    btn.innerHTML = '<i data-lucide="cloud-upload"></i><span>Enviando...</span>';
    lucide.createIcons();

    const ts      = new Date().toISOString().slice(0,19).replace('T','-').replace(':','h').replace(':','m');
    const nomeSem = `${d0.getDate()} a ${d6.getDate()} de ${mesNome} ${ano}`;
    const pasta   = `Obras e Clientes ${ano}/Programacao Estoque`;
    const arquivo = `Estoque - ${nomeSem} (${ts}).pdf`;

    // Download local automático
    const url = URL.createObjectURL(pdfBlob);
    const a   = document.createElement('a');
    a.href = url; a.download = arquivo; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    // Upload SharePoint
    await uploadPDFServidor(pdfBlob, pasta, arquivo);
    mostrarToast(`✅ Baixado e salvo no SharePoint: "${arquivo}"`, 'ok');

  } catch(e) {
    console.error('[exportarProgramacaoEstoque]', e);
    mostrarToast('Erro ao exportar: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="package"></i><span>Prog. Estoque</span>';
    lucide.createIcons();
  }
}

// ── REPLICAR AGENDAMENTO ──────────────────────────────────────
function toggleReplicar(ativo) {
  document.getElementById('replicar-wrap').style.display = ativo ? 'block' : 'none';
  if (ativo) atualizarPreviewRep();
}

function diasParaReplicar() {
  const inicio   = document.getElementById('f-data').value;
  const fim      = document.getElementById('f-data-fim-rep').value;
  const pularFds = document.getElementById('f-pular-fds')?.checked ?? true;
  const pularBloq = document.getElementById('f-pular-bloq')?.checked ?? true;
  if (!inicio || !fim || fim < inicio) return [];

  const dias = [];
  const cur  = new Date(inicio + 'T12:00');
  const end  = new Date(fim    + 'T12:00');
  while (cur <= end) {
    const iso = cur.toISOString().slice(0,10);
    const dow = cur.getDay(); // 0=dom, 6=sab
    if (pularFds && (dow === 0 || dow === 6)) { cur.setDate(cur.getDate()+1); continue; }
    if (pularBloq && diasBloqueados[iso])      { cur.setDate(cur.getDate()+1); continue; }
    dias.push(iso);
    cur.setDate(cur.getDate()+1);
  }
  return dias;
}

function atualizarPreviewRep() {
  if (!document.getElementById('f-replicar')?.checked) return;
  const dias = diasParaReplicar();
  const el   = document.getElementById('rep-preview');
  if (!el) return;
  if (!dias.length) { el.textContent = 'Nenhum dia selecionado.'; return; }
  const fmt = iso => new Date(iso+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  el.innerHTML = `<span style="color:var(--primary);font-weight:700">${dias.length} dias:</span> ` + dias.map(fmt).join(' · ');
}

// ── DIAS BLOQUEADOS (feriados + manual) ──────────────────────
function calcularPascoa(ano) {
  const a = ano % 19, b = Math.floor(ano/100), c = ano % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4;
  const l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const mes = Math.floor((h+l-7*m+114)/31);
  const dia = ((h+l-7*m+114) % 31) + 1;
  return new Date(ano, mes-1, dia);
}

function feriadosNacionais(ano) {
  const f = [];
  const add = (d, motivo) => f.push({ data: d, motivo });
  const iso = (d) => d.toISOString().slice(0,10);
  const fixed = (m, dia, motivo) => add(`${ano}-${String(m).padStart(2,'0')}-${String(dia).padStart(2,'0')}`, motivo);

  fixed(1,  1,  'Feriado Nacional: Confraternização Universal');
  fixed(4,  21, 'Feriado Nacional: Tiradentes');
  fixed(5,  1,  'Feriado Nacional: Dia do Trabalho');
  fixed(9,  7,  'Feriado Nacional: Independência do Brasil');
  fixed(10, 12, 'Feriado Nacional: Nossa Senhora Aparecida');
  fixed(11, 2,  'Feriado Nacional: Finados');
  fixed(11, 15, 'Feriado Nacional: Proclamação da República');
  fixed(11, 20, 'Feriado Nacional: Consciência Negra');
  fixed(12, 25, 'Feriado Nacional: Natal');

  const pascoa = calcularPascoa(ano);
  add(iso(new Date(pascoa.getTime() - 47*864e5)), 'Feriado Nacional: Carnaval (Segunda)');
  add(iso(new Date(pascoa.getTime() - 46*864e5)), 'Feriado Nacional: Carnaval (Terça)');
  add(iso(new Date(pascoa.getTime() -  2*864e5)), 'Feriado Nacional: Sexta-feira Santa');
  add(iso(pascoa), 'Feriado Nacional: Páscoa');
  add(iso(new Date(pascoa.getTime() + 60*864e5)), 'Feriado Nacional: Corpus Christi');

  return f;
}

async function carregarDiasBloqueados() {
  const ano = new Date().getFullYear();
  const { data } = await db.from('dias_bloqueados').select('*');
  diasBloqueados = {};
  (data || []).forEach(d => { diasBloqueados[d.data] = d; });

  // Auto-insere feriados dos próximos 2 anos se ainda não existirem
  for (const y of [ano, ano+1]) {
    for (const f of feriadosNacionais(y)) {
      if (!diasBloqueados[f.data]) {
        const { data: ins } = await db.from('dias_bloqueados')
          .insert({ data: f.data, motivo: f.motivo })
          .select().single();
        if (ins) diasBloqueados[ins.data] = ins;
      }
    }
  }
}

async function toggleBloqueioDia(dataStr) {
  if (diasBloqueados[dataStr]) {
    // Desbloquear
    const id = diasBloqueados[dataStr].id;
    const { error } = await db.from('dias_bloqueados').delete().eq('id', id);
    if (!error) { delete diasBloqueados[dataStr]; renderGrade(diasDaSemana(semanaOffset)); }
  } else {
    // Bloquear manualmente
    const motivo = prompt('Motivo do bloqueio (ex.: Feriado municipal, Recesso...):');
    if (!motivo || !motivo.trim()) return;
    const { data, error } = await db.from('dias_bloqueados')
      .insert({ data: dataStr, motivo: motivo.trim() })
      .select().single();
    if (!error && data) { diasBloqueados[dataStr] = data; renderGrade(diasDaSemana(semanaOffset)); }
  }
}

// ── ANOTAÇÕES POR DIA ────────────────────────────────────────
async function carregarAnotacoes() {
  const dias = diasDaSemana(semanaOffset);
  const ini  = fmtISO(dias[0]), fim = fmtISO(dias[6]);
  const { data } = await db.from('agenda_anotacoes').select('*').gte('data', ini).lte('data', fim);
  anotacoes = {};
  (data || []).forEach(a => { anotacoes[a.data] = a; });
}

function abrirNotaPanel(dataStr) {
  notaPanelDataAtual = dataStr;
  const d = new Date(dataStr + 'T12:00');
  const DIAS_FULL = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MESES_PT  = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  document.getElementById('nota-panel-data').textContent =
    `${DIAS_FULL[d.getDay()]}, ${d.getDate()} de ${MESES_PT[d.getMonth()]}`;
  const nota = anotacoes[dataStr];
  document.getElementById('nota-textarea').value = nota?.texto || '';
  document.getElementById('btn-nota-excluir').style.display = nota ? 'block' : 'none';
  document.getElementById('nota-panel').classList.add('aberto');
  document.getElementById('nota-overlay').style.display = 'block';
  lucide.createIcons();
  setTimeout(() => document.getElementById('nota-textarea').focus(), 150);
}

function fecharNotaPanel() {
  document.getElementById('nota-panel').classList.remove('aberto');
  document.getElementById('nota-overlay').style.display = 'none';
  notaPanelDataAtual = null;
}

async function salvarNota() {
  if (!notaPanelDataAtual) return;
  const texto = document.getElementById('nota-textarea').value.trim();
  if (!texto) { await excluirNota(); return; }
  const nota = anotacoes[notaPanelDataAtual];
  const payload = { data: notaPanelDataAtual, texto, atualizado_em: new Date().toISOString() };
  let res;
  if (nota?.id) {
    res = await db.from('agenda_anotacoes').update(payload).eq('id', nota.id).select().single();
  } else {
    res = await db.from('agenda_anotacoes').insert(payload).select().single();
  }
  if (res.data) {
    anotacoes[notaPanelDataAtual] = res.data;
    mostrarToast('✅ Anotação salva.', 'ok');
    fecharNotaPanel();
    renderGrade(diasDaSemana(semanaOffset));
  }
}

async function excluirNota() {
  const nota = anotacoes[notaPanelDataAtual];
  if (nota?.id) {
    await db.from('agenda_anotacoes').delete().eq('id', nota.id);
  }
  delete anotacoes[notaPanelDataAtual];
  mostrarToast('Anotação removida.', 'ok');
  fecharNotaPanel();
  renderGrade(diasDaSemana(semanaOffset));
}

// ── BLOQUEIOS DE TÉCNICOS ─────────────────────────────────────
let bloqueios = [];

async function carregarBloqueios() {
  const { data } = await db.from('tecnico_bloqueios').select('*').order('data_inicio');
  bloqueios = data || [];
}

// Verifica se técnico está bloqueado na data+hora do agendamento
function tecnicoBloqueadoNaData(tecnicoId, dataStr, horaAgendamento) {
  if (!dataStr) return null;
  return bloqueios.find(b => {
    if (String(b.tecnico_id) !== String(tecnicoId)) return false;
    if (dataStr < b.data_inicio || dataStr > b.data_fim) return false;
    // Sem horário definido = dia inteiro
    if (!b.hora_inicio || !b.hora_fim) return true;
    // Com horário: verifica se o agendamento cai no período
    if (!horaAgendamento) return true; // sem hora de agendamento → bloqueia por segurança
    const horaAg = horaAgendamento.slice(0,5);
    return horaAg >= b.hora_inicio.slice(0,5) && horaAg < b.hora_fim.slice(0,5);
  }) || null;
}

function descricaoPeriodoBloqueio(b) {
  if (!b.hora_inicio || !b.hora_fim) return 'Dia inteiro';
  return `${b.hora_inicio.slice(0,5)} – ${b.hora_fim.slice(0,5)}`;
}

function toggleBloqueioHoras() {
  const tipo = document.getElementById('bl-tipo').value;
  document.getElementById('bl-horas-wrap').style.display = tipo === 'personalizado' ? 'grid' : 'none';
}

function abrirModalBloqueio() {
  const sel = document.getElementById('bl-tecnico');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    tecnicos.map(t => `<option value="${t.id}">${escHtml(t.nome)}</option>`).join('');
  document.getElementById('bl-tipo').value = 'dia_inteiro';
  document.getElementById('bl-horas-wrap').style.display = 'none';
  renderBloqueiosLista();
  document.getElementById('overlay-bloqueio').style.display = 'flex';
  lucide.createIcons();
}

function fecharModalBloqueio() {
  document.getElementById('overlay-bloqueio').style.display = 'none';
}

function renderBloqueiosLista() {
  const el = document.getElementById('bloqueios-lista');
  if (!bloqueios.length) {
    el.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:8px 0">Nenhum bloqueio cadastrado.</div>';
    return;
  }
  const fmt = d => new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  el.innerHTML = bloqueios.map(b => {
    const tec    = tecnicos.find(t => t.id === b.tecnico_id);
    const periodo = descricaoPeriodoBloqueio(b);
    const datas  = b.data_inicio === b.data_fim ? fmt(b.data_inicio) : `${fmt(b.data_inicio)} → ${fmt(b.data_fim)}`;
    return `<div class="bloqueio-item">
      <div style="flex:1;min-width:0">
        <div class="bloqueio-nome">${escHtml(tec?.nome || '—')}</div>
        <div class="bloqueio-info">${datas} · <strong style="color:var(--text-2)">${periodo}</strong></div>
        <div class="bloqueio-motivo">${escHtml(b.motivo)}</div>
      </div>
      <button class="bloqueio-del" onclick="excluirBloqueio(${b.id})" title="Remover">
        <i data-lucide="trash-2" style="width:14px;height:14px"></i>
      </button>
    </div>`;
  }).join('');
  lucide.createIcons();
}

async function salvarBloqueio() {
  const tecId  = document.getElementById('bl-tecnico').value;
  const inicio = document.getElementById('bl-inicio').value;
  const fim    = document.getElementById('bl-fim').value;
  const motivo = document.getElementById('bl-motivo').value.trim();
  const tipo   = document.getElementById('bl-tipo').value;
  const erroEl = document.getElementById('bl-erro');

  if (!tecId || !inicio || !fim || !motivo) {
    erroEl.textContent = 'Preencha todos os campos.';
    erroEl.style.display = 'block'; return;
  }
  if (fim < inicio) {
    erroEl.textContent = 'Data fim deve ser igual ou posterior à data início.';
    erroEl.style.display = 'block'; return;
  }
  erroEl.style.display = 'none';

  // Resolve hora_inicio e hora_fim conforme tipo
  let hora_inicio = null, hora_fim = null;
  if (tipo === 'manha')        { hora_inicio = '00:00'; hora_fim = '12:00'; }
  else if (tipo === 'tarde')   { hora_inicio = '12:00'; hora_fim = '23:59'; }
  else if (tipo === 'personalizado') {
    hora_inicio = document.getElementById('bl-hora-inicio').value;
    hora_fim    = document.getElementById('bl-hora-fim').value;
    if (!hora_inicio || !hora_fim) {
      erroEl.textContent = 'Informe a hora de início e fim.';
      erroEl.style.display = 'block'; return;
    }
  }
  // dia_inteiro: hora_inicio e hora_fim ficam null

  const { data, error } = await db.from('tecnico_bloqueios').insert({
    tecnico_id: parseInt(tecId), data_inicio: inicio, data_fim: fim,
    motivo, hora_inicio, hora_fim
  }).select().single();

  if (error) { erroEl.textContent = 'Erro: ' + error.message; erroEl.style.display = 'block'; return; }

  bloqueios.push(data);
  document.getElementById('bl-tecnico').value = '';
  document.getElementById('bl-inicio').value  = '';
  document.getElementById('bl-fim').value     = '';
  document.getElementById('bl-motivo').value  = '';
  document.getElementById('bl-tipo').value    = 'dia_inteiro';
  document.getElementById('bl-horas-wrap').style.display = 'none';
  renderBloqueiosLista();
}

async function excluirBloqueio(id) {
  const { error } = await db.from('tecnico_bloqueios').delete().eq('id', id);
  if (error) return;
  bloqueios = bloqueios.filter(b => b.id !== id);
  renderBloqueiosLista();
}
