<!DOCTYPE html>
<!-- build: 2026-06-01p -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — Agenda Técnica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0A0A0A;
      --surface-1:    #111111;
      --surface-2:    #161616;
      --surface-3:    #1B1B1B;
      --primary:      #3ECF8E;
      --secondary:    #4F46E5;
      --text-1:       #FFFFFF;
      --text-2:       #A1A1AA;
      --text-3:       #52525B;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
    .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

    /* ── Barra de controles ── */
    .controles {
      max-width: 1400px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .semana-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .semana-nav button {
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms, color 150ms;
    }

    .semana-nav button i { width: 16px; height: 16px; }
    .semana-nav button:hover { border-color: var(--border-hover); color: var(--text-1); }

    .semana-nav span {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-1);
      min-width: 230px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .filtros-equipe {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filtro-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }

    .filtro-btn:hover { border-color: var(--border-hover); color: var(--text-1); }

    .filtro-btn.ativo {
      background: rgba(62,207,142,0.12);
      border-color: rgba(62,207,142,0.35);
      color: var(--primary);
    }

    .btn-novo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 150ms, transform 150ms;
      font-family: inherit;
    }

    .btn-novo i { width: 15px; height: 15px; }
    .btn-novo:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── Grade semanal ── */
    .grade {
      max-width: 1400px;
      margin: 20px auto 48px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(7, minmax(170px, 1fr));
      gap: 10px;
    }

    @media (max-width: 900px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .grade { grid-template-columns: 1fr; } }

    /* ── Coluna do dia ── */
    .coluna {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .coluna-header {
      padding: 12px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dia-nome {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    .dia-data {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .dia-data.hoje { color: var(--primary); }
    .btn-nota { display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-3);transition:color .15s,border-color .15s,background .15s;position:relative; }
    .btn-nota:hover { color:#FBBF24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08); }
    .btn-nota.tem-nota { color:#FBBF24;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08); }
    .btn-nota i { width:12px;height:12px; }
    .nota-dot { position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#FBBF24; }
    /* Painel lateral de anotações */
    .nota-panel { position:fixed;top:0;right:-380px;width:360px;height:100vh;background:var(--surface-1);border-left:1px solid var(--border);z-index:500;display:flex;flex-direction:column;transition:right .25s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 32px rgba(0,0,0,.4); }
    .nota-panel.aberto { right:0; }
    .nota-panel-header { padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0; }
    .nota-panel-titulo { font-size:14px;font-weight:700;color:var(--text-1); }
    .nota-panel-data { font-size:11px;color:var(--text-3);margin-top:2px; }
    .nota-panel-body { flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto; }
    .nota-textarea { flex:1;min-height:200px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-1);font-family:inherit;font-size:13px;line-height:1.6;padding:12px 14px;resize:none;outline:none;transition:border-color .15s; }
    .nota-textarea:focus { border-color:rgba(251,191,36,.4); }
    .nota-textarea::placeholder { color:var(--text-3); }
    .nota-panel-footer { padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0; }
    .btn-nota-salvar { flex:1;height:38px;background:#FBBF24;border:none;border-radius:6px;color:#0A0A0A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s; }
    .btn-nota-salvar:hover { opacity:.88; }
    .btn-nota-excluir { height:38px;padding:0 14px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-3);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s; }
    .btn-nota-excluir:hover { color:#f87171;border-color:rgba(239,68,68,.3); }
    .nota-fechar { background:none;border:none;cursor:pointer;color:var(--text-3);display:flex;padding:4px;border-radius:4px; }
    .nota-fechar:hover { color:var(--text-1);background:rgba(255,255,255,.06); }
    .nota-fechar i { width:16px;height:16px; }
    .coluna.bloqueada { border-color: rgba(239,68,68,.4); }
    .coluna.bloqueada .coluna-header { background: rgba(239,68,68,.1); border-bottom-color: rgba(239,68,68,.25); }
    .coluna.bloqueada .dia-nome { color: #f87171; }
    .coluna.bloqueada .dia-data { color: #f87171; }
    .bloqueio-tag { font-size:10px; font-weight:700; color:#f87171; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.25); border-radius:4px; padding:2px 6px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
    .btn-lock { display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-3);transition:color .15s,border-color .15s,background .15s; }
    .btn-lock:hover { color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08); }
    .btn-lock.ativo { color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1); }
    .btn-lock i { width:12px;height:12px; }

    /* ── Botão disparar dia (dentro do header de cada coluna) ── */
    .btn-dispatch-dia {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      background: rgba(37,211,102,0.08);
      border: 1px solid rgba(37,211,102,0.22);
      border-radius: var(--radius-input);
      color: #25D366; cursor: pointer; flex-shrink: 0;
      transition: background 150ms, border-color 150ms;
    }
    .btn-dispatch-dia:hover { background: rgba(37,211,102,0.18); border-color: rgba(37,211,102,0.45); }
    .btn-dispatch-dia svg { width: 12px; height: 12px; flex-shrink: 0; }

    .btn-add {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 22px;
      height: 22px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 150ms, color 150ms, background 150ms;
    }

    .btn-add i { width: 14px; height: 14px; }
    .btn-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(62,207,142,0.08); }

    .coluna-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .coluna-vazia {
      text-align: center;
      padding: 24px 8px;
      color: var(--text-3);
      font-size: 0.75rem;
    }

    /* ── Cards de agendamento ── */
    .card-ag {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 3px solid;
      cursor: pointer;
      transition: opacity 150ms, transform 150ms;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .card-ag:hover { opacity: 0.85; transform: translateX(2px); }

    /* confirmado = AZUL */
    .card-confirmado   { background: rgba(59,130,246,0.07);  border-color: #3b82f6; }
    /* nao_confirmado = AMARELO */
    .card-nao_confirmado { background: rgba(234,179,8,0.07); border-color: #eab308; }
    /* viagem = VERDE */
    .card-viagem       { background: rgba(34,197,94,0.07);   border-color: #22c55e; }

    .ag-tecs    { font-weight: 700; color: var(--text-1); margin-bottom: 3px; }
    .ag-hora    { font-weight: 700; color: var(--primary); font-size: 0.84rem; flex-shrink: 0; }
    .ag-cliente { font-weight: 700; color: var(--text-1); font-size: 0.82rem; line-height: 1.3; }

    /* ── Detalhes do card (coluna única compacta) ── */
    .ag-detalhes {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 4px;
      margin-top: 4px;
    }
    .ag-detalhe {
      font-size: 0.7rem;
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-top: 2px;
      line-height: 1.3;
      min-width: 0;
    }
    .ag-label {
      color: var(--text-2);
      font-weight: 600;
      flex-shrink: 0;
      white-space: nowrap;
      min-width: 50px;
    }
    .ag-val {
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .ag-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* badges */
    .badge-confirmado     { background: rgba(30,58,138,0.6);   color: #bfdbfe; }
    .badge-nao_confirmado { background: rgba(113,63,18,0.6);   color: #fef08a; }
    .badge-viagem         { background: rgba(20,83,45,0.6);    color: #86efac; }

    /* ── Spinner ── */
    .spinner-wrap { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-3); }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal de detalhe do agendamento ── */
    .det-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .det-hora-badge {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .det-cliente {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      line-height: 1.3;
      letter-spacing: -0.02em;
      flex: 1;
    }
    .det-fechar {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: inherit;
      transition: color 150ms, border-color 150ms;
    }
    .det-fechar:hover { color: var(--text-1); border-color: var(--border-hover); }
    .det-fechar i { width: 14px; height: 14px; }

    .det-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
    .det-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 6px 12px;
      align-items: start;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .det-row:last-child { border-bottom: none; }
    .det-lbl {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: 2px;
    }
    .det-vlr {
      font-size: 0.88rem;
      color: var(--text-1);
      line-height: 1.5;
      word-break: break-word;
    }
    .det-vlr.muted { color: var(--text-2); }
    .det-status-wrap { margin-top: 16px; }
    .det-status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    /* card-ag clicável no modo visualização */
    .card-ag.clicavel { cursor: pointer !important; }
    .card-ag.clicavel:hover { opacity: 0.85; transform: translateX(2px); }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-header-icon i { width: 16px; height: 16px; color: var(--primary); }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-group label .label-hint {
      color: var(--text-3);
      font-weight: 400;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      color: var(--text-1);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      font-family: inherit;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--text-3); }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .form-group select option { background: var(--surface-2); color: var(--text-1); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Separador de seção ── */
    .form-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Tipo serviço radio ── */
    .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-option { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: var(--text-2); transition: border-color .15s, color .15s; }
    .radio-option input[type="radio"] { accent-color: var(--primary); width: 15px; height: 15px; }
    .radio-option:has(input:checked) { border-color: var(--primary); color: var(--text-1); background: var(--primary-muted); }

    /* ── Equipe multi-select ── */
    .equipe-select { position: relative; }
    .equipe-search { padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .equipe-search input {
      width: 100%; box-sizing: border-box;
      background: var(--surface-3, #111); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text-1); font-size: 0.82rem;
      padding: 6px 10px; outline: none; font-family: inherit;
    }
    .equipe-search input:focus { border-color: var(--primary); }
    .equipe-item-definir { border-bottom: 1px solid var(--border); }

    .equipe-trigger {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 40px;
      gap: 8px;
      transition: border-color 150ms, box-shadow 150ms;
      user-select: none;
    }

    .equipe-trigger:hover { border-color: var(--border-hover); }

    .equipe-trigger.aberto {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .equipe-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .equipe-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.25);
      border-radius: 4px;
      padding: 2px 7px 2px 9px;
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .equipe-chip-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      padding: 0 1px;
      line-height: 1;
      font-size: 15px;
      opacity: 0.6;
      display: flex;
      align-items: center;
    }

    .equipe-chip-del:hover { opacity: 1; }

    .equipe-placeholder { color: var(--text-3); font-size: 0.84rem; }

    .equipe-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-3);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .equipe-arrow.rotated { transform: rotate(180deg); }

    .equipe-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-input);
      z-index: 300;
      max-height: 210px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
    }

    .equipe-dropdown.aberto { display: block; }

    .equipe-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 120ms;
      font-size: 0.82rem;
    }

    .equipe-item:hover { background: rgba(255,255,255,0.04); }
    .equipe-item.selecionado { background: rgba(62,207,142,0.06); }

    .equipe-item input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .equipe-item-nome { color: var(--text-1); font-weight: 500; flex: 1; }
    .equipe-item-funcao {
      color: var(--text-3);
      font-size: 0.72rem;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Footer do modal ── */
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .btn-cancelar {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 150ms, color 150ms;
    }

    .btn-cancelar:hover { border-color: var(--border-hover); color: var(--text-1); }

    .btn-salvar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: opacity 150ms;
    }

    .btn-salvar:hover { opacity: 0.88; }
    .btn-salvar:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-excluir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-input);
      color: #f87171;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      margin-right: auto;
      transition: background 150ms, border-color 150ms;
    }

    .btn-excluir:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.35); }
    .btn-excluir i { width: 14px; height: 14px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 9999;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s;
      opacity: 0;
      white-space: nowrap;
    }
    .toast.visivel { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast-icon.ok { background: rgba(62,207,142,0.15); color: #3ECF8E; }
    .toast-icon.err { background: rgba(239,68,68,0.15); color: #ef4444; }
    .toast-icon svg { width: 12px; height: 12px; }

    /* ── Card de agenda (renderizado pelo html2canvas, fora da tela) ── */
    #agenda-card {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1500px;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      border-radius: 14px;
      overflow: hidden;
    }
    .ac-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 24px 28px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .ac-brand { font-size: 13px; font-weight: 700; color: #3ECF8E; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
    .ac-titulo { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; line-height: 1.1; }
    .ac-data { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 6px; font-weight: 500; }
    .ac-icon { width: 40px; height: 40px; background: rgba(62,207,142,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #3ECF8E; font-size: 20px; flex-shrink: 0; }
    .ac-body { padding: 20px 24px; }
    .ac-atendimento { background: #f8fafc; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .ac-atendimento:last-child { margin-bottom: 0; }
    .ac-at-header { padding: 9px 16px; font-size: 11px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 0.09em; display: flex; align-items: center; gap: 7px; }
    .ac-at-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.5); flex-shrink: 0; }
    .ac-campos { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .ac-campo { display: flex; align-items: flex-start; gap: 0; }
    .ac-campo-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; width: 68px; flex-shrink: 0; padding-top: 1px; }
    .ac-campo-valor { font-size: 13px; font-weight: 500; color: #0f172a; line-height: 1.45; flex: 1; }
    .ac-campo-valor.destaque { font-weight: 700; font-size: 14px; color: #0f172a; }
    .ac-footer { padding: 14px 24px; background: #f1f5f9; border-top: 1px solid #e2e8f0; text-align: center; }
    .ac-footer-txt { font-size: 11px; color: #94a3b8; font-weight: 500; letter-spacing: 0.03em; }

    /* ── Botão WhatsApp ── */
    .btn-whatsapp {
      display: none; /* mostrado via JS apenas para agendamento/coordenador/supervisor */
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.3);
      border-radius: var(--radius-input);
      color: #25D366;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms, border-color 150ms, transform 150ms;
      font-family: inherit;
    }
    .btn-whatsapp:hover { background: rgba(37,211,102,0.2); border-color: rgba(37,211,102,0.5); transform: translateY(-1px); }
    .btn-whatsapp svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── Botão programação semanal ── */
    .btn-semana-tec {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      background: rgba(139,92,246,0.10);
      border: 1px solid rgba(139,92,246,0.30);
      border-radius: var(--radius-input);
      color: #A78BFA;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms, border-color 150ms, transform 150ms;
      font-family: inherit;
    }
    .btn-semana-tec:hover { background: rgba(139,92,246,0.18); border-color: rgba(139,92,246,0.50); transform: translateY(-1px); }
    .btn-semana-tec i { width: 15px; height: 15px; }
    .btn-bloqueio {
      display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 36px;
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px; color: #f87171; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background .15s, border-color .15s, transform .15s;
    }
    .btn-bloqueio:hover { background: rgba(239,68,68,0.16); border-color: rgba(239,68,68,0.5); transform: translateY(-1px); }
    .btn-bloqueio i { width: 15px; height: 15px; }
    .bloqueio-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface-2); border-radius:7px; margin-bottom:6px; }
    .bloqueio-nome { font-size:13px; font-weight:600; color:var(--text-1); flex:1; min-width:0; }
    .bloqueio-info { font-size:11px; color:var(--text-3); }
    .bloqueio-motivo { font-size:11px; color:#f87171; font-weight:600; }
    .bloqueio-del { background:none; border:none; cursor:pointer; color:var(--text-3); padding:4px; border-radius:4px; display:flex; }
    .bloqueio-del:hover { color:#f87171; background:rgba(239,68,68,.1); }

    /* ── Botão exportar agenda → SharePoint ── */
    .btn-exportar-sp {
      display: none; /* mostrado via JS apenas para agendamento/coordenador/supervisor */
      align-items: center; gap: 7px;
      padding: 7px 14px; border-radius: 7px;
      background: rgba(62,207,142,0.10);
      border: 1px solid rgba(62,207,142,0.30);
      color: var(--primary);
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s;
      white-space: nowrap;
    }
    .btn-exportar-sp:hover { background: rgba(62,207,142,0.18); border-color: rgba(62,207,142,0.55); transform: translateY(-1px); }
    .btn-exportar-sp:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-exportar-sp i { width: 15px; height: 15px; }

    /* ── Date input para dispatch ── */
    .input-data-dispatch {
      height: 36px;
      padding: 0 10px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-1);
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 150ms;
      width: 140px;
    }
    .input-data-dispatch:hover, .input-data-dispatch:focus { border-color: var(--border-hover); }
    .input-data-dispatch::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }

    /* ── Grupo ações direita ── */
    .controles-acoes {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
  
  /* ── TEMA CLARO ── */
  :root[data-theme="light"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); }
  @media (prefers-color-scheme: light) { :root[data-theme="auto"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); } }
  .tema-btn { background:transparent; border:1px solid var(--border-strong,rgba(255,255,255,.12)); border-radius:6px; color:var(--text-2,#A1A1AA); font-size:15px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-right:8px; flex-shrink:0; }
  .tema-btn:hover { background:rgba(128,128,128,.1); }

  /* ── RESPONSIVO ── */
  @media (max-width: 1024px) {
    .topbar-links a { font-size: 12px; padding: 5px 9px; }
  }
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; }
    .topbar-greeting { display: none !important; }
    .topbar-links { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .topbar-links a { font-size: 12px; padding: 5px 8px; white-space: nowrap; }
    .container { padding: 0 12px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    main { padding: 20px 12px !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .form-row { grid-template-columns: 1fr !important; }
    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .card { padding: 16px !important; }
    .page-header h1 { font-size: 18px !important; }
    .modal, .modal-content { border-radius: 0 !important; max-width: 100% !important; max-height: 100dvh !important; }
    .modal-overlay, .overlay { padding: 0 !important; align-items: flex-end !important; }
    table { font-size: 12px; min-width: 500px; }
    .table-wrap, .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  @media (max-width: 480px) {
    .topbar-logo { font-size: 13px; }
    .stats-grid { grid-template-columns: 1fr !important; }
    .stat-card { padding: 14px !important; }
    .btn, button { font-size: 12px; }
  }

  /* ── Mobile: evita auto-zoom iOS (inputs precisam de 16px) ── */
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
</style>

<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<!-- Controles -->
<div class="controles">
  <div class="semana-nav">
    <button onclick="mudarSemana(-1)"><i data-lucide="chevron-left"></i></button>
    <span id="periodo-label">—</span>
    <button onclick="mudarSemana(1)"><i data-lucide="chevron-right"></i></button>
  </div>

  <div class="filtros-equipe" id="filtros-equipe">
    <button class="filtro-btn ativo" data-equipe="todas">Todas equipes</button>
  </div>

  <div class="controles-acoes">
    <!-- Botão exportar agenda da semana para SharePoint -->
    <button class="btn-exportar-sp" id="btn-exportar-sp" onclick="exportarAgendaSharePoint()" title="Salvar PDF da semana no SharePoint">
      <i data-lucide="cloud-upload"></i>
      <span>Exportar → SharePoint</span>
    </button>

    <!-- Botão programação semanal de técnico (substitui o antigo disparar-dia fixo) -->
    <button class="btn-semana-tec" id="btn-semana-tec" onclick="abrirModalSemana()" title="Gerar e disparar programação semanal de um técnico">
      <i data-lucide="calendar-range"></i>
      <span>Prog. semanal</span>
    </button>

    <!-- Date picker: seleciona o dia a disparar -->
    <input type="date" id="data-dispatch" class="input-data-dispatch" title="Selecionar data para disparar agenda">

    <!-- Disparar agenda do dia selecionado -->
    <button class="btn-whatsapp" id="btn-whatsapp" onclick="dispararAgendaWhatsapp()" title="Gerar imagem da agenda do dia selecionado e copiar pro clipboard">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <span>Disparar dia</span>
    </button>

    <button class="btn-exportar-sp" id="btn-estoque" onclick="exportarProgramacaoEstoque()" title="Gerar PDF semanal para o estoque com motoristas" style="background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.3);color:#A5B4FC">
      <i data-lucide="package"></i>
      <span>Prog. Estoque</span>
    </button>

    <button class="btn-bloqueio" id="btn-bloqueio" onclick="abrirModalBloqueio()" title="Gerenciar bloqueios de técnicos">
      <i data-lucide="user-x"></i>
      Bloqueios
    </button>

    <button class="btn-novo" id="btn-novo" onclick="abrirModal()">
      <i data-lucide="plus"></i>
      Novo agendamento
    </button>
  </div>
</div>

<!-- Modal Bloqueio de Técnico -->
<div class="overlay" id="overlay-bloqueio" style="display:none" onclick="if(event.target===this)fecharModalBloqueio()" role="presentation">
  <div class="modal" style="max-width:540px;max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
    <h2 style="margin-bottom:16px;display:flex;align-items:center;gap:8px"><i data-lucide="user-x"></i> Bloqueios de Técnicos</h2>

    <!-- Lista de bloqueios ativos -->
    <div id="bloqueios-lista" style="margin-bottom:20px"></div>

    <!-- Formulário novo bloqueio -->
    <div style="border-top:1px solid var(--border);padding-top:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:12px">Novo bloqueio</div>

      <div class="form-group" style="margin-bottom:10px">
        <label>Técnico</label>
        <select id="bl-tecnico"><option value="">Selecione...</option></select>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="form-group" style="margin:0">
          <label>Data início</label>
          <input type="date" id="bl-inicio">
        </div>
        <div class="form-group" style="margin:0">
          <label>Data fim</label>
          <input type="date" id="bl-fim">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:10px">
        <label>Período do bloqueio</label>
        <select id="bl-tipo" onchange="toggleBloqueioHoras()">
          <option value="dia_inteiro">Dia inteiro</option>
          <option value="manha">Manhã (até 12:00)</option>
          <option value="tarde">Tarde (12:00 em diante)</option>
          <option value="personalizado">Horário específico</option>
        </select>
      </div>

      <div id="bl-horas-wrap" style="display:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="form-group" style="margin:0">
          <label>Hora início</label>
          <input type="time" id="bl-hora-inicio" value="13:00">
        </div>
        <div class="form-group" style="margin:0">
          <label>Hora fim</label>
          <input type="time" id="bl-hora-fim" value="15:00">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:12px">
        <label>Motivo</label>
        <input type="text" id="bl-motivo" placeholder="Ex.: Consulta médica, Férias, Atestado...">
      </div>
      <div id="bl-erro" style="color:#f87171;font-size:12px;margin-bottom:8px;display:none"></div>
      <button onclick="salvarBloqueio()" style="width:100%;height:40px;background:var(--primary);border:none;border-radius:6px;color:#0A0A0A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
        <i data-lucide="plus" style="display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:4px"></i>Adicionar bloqueio
      </button>
    </div>
  </div>

<script>

// ── Estado ──────────────────────────────────────────────────
let semanaOffset          = 0;
let filtroEquipe          = 'todas';
let agendamentos          = [];
let diasBloqueados        = {}; // { 'YYYY-MM-DD': { id, motivo } }
let agendarEmDiaBloqueado = false;
let pendenciaOrigemId     = null; // preenchido ao vir de pendencias.html
let anotacoes             = {}; // { 'YYYY-MM-DD': { id, texto } }
let notaPanelDataAtual    = null;
let jwtToken          = null;
let obras             = [];
let tecnicos          = [];
let tecnicoEquipes    = [];
let equipesDisponiveis = []; // { id, nome } — carregadas do banco
let agEditandoId      = null;
let equipesSelecionadas = []; // array de IDs (string)
let equipeDropdownAberto = false;
let modoVisualizacao  = false;
let roleAtual         = null;
// numero_os agora vem direto do agendamento (campo ag.numero_os)
const DIAS  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const STATUS_LABEL = {
  confirmado:     'Confirmado',
  nao_confirmado: 'Não confirmado',
  viagem:         'Viagem',
};

// ── Init ─────────────────────────────────────────────────────
let _authUserId = null;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  jwtToken    = session.access_token;
  _authUserId = session.user.id;

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();
  renderTopbar(eu?.nome, eu?.role, 'agenda');
  roleAtual = eu?.role;

  const podeEditar = ['agendamento', 'coordenador', 'supervisor'].includes(roleAtual);
  const podeDisparar = ['agendamento', 'coordenador', 'supervisor'].includes(roleAtual);

  if (!podeEditar) {
    modoVisualizacao = true;
    const btnNovo = document.getElementById('btn-novo');
    if (btnNovo) btnNovo.style.display = 'none';
  }

  // Inicializa date picker com hoje
  const dpEl = document.getElementById('data-dispatch');
  if (dpEl) dpEl.value = fmtISO(new Date());

  if (podeDisparar) {
    const btnWa = document.getElementById('btn-whatsapp');
    if (btnWa) btnWa.style.display = 'inline-flex';
    const dpWrap = document.getElementById('data-dispatch');
    if (dpWrap) dpWrap.style.display = 'inline-block';
    const btnSem = document.getElementById('btn-semana-tec');
    if (btnSem) btnSem.style.display = 'inline-flex';
    const btnSp = document.getElementById('btn-exportar-sp');
    if (btnSp) btnSp.style.display = 'inline-flex';
    const btnEst = document.getElementById('btn-estoque');
    if (btnEst) btnEst.style.display = 'inline-flex';
  } else {
    const dpWrap = document.getElementById('data-dispatch');
    if (dpWrap) dpWrap.style.display = 'none';
    const btnSem = document.getElementById('btn-semana-tec');
    if (btnSem) btnSem.style.display = 'none';
  }

  await Promise.all([carregarObras(), carregarTecnicos(), carregarBloqueios(), carregarDiasBloqueados(), carregarAnotacoes()]);
  preencherSelects();
  await carregarAgenda();

  // Pré-preenche modal se veio de uma pendência
  const params = new URLSearchParams(location.search);
  if (params.has('pendencia_id') && podeEditar) {
    pendenciaOrigemId = parseInt(params.get('pendencia_id'));
    await abrirModal();
    const obraId      = params.get('obra_id');
    const clienteOutro= params.get('cliente_outro');
    const servico     = params.get('servico');

    if (obraId) {
      const sel = document.getElementById('f-obra');
      if (sel) { sel.value = obraId; onObraChange(); }
    } else if (clienteOutro) {
      const sel = document.getElementById('f-obra');
      if (sel) { sel.value = 'outro'; onObraChange(); }
      const nomeEl = document.getElementById('f-nome-outro');
      if (nomeEl) nomeEl.value = clienteOutro;
    }
    if (servico) {
      const srvEl = document.getElementById('f-servico');
      if (srvEl) srvEl.value = decodeURIComponent(servico);
    }
    history.replaceState({}, '', 'agenda.html');
  }
}
// ── Datas ────────────────────────────────────────────────────
function getSegunda(offset = 0) {
  const hoje = new Date();
  const dia  = hoje.getDay() || 7;
  const seg  = new Date(hoje);
  seg.setDate(hoje.getDate() - dia + 1 + offset * 7);
  seg.setHours(0,0,0,0);
  return seg;
}

function diasDaSemana(offset) {
  const seg = getSegunda(offset);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(seg);
    d.setDate(seg.getDate() + i);
    return d;
  });
}

function fmtISO(d) { return d.toISOString().split('T')[0]; }
function fmtBR(d)  { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }

function isHoje(d) {
  const h = new Date();
  return d.getDate()===h.getDate() && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
}

// ── Carregar dados ───────────────────────────────────────────
async function carregarObras() {
  obras = await cachedQuery('agenda-obras', 300, async () => {
    const { data } = await db.from('obras').select('id, nome_cliente, endereco, situacao').order('nome_cliente');
    return data || [];
  });
}

async function carregarTecnicos() {
  const [t, te, eq] = await Promise.all([
    cachedQuery('agenda-tecnicos', 600, async () => {
      let { data: d, error: e1 } = await db.from('tecnicos').select('id, nome, funcao').order('nome');
      if (e1 || !d) {
        const { data: d2 } = await db.from('tecnicos').select('id, nome').order('nome');
        d = (d2 || []).map(x => ({ ...x, funcao: '' }));
      }
      return d || [];
    }),
    cachedQuery('agenda-tecnico-equipes', 600, async () => {
      const { data } = await db.from('tecnico_equipes').select('tecnico_id, equipe_id');
      return data || [];
    }),
    cachedQuery('agenda-equipes', 3600, async () => {
      const { data } = await db.from('equipes').select('id, nome').order('nome');
      return data || [];
    }),
  ]);
  tecnicos           = t;
  tecnicoEquipes     = te;
  equipesDisponiveis = eq;
  renderFiltrosEquipe();
}

// Equipes internas sem agenda própria — não aparecem como filtro na grade
const EQUIPES_SEM_AGENDA = new Set(['comercial', 'gestão', 'gestao', 'projetos', 'vistoria']);

function renderFiltrosEquipe() {
  const container = document.getElementById('filtros-equipe');
  if (!container) return;
  const comAgenda = equipesDisponiveis.filter(
    eq => !EQUIPES_SEM_AGENDA.has((eq.nome || '').toLowerCase())
  );
  // Remover botões antigos exceto "Todas equipes"
  container.innerHTML = '<button class="filtro-btn ativo" data-equipe="todas">Todas equipes</button>'
    + comAgenda.map(eq =>
        `<button class="filtro-btn" data-equipe="${eq.id}">${escHtml(eq.nome)}</button>`
      ).join('');
  container.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      filtroEquipe = btn.dataset.equipe;
      renderGrade(diasDaSemana(semanaOffset));
    });
  });
}

async function carregarAgenda() {
  const dias = diasDaSemana(semanaOffset);
  const ini  = fmtISO(dias[0]);
  const fim  = fmtISO(dias[6]);

  document.getElementById('periodo-label').textContent =
    `${DIAS[0]}, ${fmtBR(dias[0])} — ${DIAS[6]}, ${fmtBR(dias[6])}`;

  const agResult = await db.from('agendamentos')
    .select('*, numero_os, motorista_id, obras(nome_cliente, endereco, arquiteto_responsavel, consultores(nome))')
    .gte('data', ini).lte('data', fim).order('hora_inicio');

  if (agResult.error) {
    document.getElementById('grade').innerHTML =
      `<div class="spinner-wrap" style="flex-direction:column;gap:12px;">
        <p style="color:#f87171">Erro ao carregar: ${escHtml(agResult.error.message)}</p>
        <button onclick="carregarAgenda()" style="padding:7px 18px;background:var(--primary);border:none;border-radius:6px;color:#000;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">Tentar novamente</button>
      </div>`;
    return;
  }

  agendamentos = (agResult.data || []).filter(ag => ag.cliente_outro !== 'Plantão de automação e rede');

  renderGrade(dias);
}

// ── Filtro por equipe ────────────────────────────────────────
function tecnicosDaEquipe(equipeId) {
  return tecnicoEquipes.filter(te => te.equipe_id === equipeId).map(te => te.tecnico_id);
}

function agendamentosVisiveis() {
  if (filtroEquipe === 'todas') return agendamentos;
  const ids = tecnicosDaEquipe(parseInt(filtroEquipe));
  return agendamentos.filter(ag =>
    ids.includes(ag.tecnico_id)   ||
    ids.includes(ag.auxiliar_id)  ||
    ids.includes(ag.auxiliar2_id) ||
    ids.includes(ag.auxiliar3_id)
  );
}

// ── Card de agendamento ──────────────────────────────────────
function cardHTML(ag) {
  const status = ag.status || 'confirmado';

  const ids   = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
  const nomes = ids.map(id => {
    const t = tecnicos.find(t => t.id === id);
    return t ? t.nome.split(' ')[0] : null;
  }).filter(Boolean);

  const tecs      = nomes.join(' · ') || '—';
  const cliente   = ag.obras?.nome_cliente || ag.cliente_outro || '—';
  const end       = ag.endereco_outro || ag.obras?.endereco || '';
  const hora      = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '';
  const osNum     = ag.numero_os || null;
  const consultor = ag.obras?.consultores?.nome || '';
  const arquiteto = ag.obras?.arquiteto_responsavel || '';

  // Linha de campo — label fixo + valor truncado em 1 linha (title = tooltip com valor completo)
  const det = (label, val) =>
    val ? `<div class="ag-detalhe"><span class="ag-label">${label}</span><span class="ag-val" title="${escHtml(val)}">${escHtml(val)}</span></div>` : '';

  // Modo visualização (técnico) → abre detalhe; modo edição → abre formulário de edição
  const clickAttr = modoVisualizacao
    ? `onclick="verDetalheAgendamento(${ag.id})" title="Ver detalhes"`
    : `onclick="editarAgendamento(${ag.id})" title="Clique para editar"`;

  return `
    <div class="card-ag card-${status} clicavel" ${clickAttr}>
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px;">
        ${hora ? `<span class="ag-hora">${escHtml(hora)}</span>` : ''}
        <span class="ag-cliente">${escHtml(cliente)}</span>
      </div>
      <div class="ag-detalhes">
        ${det('Técnico',   tecs)}
        ${det('Endereço',  end)}
        ${det('OS',        osNum ? `#${osNum}` : '')}
        ${det('Consultor', consultor)}
        ${det('Arquiteto', arquiteto)}
        ${det('Serviço',   ag.servico || '')}
        ${det('Veículo',   ag.veiculo || '')}
      </div>
      <span class="ag-badge badge-${escHtml(status)}" style="margin-top:5px;">${escHtml(STATUS_LABEL[status] || status)}</span>
    </div>`;
}

// ── Equipe multi-select ──────────────────────────────────────
function toggleEquipeDropdown() {
  equipeDropdownAberto = !equipeDropdownAberto;
  const dropdown = document.getElementById('equipe-dropdown');
  const trigger  = document.getElementById('equipe-trigger');
  const arrow    = document.getElementById('equipe-arrow');
  dropdown.classList.toggle('aberto', equipeDropdownAberto);
  trigger.classList.toggle('aberto', equipeDropdownAberto);
  if (arrow) arrow.classList.toggle('rotated', equipeDropdownAberto);
  if (equipeDropdownAberto) {
    // Foca o campo de busca para que digitar letras já filtre direto
    setTimeout(() => {
      const busca = document.getElementById('equipe-busca');
      if (busca) busca.focus();
    }, 30);
  }
}

function fecharEquipeDropdown() {
  equipeDropdownAberto = false;
  const dropdown = document.getElementById('equipe-dropdown');
  const trigger  = document.getElementById('equipe-trigger');
  const arrow    = document.getElementById('equipe-arrow');
  if (dropdown) dropdown.classList.remove('aberto');
  if (trigger)  trigger.classList.remove('aberto');
  if (arrow)    arrow.classList.remove('rotated');
}

const A_DEFINIR_ID = 'a_definir';

async function toggleTecnicoEquipe(idStr, evt) {
  if (evt) evt.stopPropagation();
  if (idStr === A_DEFINIR_ID) {
    equipesSelecionadas = equipesSelecionadas.includes(A_DEFINIR_ID) ? [] : [A_DEFINIR_ID];
  } else {
    // Verifica bloqueio na data selecionada
    const dataAgendamento = document.getElementById('f-data')?.value;
    const horaAgendamento = document.getElementById('f-inicio')?.value;
    if (dataAgendamento && !equipesSelecionadas.includes(idStr)) {
      const bloqueio = tecnicoBloqueadoNaData(idStr, dataAgendamento, horaAgendamento);
      if (bloqueio) {
        const periodo = descricaoPeriodoBloqueio(bloqueio);
        await alertModal('Técnico bloqueado', `O técnico não pode ser selecionado pois está bloqueado.\nPeríodo: ${periodo}\nMotivo: ${bloqueio.motivo}`, 'aviso');
        return;
      }
    }
    equipesSelecionadas = equipesSelecionadas.filter(x => x !== A_DEFINIR_ID);
    const idx = equipesSelecionadas.indexOf(idStr);
    if (idx === -1) equipesSelecionadas.push(idStr);
    else equipesSelecionadas.splice(idx, 1);
  }
  renderEquipeChips();
  renderEquipeDropdownItems();
}

function removerDaEquipe(idStr) {
  equipesSelecionadas = equipesSelecionadas.filter(x => x !== idStr);
  renderEquipeChips();
  renderEquipeDropdownItems();
}

function renderEquipeChips() {
  const wrap        = document.getElementById('equipe-chips-wrap');
  const placeholder = document.getElementById('equipe-placeholder');
  if (!wrap) return;

  // Remove chips existentes
  wrap.querySelectorAll('.equipe-chip').forEach(c => c.remove());

  if (equipesSelecionadas.length === 0) {
    if (placeholder) placeholder.style.display = '';
    return;
  }
  if (placeholder) placeholder.style.display = 'none';

  // Atualiza select de motorista com as pessoas da equipe
  const motWrap = document.getElementById('motorista-wrap');
  const motSel  = document.getElementById('f-motorista');
  if (motWrap && motSel) {
    const ids = equipesSelecionadas.filter(x => x !== A_DEFINIR_ID);
    if (ids.length > 0) {
      const prevMotorista = motSel.value;
      motSel.innerHTML = '<option value="">— Selecione o motorista —</option>' +
        ids.map(idStr => {
          const t = tecnicos.find(t => String(t.id) === idStr);
          return t ? `<option value="${t.id}">${escHtml(t.nome)}</option>` : '';
        }).join('');
      if (prevMotorista) motSel.value = prevMotorista;
      motWrap.style.display = 'block';
    } else {
      motWrap.style.display = 'none';
      motSel.value = '';
    }
  }

  equipesSelecionadas.forEach(idStr => {
    const chip = document.createElement('span');
    chip.className = 'equipe-chip';
    if (idStr === A_DEFINIR_ID) {
      chip.style.cssText = 'font-style:italic;color:var(--text-3)';
      chip.innerHTML = `A definir <button type="button" class="equipe-chip-del" onclick="event.stopPropagation();removerDaEquipe('${A_DEFINIR_ID}')">×</button>`;
    } else {
      const t = tecnicos.find(t => String(t.id) === idStr);
      if (!t) return;
      chip.innerHTML = `${t.nome.split(' ')[0]} <button type="button" class="equipe-chip-del" onclick="event.stopPropagation();removerDaEquipe('${idStr}')">×</button>`;
    }
    wrap.appendChild(chip);
  });
}

function renderEquipeDropdownItems() {
  const lista = document.getElementById('equipe-lista');
  if (!lista) return;

  const busca = (document.getElementById('equipe-busca')?.value || '').toLowerCase();
  const aDefSel = equipesSelecionadas.includes(A_DEFINIR_ID);

  const aDefHtml = (!busca || 'a definir'.includes(busca)) ? `
    <div class="equipe-item equipe-item-definir ${aDefSel ? 'selecionado' : ''}"
         onclick="toggleTecnicoEquipe('${A_DEFINIR_ID}', event)">
      <input type="checkbox" ${aDefSel ? 'checked' : ''}
             onclick="event.stopPropagation();toggleTecnicoEquipe('${A_DEFINIR_ID}', event)"/>
      <span class="equipe-item-nome" style="font-style:italic;color:var(--text-3)">A definir equipe</span>
    </div>` : '';

  const filtrados = tecnicos.filter(t => !busca || t.nome.toLowerCase().includes(busca));

  lista.innerHTML = aDefHtml + filtrados.map(t => {
    const idStr      = String(t.id);
    const selecionado = equipesSelecionadas.includes(idStr);
    return `
      <div class="equipe-item ${selecionado ? 'selecionado' : ''}"
           onclick="toggleTecnicoEquipe('${idStr}', event)">
        <input type="checkbox" ${selecionado ? 'checked' : ''}
               onclick="event.stopPropagation();toggleTecnicoEquipe('${idStr}', event)"/>
        <span class="equipe-item-nome">${escHtml(t.nome)}</span>
        ${t.funcao ? `<span class="equipe-item-funcao">${escHtml(t.funcao)}</span>` : ''}
      </div>`;
  }).join('');
}

// ── Obra select — auto-preenche endereço ─────────────────────
async function onObraChange() {
  const val         = document.getElementById('f-obra').value;
  const outroFields = document.getElementById('outro-fields');
  const endInput    = document.getElementById('f-endereco');

  outroFields.style.display = val === 'outro' ? 'block' : 'none';

  if (val && val !== 'outro') {
    const obra = obras.find(o => String(o.id) === val);
    if (obra) {
      if (obra.endereco) endInput.value = obra.endereco;
      if (obra.situacao === 'bloqueado_financeiro') {
        await alertModal(
          'Obra bloqueada financeiramente',
          'Esta obra está bloqueada pelo financeiro. Verifique com o setor antes de agendar.',
          'erro'
        );
      }
    }
  } else if (!val) {
    endInput.value = '';
  }
}

// ── Preencher select de obras ────────────────────────────────
function preencherSelects() {
  const selObra = document.getElementById('f-obra');
  selObra.innerHTML = '<option value="">Selecione a obra...</option><option value="outro">— Outro (assistência / avulso) —</option>';
  obras.forEach(o => {
    const opt = document.createElement('option');
    opt.value       = String(o.id);
    opt.textContent = o.nome_cliente;
    selObra.appendChild(opt);
  });
  renderEquipeDropdownItems();
}

// ── Abrir modal (novo) ───────────────────────────────────────
async function abrirModal(data = '') {
  agEditandoId = null;
  equipesSelecionadas = [];
  fecharEquipeDropdown();

  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();
  renderEquipeChips();

  document.getElementById('modal-titulo').textContent   = 'Novo Agendamento';
  document.getElementById('modal-erro').style.display   = 'none';
  document.getElementById('f-obra').value               = '';
  document.getElementById('f-endereco').value           = '';
  document.getElementById('outro-fields').style.display = 'none';
  document.getElementById('f-nome-outro').value         = '';
  document.getElementById('f-status').value             = 'confirmado';
  document.getElementById('f-inicio').value             = '';
  document.getElementById('f-fim').value                = '';
  document.getElementById('f-veiculo').value            = '';
  document.getElementById('f-servico').value            = '';
  const dataAgenda = data || fmtISO(new Date());
  document.getElementById('f-data').value               = dataAgenda;
  document.getElementById('btn-excluir').style.display  = 'none';
  const repCb = document.getElementById('f-replicar');
  if (repCb) { repCb.checked = false; toggleReplicar(false); }
  const osSharedCb = document.getElementById('f-mesma-os');
  if (osSharedCb) osSharedCb.checked = false;
  const motWrap = document.getElementById('motorista-wrap');
  if (motWrap) motWrap.style.display = 'none';
  const motSel = document.getElementById('f-motorista');
  if (motSel) motSel.value = '';

  // Verifica se o dia está bloqueado
  const bloqDia = diasBloqueados[dataAgenda];
  if (bloqDia) {
    const prosseguir = await new Promise(resolve => {
      confirmModal(
        `Dia bloqueado. Motivo: ${bloqDia.motivo}\n\nDeseja agendar mesmo assim? Será contabilizado como diária (pendente aprovação no supervisor).`,
        () => resolve(true),
        () => resolve(false)
      );
    });
    if (!prosseguir) return;
    agendarEmDiaBloqueado = true;
  } else {
    agendarEmDiaBloqueado = false;
  }

  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Abrir modal (editar) ─────────────────────────────────────
async function editarAgendamento(id) {
  const ag = agendamentos.find(a => a.id === id);
  if (!ag) return;
  agEditandoId = id;

  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();

  // Reconstrói equipe a partir dos 4 campos
  equipesSelecionadas = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id]
    .filter(Boolean)
    .map(String);
  renderEquipeChips();
  renderEquipeDropdownItems();
  fecharEquipeDropdown();

  document.getElementById('modal-titulo').textContent = 'Editar Agendamento';
  document.getElementById('modal-erro').style.display = 'none';

  // Pré-preencher tipo_servico a partir da OS associada ao agendamento
  db.from('ordens_de_servico')
    .select('tipo_servico')
    .eq('agendamento_id', id)
    .limit(1)
    .maybeSingle()
    .then(({ data: osAssoc }) => {
      const tipo = osAssoc?.tipo_servico || 'execucao';
      document.querySelectorAll('input[name="tipo-servico"]').forEach(r => { r.checked = r.value === tipo; });
    });

  const obraVal = ag.obra_id ? String(ag.obra_id) : (ag.cliente_outro ? 'outro' : '');
  document.getElementById('f-obra').value               = obraVal;
  document.getElementById('outro-fields').style.display = ag.cliente_outro ? 'block' : 'none';
  document.getElementById('f-nome-outro').value         = ag.cliente_outro || '';

  // Endereço: prioriza override salvo, senão pega da obra
  const obraLocal = obras.find(o => String(o.id) === String(ag.obra_id));
  document.getElementById('f-endereco').value = ag.endereco_outro || obraLocal?.endereco || '';

  document.getElementById('f-data').value    = ag.data            || '';
  document.getElementById('f-status').value  = ag.status          || 'confirmado';
  document.getElementById('f-inicio').value  = ag.hora_inicio     ? ag.hora_inicio.slice(0,5) : '';
  document.getElementById('f-fim').value     = '';
  document.getElementById('f-veiculo').value = ag.veiculo || '';
  document.getElementById('f-servico').value = ag.servico || '';
  // Preenche motorista ao editar
  if (ag.motorista_id && equipesSelecionadas.length > 0) {
    const motSel = document.getElementById('f-motorista');
    const motWrap = document.getElementById('motorista-wrap');
    if (motSel && motWrap) { motWrap.style.display = 'block'; motSel.value = String(ag.motorista_id); }
  }
  document.getElementById('btn-excluir').style.display = 'flex';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Fechar modal ─────────────────────────────────────────────
function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
  agEditandoId = null;
  fecharEquipeDropdown();
}

function fecharModalFora(e) {

// ── Modal de detalhe (somente leitura) ───────────────────────
function verDetalheAgendamento(id) {
  const ag = agendamentos.find(a => a.id === id);
  if (!ag) return;

  const status   = ag.status || 'confirmado';
  const hora     = ag.hora_inicio ? ag.hora_inicio.slice(0, 5) : '';
  const horaFim  = ag.hora_fim    ? ag.hora_fim.slice(0, 5)    : '';
  const cliente  = ag.obras?.nome_cliente || ag.cliente_outro || '—';
  const end      = ag.endereco_outro || ag.obras?.endereco || '';
  const osNum    = ag.numero_os || null;
  const consultor = ag.obras?.consultores?.nome || '';
  const arquiteto = ag.obras?.arquiteto_responsavel || '';

  // Nomes completos dos técnicos (sem abreviar)
  const ids   = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
  const nomes = ids.map(id => {
    const t = tecnicos.find(t => t.id === id);
    return t ? t.nome : null;
  }).filter(Boolean);

  // Cabeçalho
  document.getElementById('det-hora').textContent   = hora ? (horaFim ? `${hora} – ${horaFim}` : hora) : '';
  document.getElementById('det-titulo').textContent = cliente;

  // Status badge
  const badge = document.getElementById('det-status-badge');
  badge.textContent = STATUS_LABEL[status] || status;
  badge.className   = `det-status-badge ag-badge badge-${status}`;

  // Linhas de detalhe
  const row = (label, val) => val
    ? `<div class="det-row">
         <span class="det-lbl">${label}</span>
         <span class="det-vlr">${escHtml(val)}</span>
       </div>`
    : '';

  document.getElementById('det-rows').innerHTML = [
    row('Data',      ag.data ? new Date(ag.data + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }) : ''),
    row('Técnico',   nomes.length ? nomes.join(' · ') : '—'),
    row('Endereço',  end),
    row('N.OS',      osNum ? `#${osNum}` : ''),
    row('Consultor', consultor),
    row('Arquiteto', arquiteto),
    row('Serviço',   ag.servico || ''),
    row('Veículo',   ag.veiculo || ''),
    row('Obs.',      ag.observacao || ''),
  ].join('');

  document.getElementById('overlay-detalhe').classList.add('aberto');
  lucide.createIcons();
}

function fecharDetalhe(e) {
  if (e && e.target !== document.getElementById('overlay-detalhe')) return;
  document.getElementById('overlay-detalhe').classList.remove('aberto');
}

// ── Salvar agendamento ───────────────────────────────────────
async function salvarAgendamento() {
  const btn    = document.getElementById('btn-salvar');
  const erroEl = document.getElementById('modal-erro');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  erroEl.style.display = 'none';

  const obraVal    = document.getElementById('f-obra').value;
  const nomeOutro  = document.getElementById('f-nome-outro').value.trim();
  const endereco   = document.getElementById('f-endereco').value.trim();
  const data       = document.getElementById('f-data').value;
  const status     = document.getElementById('f-status').value;
  const inicio     = document.getElementById('f-inicio').value;
  const fim        = '';
  const veiculo    = document.getElementById('f-veiculo').value;
  const servico    = document.getElementById('f-servico').value;
  const tipoServico = agendarEmDiaBloqueado ? 'diaria'
    : (document.querySelector('input[name="tipo-servico"]:checked')?.value || 'execucao');

  // Validações
  if (!obraVal) {
    mostrarErroModal('Selecione a obra ou escolha "Outro".'); return;
  }
  if (obraVal === 'outro' && !nomeOutro) {
    mostrarErroModal('Informe o nome do cliente.'); return;
  }
  if (equipesSelecionadas.length === 0) {
    mostrarErroModal('Selecione pelo menos uma pessoa ou "A definir equipe".'); return;
  }
  if (!data) {
    mostrarErroModal('Selecione a data.'); return;
  }

  function mostrarErroModal(msg) {
    erroEl.textContent      = msg;
    erroEl.style.display    = 'block';
    btn.disabled            = false;
    btn.innerHTML           = '<i data-lucide="save"></i> Salvar';
    lucide.createIcons();
  }

  // Verificar conflito de agendamento: técnico já alocado neste dia?
  const isADefinir = equipesSelecionadas[0] === A_DEFINIR_ID;
  const techIds = isADefinir ? [] : equipesSelecionadas.map(Number).filter(Boolean);
  const { data: mesmaData } = await db.from('agendamentos')
    .select('id, tecnico_id, auxiliar_id, auxiliar2_id, auxiliar3_id, obras(nome_cliente), cliente_outro')
    .eq('data', data);

  const conflitos = (mesmaData || []).filter(c => {
    if (agEditandoId && c.id === agEditandoId) return false;
    const cTecs = [c.tecnico_id, c.auxiliar_id, c.auxiliar2_id, c.auxiliar3_id].filter(Boolean).map(Number);
    return techIds.some(id => cTecs.includes(id));
  });

  if (conflitos.length > 0) {
    const descricoes = conflitos.map(c => c.obras?.nome_cliente || c.cliente_outro || 'outro').join(', ');
    const prosseguir = await new Promise(resolve => {
      confirmModal(
        `Atenção: um ou mais técnicos já têm agendamento nesta data (${descricoes}). Deseja salvar mesmo assim?`,
        () => resolve(true),
        () => resolve(false)
      );
    });
    if (!prosseguir) {
      btn.disabled  = false;
      btn.innerHTML = '<i data-lucide="save"></i> Salvar';
      lucide.createIcons();
      return;
    }
  }

  // Mapeia equipe → colunas DB (max 4)
  const [id0, id1, id2, id3] = isADefinir ? [null, null, null, null] : equipesSelecionadas;

  // Lista de datas a salvar (replicar ou só a data principal)
  const replicar   = !agEditandoId && document.getElementById('f-replicar')?.checked;
  const mesmaOS    = replicar && document.getElementById('f-mesma-os')?.checked;
  const diasSalvar = replicar ? diasParaReplicar() : [data];
  if (!diasSalvar.includes(data) && !replicar) diasSalvar.unshift(data);

  // Helper: gera número de OS para uma data
  async function gerarNumeroOS(dataStr) {
    if (status === 'viagem') return null;
    const { data: seqData, error: seqErr } = await db.rpc('proximo_numero_os');
    if (seqErr || seqData == null) return null;
    const [y, m, d] = dataStr.split('-');
    if (tipoServico === 'assistencia' || tipoServico === 'diaria') {
      return `${y}-${m}-${d}-${String(seqData).padStart(4, '0')}`;
    } else {
      const teId  = id0 ? parseInt(id0) : null;
      const teRec = teId ? tecnicoEquipes.find(e => e.tecnico_id === teId) : null;
      const EQ_COD = { 1:'01', 2:'02', 3:'03', 4:'04', 5:'05' };
      const eqCod  = (teRec && EQ_COD[teRec.equipe_id]) || '00';
      return `${y}-${m}-${eqCod}-${String(seqData).padStart(4, '0')}`;
    }
  }

  // Se "Mesma N.OS", gera apenas uma vez para o primeiro dia e reutiliza
  let osCompartilhado = null;
  if (mesmaOS && diasSalvar.length > 0) {
    osCompartilhado = await gerarNumeroOS(diasSalvar[0]);
  }

  const basePayload = {
    obra_id:        obraVal !== 'outro' ? parseInt(obraVal) : null,
    cliente_outro:  obraVal === 'outro' ? nomeOutro          : null,
    endereco_outro: endereco || null,
    tecnico_id:     id0 ? parseInt(id0) : null,
    auxiliar_id:    id1 ? parseInt(id1) : null,
    auxiliar2_id:   id2 ? parseInt(id2) : null,
    auxiliar3_id:   id3 ? parseInt(id3) : null,
    status,
    hora_inicio:   inicio || null,
    hora_fim:      null,
    veiculo:       veiculo || null,
    servico:       servico || null,
    motorista_id:  document.getElementById('f-motorista')?.value ? parseInt(document.getElementById('f-motorista').value) : null,
  };

  // Salva cada dia (se replicando, salva em paralelo sequencial para OS numbers únicos)
  let error     = null;
  let savedAgId = null;

  let osCriadaNoFirstDay = false; // quando mesmaOS=true, cria OS só uma vez

  for (let diaIdx = 0; diaIdx < diasSalvar.length; diaIdx++) {
    const diaStr = diasSalvar[diaIdx];
    const isPrimeiroDia = diaIdx === 0;

    // Quando mesmaOS: só o primeiro dia guarda o numero_os no agendamento
    // (evita violação da constraint UNIQUE idx_agendamentos_numero_os)
    const numeroOSGerado = mesmaOS
      ? (isPrimeiroDia ? osCompartilhado : null)
      : await gerarNumeroOS(diaStr);

    const payload = { ...basePayload, data: diaStr, numero_os: numeroOSGerado };

    let result;
    if (agEditandoId && diaStr === data) {
      result = await (async () => {
        const res = await db.from('agendamentos').update(payload).eq('id', agEditandoId);
        return { error: res.error, id: agEditandoId };
      })();
    } else {
      result = await (async () => {
        const res = await db.from('agendamentos').insert(payload).select('id').single();
        return { error: res.error, id: res.data?.id };
      })();
    }

    if (result.error) { error = result.error; break; }
    if (!savedAgId) savedAgId = result.id;

    // Cria OS pendentes:
    // - Sem mesmaOS: uma por dia (comportamento padrão)
    // - Com mesmaOS: apenas no primeiro dia, cobrindo toda a semana
    const devecriarOS = !agEditandoId && result.id && status !== 'viagem'
      && (!mesmaOS || (mesmaOS && !osCriadaNoFirstDay));

    if (devecriarOS) {
      const equipeOS = [payload.tecnico_id, payload.auxiliar_id, payload.auxiliar2_id, payload.auxiliar3_id]
        .filter(Boolean).filter((id, idx, arr) => arr.indexOf(id) === idx);
      if (equipeOS.length) {
        const agora = new Date().toISOString();
        // Quando mesmaOS, descreve todos os dias no servico_planejado
        const servicoOS = mesmaOS && diasSalvar.length > 1
          ? `${servico || ''} [Obra continuada: ${diasSalvar.join(', ')}]`.trim()
          : servico || null;
        const osPayloads = equipeOS.map(tecId => ({
          agendamento_id:    result.id,
          obra_id:           payload.obra_id,
          endereco_servico:  endereco || null,
          tecnico_id:        tecId,
          data_servico:      diaStr,
          servico_planejado: servicoOS,
          status_aprovacao:  'pendente',
          tipo_servico:      tipoServico,
          numero_os:         osCompartilhado ?? numeroOSGerado,
          criado_em:         agora,
        }));
        await db.from('ordens_de_servico').insert(osPayloads);
        if (mesmaOS) osCriadaNoFirstDay = true;
      }
    }
  }

  if (error) {
    erroEl.textContent   = 'Erro ao salvar: ' + error.message;
    erroEl.style.display = 'block';
  } else {
    invalidateCache('agenda-obras');
    invalidateCache('agenda-tecnicos');

    // Se veio de uma pendência, atualiza data_marcada com a data do agendamento
    if (!agEditandoId && pendenciaOrigemId) {
      await db.from('pendencias')
        .update({ data_marcada: data, atualizado_em: new Date().toISOString() })
        .eq('id', pendenciaOrigemId);
      pendenciaOrigemId = null;
      mostrarToast('✅ Pendência atualizada com a data do agendamento.', 'ok');
    }

    fecharModal();
    if (!agEditandoId && tipoServico === 'assistencia') {
      window.location.href = 'assistencia.html';
    } else if (!agEditandoId && status === 'viagem') {
      window.location.href = 'viagens.html';
    } else {
      await carregarAgenda();
    }
  }

  btn.disabled  = false;
  btn.innerHTML = '<i data-lucide="save"></i> Salvar';
  lucide.createIcons();
}

// ── Excluir agendamento ──────────────────────────────────────
async function excluirAgendamento() {
  if (!agEditandoId) return;
  confirmModal('Excluir este agendamento? As OSs pendentes vinculadas serão canceladas.', async () => {

  // Cancela OSs pendentes vinculadas (preserva número para histórico)
  const ag = agendamentos.find(a => a.id === agEditandoId);
  if (ag) {
    const porAgendamento = await db
      .from('ordens_de_servico')
      .update({ status_aprovacao: 'cancelada' })
      .eq('agendamento_id', agEditandoId)
      .eq('status_aprovacao', 'pendente');

    if (porAgendamento.error && ag.obra_id && ag.data) {
      await db
        .from('ordens_de_servico')
        .update({ status_aprovacao: 'cancelada' })
        .eq('obra_id', ag.obra_id)
        .eq('data_servico', ag.data)
        .eq('status_aprovacao', 'pendente');
    }
  }

  const agParaDeletar = agendamentos.find(a => a.id === agEditandoId);
  const { error } = await db.from('agendamentos').delete().eq('id', agEditandoId);
  if (error) { showToast('Erro ao excluir: ' + error.message, 'error'); return; }

  // Audit log (fire-and-forget)
  db.from('audit_log').insert({
    user_id:      _authUserId,
    tabela:       'agendamentos',
    operacao:     'DELETE',
    registro_id:  String(agEditandoId),
    dados_antes:  agParaDeletar ? {
      obra_id:      agParaDeletar.obra_id,
      data:         agParaDeletar.data,
      numero_os:    agParaDeletar.numero_os,
      tecnico_id:   agParaDeletar.tecnico_id,
    } : null,
    dados_depois: null,
    criado_em:    new Date().toISOString(),
  });

  fecharModal();
  await carregarAgenda();
  }); // confirmModal
}

let toastTimer = null;

  const el   = document.getElementById('toast');
  const icon = document.getElementById('toast-icon');
  document.getElementById('toast-msg').textContent = msg;
  icon.className = `toast-icon ${tipo}`;

    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>`
