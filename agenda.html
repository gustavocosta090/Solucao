<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0A0A0A;
      --surface-1:    #111111;
      --surface-2:    #161616;
      --surface-3:    #1B1B1B;
      --primary:      #3ECF8E;
      --secondary:    #4F46E5;
      --text-1:       #FFFFFF;
      --text-2:       #A1A1AA;
      --text-3:       #52525B;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-brand {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    nav a {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-2);
      text-decoration: none;
      transition: color 150ms, background 150ms;
    }

    nav a:hover { color: var(--text-1); background: rgba(255,255,255,0.05); }
    nav a.ativo { color: var(--text-1); background: rgba(255,255,255,0.07); }

    .btn-logout {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-2);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 150ms, background 150ms;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn-logout:hover { color: #fca5a5; background: rgba(239,68,68,0.08); }

    .nav-divider {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 6px;
    }

    /* ── Barra de controles ── */
    .controles {
      max-width: 1400px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .semana-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .semana-nav button {
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms, color 150ms;
    }

    .semana-nav button i { width: 16px; height: 16px; }
    .semana-nav button:hover { border-color: var(--border-hover); color: var(--text-1); }

    .semana-nav span {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-1);
      min-width: 230px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .filtros-equipe {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filtro-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }

    .filtro-btn:hover { border-color: var(--border-hover); color: var(--text-1); }

    .filtro-btn.ativo {
      background: rgba(62,207,142,0.12);
      border-color: rgba(62,207,142,0.35);
      color: var(--primary);
    }

    .btn-novo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 150ms, transform 150ms;
      font-family: inherit;
    }

    .btn-novo i { width: 15px; height: 15px; }
    .btn-novo:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── Grade semanal ── */
    .grade {
      max-width: 1400px;
      margin: 20px auto 48px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 900px) {
      .grade { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 600px) {
      .grade { grid-template-columns: 1fr; }
    }

    /* ── Coluna do dia ── */
    .coluna {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .coluna-header {
      padding: 12px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dia-nome {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    .dia-data {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .dia-data.hoje { color: var(--primary); }

    .btn-add {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 150ms, color 150ms, background 150ms;
    }

    .btn-add i { width: 14px; height: 14px; }

    .btn-add:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(62,207,142,0.08);
    }

    .coluna-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .coluna-vazia {
      text-align: center;
      padding: 24px 8px;
      color: var(--text-3);
      font-size: 0.75rem;
    }

    /* ── Cards de agendamento ── */
    .card-ag {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 2px solid;
      cursor: pointer;
      transition: opacity 150ms, transform 150ms;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .card-ag:hover { opacity: 0.85; transform: translateX(2px); }

    .card-confirmado   { background: rgba(34,197,94,0.07);   border-color: #22c55e; }
    .card-nao_confirmado { background: rgba(234,179,8,0.07); border-color: #eab308; }
    .card-viagem       { background: rgba(74,222,128,0.07);  border-color: #4ade80; }

    .ag-tecs { font-weight: 700; color: var(--text-1); margin-bottom: 3px; }
    .ag-cliente { font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
    .ag-detalhe { color: var(--text-3); font-size: 0.72rem; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .ag-detalhe i { width: 11px; height: 11px; flex-shrink: 0; }

    .ag-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge-confirmado     { background: rgba(22,101,52,0.6);  color: #bbf7d0; }
    .badge-nao_confirmado { background: rgba(113,63,18,0.6);  color: #fef08a; }
    .badge-viagem         { background: rgba(20,83,45,0.6);   color: #86efac; }

    /* ── Spinner ── */
    .spinner-wrap {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px;
      color: var(--text-3);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-header-icon i { width: 16px; height: 16px; color: var(--primary); }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      color: var(--text-1);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      font-family: inherit;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--text-3); }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .form-group select option { background: var(--surface-2); color: var(--text-1); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .btn-cancelar {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 150ms, color 150ms;
    }

    .btn-cancelar:hover { border-color: var(--border-hover); color: var(--text-1); }

    .btn-salvar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: opacity 150ms;
    }

    .btn-salvar:hover { opacity: 0.88; }
    .btn-salvar:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-excluir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-input);
      color: #f87171;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      margin-right: auto;
      transition: background 150ms, border-color 150ms;
    }

    .btn-excluir:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.35); }
    .btn-excluir i { width: 14px; height: 14px; }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <span class="header-brand-dot"></span>
    Solução Técnica
  </div>
  <nav>
    <a href="obras.html">Obras</a>
    <a href="agenda.html" class="ativo">Agenda</a>
    <a href="os.html">OS</a>
    <div class="nav-divider"></div>
    <span id="topbar-greeting" style="font-size:13px;color:var(--text-2);"></span>
    <button class="btn-logout" onclick="logout()">
      <i data-lucide="log-out"></i>
      Sair
    </button>
  </nav>
</header>

<!-- Controles -->
<div class="controles">
  <div class="semana-nav">
    <button onclick="mudarSemana(-1)"><i data-lucide="chevron-left"></i></button>
    <span id="periodo-label">—</span>
    <button onclick="mudarSemana(1)"><i data-lucide="chevron-right"></i></button>
  </div>

  <div class="filtros-equipe">
    <button class="filtro-btn ativo" data-equipe="todas">Todas equipes</button>
    <button class="filtro-btn" data-equipe="1">Cabeamento</button>
    <button class="filtro-btn" data-equipe="2">Eletrica</button>
    <button class="filtro-btn" data-equipe="3">Audio e Video</button>
    <button class="filtro-btn" data-equipe="4">Automacao</button>
  </div>

  <button class="btn-novo" onclick="abrirModal()">
    <i data-lucide="plus"></i>
    Novo agendamento
  </button>
</div>

<!-- Grade semanal -->
<div class="grade" id="grade">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <p>Carregando agenda...</p>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="fecharModalFora(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-icon">
        <i data-lucide="calendar"></i>
      </div>
      <div class="modal-title" id="modal-titulo">Novo Agendamento</div>
    </div>

    <div id="modal-erro" style="display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:6px;padding:10px 14px;font-size:0.8rem;color:#f87171;margin-bottom:16px;"></div>

    <div class="form-group">
      <label>Obra / Cliente</label>
      <select id="f-obra"><option value="">Selecione a obra...</option></select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Tecnico principal</label>
        <select id="f-tecnico"><option value="">Selecione...</option></select>
      </div>
      <div class="form-group">
        <label>Auxiliar 1</label>
        <select id="f-auxiliar"><option value="">Nenhum</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Auxiliar 2</label>
        <select id="f-auxiliar2"><option value="">Nenhum</option></select>
      </div>
      <div class="form-group">
        <label>Auxiliar 3</label>
        <select id="f-auxiliar3"><option value="">Nenhum</option></select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="f-data"/>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option value="confirmado">Confirmado</option>
          <option value="nao_confirmado">Não confirmado</option>
          <option value="viagem">Viagem</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Hora inicio</label>
        <input type="time" id="f-inicio"/>
      </div>
      <div class="form-group">
        <label>Hora fim</label>
        <input type="time" id="f-fim"/>
      </div>
    </div>

    <div class="form-group">
      <label>Veiculo (placa)</label>
      <input type="text" id="f-veiculo" placeholder="Ex: STRADA-TYR7C97"/>
    </div>

    <div class="form-group">
      <label>Servico a realizar</label>
      <textarea id="f-servico" rows="3" placeholder="Descreva o servico..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-excluir" id="btn-excluir" onclick="excluirAgendamento()" style="display:none">
        <i data-lucide="trash-2"></i>
        Excluir
      </button>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarAgendamento()">
        <i data-lucide="save"></i>
        Salvar
      </button>
    </div>
  </div>
</div>

<script>
const { createClient } = window.supabase;
const db = createClient(
  'https://kxtjqudpnmdqkzqhyhmz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4dGpxdWRwbm1kcWt6cWh5aG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NDYzMzEsImV4cCI6MjA5NTIyMjMzMX0.tba066RGNwDbXaNEy3w_OHbblll_bky6Dx10mXnxVQ0'
);

// ── Estado ──────────────────────────────────────────────────
let semanaOffset = 0;
let filtroEquipe = 'todas';
let agendamentos = [];
let obras        = [];
let tecnicos     = [];
let tecnicoEquipes = [];
let agEditandoId = null;

const DIAS  = ['Segunda','Terca','Quarta','Quinta','Sexta'];
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const STATUS_LABEL = {
  confirmado:     'Confirmado',
  nao_confirmado: 'Não confirmado',
  viagem:         'Viagem',
};

let modoVisualizacao = false;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();

  // Saudação
  const _ha = new Date().getHours();
  const _sa = _ha < 12 ? 'Bom dia' : _ha < 18 ? 'Boa tarde' : 'Boa noite';
  const _na = (eu?.nome || '').split(' ')[0];
  const _ga = document.getElementById('topbar-greeting');
  if (_ga && _na) _ga.textContent = `${_sa}, ${_na}`;

  if (eu && eu.role === 'tecnico') {
    modoVisualizacao = true;
    const btnNovo = document.querySelector('.btn-novo');
    if (btnNovo) btnNovo.style.display = 'none';
  }

  await Promise.all([carregarObras(), carregarTecnicos()]);
  preencherModal();
  await carregarAgenda();
}

async function logout() {
  await db.auth.signOut();
  window.location.href = 'login.html';
}

// ── Datas da semana ─────────────────────────────────────────
function getSegunda(offset = 0) {
  const hoje = new Date();
  const dia  = hoje.getDay() || 7;
  const seg  = new Date(hoje);
  seg.setDate(hoje.getDate() - dia + 1 + offset * 7);
  seg.setHours(0,0,0,0);
  return seg;
}

function diasDaSemana(offset) {
  const seg = getSegunda(offset);
  return Array.from({length: 5}, (_, i) => {
    const d = new Date(seg);
    d.setDate(seg.getDate() + i);
    return d;
  });
}

function fmtISO(d) { return d.toISOString().split('T')[0]; }
function fmtBR(d)  { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }

function isHoje(d) {
  const h = new Date();
  return d.getDate()===h.getDate() && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
}

// ── Carregar dados ──────────────────────────────────────────
async function carregarObras() {
  const { data } = await db.from('obras').select('id, nome_cliente, endereco').order('nome_cliente');
  obras = data || [];
}

async function carregarTecnicos() {
  let { data: t, error: e1 } = await db.from('tecnicos').select('id, nome, funcao').order('nome');
  if (e1 || !t) {
    const { data: t2 } = await db.from('tecnicos').select('id, nome').order('nome');
    t = (t2 || []).map(x => ({ ...x, funcao: '' }));
  }
  const { data: te } = await db.from('tecnico_equipes').select('tecnico_id, equipe_id');
  tecnicos       = t  || [];
  tecnicoEquipes = te || [];
}

async function carregarAgenda() {
  const dias = diasDaSemana(semanaOffset);
  const ini  = fmtISO(dias[0]);
  const fim  = fmtISO(dias[4]);

  document.getElementById('periodo-label').textContent =
    `${DIAS[0]}, ${fmtBR(dias[0])} — ${DIAS[4]}, ${fmtBR(dias[4])}`;

  const { data, error } = await db
    .from('agendamentos')
    .select(`*, obras(nome_cliente, endereco), tecnico:tecnicos!agendamentos_tecnico_id_fkey(id,nome), auxiliar:tecnicos!agendamentos_auxiliar_id_fkey(id,nome)`)
    .gte('data', ini)
    .lte('data', fim)
    .order('hora_inicio');

  if (error) {
    document.getElementById('grade').innerHTML =
      `<div class="spinner-wrap"><p style="color:#f87171">Erro: ${error.message}</p></div>`;
    return;
  }

  agendamentos = data || [];
  renderGrade(dias);
}

// ── Filtro por equipe ───────────────────────────────────────
function tecnicosDaEquipe(equipeId) {
  return tecnicoEquipes.filter(te => te.equipe_id === equipeId).map(te => te.tecnico_id);
}

function agendamentosVisiveis() {
  if (filtroEquipe === 'todas') return agendamentos;
  const ids = tecnicosDaEquipe(parseInt(filtroEquipe));
  return agendamentos.filter(ag =>
    ids.includes(ag.tecnico_id)   ||
    ids.includes(ag.auxiliar_id)  ||
    ids.includes(ag.auxiliar2_id) ||
    ids.includes(ag.auxiliar3_id)
  );
}

// ── Renderizar grade ────────────────────────────────────────
function renderGrade(dias) {
  const visiveis = agendamentosVisiveis();
  const grade = document.getElementById('grade');

  grade.innerHTML = dias.map((dia, i) => {
    const dataStr = fmtISO(dia);
    const ags = visiveis.filter(ag => ag.data === dataStr);

    const cards = ags.length
      ? ags.map(cardHTML).join('')
      : `<div class="coluna-vazia">Sem agendamentos</div>`;

    return `
      <div class="coluna">
        <div class="coluna-header">
          <div>
            <div class="dia-nome">${DIAS[i]}</div>
            <div class="dia-data ${isHoje(dia) ? 'hoje' : ''}">${fmtBR(dia)}</div>
          </div>
          ${modoVisualizacao ? '' : `<button class="btn-add" onclick="abrirModal('${dataStr}')" title="Novo agendamento"><i data-lucide="plus"></i></button>`}
        </div>
        <div class="coluna-body">${cards}</div>
      </div>`;
  }).join('');

  lucide.createIcons();
}

// ── Card de agendamento ─────────────────────────────────────
function nomeTecnico(id) {
  if (!id) return null;
  // Tenta pegar do objeto ag (FK join) ou do array tecnicos
  const t = tecnicos.find(t => t.id === id);
  return t ? t.nome : null;
}

function cardHTML(ag) {
  const status = ag.status || 'confirmado';

  // Monta lista de nomes: tecnico principal + auxiliares não nulos
  const nomes = [
    ag.tecnico?.nome || nomeTecnico(ag.tecnico_id),
    ag.auxiliar?.nome || nomeTecnico(ag.auxiliar_id),
    nomeTecnico(ag.auxiliar2_id),
    nomeTecnico(ag.auxiliar3_id),
  ].filter(Boolean);

  const tecs    = nomes.join(' + ');
  const cliente = ag.obras?.nome_cliente || '—';
  const end     = ag.obras?.endereco || '';
  const hora    = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '';

  return `
    <div class="card-ag card-${status}" ${modoVisualizacao ? '' : `onclick="editarAgendamento(${ag.id})" title="Clique para editar"`} style="${modoVisualizacao ? 'cursor:default' : ''}">
      <div class="ag-tecs">${hora ? hora + ' · ' : ''}${tecs || '—'}</div>
      <div class="ag-cliente">${cliente}</div>
      ${end ? `<div class="ag-detalhe"><i data-lucide="map-pin"></i>${end}</div>` : ''}
      ${ag.servico ? `<div class="ag-detalhe"><i data-lucide="wrench"></i>${ag.servico}</div>` : ''}
      ${ag.veiculo ? `<div class="ag-detalhe"><i data-lucide="car"></i>${ag.veiculo}</div>` : ''}
      <span class="ag-badge badge-${status}">${STATUS_LABEL[status] || status}</span>
    </div>`;
}

// ── Navegação ────────────────────────────────────────────────
function mudarSemana(delta) {
  semanaOffset += delta;
  carregarAgenda();
}

// ── Modal ───────────────────────────────────────────────────
function preencherSelects() {
  // Obras
  const selObra = document.getElementById('f-obra');
  const obraVal = selObra.value;
  selObra.innerHTML = '<option value="">Selecione a obra...</option>';
  obras.forEach(o => {
    const opt = document.createElement('option');
    opt.value = String(o.id); opt.textContent = o.nome_cliente;
    selObra.appendChild(opt);
  });
  if (obraVal) selObra.value = obraVal;

  // Técnicos (todos os selects de pessoa)
  ['f-tecnico','f-auxiliar','f-auxiliar2','f-auxiliar3'].forEach(id => {
    const sel = document.getElementById(id);
    const val = sel.value;
    const defaultLabel = id === 'f-tecnico' ? 'Selecione...' : 'Nenhum';
    sel.innerHTML = `<option value="">${defaultLabel}</option>`;
    tecnicos.forEach(t => {
      const opt = document.createElement('option');
      opt.value = String(t.id);
      opt.textContent = t.funcao ? `${t.nome} (${t.funcao})` : t.nome;
      sel.appendChild(opt);
    });
    if (val) sel.value = val;
  });
}

// Compatibilidade — mantém o nome antigo caso chamado de outro lugar
function preencherModal() { preencherSelects(); }

async function abrirModal(data = '') {
  agEditandoId = null;

  // Garante que obras e técnicos estão carregados
  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();

  document.getElementById('modal-titulo').textContent = 'Novo Agendamento';
  document.getElementById('modal-erro').style.display = 'none';
  document.getElementById('f-obra').value      = '';
  document.getElementById('f-tecnico').value   = '';
  document.getElementById('f-auxiliar').value  = '';
  document.getElementById('f-auxiliar2').value = '';
  document.getElementById('f-auxiliar3').value = '';
  document.getElementById('f-status').value    = 'confirmado';
  document.getElementById('f-inicio').value    = '';
  document.getElementById('f-fim').value       = '';
  document.getElementById('f-veiculo').value   = '';
  document.getElementById('f-servico').value   = '';
  document.getElementById('f-data').value      = data || fmtISO(new Date());
  document.getElementById('btn-excluir').style.display = 'none';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

async function editarAgendamento(id) {
  const ag = agendamentos.find(a => a.id === id);
  if (!ag) return;
  agEditandoId = id;

  // Garante que obras e técnicos estão carregados
  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();

  document.getElementById('modal-titulo').textContent = 'Editar Agendamento';
  document.getElementById('modal-erro').style.display = 'none';

  // Usa String() para garantir compatibilidade com o valor dos <option>
  document.getElementById('f-obra').value      = ag.obra_id      ? String(ag.obra_id)      : '';
  document.getElementById('f-tecnico').value   = ag.tecnico_id   ? String(ag.tecnico_id)   : '';
  document.getElementById('f-auxiliar').value  = ag.auxiliar_id  ? String(ag.auxiliar_id)  : '';
  document.getElementById('f-auxiliar2').value = ag.auxiliar2_id ? String(ag.auxiliar2_id) : '';
  document.getElementById('f-auxiliar3').value = ag.auxiliar3_id ? String(ag.auxiliar3_id) : '';
  document.getElementById('f-data').value      = ag.data         || '';
  document.getElementById('f-status').value    = ag.status       || 'confirmado';
  document.getElementById('f-inicio').value    = ag.hora_inicio  ? ag.hora_inicio.slice(0,5) : '';
  document.getElementById('f-fim').value       = ag.hora_fim     ? ag.hora_fim.slice(0,5)    : '';
  document.getElementById('f-veiculo').value   = ag.veiculo      || '';
  document.getElementById('f-servico').value   = ag.servico      || '';
  document.getElementById('btn-excluir').style.display = 'flex';
  document.getElementById('overlay').classList.add('aberto');
}

function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
  agEditandoId = null;
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('overlay')) fecharModal();
}

async function salvarAgendamento() {
  const btn    = document.getElementById('btn-salvar');
  const erroEl = document.getElementById('modal-erro');
  btn.disabled = true;
  btn.innerHTML = 'Salvando...';
  erroEl.style.display = 'none';

  const obraId  = document.getElementById('f-obra').value;
  const tecId   = document.getElementById('f-tecnico').value;
  const auxId   = document.getElementById('f-auxiliar').value;
  const aux2Id  = document.getElementById('f-auxiliar2').value;
  const aux3Id  = document.getElementById('f-auxiliar3').value;
  const data    = document.getElementById('f-data').value;
  const status  = document.getElementById('f-status').value;
  const inicio  = document.getElementById('f-inicio').value;
  const fim     = document.getElementById('f-fim').value;
  const veiculo = document.getElementById('f-veiculo').value;
  const servico = document.getElementById('f-servico').value;

  if (!obraId || !tecId || !data) {
    erroEl.textContent = 'Preencha obra, tecnico principal e data.';
    erroEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="save"></i> Salvar';
    lucide.createIcons();
    return;
  }

  const payload = {
    obra_id:      parseInt(obraId),
    tecnico_id:   parseInt(tecId),
    auxiliar_id:  auxId  ? parseInt(auxId)  : null,
    auxiliar2_id: aux2Id ? parseInt(aux2Id) : null,
    auxiliar3_id: aux3Id ? parseInt(aux3Id) : null,
    data, status,
    hora_inicio: inicio  || null,
    hora_fim:    fim     || null,
    veiculo:     veiculo || null,
    servico:     servico || null,
  };

  let error;

  const tentarSalvar = async (p) => {
    if (agEditandoId) {
      return (await db.from('agendamentos').update(p).eq('id', agEditandoId)).error;
    } else {
      return (await db.from('agendamentos').insert(p)).error;
    }
  };

  error = await tentarSalvar(payload);

  // Se falhou por coluna inexistente (SQL ainda não rodado), tenta sem aux2/aux3
  if (error && (error.message.includes('auxiliar2_id') || error.message.includes('auxiliar3_id'))) {
    const payloadSimples = { ...payload };
    delete payloadSimples.auxiliar2_id;
    delete payloadSimples.auxiliar3_id;
    error = await tentarSalvar(payloadSimples);
  }

  if (error) {
    erroEl.textContent = 'Erro ao salvar: ' + error.message;
    erroEl.style.display = 'block';
  } else {
    fecharModal();
    await carregarAgenda();
  }

  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="save"></i> Salvar';
  lucide.createIcons();
}

async function excluirAgendamento() {
  if (!agEditandoId) return;
  if (!confirm('Tem certeza que quer excluir este agendamento?')) return;
  const { error } = await db.from('agendamentos').delete().eq('id', agEditandoId);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  fecharModal();
  await carregarAgenda();
}

// ── Filtros de equipe ───────────────────────────────────────
document.querySelectorAll('.filtro-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    filtroEquipe = btn.dataset.equipe;
    renderGrade(diasDaSemana(semanaOffset));
  });
});

// ── Iniciar ─────────────────────────────────────────────────
init();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
