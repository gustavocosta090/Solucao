<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0A0A0A;
      --surface-1:    #111111;
      --surface-2:    #161616;
      --surface-3:    #1B1B1B;
      --primary:      #3ECF8E;
      --secondary:    #4F46E5;
      --text-1:       #FFFFFF;
      --text-2:       #A1A1AA;
      --text-3:       #52525B;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
    .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

    /* ── Barra de controles ── */
    .controles {
      max-width: 1400px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .semana-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .semana-nav button {
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms, color 150ms;
    }

    .semana-nav button i { width: 16px; height: 16px; }
    .semana-nav button:hover { border-color: var(--border-hover); color: var(--text-1); }

    .semana-nav span {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-1);
      min-width: 230px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .filtros-equipe {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filtro-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }

    .filtro-btn:hover { border-color: var(--border-hover); color: var(--text-1); }

    .filtro-btn.ativo {
      background: rgba(62,207,142,0.12);
      border-color: rgba(62,207,142,0.35);
      color: var(--primary);
    }

    .btn-novo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 150ms, transform 150ms;
      font-family: inherit;
    }

    .btn-novo i { width: 15px; height: 15px; }
    .btn-novo:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── Grade semanal ── */
    .grade {
      max-width: 1400px;
      margin: 20px auto 48px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 900px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .grade { grid-template-columns: 1fr; } }

    /* ── Coluna do dia ── */
    .coluna {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .coluna-header {
      padding: 12px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dia-nome {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    .dia-data {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .dia-data.hoje { color: var(--primary); }

    .btn-add {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 150ms, color 150ms, background 150ms;
    }

    .btn-add i { width: 14px; height: 14px; }
    .btn-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(62,207,142,0.08); }

    .coluna-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .coluna-vazia {
      text-align: center;
      padding: 24px 8px;
      color: var(--text-3);
      font-size: 0.75rem;
    }

    /* ── Cards de agendamento ── */
    .card-ag {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 3px solid;
      cursor: pointer;
      transition: opacity 150ms, transform 150ms;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .card-ag:hover { opacity: 0.85; transform: translateX(2px); }

    /* confirmado = AZUL */
    .card-confirmado   { background: rgba(59,130,246,0.07);  border-color: #3b82f6; }
    /* nao_confirmado = AMARELO */
    .card-nao_confirmado { background: rgba(234,179,8,0.07); border-color: #eab308; }
    /* viagem = VERDE */
    .card-viagem       { background: rgba(34,197,94,0.07);   border-color: #22c55e; }

    .ag-tecs    { font-weight: 700; color: var(--text-1); margin-bottom: 3px; }
    .ag-cliente { font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
    .ag-detalhe { color: var(--text-3); font-size: 0.72rem; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .ag-detalhe i { width: 11px; height: 11px; flex-shrink: 0; }

    .ag-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* badges */
    .badge-confirmado     { background: rgba(30,58,138,0.6);   color: #bfdbfe; }
    .badge-nao_confirmado { background: rgba(113,63,18,0.6);   color: #fef08a; }
    .badge-viagem         { background: rgba(20,83,45,0.6);    color: #86efac; }

    /* ── Spinner ── */
    .spinner-wrap { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-3); }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-header-icon i { width: 16px; height: 16px; color: var(--primary); }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-group label .label-hint {
      color: var(--text-3);
      font-weight: 400;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      color: var(--text-1);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      font-family: inherit;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--text-3); }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .form-group select option { background: var(--surface-2); color: var(--text-1); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Separador de seção ── */
    .form-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Equipe multi-select ── */
    .equipe-select { position: relative; }

    .equipe-trigger {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 40px;
      gap: 8px;
      transition: border-color 150ms, box-shadow 150ms;
      user-select: none;
    }

    .equipe-trigger:hover { border-color: var(--border-hover); }

    .equipe-trigger.aberto {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .equipe-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .equipe-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.25);
      border-radius: 4px;
      padding: 2px 7px 2px 9px;
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .equipe-chip-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      padding: 0 1px;
      line-height: 1;
      font-size: 15px;
      opacity: 0.6;
      display: flex;
      align-items: center;
    }

    .equipe-chip-del:hover { opacity: 1; }

    .equipe-placeholder { color: var(--text-3); font-size: 0.84rem; }

    .equipe-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-3);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .equipe-arrow.rotated { transform: rotate(180deg); }

    .equipe-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-input);
      z-index: 300;
      max-height: 210px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
    }

    .equipe-dropdown.aberto { display: block; }

    .equipe-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 120ms;
      font-size: 0.82rem;
    }

    .equipe-item:hover { background: rgba(255,255,255,0.04); }
    .equipe-item.selecionado { background: rgba(62,207,142,0.06); }

    .equipe-item input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .equipe-item-nome { color: var(--text-1); font-weight: 500; flex: 1; }
    .equipe-item-funcao {
      color: var(--text-3);
      font-size: 0.72rem;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Footer do modal ── */
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .btn-cancelar {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 150ms, color 150ms;
    }

    .btn-cancelar:hover { border-color: var(--border-hover); color: var(--text-1); }

    .btn-salvar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: opacity 150ms;
    }

    .btn-salvar:hover { opacity: 0.88; }
    .btn-salvar:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-excluir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-input);
      color: #f87171;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      margin-right: auto;
      transition: background 150ms, border-color 150ms;
    }

    .btn-excluir:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.35); }
    .btn-excluir i { width: 14px; height: 14px; }
  </style>
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<!-- Controles -->
<div class="controles">
  <div class="semana-nav">
    <button onclick="mudarSemana(-1)"><i data-lucide="chevron-left"></i></button>
    <span id="periodo-label">—</span>
    <button onclick="mudarSemana(1)"><i data-lucide="chevron-right"></i></button>
  </div>

  <div class="filtros-equipe">
    <button class="filtro-btn ativo" data-equipe="todas">Todas equipes</button>
    <button class="filtro-btn" data-equipe="1">Cabeamento</button>
    <button class="filtro-btn" data-equipe="2">Elétrica</button>
    <button class="filtro-btn" data-equipe="3">Áudio e Vídeo</button>
    <button class="filtro-btn" data-equipe="4">Automação</button>
  </div>

  <button class="btn-novo" onclick="abrirModal()">
    <i data-lucide="plus"></i>
    Novo agendamento
  </button>
</div>

<!-- Grade semanal -->
<div class="grade" id="grade">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <p>Carregando agenda...</p>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="fecharModalFora(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-icon">
        <i data-lucide="calendar"></i>
      </div>
      <div class="modal-title" id="modal-titulo">Novo Agendamento</div>
    </div>

    <div id="modal-erro" style="display:none;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:6px;padding:10px 14px;font-size:0.8rem;color:#f87171;margin-bottom:16px;"></div>

    <!-- OBRA / CLIENTE -->
    <div class="form-section-label">Obra / Cliente</div>

    <div class="form-group">
      <label>Obra</label>
      <select id="f-obra" onchange="onObraChange()">
        <option value="">Selecione a obra...</option>
        <option value="outro">— Outro (assistência / avulso) —</option>
      </select>
    </div>

    <!-- Campos para "Outro" -->
    <div id="outro-fields" style="display:none">
      <div class="form-group">
        <label>Nome do cliente</label>
        <input type="text" id="f-nome-outro" placeholder="Nome do cliente para assistência..."/>
      </div>
    </div>

    <div class="form-group">
      <label>Endereço <span class="label-hint">(preenchido da obra, editável)</span></label>
      <input type="text" id="f-endereco" placeholder="Endereço do serviço..."/>
    </div>

    <!-- EQUIPE -->
    <div class="form-section-label">Equipe</div>

    <div class="form-group">
      <label>Quem vai <span class="label-hint">(selecione todos)</span></label>
      <div class="equipe-select" id="equipe-select">
        <div class="equipe-trigger" id="equipe-trigger" onclick="toggleEquipeDropdown()">
          <div class="equipe-chips-wrap" id="equipe-chips-wrap">
            <span id="equipe-placeholder" class="equipe-placeholder">Selecione a equipe...</span>
          </div>
          <svg id="equipe-arrow" class="equipe-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="equipe-dropdown" id="equipe-dropdown">
          <div id="equipe-lista"></div>
        </div>
      </div>
    </div>

    <!-- AGENDAMENTO -->
    <div class="form-section-label">Agendamento</div>

    <div class="form-row">
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="f-data"/>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option value="confirmado">Confirmado</option>
          <option value="nao_confirmado">Não confirmado</option>
          <option value="viagem">Viagem</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Hora início</label>
        <input type="time" id="f-inicio"/>
      </div>
      <div class="form-group">
        <label>Hora fim</label>
        <input type="time" id="f-fim"/>
      </div>
    </div>

    <div class="form-group">
      <label>Veículo (placa)</label>
      <input type="text" id="f-veiculo" placeholder="Ex: STRADA-TYR7C97"/>
    </div>

    <div class="form-group">
      <label>Serviço a realizar</label>
      <textarea id="f-servico" rows="3" placeholder="Descreva o serviço..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-excluir" id="btn-excluir" onclick="excluirAgendamento()" style="display:none">
        <i data-lucide="trash-2"></i>
        Excluir
      </button>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarAgendamento()">
        <i data-lucide="save"></i>
        Salvar
      </button>
    </div>
  </div>
</div>

<script>
const { createClient } = window.supabase;

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();

  }

  await Promise.all([carregarObras(), carregarTecnicos()]);
  preencherSelects();
  await carregarAgenda();

}

// ── Datas ────────────────────────────────────────────────────
function getSegunda(offset = 0) {
  const hoje = new Date();
  const dia  = hoje.getDay() || 7;
  const seg  = new Date(hoje);
  seg.setDate(hoje.getDate() - dia + 1 + offset * 7);
  seg.setHours(0,0,0,0);
  return seg;
}

function diasDaSemana(offset) {
  const seg = getSegunda(offset);
  return Array.from({length: 5}, (_, i) => {
    const d = new Date(seg);
    d.setDate(seg.getDate() + i);
    return d;
  });
}

function fmtISO(d) { return d.toISOString().split('T')[0]; }
function fmtBR(d)  { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }

function isHoje(d) {
  const h = new Date();
  return d.getDate()===h.getDate() && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
}

// ── Carregar dados ───────────────────────────────────────────
async function carregarObras() {
  const { data } = await db.from('obras').select('id, nome_cliente, endereco').order('nome_cliente');
  obras = data || [];
}

async function carregarTecnicos() {
  let { data: t, error: e1 } = await db.from('tecnicos').select('id, nome, funcao').order('nome');
  if (e1 || !t) {
    const { data: t2 } = await db.from('tecnicos').select('id, nome').order('nome');
    t = (t2 || []).map(x => ({ ...x, funcao: '' }));
  }
  const { data: te } = await db.from('tecnico_equipes').select('tecnico_id, equipe_id');
  tecnicos       = t  || [];
  tecnicoEquipes = te || [];
}

async function carregarAgenda() {
  const dias = diasDaSemana(semanaOffset);
  const ini  = fmtISO(dias[0]);
  const fim  = fmtISO(dias[4]);

  document.getElementById('periodo-label').textContent =
    `${DIAS[0]}, ${fmtBR(dias[0])} — ${DIAS[4]}, ${fmtBR(dias[4])}`;

  const { data, error } = await db
    .from('agendamentos')
    .select('*, obras(nome_cliente, endereco)')
    .gte('data', ini)
    .lte('data', fim)
    .order('hora_inicio');

  if (error) {
    document.getElementById('grade').innerHTML =
      `<div class="spinner-wrap"><p style="color:#f87171">Erro: ${error.message}</p></div>`;
    return;
  }

  agendamentos = data || [];
  renderGrade(dias);
}

// ── Filtro por equipe ────────────────────────────────────────
function tecnicosDaEquipe(equipeId) {
  return tecnicoEquipes.filter(te => te.equipe_id === equipeId).map(te => te.tecnico_id);
}

function agendamentosVisiveis() {
  if (filtroEquipe === 'todas') return agendamentos;
  const ids = tecnicosDaEquipe(parseInt(filtroEquipe));
  return agendamentos.filter(ag =>
    ids.includes(ag.tecnico_id)   ||
    ids.includes(ag.auxiliar_id)  ||
    ids.includes(ag.auxiliar2_id) ||
    ids.includes(ag.auxiliar3_id)
  );
}

// ── Renderizar grade ─────────────────────────────────────────
function renderGrade(dias) {
  const visiveis = agendamentosVisiveis();
  const grade    = document.getElementById('grade');

  grade.innerHTML = dias.map((dia, i) => {
    const dataStr = fmtISO(dia);
    const ags     = visiveis.filter(ag => ag.data === dataStr);

    const cards = ags.length
      ? ags.map(cardHTML).join('')
      : `<div class="coluna-vazia">Sem agendamentos</div>`;

    return `
      <div class="coluna">
        <div class="coluna-header">
          <div>
            <div class="dia-nome">${DIAS[i]}</div>
            <div class="dia-data ${isHoje(dia) ? 'hoje' : ''}">${fmtBR(dia)}</div>
          </div>
          ${modoVisualizacao ? '' : `<button class="btn-add" onclick="abrirModal('${dataStr}')" title="Novo agendamento"><i data-lucide="plus"></i></button>`}
        </div>
        <div class="coluna-body">${cards}</div>
      </div>`;
  }).join('');

  lucide.createIcons();
}

// ── Card de agendamento ──────────────────────────────────────
function cardHTML(ag) {
  const status = ag.status || 'confirmado';

  // Monta nomes da equipe a partir do array local de técnicos
  const ids   = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
  const nomes = ids.map(id => {
    const t = tecnicos.find(t => t.id === id);
    return t ? t.nome.split(' ')[0] : null; // primeiro nome para caber no card
  }).filter(Boolean);

  const tecs    = nomes.join(' · ') || '—';
  const cliente = ag.obras?.nome_cliente || ag.cliente_outro || '—';
  const end     = ag.endereco_outro || ag.obras?.endereco || '';
  const hora    = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '';

  return `
    <div class="card-ag card-${status}" ${modoVisualizacao ? '' : `onclick="editarAgendamento(${ag.id})" title="Clique para editar"`} style="${modoVisualizacao ? 'cursor:default' : ''}">
      <div class="ag-tecs">${hora ? hora + ' · ' : ''}${tecs}</div>
      <div class="ag-cliente">${cliente}</div>
      ${end ? `<div class="ag-detalhe"><i data-lucide="map-pin"></i>${end}</div>` : ''}
      ${ag.servico ? `<div class="ag-detalhe"><i data-lucide="wrench"></i>${ag.servico}</div>` : ''}
      ${ag.veiculo ? `<div class="ag-detalhe"><i data-lucide="car"></i>${ag.veiculo}</div>` : ''}
      <span class="ag-badge badge-${status}">${STATUS_LABEL[status] || status}</span>
    </div>`;
}

// ── Equipe multi-select ──────────────────────────────────────
function toggleEquipeDropdown() {
  equipeDropdownAberto = !equipeDropdownAberto;
  const dropdown = document.getElementById('equipe-dropdown');
  const trigger  = document.getElementById('equipe-trigger');
  const arrow    = document.getElementById('equipe-arrow');
  dropdown.classList.toggle('aberto', equipeDropdownAberto);
  trigger.classList.toggle('aberto', equipeDropdownAberto);
  if (arrow) arrow.classList.toggle('rotated', equipeDropdownAberto);
}

function fecharEquipeDropdown() {
  equipeDropdownAberto = false;
  const dropdown = document.getElementById('equipe-dropdown');
  const trigger  = document.getElementById('equipe-trigger');
  const arrow    = document.getElementById('equipe-arrow');
  if (dropdown) dropdown.classList.remove('aberto');
  if (trigger)  trigger.classList.remove('aberto');
  if (arrow)    arrow.classList.remove('rotated');
}

function toggleTecnicoEquipe(idStr, evt) {
  if (evt) evt.stopPropagation();
  const idx = equipesSelecionadas.indexOf(idStr);
  if (idx === -1) {
    equipesSelecionadas.push(idStr);
  } else {
    equipesSelecionadas.splice(idx, 1);
  }
  renderEquipeChips();
  renderEquipeDropdownItems();
}

function removerDaEquipe(idStr) {
  equipesSelecionadas = equipesSelecionadas.filter(x => x !== idStr);
  renderEquipeChips();
  renderEquipeDropdownItems();
}

function renderEquipeChips() {
  const wrap        = document.getElementById('equipe-chips-wrap');
  const placeholder = document.getElementById('equipe-placeholder');
  if (!wrap) return;

  // Remove chips existentes
  wrap.querySelectorAll('.equipe-chip').forEach(c => c.remove());

  if (equipesSelecionadas.length === 0) {
    if (placeholder) placeholder.style.display = '';
    return;
  }
  if (placeholder) placeholder.style.display = 'none';

  equipesSelecionadas.forEach(idStr => {
    const t = tecnicos.find(t => String(t.id) === idStr);
    if (!t) return;
    const chip = document.createElement('span');
    chip.className = 'equipe-chip';
    chip.innerHTML = `${t.nome.split(' ')[0]} <button type="button" class="equipe-chip-del" onclick="event.stopPropagation();removerDaEquipe('${idStr}')">×</button>`;
    wrap.appendChild(chip);
  });
}

function renderEquipeDropdownItems() {
  const lista = document.getElementById('equipe-lista');
  if (!lista) return;

  lista.innerHTML = tecnicos.map(t => {
    const idStr      = String(t.id);
    const selecionado = equipesSelecionadas.includes(idStr);
    return `
      <div class="equipe-item ${selecionado ? 'selecionado' : ''}"
           onclick="toggleTecnicoEquipe('${idStr}', event)">
        <input type="checkbox" ${selecionado ? 'checked' : ''}
               onclick="event.stopPropagation();toggleTecnicoEquipe('${idStr}', event)"/>
        <span class="equipe-item-nome">${t.nome}</span>
        ${t.funcao ? `<span class="equipe-item-funcao">${t.funcao}</span>` : ''}
      </div>`;
  }).join('');
}

// ── Obra select — auto-preenche endereço ─────────────────────
function onObraChange() {
  const val         = document.getElementById('f-obra').value;
  const outroFields = document.getElementById('outro-fields');
  const endInput    = document.getElementById('f-endereco');

  outroFields.style.display = val === 'outro' ? 'block' : 'none';

  if (val && val !== 'outro') {
    const obra = obras.find(o => String(o.id) === val);
    if (obra && obra.endereco) {
      endInput.value = obra.endereco;
    }
  } else if (!val) {
    endInput.value = '';
  }
}

// ── Preencher select de obras ────────────────────────────────
function preencherSelects() {
  const selObra = document.getElementById('f-obra');
  selObra.innerHTML = '<option value="">Selecione a obra...</option><option value="outro">— Outro (assistência / avulso) —</option>';
  obras.forEach(o => {
    const opt = document.createElement('option');
    opt.value       = String(o.id);
    opt.textContent = o.nome_cliente;
    selObra.appendChild(opt);
  });
  renderEquipeDropdownItems();
}

// ── Abrir modal (novo) ───────────────────────────────────────
async function abrirModal(data = '') {
  agEditandoId = null;
  equipesSelecionadas = [];
  fecharEquipeDropdown();

  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();
  renderEquipeChips();

  document.getElementById('modal-titulo').textContent   = 'Novo Agendamento';
  document.getElementById('modal-erro').style.display   = 'none';
  document.getElementById('f-obra').value               = '';
  document.getElementById('f-endereco').value           = '';
  document.getElementById('outro-fields').style.display = 'none';
  document.getElementById('f-nome-outro').value         = '';
  document.getElementById('f-status').value             = 'confirmado';
  document.getElementById('f-inicio').value             = '';
  document.getElementById('f-fim').value                = '';
  document.getElementById('f-veiculo').value            = '';
  document.getElementById('f-servico').value            = '';
  document.getElementById('f-data').value               = data || fmtISO(new Date());
  document.getElementById('btn-excluir').style.display  = 'none';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Abrir modal (editar) ─────────────────────────────────────
async function editarAgendamento(id) {
  const ag = agendamentos.find(a => a.id === id);
  if (!ag) return;
  agEditandoId = id;

  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();

  // Reconstrói equipe a partir dos 4 campos
  equipesSelecionadas = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id]
    .filter(Boolean)
    .map(String);
  renderEquipeChips();
  renderEquipeDropdownItems();
  fecharEquipeDropdown();

  document.getElementById('modal-titulo').textContent = 'Editar Agendamento';
  document.getElementById('modal-erro').style.display = 'none';

  const obraVal = ag.obra_id ? String(ag.obra_id) : (ag.cliente_outro ? 'outro' : '');
  document.getElementById('f-obra').value               = obraVal;
  document.getElementById('outro-fields').style.display = ag.cliente_outro ? 'block' : 'none';
  document.getElementById('f-nome-outro').value         = ag.cliente_outro || '';

  // Endereço: prioriza override salvo, senão pega da obra
  const obraLocal = obras.find(o => String(o.id) === String(ag.obra_id));
  document.getElementById('f-endereco').value = ag.endereco_outro || obraLocal?.endereco || '';

  document.getElementById('f-data').value    = ag.data            || '';
  document.getElementById('f-status').value  = ag.status          || 'confirmado';
  document.getElementById('f-inicio').value  = ag.hora_inicio     ? ag.hora_inicio.slice(0,5) : '';
  document.getElementById('f-fim').value     = ag.hora_fim        ? ag.hora_fim.slice(0,5)    : '';
  document.getElementById('f-veiculo').value = ag.veiculo         || '';
  document.getElementById('f-servico').value = ag.servico         || '';
  document.getElementById('btn-excluir').style.display = 'flex';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Fechar modal ─────────────────────────────────────────────
function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
  agEditandoId = null;
  fecharEquipeDropdown();
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('overlay')) fecharModal();
}

// ── Salvar agendamento ───────────────────────────────────────
async function salvarAgendamento() {
  const btn    = document.getElementById('btn-salvar');
  const erroEl = document.getElementById('modal-erro');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  erroEl.style.display = 'none';

  const obraVal   = document.getElementById('f-obra').value;
  const nomeOutro = document.getElementById('f-nome-outro').value.trim();
  const endereco  = document.getElementById('f-endereco').value.trim();
  const data      = document.getElementById('f-data').value;
  const status    = document.getElementById('f-status').value;
  const inicio    = document.getElementById('f-inicio').value;
  const fim       = document.getElementById('f-fim').value;
  const veiculo   = document.getElementById('f-veiculo').value;
  const servico   = document.getElementById('f-servico').value;

  // Validações
  if (!obraVal) {
    mostrarErroModal('Selecione a obra ou escolha "Outro".'); return;
  }
  if (obraVal === 'outro' && !nomeOutro) {
    mostrarErroModal('Informe o nome do cliente.'); return;
  }
  if (equipesSelecionadas.length === 0) {
    mostrarErroModal('Selecione pelo menos uma pessoa para a equipe.'); return;
  }
  if (!data) {
    mostrarErroModal('Selecione a data.'); return;
  }

  function mostrarErroModal(msg) {
    erroEl.textContent      = msg;
    erroEl.style.display    = 'block';
    btn.disabled            = false;
    btn.innerHTML           = '<i data-lucide="save"></i> Salvar';
    lucide.createIcons();
  }

  // Mapeia equipe → colunas DB (max 4)
  const [id0, id1, id2, id3] = equipesSelecionadas;

  const payload = {
    obra_id:        obraVal !== 'outro' ? parseInt(obraVal) : null,
    cliente_outro:  obraVal === 'outro' ? nomeOutro          : null,
    endereco_outro: endereco || null,
    tecnico_id:     id0 ? parseInt(id0) : null,
    auxiliar_id:    id1 ? parseInt(id1) : null,
    auxiliar2_id:   id2 ? parseInt(id2) : null,
    auxiliar3_id:   id3 ? parseInt(id3) : null,
    data, status,
    hora_inicio: inicio  || null,
    hora_fim:    fim     || null,
    veiculo:     veiculo || null,
    servico:     servico || null,
  };

  const tentarSalvar = async (p) => {
    if (agEditandoId) {
      return (await db.from('agendamentos').update(p).eq('id', agEditandoId)).error;
    } else {
      return (await db.from('agendamentos').insert(p)).error;
    }
  };

  let error = await tentarSalvar(payload);

  // Fallback gracioso se colunas novas ainda não existem no banco
  if (error && (
    error.message.includes('auxiliar2_id') ||
    error.message.includes('auxiliar3_id') ||
    error.message.includes('cliente_outro') ||
    error.message.includes('endereco_outro')
  )) {
    const fallback = {
      obra_id:     payload.obra_id,
      tecnico_id:  payload.tecnico_id,
      auxiliar_id: payload.auxiliar_id,
      data:        payload.data,
      status:      payload.status,
      hora_inicio: payload.hora_inicio,
      hora_fim:    payload.hora_fim,
      veiculo:     payload.veiculo,
      servico:     payload.servico,
    };
    error = await tentarSalvar(fallback);
  }

  if (error) {
    erroEl.textContent   = 'Erro ao salvar: ' + error.message;
    erroEl.style.display = 'block';
  } else {
    fecharModal();
    await carregarAgenda();
  }

  btn.disabled  = false;
  btn.innerHTML = '<i data-lucide="save"></i> Salvar';
  lucide.createIcons();
}

// ── Excluir agendamento ──────────────────────────────────────
async function excluirAgendamento() {
  if (!agEditandoId) return;
  if (!confirm('Tem certeza que quer excluir este agendamento?')) return;
  const { error } = await db.from('agendamentos').delete().eq('id', agEditandoId);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  fecharModal();
  await carregarAgenda();
}
