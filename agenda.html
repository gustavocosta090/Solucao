<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — Agenda Técnica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';function applyTheme(t){localStorage.setItem('tema',t);document.documentElement.dataset.theme=t;var i={dark:'🌙',light:'☀️',auto:'🖥️'};var b=document.getElementById('tema-btn');if(b){b.textContent=i[t];b.title={dark:'Modo escuro',light:'Modo claro',auto:'Automático'}[t];}}function ciclarTema(){applyTheme({auto:'dark',dark:'light',light:'auto'}[localStorage.getItem('tema')||'auto']);}window.addEventListener('DOMContentLoaded',function(){applyTheme(localStorage.getItem('tema')||'auto');});</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0A0A0A;
      --surface-1:    #111111;
      --surface-2:    #161616;
      --surface-3:    #1B1B1B;
      --primary:      #3ECF8E;
      --secondary:    #4F46E5;
      --text-1:       #FFFFFF;
      --text-2:       #A1A1AA;
      --text-3:       #52525B;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
    .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

    /* ── Barra de controles ── */
    .controles {
      max-width: 1400px;
      margin: 28px auto 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .semana-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .semana-nav button {
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 150ms, color 150ms;
    }

    .semana-nav button i { width: 16px; height: 16px; }
    .semana-nav button:hover { border-color: var(--border-hover); color: var(--text-1); }

    .semana-nav span {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-1);
      min-width: 230px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .filtros-equipe {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filtro-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }

    .filtro-btn:hover { border-color: var(--border-hover); color: var(--text-1); }

    .filtro-btn.ativo {
      background: rgba(62,207,142,0.12);
      border-color: rgba(62,207,142,0.35);
      color: var(--primary);
    }

    .btn-novo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 150ms, transform 150ms;
      font-family: inherit;
    }

    .btn-novo i { width: 15px; height: 15px; }
    .btn-novo:hover { opacity: 0.88; transform: translateY(-1px); }

    /* ── Grade semanal ── */
    .grade {
      max-width: 1400px;
      margin: 20px auto 48px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 900px) { .grade { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px) { .grade { grid-template-columns: 1fr; } }

    /* ── Coluna do dia ── */
    .coluna {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .coluna-header {
      padding: 12px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dia-nome {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    .dia-data {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .dia-data.hoje { color: var(--primary); }

    /* ── Botão disparar dia (dentro do header de cada coluna) ── */
    .btn-dispatch-dia {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px;
      background: rgba(37,211,102,0.08);
      border: 1px solid rgba(37,211,102,0.22);
      border-radius: var(--radius-input);
      color: #25D366; cursor: pointer; flex-shrink: 0;
      transition: background 150ms, border-color 150ms;
    }
    .btn-dispatch-dia:hover { background: rgba(37,211,102,0.18); border-color: rgba(37,211,102,0.45); }
    .btn-dispatch-dia svg { width: 12px; height: 12px; flex-shrink: 0; }

    .btn-add {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 150ms, color 150ms, background 150ms;
    }

    .btn-add i { width: 14px; height: 14px; }
    .btn-add:hover { border-color: var(--primary); color: var(--primary); background: rgba(62,207,142,0.08); }

    .coluna-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .coluna-vazia {
      text-align: center;
      padding: 24px 8px;
      color: var(--text-3);
      font-size: 0.75rem;
    }

    /* ── Cards de agendamento ── */
    .card-ag {
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 3px solid;
      cursor: pointer;
      transition: opacity 150ms, transform 150ms;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .card-ag:hover { opacity: 0.85; transform: translateX(2px); }

    /* confirmado = AZUL */
    .card-confirmado   { background: rgba(59,130,246,0.07);  border-color: #3b82f6; }
    /* nao_confirmado = AMARELO */
    .card-nao_confirmado { background: rgba(234,179,8,0.07); border-color: #eab308; }
    /* viagem = VERDE */
    .card-viagem       { background: rgba(34,197,94,0.07);   border-color: #22c55e; }

    .ag-tecs    { font-weight: 700; color: var(--text-1); margin-bottom: 3px; }
    .ag-cliente { font-weight: 600; color: var(--text-2); margin-bottom: 2px; }
    .ag-detalhe { color: var(--text-3); font-size: 0.72rem; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .ag-detalhe i { width: 11px; height: 11px; flex-shrink: 0; }

    .ag-badge {
      display: inline-block;
      margin-top: 7px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* badges */
    .badge-confirmado     { background: rgba(30,58,138,0.6);   color: #bfdbfe; }
    .badge-nao_confirmado { background: rgba(113,63,18,0.6);   color: #fef08a; }
    .badge-viagem         { background: rgba(20,83,45,0.6);    color: #86efac; }

    /* ── Spinner ── */
    .spinner-wrap { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-3); }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-header-icon i { width: 16px; height: 16px; color: var(--primary); }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-group label .label-hint {
      color: var(--text-3);
      font-weight: 400;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      color: var(--text-1);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      font-family: inherit;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--text-3); }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .form-group select option { background: var(--surface-2); color: var(--text-1); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Separador de seção ── */
    .form-section-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 20px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Equipe multi-select ── */
    .equipe-select { position: relative; }

    .equipe-trigger {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      min-height: 40px;
      gap: 8px;
      transition: border-color 150ms, box-shadow 150ms;
      user-select: none;
    }

    .equipe-trigger:hover { border-color: var(--border-hover); }

    .equipe-trigger.aberto {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .equipe-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .equipe-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.25);
      border-radius: 4px;
      padding: 2px 7px 2px 9px;
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .equipe-chip-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
      padding: 0 1px;
      line-height: 1;
      font-size: 15px;
      opacity: 0.6;
      display: flex;
      align-items: center;
    }

    .equipe-chip-del:hover { opacity: 1; }

    .equipe-placeholder { color: var(--text-3); font-size: 0.84rem; }

    .equipe-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-3);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .equipe-arrow.rotated { transform: rotate(180deg); }

    .equipe-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-input);
      z-index: 300;
      max-height: 210px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
    }

    .equipe-dropdown.aberto { display: block; }

    .equipe-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 120ms;
      font-size: 0.82rem;
    }

    .equipe-item:hover { background: rgba(255,255,255,0.04); }
    .equipe-item.selecionado { background: rgba(62,207,142,0.06); }

    .equipe-item input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .equipe-item-nome { color: var(--text-1); font-weight: 500; flex: 1; }
    .equipe-item-funcao {
      color: var(--text-3);
      font-size: 0.72rem;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* ── Footer do modal ── */
    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .btn-cancelar {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 150ms, color 150ms;
    }

    .btn-cancelar:hover { border-color: var(--border-hover); color: var(--text-1); }

    .btn-salvar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: opacity 150ms;
    }

    .btn-salvar:hover { opacity: 0.88; }
    .btn-salvar:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-excluir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-input);
      color: #f87171;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      margin-right: auto;
      transition: background 150ms, border-color 150ms;
    }

    .btn-excluir:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.35); }
    .btn-excluir i { width: 14px; height: 14px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 9999;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s;
      opacity: 0;
      white-space: nowrap;
    }
    .toast.visivel { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .toast-icon.ok { background: rgba(62,207,142,0.15); color: #3ECF8E; }
    .toast-icon.err { background: rgba(239,68,68,0.15); color: #ef4444; }
    .toast-icon svg { width: 12px; height: 12px; }

    /* ── Card de agenda (renderizado pelo html2canvas, fora da tela) ── */
    #agenda-card {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1500px;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      border-radius: 14px;
      overflow: hidden;
    }
    .ac-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 24px 28px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .ac-brand { font-size: 13px; font-weight: 700; color: #3ECF8E; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
    .ac-titulo { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; line-height: 1.1; }
    .ac-data { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 6px; font-weight: 500; }
    .ac-icon { width: 40px; height: 40px; background: rgba(62,207,142,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #3ECF8E; font-size: 20px; flex-shrink: 0; }
    .ac-body { padding: 20px 24px; }
    .ac-atendimento { background: #f8fafc; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .ac-atendimento:last-child { margin-bottom: 0; }
    .ac-at-header { padding: 9px 16px; font-size: 11px; font-weight: 800; color: #ffffff; text-transform: uppercase; letter-spacing: 0.09em; display: flex; align-items: center; gap: 7px; }
    .ac-at-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.5); flex-shrink: 0; }
    .ac-campos { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .ac-campo { display: flex; align-items: flex-start; gap: 0; }
    .ac-campo-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; width: 68px; flex-shrink: 0; padding-top: 1px; }
    .ac-campo-valor { font-size: 13px; font-weight: 500; color: #0f172a; line-height: 1.45; flex: 1; }
    .ac-campo-valor.destaque { font-weight: 700; font-size: 14px; color: #0f172a; }
    .ac-footer { padding: 14px 24px; background: #f1f5f9; border-top: 1px solid #e2e8f0; text-align: center; }
    .ac-footer-txt { font-size: 11px; color: #94a3b8; font-weight: 500; letter-spacing: 0.03em; }

    /* ── Botão WhatsApp ── */
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: rgba(37,211,102,0.12);
      border: 1px solid rgba(37,211,102,0.3);
      border-radius: var(--radius-input);
      color: #25D366;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 150ms, border-color 150ms, transform 150ms;
      font-family: inherit;
    }

  return String(v ?? '').replace(/[&<>"']/g, c => ({

  const { data: { session } } = await db.auth.getSession();

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();

function renderTopbar(nome, role, paginaAtiva) {
  const h = new Date().getHours();

  const links = [

    { href:'pendencias.html',           label:'Pendências',          id:'pendencias',         roles:['supervisor','coordenador','agendamento'] },
    { href:'admin.html',                label:'Admin',               id:'admin',              roles:['coordenador'] },
    { href:'tecnico_dashboard.html',    label:'Minhas OSs',          id:'minhas-os',          roles:['tecnico','auxiliar'] },
    { href:'gerente_comercial.html',    label:'Comercial',           id:'comercial',          roles:['gerente_comercial'] },
    { href:'projetista.html',           label:'Meu Painel',          id:'projetista',         roles:['projetista'] },
    { href:'coordenador_projetos.html', label:'Projetos',            id:'coordenador-projetos', roles:['coordenador_projetos'] },
  ];
  const nav = document.getElementById('topbar-nav');

    .join('') + `<a href="#" class="nav-sair" onclick="logout()">Sair</a>`;
}

// ── Datas ────────────────────────────────────────────────────
function getSegunda(offset = 0) {
  const hoje = new Date();
  const dia  = hoje.getDay() || 7;
  const seg  = new Date(hoje);
  seg.setDate(hoje.getDate() - dia + 1 + offset * 7);
  seg.setHours(0,0,0,0);
  return seg;
}

function diasDaSemana(offset) {
  const seg = getSegunda(offset);
  return Array.from({length: 5}, (_, i) => {
    const d = new Date(seg);
    d.setDate(seg.getDate() + i);
    return d;
  });
}

function fmtISO(d) { return d.toISOString().split('T')[0]; }
function fmtBR(d)  { return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }

function isHoje(d) {
  const h = new Date();
  return d.getDate()===h.getDate() && d.getMonth()===h.getMonth() && d.getFullYear()===h.getFullYear();
}

// ── Carregar dados ───────────────────────────────────────────
async function carregarObras() {
  const { data } = await db.from('obras').select('id, nome_cliente, endereco').order('nome_cliente');
  obras = data || [];
}

async function carregarTecnicos() {
  let { data: t, error: e1 } = await db.from('tecnicos').select('id, nome, funcao').order('nome');
  if (e1 || !t) {
    const { data: t2 } = await db.from('tecnicos').select('id, nome').order('nome');
    t = (t2 || []).map(x => ({ ...x, funcao: '' }));
  }
  const { data: te } = await db.from('tecnico_equipes').select('tecnico_id, equipe_id');
  tecnicos       = t  || [];
  tecnicoEquipes = te || [];
}

async function carregarAgenda() {
  const dias = diasDaSemana(semanaOffset);
  const ini  = fmtISO(dias[0]);
  const fim  = fmtISO(dias[4]);

  document.getElementById('periodo-label').textContent =
    `${DIAS[0]}, ${fmtBR(dias[0])} — ${DIAS[4]}, ${fmtBR(dias[4])}`;

  const { data, error } = await db
    .from('agendamentos')
    .select('*, obras(nome_cliente, endereco)')
    .gte('data', ini)
    .lte('data', fim)
    .order('hora_inicio');

  if (error) {
    document.getElementById('grade').innerHTML =
      `<div class="spinner-wrap"><p style="color:#f87171">Erro: ${error.message}</p></div>`;
    return;
  }

  agendamentos = data || [];
  renderGrade(dias);
}

// ── Filtro por equipe ────────────────────────────────────────
function tecnicosDaEquipe(equipeId) {
  return tecnicoEquipes.filter(te => te.equipe_id === equipeId).map(te => te.tecnico_id);
}

function agendamentosVisiveis() {
  if (filtroEquipe === 'todas') return agendamentos;
  const ids = tecnicosDaEquipe(parseInt(filtroEquipe));
  return agendamentos.filter(ag =>
    ids.includes(ag.tecnico_id)   ||
    ids.includes(ag.auxiliar_id)  ||
    ids.includes(ag.auxiliar2_id) ||
    ids.includes(ag.auxiliar3_id)
  );
}

// ── Card de agendamento ──────────────────────────────────────
function cardHTML(ag) {
  const status = ag.status || 'confirmado';

  // Monta nomes da equipe a partir do array local de técnicos
  const ids   = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
  const nomes = ids.map(id => {
    const t = tecnicos.find(t => t.id === id);
    return t ? t.nome.split(' ')[0] : null; // primeiro nome para caber no card
  }).filter(Boolean);

  const tecs    = nomes.join(' · ') || '—';
  const cliente = ag.obras?.nome_cliente || ag.cliente_outro || '—';
  const end     = ag.endereco_outro || ag.obras?.endereco || '';
  const hora    = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '';

  return `
    <div class="card-ag card-${status}" ${modoVisualizacao ? '' : `onclick="editarAgendamento(${ag.id})" title="Clique para editar"`} style="${modoVisualizacao ? 'cursor:default' : ''}">
      <div class="ag-tecs">${escHtml(hora ? hora + ' · ' : '')}${escHtml(tecs)}</div>
      <div class="ag-cliente">${escHtml(cliente)}</div>
      ${end ? `<div class="ag-detalhe"><i data-lucide="map-pin"></i>${escHtml(end)}</div>` : ''}
      ${ag.servico ? `<div class="ag-detalhe"><i data-lucide="wrench"></i>${escHtml(ag.servico)}</div>` : ''}
      ${ag.veiculo ? `<div class="ag-detalhe"><i data-lucide="car"></i>${escHtml(ag.veiculo)}</div>` : ''}
      <span class="ag-badge badge-${escHtml(status)}">${escHtml(STATUS_LABEL[status] || status)}</span>
    </div>`;
}

// ── Equipe multi-select ──────────────────────────────────────
function toggleEquipeDropdown() {
  equipeDropdownAberto = !equipeDropdownAberto;
  const dropdown = document.getElementById('equipe-dropdown');
  const trigger  = document.getElementById('equipe-trigger');
  const arrow    = document.getElementById('equipe-arrow');
  dropdown.classList.toggle('aberto', equipeDropdownAberto);
  trigger.classList.toggle('aberto', equipeDropdownAberto);
  if (arrow) arrow.classList.toggle('rotated', equipeDropdownAberto);
}

function fecharEquipeDropdown() {
  equipeDropdownAberto = false;
  const dropdown = document.getElementById('equipe-dropdown');
  const trigger  = document.getElementById('equipe-trigger');
  const arrow    = document.getElementById('equipe-arrow');
  if (dropdown) dropdown.classList.remove('aberto');
  if (trigger)  trigger.classList.remove('aberto');
  if (arrow)    arrow.classList.remove('rotated');
}

function toggleTecnicoEquipe(idStr, evt) {
  if (evt) evt.stopPropagation();
  const idx = equipesSelecionadas.indexOf(idStr);
  if (idx === -1) {
    equipesSelecionadas.push(idStr);
  } else {
    equipesSelecionadas.splice(idx, 1);
  }
  renderEquipeChips();
  renderEquipeDropdownItems();
}

function removerDaEquipe(idStr) {
  equipesSelecionadas = equipesSelecionadas.filter(x => x !== idStr);
  renderEquipeChips();
  renderEquipeDropdownItems();
}

function renderEquipeChips() {
  const wrap        = document.getElementById('equipe-chips-wrap');
  const placeholder = document.getElementById('equipe-placeholder');
  if (!wrap) return;

  // Remove chips existentes
  wrap.querySelectorAll('.equipe-chip').forEach(c => c.remove());

  if (equipesSelecionadas.length === 0) {
    if (placeholder) placeholder.style.display = '';
    return;
  }
  if (placeholder) placeholder.style.display = 'none';

  equipesSelecionadas.forEach(idStr => {
    const t = tecnicos.find(t => String(t.id) === idStr);
    if (!t) return;
    const chip = document.createElement('span');
    chip.className = 'equipe-chip';
    chip.innerHTML = `${t.nome.split(' ')[0]} <button type="button" class="equipe-chip-del" onclick="event.stopPropagation();removerDaEquipe('${idStr}')">×</button>`;
    wrap.appendChild(chip);
  });
}

function renderEquipeDropdownItems() {
  const lista = document.getElementById('equipe-lista');
  if (!lista) return;

  lista.innerHTML = tecnicos.map(t => {
    const idStr      = String(t.id);
    const selecionado = equipesSelecionadas.includes(idStr);
    return `
      <div class="equipe-item ${selecionado ? 'selecionado' : ''}"
           onclick="toggleTecnicoEquipe('${idStr}', event)">
        <input type="checkbox" ${selecionado ? 'checked' : ''}
               onclick="event.stopPropagation();toggleTecnicoEquipe('${idStr}', event)"/>
        <span class="equipe-item-nome">${escHtml(t.nome)}</span>
        ${t.funcao ? `<span class="equipe-item-funcao">${escHtml(t.funcao)}</span>` : ''}
      </div>`;
  }).join('');
}

// ── Obra select — auto-preenche endereço ─────────────────────
function onObraChange() {
  const val         = document.getElementById('f-obra').value;
  const outroFields = document.getElementById('outro-fields');
  const endInput    = document.getElementById('f-endereco');

  outroFields.style.display = val === 'outro' ? 'block' : 'none';

  if (val && val !== 'outro') {
    const obra = obras.find(o => String(o.id) === val);
    if (obra && obra.endereco) {
      endInput.value = obra.endereco;
    }
  } else if (!val) {
    endInput.value = '';
  }
}

// ── Preencher select de obras ────────────────────────────────
function preencherSelects() {
  const selObra = document.getElementById('f-obra');
  selObra.innerHTML = '<option value="">Selecione a obra...</option><option value="outro">— Outro (assistência / avulso) —</option>';
  obras.forEach(o => {
    const opt = document.createElement('option');
    opt.value       = String(o.id);
    opt.textContent = o.nome_cliente;
    selObra.appendChild(opt);
  });
  renderEquipeDropdownItems();
}

// ── Abrir modal (novo) ───────────────────────────────────────
async function abrirModal(data = '') {
  agEditandoId = null;
  equipesSelecionadas = [];
  fecharEquipeDropdown();

  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();
  renderEquipeChips();

  document.getElementById('modal-titulo').textContent   = 'Novo Agendamento';
  document.getElementById('modal-erro').style.display   = 'none';
  document.getElementById('f-obra').value               = '';
  document.getElementById('f-endereco').value           = '';
  document.getElementById('outro-fields').style.display = 'none';
  document.getElementById('f-nome-outro').value         = '';
  document.getElementById('f-status').value             = 'confirmado';
  document.getElementById('f-inicio').value             = '';
  document.getElementById('f-fim').value                = '';
  document.getElementById('f-veiculo').value            = '';
  document.getElementById('f-servico').value            = '';
  document.getElementById('f-data').value               = data || fmtISO(new Date());
  document.getElementById('btn-excluir').style.display  = 'none';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Abrir modal (editar) ─────────────────────────────────────
async function editarAgendamento(id) {
  const ag = agendamentos.find(a => a.id === id);
  if (!ag) return;
  agEditandoId = id;

  if (!obras.length || !tecnicos.length) {
    await Promise.all([
      obras.length    ? Promise.resolve() : carregarObras(),
      tecnicos.length ? Promise.resolve() : carregarTecnicos(),
    ]);
  }
  preencherSelects();

  // Reconstrói equipe a partir dos 4 campos
  equipesSelecionadas = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id]
    .filter(Boolean)
    .map(String);
  renderEquipeChips();
  renderEquipeDropdownItems();
  fecharEquipeDropdown();

  document.getElementById('modal-titulo').textContent = 'Editar Agendamento';
  document.getElementById('modal-erro').style.display = 'none';

  const obraVal = ag.obra_id ? String(ag.obra_id) : (ag.cliente_outro ? 'outro' : '');
  document.getElementById('f-obra').value               = obraVal;
  document.getElementById('outro-fields').style.display = ag.cliente_outro ? 'block' : 'none';
  document.getElementById('f-nome-outro').value         = ag.cliente_outro || '';

  // Endereço: prioriza override salvo, senão pega da obra
  const obraLocal = obras.find(o => String(o.id) === String(ag.obra_id));
  document.getElementById('f-endereco').value = ag.endereco_outro || obraLocal?.endereco || '';

  document.getElementById('f-data').value    = ag.data            || '';
  document.getElementById('f-status').value  = ag.status          || 'confirmado';
  document.getElementById('f-inicio').value  = ag.hora_inicio     ? ag.hora_inicio.slice(0,5) : '';
  document.getElementById('f-fim').value     = '';
  document.getElementById('f-veiculo').value = ag.veiculo         || '';
  document.getElementById('f-servico').value = ag.servico         || '';
  document.getElementById('btn-excluir').style.display = 'flex';
  document.getElementById('overlay').classList.add('aberto');
  lucide.createIcons();
}

// ── Fechar modal ─────────────────────────────────────────────
function fecharModal() {
  document.getElementById('overlay').classList.remove('aberto');
  agEditandoId = null;
  fecharEquipeDropdown();
}

function fecharModalFora(e) {
  if (e.target === document.getElementById('overlay')) fecharModal();
}

// ── Salvar agendamento ───────────────────────────────────────
async function salvarAgendamento() {
  const btn    = document.getElementById('btn-salvar');
  const erroEl = document.getElementById('modal-erro');
  btn.disabled = true;
  btn.textContent = 'Salvando...';
  erroEl.style.display = 'none';

  const obraVal   = document.getElementById('f-obra').value;
  const nomeOutro = document.getElementById('f-nome-outro').value.trim();
  const endereco  = document.getElementById('f-endereco').value.trim();
  const data      = document.getElementById('f-data').value;
  const status    = document.getElementById('f-status').value;
  const inicio    = document.getElementById('f-inicio').value;
  const fim       = '';
  const veiculo   = document.getElementById('f-veiculo').value;
  const servico   = document.getElementById('f-servico').value;

  // Validações
  if (!obraVal) {
    mostrarErroModal('Selecione a obra ou escolha "Outro".'); return;
  }
  if (obraVal === 'outro' && !nomeOutro) {
    mostrarErroModal('Informe o nome do cliente.'); return;
  }
  if (equipesSelecionadas.length === 0) {
    mostrarErroModal('Selecione pelo menos uma pessoa para a equipe.'); return;
  }
  if (!data) {
    mostrarErroModal('Selecione a data.'); return;
  }

  function mostrarErroModal(msg) {
    erroEl.textContent      = msg;
    erroEl.style.display    = 'block';
    btn.disabled            = false;
    btn.innerHTML           = '<i data-lucide="save"></i> Salvar';
    lucide.createIcons();
  }

  // Mapeia equipe → colunas DB (max 4)
  const [id0, id1, id2, id3] = equipesSelecionadas;

  const payload = {
    obra_id:        obraVal !== 'outro' ? parseInt(obraVal) : null,
    cliente_outro:  obraVal === 'outro' ? nomeOutro          : null,
    endereco_outro: endereco || null,
    tecnico_id:     id0 ? parseInt(id0) : null,
    auxiliar_id:    id1 ? parseInt(id1) : null,
    auxiliar2_id:   id2 ? parseInt(id2) : null,
    auxiliar3_id:   id3 ? parseInt(id3) : null,
    data, status,
    hora_inicio: inicio  || null,
    hora_fim:    null,
    veiculo:     veiculo || null,
    servico:     servico || null,
  };

  // Retorna { error, id } — id é o agendamento inserido/editado
  const tentarSalvar = async (p) => {
    if (agEditandoId) {
      const res = await db.from('agendamentos').update(p).eq('id', agEditandoId);
      return { error: res.error, id: agEditandoId };
    } else {
      const res = await db.from('agendamentos').insert(p).select('id').single();
      return { error: res.error, id: res.data?.id };
    }
  };

  let result = await tentarSalvar(payload);
  let error  = result.error;
  let savedAgId = result.id;

  // Fallback gracioso se colunas novas ainda não existem no banco
  if (error && (
    error.message.includes('auxiliar2_id') ||
    error.message.includes('auxiliar3_id') ||
    error.message.includes('cliente_outro') ||
    error.message.includes('endereco_outro')
  )) {
    const fallback = {
      obra_id:     payload.obra_id,
      tecnico_id:  payload.tecnico_id,
      auxiliar_id: payload.auxiliar_id,
      data:        payload.data,
      status:      payload.status,
      hora_inicio: payload.hora_inicio,
      hora_fim:    payload.hora_fim,
      veiculo:     payload.veiculo,
      servico:     payload.servico,
    };
    result    = await tentarSalvar(fallback);
    error     = result.error;
    savedAgId = result.id;
  }

  if (error) {
    erroEl.textContent   = 'Erro ao salvar: ' + error.message;
    erroEl.style.display = 'block';
  } else {
    // ── Cria uma OS pendente individual para cada pessoa da equipe ───
    // A unificação acontece depois, no os.html, quando o técnico marca quem participou.
    if (!agEditandoId && savedAgId && status !== 'viagem') {
      const equipeOS = [payload.tecnico_id, payload.auxiliar_id, payload.auxiliar2_id, payload.auxiliar3_id]
        .filter(Boolean)
        .filter((id, idx, arr) => arr.indexOf(id) === idx);

      for (const tecnicoId of equipeOS) {
        const osPayload = {
          agendamento_id:   savedAgId,
          obra_id:          payload.obra_id,
          cliente_outro:    payload.cliente_outro   || null,
          endereco_servico: endereco                || null,
          tecnico_id:       tecnicoId,
          data_servico:     data,
          servico_planejado: servico                || null,
          status_aprovacao: 'pendente',
          criado_em:        new Date().toISOString(),
        };

        let { error: osErr } = await db.from('ordens_de_servico').insert(osPayload);

        if (osErr) {
          const { agendamento_id: _a, endereco_servico: _e, cliente_outro: _c, ...l2 } = osPayload;
          const r2 = await db.from('ordens_de_servico').insert(l2);

          if (r2.error) {
            const r3 = await db.from('ordens_de_servico').insert({
              obra_id:          payload.obra_id,
              tecnico_id:       tecnicoId,
              data_servico:     data,
              servico_planejado: servico || null,
              status_aprovacao: 'pendente',
              criado_em:        new Date().toISOString(),
            });
            if (r3.error) console.warn('OS pendente não criada:', r3.error.message);
          }
        }
      }
    }

    fecharModal();
    await carregarAgenda();
  }

  btn.disabled  = false;
  btn.innerHTML = '<i data-lucide="save"></i> Salvar';
  lucide.createIcons();
}

// ── Excluir agendamento ──────────────────────────────────────
async function excluirAgendamento() {
  if (!agEditandoId) return;
  if (!confirm('Tem certeza que quer excluir este agendamento?')) return;

  // Apagar OSs pendentes vinculadas (não apaga OSs já concluídas)
  const ag = agendamentos.find(a => a.id === agEditandoId);
  if (ag) {
    // Tenta por agendamento_id primeiro (se coluna existir)
    const porAgendamento = await db
      .from('ordens_de_servico')
      .delete()
      .eq('agendamento_id', agEditandoId)
      .eq('status_aprovacao', 'pendente');

    if (porAgendamento.error && ag.obra_id && ag.data) {
      // Fallback: busca por obra_id + data_servico
      await db
        .from('ordens_de_servico')
        .delete()
        .eq('obra_id', ag.obra_id)
        .eq('data_servico', ag.data)
        .eq('status_aprovacao', 'pendente');
    }
  }

  const { error } = await db.from('agendamentos').delete().eq('id', agEditandoId);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  fecharModal();
  await carregarAgenda();
}

    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  el.classList.add('visivel');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('visivel'), 4500);
}

async function dispararAgendaWhatsapp() {
  const btn    = document.getElementById('btn-whatsapp');
  const dpEl   = document.getElementById('data-dispatch');
  const hoje   = dpEl?.value || fmtISO(new Date());
  const agHoje = agendamentos.filter(ag => ag.data === hoje);

  if (agHoje.length === 0) {
    const [y, m, d2] = hoje.split('-');
    mostrarToast(`Não há agendamentos para ${d2}/${m}/${y}.`, 'err');
    return;
  }

  btn.style.opacity = '0.5';
  btn.style.pointerEvents = 'none';
  btn.querySelector('span') && (btn.querySelector('span').textContent = 'Gerando...');

  const DIAS_PT  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d        = new Date(hoje + 'T12:00');
  const dataFmt  = `${DIAS_PT[d.getDay()]}, ${d.getDate()} de ${MESES_PT[d.getMonth()]} de ${d.getFullYear()}`;

  // Mapa de equipes: id → { nome, cor }
  const EQUIPE_INFO = {
    1: { nome: 'Cabeamento',    cor: '#1D4ED8' }, // azul
    2: { nome: 'Eletrica',      cor: '#B45309' }, // âmbar escuro
    3: { nome: 'Audio e Video', cor: '#6D28D9' }, // roxo
    4: { nome: 'Automacao',     cor: '#065F46' }, // verde escuro
    5: { nome: 'Regional Norte', cor: '#9F1239' }, // vermelho escuro
  };
  const COR_PADRAO = '#1e293b';

  // Descobre a equipe principal de um agendamento pelo técnico líder
  function equipeDoAg(ag) {
    const ids = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
    for (const tid of ids) {
      const te = tecnicoEquipes.find(e => e.tecnico_id === tid);
      if (te && EQUIPE_INFO[te.equipe_id]) return EQUIPE_INFO[te.equipe_id];
    }
    return null;
  }

  // Ordena todos os agendamentos de hoje por horário
  const ordenados = [...agHoje].sort((a, b) =>
    (a.hora_inicio || '00:00').localeCompare(b.hora_inicio || '00:00')
  );

  // Carregar logo já pré-processado como branco (html2canvas ignora CSS filter)
  const logoB64   = await carregarLogoBase64Branco('logosolucao.png');
  const geradoEm  = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });

  // Paleta profissional — dark minimal
  const BG     = '#0D1117';
  const SURF   = '#161B22';
  const HEADER = '#0A0E15';
  const GOLD   = '#C4A882';
  const T1     = '#F0F6FC';
  const T2     = '#8B949E';
  const T3     = '#484F58';
  const BRDR   = '#21262D';
  const COR_EQ = { 1:'#2563EB', 2:'#D97706', 3:'#7C3AED', 4:'#059669', 5:'#DC2626' };

  // Monta card de cada agendamento com inline styles
  const cardsHTML = ordenados.map((ag) => {
    const hora    = ag.hora_inicio ? ag.hora_inicio.slice(0,5) : '—';
    const cliente = escHtml(ag.obras?.nome_cliente || ag.cliente_outro || '—');
    const end     = escHtml(ag.endereco_outro || ag.obras?.endereco || '');
    const serv    = escHtml(ag.servico || '');
    const veic    = escHtml(ag.veiculo || '');

    const tecIds   = [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].filter(Boolean);
    const tecStr   = tecIds.map(id => tecnicos.find(t => t.id === id)?.nome || '').filter(Boolean).join(' · ');

    const eq  = equipeDoAg(ag);
    const cor = eq ? (COR_EQ[Object.keys(EQUIPE_INFO).find(k => EQUIPE_INFO[k].nome === eq.nome)] || eq.cor) : '#334155';

    const detalhe = [serv, end, veic ? `Veículo: ${veic}` : ''].filter(Boolean);

    return `<div style="background:${SURF};border-radius:7px;padding:13px 15px;margin-bottom:9px;border-left:3px solid ${cor};">
      <div style="display:flex;align-items:baseline;gap:13px;">
        <span style="font-size:14px;font-weight:700;color:${GOLD};flex-shrink:0;min-width:46px;font-variant-numeric:tabular-nums;">${hora}</span>
        <span style="font-size:14px;font-weight:700;color:${T1};flex:1;line-height:1.3;">${cliente}</span>
      </div>
      ${tecStr ? `<div style="font-size:11px;color:${T2};margin-top:5px;padding-left:59px;">${escHtml(tecStr)}</div>` : ''}
      ${detalhe.length ? `<div style="margin-top:3px;padding-left:59px;">${detalhe.map(d => `<div style="font-size:11px;color:${T2};margin-top:1px;">${d}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  const card = document.getElementById('agenda-card');
  card.style.width = '860px';
  card.innerHTML = `<div style="width:860px;background:${BG};font-family:'Segoe UI',system-ui,Arial,sans-serif;border-radius:12px;overflow:hidden;">
    <div style="background:${HEADER};padding:20px 26px;display:flex;align-items:center;gap:18px;border-bottom:1px solid ${BRDR};">
      ${logoB64 ? `<img src="${logoB64}" style="height:26px;opacity:0.92;">` : `<span style="font-size:14px;font-weight:800;color:${T1};">SOLUÇÃO TÉCNICA</span>`}
      <div style="width:1px;height:32px;background:${BRDR};"></div>
      <div style="flex:1;">
        <div style="font-size:10px;font-weight:700;color:${GOLD};letter-spacing:0.09em;text-transform:uppercase;">Agenda do Dia</div>
        <div style="font-size:16px;font-weight:700;color:${T1};margin-top:3px;">${dataFmt}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:22px;font-weight:700;color:${T1};line-height:1;">${ordenados.length}</div>
        <div style="font-size:9px;color:${T2};margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;">serviço${ordenados.length !== 1 ? 's' : ''}</div>
      </div>
    </div>
    <div style="height:2px;background:linear-gradient(90deg,${GOLD} 0%,rgba(196,168,130,0.08) 100%);"></div>
    <div style="padding:14px 18px;">${cardsHTML}</div>
    <div style="background:${HEADER};padding:9px 26px;border-top:1px solid ${BRDR};display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:8px;color:${T3};letter-spacing:0.06em;text-transform:uppercase;">Solução Técnica · Sistema de Gestão</div>
      <div style="font-size:8px;color:${T3};">${geradoEm}</div>
    </div>
  </div>`;

  try {
    await document.fonts.ready;

    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#0D1117',
      logging: false,
    });

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

    // Tenta copiar pro clipboard (requer permissão / HTTPS)
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      mostrarToast('✅ Imagem copiada! Abra o WhatsApp e cole (Ctrl+V) no grupo.', 'ok');
      setTimeout(() => window.open('https://web.whatsapp.com', '_blank'), 800);
    } catch (clipErr) {
      // Fallback: download da imagem
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href     = url;
      a.download = `agenda-${hoje}.png`;
      a.click();
      URL.revokeObjectURL(url);
      setTimeout(() => window.open('https://web.whatsapp.com', '_blank'), 400);
      mostrarToast('Imagem baixada! Anexe no grupo do WhatsApp.', 'ok');
    }
  } catch (err) {
    mostrarToast('Erro ao gerar imagem: ' + err.message, 'err');
    console.error(err);
  } finally {
    btn.style.opacity = '';
    btn.style.pointerEvents = '';
  }
}

// ── Carregar imagem como base64 via fetch (evita CORS/canvas taint) ──
async function carregarImgBase64(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise(ok => {
      const reader = new FileReader();
      reader.onloadend = () => ok(reader.result);
      reader.onerror  = () => ok(null);
      reader.readAsDataURL(blob);
    });
  } catch { return null; }
}

// ── Versão branca do logo (html2canvas não suporta CSS filter em imagens) ──
async function carregarLogoBase64Branco(url) {
  const b64 = await carregarImgBase64(url);
  if (!b64) return null;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c   = document.createElement('canvas');
      c.width   = img.naturalWidth;
      c.height  = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // Mantém apenas os pixels não-transparentes e pinta tudo de branco
      ctx.globalCompositeOperation = 'source-in';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, c.width, c.height);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => resolve(null);
    img.src = b64;
  });
}

async function gerarProgramacaoSemanal() {
  const tecId   = Number(document.getElementById('semana-tec-id').value);
  const refDate = document.getElementById('semana-data-ref').value;
  const erroEl  = document.getElementById('modal-semana-erro');

  if (!tecId)   { erroEl.textContent = 'Selecione um técnico.'; erroEl.style.display='block'; return; }
  if (!refDate) { erroEl.textContent = 'Informe a data de referência.'; erroEl.style.display='block'; return; }
  erroEl.style.display = 'none';

  const tec = tecnicos.find(t => t.id === tecId);
  if (!tec) return;

  fecharModalSemanaBtn();
  mostrarToast('⏳ Gerando imagem horizontal...', 'ok');

  // Calcula seg–sex da semana da data de referência
  const base = new Date(refDate + 'T12:00');
  const diaSemana = base.getDay() === 0 ? 7 : base.getDay();
  const seg = new Date(base); seg.setDate(base.getDate() - diaSemana + 1);
  const diasSemana = Array.from({length:5}, (_, i) => { const d = new Date(seg); d.setDate(seg.getDate()+i); return d; });
  const datasISO = diasSemana.map(fmtISO);

  // Filtra agendamentos dessa semana onde o técnico participa
  const agSemana = agendamentos.filter(ag =>
    datasISO.includes(ag.data) &&
    [ag.tecnico_id, ag.auxiliar_id, ag.auxiliar2_id, ag.auxiliar3_id].includes(tecId)
  );

  const DIAS_PT  = ['Dom','Segunda','Terça','Quarta','Quinta','Sexta','Sáb'];
  const DIAS_ABR = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MESES_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

  const [yy, mm, dd] = datasISO[0].split('-');
  const [ye, me, de] = datasISO[4].split('-');
  const periodoFmt = `${dd}/${mm}/${yy.slice(2)} – ${de}/${me}/${ye.slice(2)}`;
  const geradoEm   = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });

  // Carregar logo pré-processado como branco (sem depender de CSS filter)
  const logoB64 = await carregarLogoBase64Branco('logosolucao.png');

  // Paleta consistente — profissional, mínima
  const S_BG     = '#0D1117';
  const S_SURF   = '#161B22';
  const S_CARD   = '#0D1117';
  const S_HEADER = '#0A0E15';
  const S_GOLD   = '#C4A882';
  const S_T1     = '#F0F6FC';
  const S_T2     = '#8B949E';
  const S_T3     = '#484F58';
  const S_BRDR   = '#21262D';
  // Cores de equipe (apenas borda esquerda nos cards)
  const COR_EQ = { 1:'#2563EB', 2:'#D97706', 3:'#7C3AED', 4:'#059669', 5:'#DC2626' };

  // Gera HTML de uma coluna (um dia da semana)
  function colunaHTML(iso, idx) {
    const d      = diasSemana[idx];
    const ags    = agSemana.filter(ag => ag.data === iso);
    const diaN   = DIAS_PT[d.getDay()];
    const dataL  = `${String(d.getDate()).padStart(2,'0')} ${MESES_PT[d.getMonth()]}`;

      : ags.map(ag => {

            ${end  ? `<div style="font-size:10px;color:${S_T3};line-height:1.3;">${end}</div>` : ''}

      <div style="font-size:8px;color:${S_T3};">${geradoEm}</div>
    </div>

  try {

      useCORS: true,

    }
  } catch(err) {
    mostrarToast('Erro ao gerar imagem: ' + err.message, 'err');
