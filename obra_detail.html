<!DOCTYPE html>
<!-- build: 2026-06-08a — fotoSrc() anexa token ?t= às URLs de /api/foto -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solução Técnica — Detalhe da Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0A0A0A;
      --surface-1:    #111111;
      --surface-2:    #161616;
      --surface-3:    #1B1B1B;
      --primary:      #3ECF8E;
      --primary-hover:#2EBF7E;
      --primary-muted:rgba(62,207,142,0.1);
      --secondary:    #4F46E5;
      --text-1:       #FFFFFF;
      --text-2:       #A1A1AA;
      --text-3:       #52525B;
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --border-focus: rgba(62,207,142,0.4);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar ── */
    .topbar { background:var(--surface-1); border-bottom:1px solid var(--border); height:56px; padding:0 24px; display:flex; align-items:center; position:sticky; top:0; z-index:100; }
    .topbar-logo { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; flex:1; }
    .topbar-greeting { font-size:13px; color:var(--text-2); margin-right:16px; }
    .topbar-links { display:flex; align-items:center; gap:4px; }
    .topbar-links a { color:var(--text-2); text-decoration:none; font-size:13px; font-weight:500; padding:6px 12px; border-radius:6px; transition:color .15s,background .15s; }
    .topbar-links a:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }
    .topbar-links a.active { color:var(--text-1); background:rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair { color:var(--text-2); border:1px solid rgba(255,255,255,0.12); margin-left:8px; }
    .topbar-links a.nav-sair:hover { color:var(--text-1); background:rgba(255,255,255,0.06); }

    /* ── Main ── */
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* ── Voltar ── */
    .btn-voltar {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--text-3); font-size: 0.82rem; font-weight: 500;
      background: none; border: none; cursor: pointer;
      margin-bottom: 24px; padding: 0; font-family: inherit; transition: color 150ms;
    }
    .btn-voltar i { width: 14px; height: 14px; }
    .btn-voltar:hover { color: var(--text-2); }

    /* ── Card da obra ── */
    .obra-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px;
      margin-bottom: 24px;
    }

    .obra-title { font-size: 1.3rem; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; margin-bottom: 4px; }

    .obra-meta {
      font-size: 0.75rem; color: var(--text-3); font-weight: 500;
      letter-spacing: 0.03em; margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }

    .obra-infos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .obra-info-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .obra-info-label {
      font-size: 0.68rem; color: var(--text-3); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px;
    }

    .obra-info-value {
      font-size: 0.85rem; color: var(--text-2);
      display: flex; align-items: center; gap: 6px;
    }

    .obra-info-value i { width: 13px; height: 13px; color: var(--text-3); flex-shrink: 0; }

    /* ── Inline edit controls ── */
    .inline-select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-1);
      font-size: 0.82rem;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
      appearance: none;
      -webkit-appearance: none;
    }
    .inline-select:focus { border-color: var(--border-focus); }
    .inline-select option { background: var(--surface-2); }

    .inline-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-1);
      font-size: 0.82rem;
      font-family: inherit;
      padding: 5px 8px;
      outline: none;
      transition: border-color .15s;
      flex: 1;
      min-width: 0;
      width: 100%;
    }
    .inline-input:focus { border-color: var(--border-focus); }
    .inline-input::placeholder { color: var(--text-3); }
    /* Remove spinners dos inputs numéricos */
    .inline-input[type="number"] { -moz-appearance: textfield; }
    .inline-input[type="number"]::-webkit-outer-spin-button,
    .inline-input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .edit-field { gap: 8px; }

    .save-indicator {
      font-size: 11px; color: var(--primary);
      opacity: 0; transition: opacity .3s;
    }
    .save-indicator.show { opacity: 1; }

    /* ── Edit row (bottom of obra-card) ── */
    .edit-row {
      margin-top: 16px; padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }

    .edit-row-group {
      display: flex; align-items: center; gap: 8px;
    }

    .edit-row-label {
      font-size: 11px; font-weight: 600; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    @media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }

    .stat-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 18px 16px;
      text-align: center;
    }

    .stat-num { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.03em; color: var(--text-1); }
    .stat-label { font-size: 0.72rem; color: var(--text-3); margin-top: 4px; font-weight: 500; }

    /* ── Tabs system ── */
    .tabs-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 0;
    }

    .tab-btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tab-btn i { width: 14px; height: 14px; }
    .tab-btn:hover { color: var(--text-2); }
    .tab-btn.tab-active { color: var(--text-1); border-bottom-color: var(--primary); }

    .tab-panel { display: none; }
    .tab-panel.tab-visible { display: block; }

    /* ── Section title ── */
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-title { font-size: 0.9rem; font-weight: 700; color: var(--text-1); letter-spacing: -0.01em; }
    .section-count {
      font-size: 0.7rem; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-3); padding: 2px 8px; border-radius: 999px; font-weight: 600;
    }

    /* ── Filtros ── */
    .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }

    .filtro-btn {
      padding: 5px 14px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text-2); font-size: 0.78rem;
      font-weight: 500; cursor: pointer; transition: all 150ms; font-family: inherit;
    }
    .filtro-btn:hover { border-color: var(--border-hover); color: var(--text-1); }
    .filtro-btn.ativo { background: rgba(62,207,142,0.12); border-color: rgba(62,207,142,0.35); color: var(--primary); }

    /* ── Tabela OS ── */
    .os-table-wrap {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      margin-bottom: 8px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }

    th {
      background: var(--surface-2); padding: 10px 16px; text-align: left;
      font-size: 0.68rem; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 1px solid var(--border);
    }

    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text-2); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 9px; border-radius: 999px;
      font-size: 0.69rem; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
    }

    .badge-pend  { background: rgba(245,158,11,0.12); color: #F59E0B; border: 1px solid rgba(245,158,11,0.22); }
    .badge-aprov { background: rgba(62,207,142,0.12);  color: var(--primary); border: 1px solid rgba(62,207,142,0.22); }

    /* Badges de fase obra */
    .badge-em_andamento      { background: rgba(99,102,241,0.15);  color: #818CF8; border: 1px solid rgba(99,102,241,0.25); }
    .badge-entregue          { background: rgba(62,207,142,0.15);  color: var(--primary); border: 1px solid rgba(62,207,142,0.25); }
    .badge-pausada           { background: rgba(245,158,11,0.12);  color: #F59E0B; border: 1px solid rgba(245,158,11,0.22); }
    .badge-concluída         { background: rgba(79,70,229,0.15);   color: #818CF8; border: 1px solid rgba(79,70,229,0.25); }
    .badge-pré-vistoria      { background: rgba(234,88,12,0.12);   color: #FB923C; border: 1px solid rgba(234,88,12,0.2); }
    .badge-pós-vistoria      { background: rgba(6,182,212,0.12);   color: #67E8F9; border: 1px solid rgba(6,182,212,0.2); }

    /* Badges de fase técnica */
    .badge-cabeamento        { background: rgba(245,158,11,0.12);  color: #F59E0B; border: 1px solid rgba(245,158,11,0.22); }
    .badge-eletrica          { background: rgba(251,191,36,0.12);  color: #FBBF24; border: 1px solid rgba(251,191,36,0.22); }
    .badge-audio_video       { background: rgba(167,139,250,0.12); color: #A78BFA; border: 1px solid rgba(167,139,250,0.22); }
    .badge-automacao              { background: rgba(62,207,142,0.12);  color: var(--primary); border: 1px solid rgba(62,207,142,0.22); }
    .badge-bloqueado_financeiro   { background: rgba(239,68,68,0.12);   color: #f87171;        border: 1px solid rgba(239,68,68,0.25); }
    .badge-parado_cliente         { background: rgba(251,146,60,0.12);  color: #fb923c;        border: 1px solid rgba(251,146,60,0.25); }

    /* ── Documentos da Obra ── */
    .docs-section { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
    .docs-header { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:14px; }
    .docs-header i { width:13px; height:13px; }
    .docs-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:600px) { .docs-grid { grid-template-columns:1fr; } }
    .doc-card { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; transition:border-color .15s; }
    .doc-card.doc-tem-arquivo { border-color:rgba(62,207,142,0.22); }
    .doc-card-corpo { display:flex; align-items:center; gap:10px; min-width:0; }
    .doc-icon { width:36px; height:36px; background:var(--surface-3); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-3); }
    .doc-icon i { width:16px; height:16px; }
    .doc-tem-arquivo .doc-icon { background:rgba(62,207,142,0.08); border-color:rgba(62,207,142,0.2); color:var(--primary); }
    .doc-info { flex:1; min-width:0; }
    .doc-label { font-size:10px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:0.4px; }
    .doc-nome { font-size:0.78rem; color:var(--text-1); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .doc-vazio { font-size:0.75rem; color:var(--text-3); margin-top:3px; }
    .doc-abrir { display:inline-flex; align-items:center; gap:4px; padding:5px 11px; background:var(--primary); color:#0A0A0A; border-radius:6px; font-size:0.75rem; font-weight:700; text-decoration:none; white-space:nowrap; flex-shrink:0; transition:opacity .15s; }
    .doc-abrir:hover { opacity:0.85; }
    .doc-abrir i { width:12px; height:12px; }
    .doc-edit-row { display:flex; align-items:center; gap:6px; }
    .doc-input { flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 10px; color:var(--text-1); font-size:0.78rem; font-family:inherit; outline:none; transition:border-color .15s; }
    .doc-input:focus { border-color:rgba(62,207,142,0.5); }
    .doc-input::placeholder { color:var(--text-3); }
    .doc-btn-remover { background:none; border:1px solid var(--border); color:var(--text-3); width:28px; height:28px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:color .15s,border-color .15s; }
    .doc-btn-remover:hover { color:#f87171; border-color:rgba(239,68,68,0.3); }
    .doc-btn-remover i { width:12px; height:12px; }

    /* ── Fotos mini ── */
    .fotos-mini { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .foto-mini { width: 34px; height: 34px; border-radius: 4px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); transition: border-color 200ms; }
    .foto-mini:hover { border-color: var(--primary); }

    /* ── Galeria ── */
    .galeria-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

    .galeria-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; }
    .galeria-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 200ms; }
    .galeria-item video { width: 100%; height: 100%; object-fit: cover; }
    .galeria-item:hover img { transform: scale(1.04); }
    .galeria-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); padding: 10px 8px 6px; font-size: 0.68rem; color: var(--text-2); }

    .vistoria-list { display: flex; flex-direction: column; gap: 12px; }
    .vistoria-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; }
    .vistoria-card:hover { border-color: var(--border-hover); }
    .vistoria-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .vistoria-title { font-weight: 700; color: var(--text-1); font-size: .92rem; }
    .vistoria-meta { color: var(--text-3); font-size: .75rem; margin-top: 4px; line-height: 1.45; }
    .midia-chip { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-size: .74rem; margin-top: 8px; }
    .midia-chip i { width: 13px; height: 13px; }

    /* ── Observações tab ── */
    .obs-wrap {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .obs-wrap h3 { font-size: 14px; font-weight: 600; color: var(--text-1); margin-bottom: 6px; }
    .obs-wrap p { font-size: 13px; color: var(--text-3); margin-bottom: 16px; }

    .obs-textarea {
      width: 100%;
      min-height: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-1);
      font-size: 14px;
      font-family: inherit;
      padding: 14px;
      resize: vertical;
      outline: none;
      transition: border-color .15s;
      line-height: 1.7;
    }
    .obs-textarea:focus { border-color: var(--border-focus); }
    .obs-textarea::placeholder { color: var(--text-3); }

    .obs-footer { display: flex; align-items: center; gap: 12px; margin-top: 12px; }

    .btn-salvar-obs {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px;
      background: var(--primary); color: #0A0A0A;
      border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s;
    }
    .btn-salvar-obs:hover { background: var(--primary-hover); }
    .btn-salvar-obs i { width: 14px; height: 14px; }

    .obs-saved-msg { font-size: 12px; color: var(--primary); display: none; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: 0.85rem; }
    .empty i { width: 36px; height: 36px; margin: 0 auto 12px; display: block; color: var(--text-3); }

    /* ── Spinner ── */
    .spinner-wrap { text-align: center; padding: 60px; color: var(--text-3); }
    .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Lightbox ── */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 16px; backdrop-filter: blur(8px); }
    .lightbox.aberto { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 78vh; border-radius: 8px; object-fit: contain; border: 1px solid var(--border); }
    .lightbox video { max-width: 90vw; max-height: 78vh; border-radius: 8px; background: #000; cursor: auto; }
    .lightbox-close { position: absolute; top: 20px; right: 24px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text-2); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 150ms, color 150ms; z-index: 2; }
    .lightbox-close:hover { border-color: var(--border-hover); color: var(--text-1); }
    .lightbox-close i { width: 16px; height: 16px; }
    .lightbox-nav { display: flex; gap: 10px; }
    .lightbox-nav button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-family: inherit; display: flex; align-items: center; gap: 6px; transition: border-color 150ms, color 150ms; }
    .lightbox-nav button:hover { border-color: var(--border-hover); color: var(--text-1); }
    .lightbox-nav button i { width: 14px; height: 14px; }
    .lightbox-caption { color: var(--text-3); font-size: 0.78rem; }
    /* Badge ▶ nas miniaturas de vídeo */
    .video-badge-lb { position:absolute; bottom:5px; left:5px; background:rgba(0,0,0,0.72); color:#fff; font-size:9px; font-weight:700; padding:2px 7px; border-radius:4px; pointer-events:none; letter-spacing:0.3px; line-height:1.6; }
    /* Estilo galeria para vídeo */
    .galeria-item { cursor: pointer; }
    .galeria-item video { width:100%; height:100%; object-fit:cover; pointer-events:none; }
  
  /* ── TEMA CLARO ── */
  :root[data-theme="light"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); }
  @media (prefers-color-scheme: light) { :root[data-theme="auto"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); } }

<!-- Lightbox fotos + vídeos -->

    <i data-lucide="x"></i>
  </button>

<script>

const params = new URLSearchParams(location.search);
const obraId = parseInt(params.get('id'));

// Detecta se uma URL aponta para um vídeo (SharePoint proxy ou Supabase)
function isVideoUrl(url) {
  const decoded = decodeURIComponent((url || '').split('path=').pop() || url);
  return /\.(mp4|mov|avi|webm)(\?|$)/i.test(decoded);
}

let todasFotos  = [];
let fotosLightbox = [];
let todasVistorias = [];
let lbIndex     = 0;
let filtroStatus = 'todos';
let todasOS     = [];
let roleAtual   = 'tecnico';
let authToken   = '';  // JWT da sessão, anexado às URLs de /api/foto (tags <img>/<video>)
// Anexa o token de sessão à URL do /api/foto para que tags <img>/<video> autentiquem
function fotoSrc(url) {
  if (!url || !authToken) return url;
  return url + (url.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(authToken);
}
let tecMap      = {};  // id → { nome } — preenchido no carregamento
let consultoresLista = [];
let regionaisLista   = [];
let tabAtiva    = 'os';
let obraAtual   = null;  // cache da obra carregada — usado para re-render de docs

// ── Valores exatos do check constraint "obras_fase_atual_check" ──
const FASES_OBRA = {
  'nao_iniciado':   'Não Iniciado',
  'projeto':        'Projeto',
  'cabeamento':     'Cabeamento',
  'eletrica':       'Elétrica',
  'audio_video':    'Áudio e Vídeo',
  'automacao':      'Automação',
  'em_finalizacao': 'Em Finalização',
  'entrega_comercial': 'Finalizado',
};

const SITUACAO_INFO = {
  liberado:             { label: 'Liberado',             cor: '#3ECF8E' },
  bloqueado_financeiro: { label: 'Bloqueado Financeiro', cor: '#EF4444' },
  parado_cliente:       { label: 'Parado Cliente',       cor: '#F97316' },
  entregue:             { label: 'Entregue',             cor: '#22C55E' },
};

const STATUS_LABELS = {
  pendente:  { label: 'Pendente',  cls: 'badge-pend' },
  concluida: { label: 'Concluída', cls: 'badge-aprov' },
  aprovada:  { label: 'Concluída', cls: 'badge-aprov' },
  reprovada: { label: 'Pendente',  cls: 'badge-pend' },
};

const TIPO_VISTORIA_LABELS = {
  cabeamento: 'Vistoria de Cabeamento',
  eletrica: 'Vistoria de elétrica',
  audio_video: 'Vistoria de Áudio e Vídeo',
  automacao: 'Vistoria de Automação',
};

const CHECKLIST_VISTORIA = {
  cabeamento: ['Tubulações conforme projeto','Pontos identificados/local correto','Cabeamento passado','Cabos identificados na central','Caixas e conduítes sem obstrução','Infraestrutura permite pendências','Acabamento adequado','Pendências registradas'],
  eletrica: ['Obra limpa e segura','Quadro de automação energizado','Rack/quadro de rede com energia','Circuitos conferidos','Equipamentos bem fixados','Aterramento/proteção aparentes','Pendências de hardware/elétrica','Libera continuidade'],
  audio_video: ['Caixas cortadas conforme projeto','Caixas alinhadas','Central com energia correta','Cabos chegam na central','Cabos identificados','Pontos no local previsto','Pendências de AV','Ambiente liberado'],
  automacao: ['Condição para equipamentos finais','Dispositivos bem fixados','Pontos conferem com projeto','Quadro organizado','Rede/energia disponíveis','Cenários pendentes identificados','Instalação com qualidade','Liberada próxima etapa'],
};

// Roles com permissão de editar campos da obra
const PODE_EDITAR = ['coordenador', 'supervisor', 'agendamento', 'coordenador_projetos'];
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  authToken = session.access_token || '';

  const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();
  roleAtual = eu?.role || 'tecnico';

  renderTopbar(eu?.nome, roleAtual, 'obras');
  lucide.createIcons();

  if (!obraId) {
    document.getElementById('conteudo').innerHTML = '<div class="empty"><p>Obra não encontrada.</p></div>';
    return;
  }

  await carregarObra();
}
// ── Documentos da Obra (Contrato / Escopo) ───────────────────
function _nomeArquivoUrl(url) {
  try {
    const u = new URL(url);
    const partes = decodeURIComponent(u.pathname).split('/').filter(Boolean);
    const last = partes[partes.length - 1];
    // Ignora identificadores SharePoint curtos como ":b:", ":w:", etc.
    return (last && last.length > 4 && !last.startsWith(':')) ? last : null;
  } catch(e) { return null; }
}

function renderDocCard(campo, label, url, podeEditar) {
  const nome = url ? _nomeArquivoUrl(url) : null;
  const ext  = nome ? nome.split('.').pop().toLowerCase() : '';
  const iconMap = { pdf:'file-text', doc:'file-text', docx:'file-text',
                    xls:'file-spreadsheet', xlsx:'file-spreadsheet' };
  const icon = iconMap[ext] || (url ? 'file' : 'file-plus');

  return `
    <div class="doc-card ${url ? 'doc-tem-arquivo' : ''}">
      <div class="doc-card-corpo">
        <div class="doc-icon"><i data-lucide="${icon}"></i></div>
        <div class="doc-info">
          <div class="doc-label">${label}</div>
          ${url
            ? `<div class="doc-nome" title="${escHtml(url)}">${nome ? escHtml(nome) : 'Link vinculado'}</div>`
            : `<div class="doc-vazio">Nenhum documento vinculado</div>`}
        </div>
        ${url ? `<a href="${escHtml(url)}" target="_blank" rel="noopener" class="doc-abrir">
          <i data-lucide="external-link"></i><span>Abrir</span>
        </a>` : ''}
      </div>
      ${podeEditar ? `
      <div class="doc-edit-row">
        <input type="url" class="doc-input" id="input-${campo}"
          placeholder="Cole o link do SharePoint..."
          value="${escHtml(url || '')}"
          onblur="salvarDocUrl('${campo}', this.value)">
        ${url ? `<button class="doc-btn-remover" onclick="salvarDocUrl('${campo}','')" title="Remover documento">
          <i data-lucide="x"></i>
        </button>` : ''}
      </div>` : ''}
    </div>`;
}

function renderDocsSecao(obra, podeEditar) {
  return ''; // desativado temporariamente
  if (!podeEditar && !obra.contrato_url && !obra.escopo_url) return '';
  return `
    <div class="docs-section">
      <div class="docs-header"><i data-lucide="folder-open"></i><span>Documentos da Obra</span></div>
      <div class="docs-grid">
        ${renderDocCard('contrato_url', 'Contrato',         obra.contrato_url, podeEditar)}
        ${renderDocCard('escopo_url',   'Escopo do Projeto', obra.escopo_url,   podeEditar)}
      </div>
    </div>`;
}

async function salvarDocUrl(campo, valor) {
  const val = valor.trim() || null;
  if (!obraId) return;
  const { error } = await db.from('obras').update({ [campo]: val }).eq('id', obraId);
  if (error) { showToast('Erro ao salvar: ' + error.message, 'error'); return; }
  if (obraAtual) obraAtual[campo] = val;
  // Re-renderiza só a seção de documentos
  const el = document.getElementById('docs-section');
  if (el && obraAtual) {
    el.outerHTML = `<div id="docs-section">${renderDocsSecao(obraAtual, PODE_EDITAR.includes(roleAtual))}</div>`;
    lucide.createIcons();
  }
  showToast(val ? 'Documento vinculado.' : 'Documento removido.', 'success');
}

// ── Salvar campo genérico da obra ──
async function salvarCampo(campo, valor) {
  if (!obraId) return;
  const { error } = await db.from('obras').update({ [campo]: valor }).eq('id', obraId);
  if (error) {
    showToast('Erro ao salvar: ' + error.message, 'error');
    return false;
  }
  mostrarSalvo('save-indicator-' + campo);
  // Invalida cache de obras da agenda quando nome ou endereço mudam
  if (['nome_cliente','endereco'].includes(campo)) invalidateCache('agenda-obras');

  // Atualizar badge da fase no header dinamicamente
  if (campo === 'fase_atual') {
    const label = FASES_OBRA[valor] || valor;
    const badgeEl = document.querySelector('.badge-fase-principal');
    if (badgeEl) {
      badgeEl.className = `badge badge-${valor} badge-fase-principal`;
      badgeEl.textContent = label;
    }
    // Salvar no sessionStorage para obras.html pré-selecionar o filtro
    try { sessionStorage.setItem('obraFaseFilter', valor); } catch(e) {}
  }
  return true;
}

// ── Mudar etapa + regra Finalizado → situacao = entregue ──────
async function mudarEtapa(valor) {
  const ok = await salvarCampo('fase_atual', valor);
  if (!ok) return;
  if (valor === 'entrega_comercial') {
    await mudarSituacao('entregue');
  }
}

// ── Mudar situação ────────────────────────────────────────────
async function mudarSituacao(valor) {
  const ok = await salvarCampo('situacao', valor);
  if (!ok) return;
  if (obraAtual) obraAtual.situacao = valor;
  // Atualizar visual dos botões sem re-render completo
  Object.keys(SITUACAO_INFO).forEach(v => {
    const btn = document.getElementById(`sit-btn-${v}`);
    if (!btn) return;
    const info = SITUACAO_INFO[v];
    const ativo = v === valor;
    const corRgb = v==='liberado'?'62,207,142':v==='bloqueado_financeiro'?'239,68,68':v==='parado_cliente'?'249,115,22':'34,197,94';
    btn.style.background     = ativo ? `rgba(${corRgb},.15)` : 'transparent';
    btn.style.color          = ativo ? info.cor : 'var(--text-3)';
    btn.style.borderColor    = ativo ? info.cor : 'var(--border)';
  });
}

// ── Salvar campo de texto (disparado ao sair do input) ──
function salvarTexto(campo, valor) {
  salvarCampo(campo, valor.trim());
}

// ── Salvar valor financeiro (número) ──
async function salvarValorFinanceiro(campo, rawValue) {
  const raw = String(rawValue).trim().replace(',', '.');
  const val = raw === '' ? null : parseFloat(raw);
  if (raw !== '' && (isNaN(val) || val < 0)) {
    showToast('Valor inválido', 'error'); return;
  }
  const { error } = await db.from('obras').update({ [campo]: val }).eq('id', obraId);
  if (error) { showToast('Erro ao salvar: ' + error.message, 'error'); return; }
  if (obraAtual) obraAtual[campo] = val;
  mostrarSalvo('save-indicator-' + campo);
  _atualizarCamposFinanceiros();
}

function _atualizarCamposFinanceiros() {
  const fmt = v => v != null && !isNaN(v)
    ? 'R$ ' + parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})
    : '—';
  const _n = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const o    = obraAtual || {};
  const vMO   = _n(o.valor_servico  ?? o.valor_servicos);
  const vProd = _n(o.valor_produto   ?? o.valor_produtos);
  // Sempre recalcula a partir dos valores editáveis — não confia no pct_servico do banco (stored as ratio 0-1, stale)
  const vTot  = (vMO != null || vProd != null) ? (vMO || 0) + (vProd || 0) : _n(o.valor_total);
  const pctN  = (vMO != null && vTot > 0) ? vMO / vTot * 100 : (_n(o.pct_servico) != null ? _n(o.pct_servico) * 100 : null);
  const pct   = pctN != null ? parseFloat(pctN).toFixed(1) + '%' : '—';
  const totEl = document.getElementById('fin-total');
  const pctEl = document.getElementById('fin-pct');
  if (totEl) totEl.textContent = fmt(vTot);
  if (pctEl) pctEl.textContent = pct;
}

function mostrarSalvo(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.style.display = 'inline';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 300); }, 2000);
}

// ── Salvar observações da obra ──
async function salvarObservacoes() {
  const texto = document.getElementById('obs-textarea')?.value || '';
  const btn = document.getElementById('btn-salvar-obs');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2"></i> Salvando...'; lucide.createIcons(); }

  const { error } = await db.from('obras').update({ observacoes: texto }).eq('id', obraId);

  if (btn) { btn.disabled = false; btn.innerHTML = '<i data-lucide="save"></i> Salvar'; lucide.createIcons(); }

  if (error) {
    showToast('Erro ao salvar: ' + error.message, 'error');
    return;
  }
  const msg = document.getElementById('obs-saved-msg');
  if (msg) { msg.style.display = 'inline'; setTimeout(() => msg.style.display = 'none', 3000); }
}

async function carregarObra() {
  // Carregar obra + consultores em paralelo
  const [{ data: obra, error }, { data: consList }, { data: regList }] = await Promise.all([
    db.from('obras').select('*, consultores(id, nome)').eq('id', obraId).single(),
    db.from('consultores').select('id, nome').order('nome'),
    db.from('obras').select('regional').not('regional', 'is', null).is('excluida_em', null),
  ]);

  consultoresLista = consList || [];
  regionaisLista   = [...new Set((regList || []).map(o => o.regional).filter(Boolean))].sort();

  if (error || !obra) {
    document.getElementById('conteudo').innerHTML = '<div class="empty"><p>Obra não encontrada.</p></div>';
    return;
  }

  const [{ data: osList, error: osErr }, { data: tecList }, { data: vistList, error: vistErr }] = await Promise.all([
    db.from('ordens_de_servico')
      .select('*')
      .eq('obra_id', obraId)
      .order('criado_em', { ascending: false }),
    db.from('tecnicos').select('id, nome'),
    db.from('relatorios_vistoria')
      .select('*, tecnicos(nome), agendamentos_vistoria(hora_inicio,confirmado,viagem,veiculo,observacao)')
      .eq('obra_id', obraId)
      .order('data_vistoria', { ascending: false })
  ]);

  if (osErr) console.error('Erro ao buscar OS:', osErr.message);
  if (vistErr) console.error('Erro ao buscar vistorias:', vistErr.message);

  (tecList || []).forEach(t => { tecMap[t.id] = t; });

  todasOS = (osList || []).map(o => ({
    ...o,
    tecnicos: o.tecnico_id ? (tecMap[o.tecnico_id] || null) : null
  }));
  todasVistorias = vistList || [];

  todasFotos = [];
  todasOS.forEach(os => {
    (os.fotos_urls || []).forEach(url => {
      todasFotos.push({ url, tipo: isVideoUrl(url) ? 'video' : 'image', tecnico: os.tecnicos?.nome || '—', data: os.criado_em?.slice(0,10) || '', origem: 'OS' });
    });
  });
  todasVistorias.forEach(v => {
    (Array.isArray(v.midias_urls) ? v.midias_urls : []).forEach(m => {
      todasFotos.push({ url: m.url, tipo: m.tipo || 'image', tecnico: v.tecnicos?.nome || '—', data: v.data_vistoria || '', origem: 'Vistoria' });
    });
  });

  renderPagina(obra);
}

function renderPagina(obra) {
  obraAtual = obra;
  const podeEditar = PODE_EDITAR.includes(roleAtual);
  const faseLabel  = FASES_OBRA[obra.fase_atual] || obra.fase_atual || '—';
  const faseClass  = obra.fase_atual || 'em_andamento';

  const total      = todasOS.length;
  const totalVistorias = todasVistorias.length;
  const concluidas = todasOS.filter(o => o.status_aprovacao === 'concluida' || o.status_aprovacao === 'aprovada').length;
  const pendentes  = todasOS.filter(o => !o.status_aprovacao || o.status_aprovacao === 'pendente' || o.status_aprovacao === 'reprovada').length;
  const nFotos     = todasFotos.length;

  // ── Campos editáveis ──
  const campoEndereco = podeEditar
    ? `<div class="obra-info-value edit-field">
        <i data-lucide="map-pin"></i>
        <input class="inline-input" value="${escHtml(obra.endereco || '')}" placeholder="Endereço..." onblur="salvarTexto('endereco', this.value)">
        <span id="save-indicator-endereco" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓</span>
       </div>`
    : `<div class="obra-info-value"><i data-lucide="map-pin"></i>${obra.endereco || '—'}</div>`;

  const campoArquiteto = podeEditar
    ? `<div class="obra-info-value edit-field">
        <i data-lucide="pen-tool"></i>
        <input class="inline-input" value="${escHtml(obra.arquiteto_responsavel || '')}" placeholder="Arquiteto..." onblur="salvarTexto('arquiteto_responsavel', this.value)">
        <span id="save-indicator-arquiteto_responsavel" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓</span>
       </div>`
    : `<div class="obra-info-value"><i data-lucide="pen-tool"></i>${obra.arquiteto_responsavel || '—'}</div>`;

  const consultorAtualId = obra.consultores?.id || '';
  const consultorAtualNome = obra.consultores?.nome || '—';
  const campoConsultor = podeEditar
    ? `<div class="obra-info-value edit-field">
        <i data-lucide="user"></i>
        <select class="inline-select" onchange="salvarCampo('consultor_id', this.value || null)">
          <option value="">— Sem consultor —</option>
          ${consultoresLista.map(c => `<option value="${c.id}" ${c.id == consultorAtualId ? 'selected' : ''}>${escHtml(c.nome)}</option>`).join('')}
        </select>
        <span id="save-indicator-consultor_id" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓</span>
       </div>`
    : `<div class="obra-info-value"><i data-lucide="user"></i>${consultorAtualNome}</div>`;

  const campoRegional = podeEditar
    ? `<div class="obra-info-value edit-field">
        <i data-lucide="map"></i>
        <select class="inline-select" onchange="salvarCampo('regional', this.value || null)">
          <option value="">— Sem regional —</option>
          ${regionaisLista.map(r => `<option value="${r}" ${obra.regional === r ? 'selected' : ''}>${r}</option>`).join('')}
        </select>
        <span id="save-indicator-regional" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓</span>
       </div>`
    : `<div class="obra-info-value"><i data-lucide="map"></i>${obra.regional || '—'}</div>`;

  // ── Edit row (privilegiados) ──
  const situacaoAtual = obra.situacao || 'liberado';
  const editRow = podeEditar ? `
    <div class="edit-row">
      <div class="edit-row-group">
        <span class="edit-row-label">Etapa da Obra</span>
        <select class="inline-select" onchange="mudarEtapa(this.value)">
          ${Object.entries(FASES_OBRA).map(([v, l]) =>
            `<option value="${v}" ${obra.fase_atual === v ? 'selected' : ''}>${l}</option>`
          ).join('')}
        </select>
        <span id="save-indicator-fase_atual" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓ Salvo</span>
      </div>
      <div class="edit-row-group">
        <span class="edit-row-label">Situação</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${Object.entries(SITUACAO_INFO).map(([v, info]) => `
            <button onclick="mudarSituacao('${v}')" id="sit-btn-${v}"
              style="padding:5px 12px;border-radius:999px;border:1px solid;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
                     background:${situacaoAtual===v?`rgba(${v==='liberado'?'62,207,142':v==='bloqueado_financeiro'?'239,68,68':v==='parado_cliente'?'249,115,22':'34,197,94'},.15)`:'transparent'};
                     color:${situacaoAtual===v?info.cor:'var(--text-3)'};
                     border-color:${situacaoAtual===v?info.cor:'var(--border)'};">
              ${info.label}
            </button>`).join('')}
        </div>
        <span id="save-indicator-situacao" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓ Salvo</span>
      </div>
      <div class="edit-row-group">
        <span class="edit-row-label">Status Compra</span>
        <select class="inline-select" onchange="salvarCampo('status_compra', this.value)">
          <option value="">— Selecione —</option>
          <option value="Material pendente"              ${obra.status_compra==='Material pendente'             ?'selected':''}>Material pendente</option>
          <option value="Sem parte do material em estoque" ${obra.status_compra==='Sem parte do material em estoque'?'selected':''}>Sem parte do material em estoque</option>
          <option value="Material entregue"              ${obra.status_compra==='Material entregue'            ?'selected':''}>Material entregue</option>
          <option value="Sem pendência"                  ${obra.status_compra==='Sem pendência'                ?'selected':''}>Sem pendência</option>
        </select>
        <span id="save-indicator-status_compra" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">✓ Salvo</span>
      </div>
    </div>` : '';

  document.getElementById('conteudo').innerHTML = `
    <div class="obra-card">
      <div class="obra-title">${obra.nome_cliente || obra.nome || '—'}</div>
      <div class="obra-meta">
        #${String(obra.id).padStart(3,'0')}
        <span class="badge badge-${faseClass} badge-fase-principal">${faseLabel}</span>
      </div>

      <div class="obra-infos">
        <div class="obra-info-item">
          <div class="obra-info-label">Endereço</div>
          ${campoEndereco}
        </div>
        <div class="obra-info-item">
          <div class="obra-info-label">Arquiteto</div>
          ${campoArquiteto}
        </div>
        <div class="obra-info-item">
          <div class="obra-info-label">Consultor</div>
          ${campoConsultor}
        </div>
        <div class="obra-info-item">
          <div class="obra-info-label">Regional</div>
          ${campoRegional}
        </div>
        ${!podeEditar ? `<div class="obra-info-item">
          <div class="obra-info-label">Status Compra</div>
          <div class="obra-info-value"><i data-lucide="shopping-cart"></i>${obra.status_compra || '—'}</div>
        </div>` : ''}
        ${obra.cod_shankya ? `<div class="obra-info-item">
          <div class="obra-info-label">Cód. Shankya</div>
          <div class="obra-info-value"><i data-lucide="hash"></i>${obra.cod_shankya}</div>
        </div>` : ''}
        ${(() => {
          const fmt = v => v != null && !isNaN(v)
            ? 'R$ ' + parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2})
            : '—';
          // Fallback: obras antigas usam valor_servicos/valor_produtos (com 's')
          //           obras novas usam valor_servico/valor_produto (sem 's')
          const _n = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
          const vMO   = _n(obra.valor_servico  ?? obra.valor_servicos);
          const vProd = _n(obra.valor_produto   ?? obra.valor_produtos);
          // Sempre recalcula — pct_servico do banco é ratio 0-1 e pode estar desatualizado
          const vTot  = (vMO != null || vProd != null) ? (vMO || 0) + (vProd || 0) : _n(obra.valor_total);
          const pctN  = (vMO != null && vTot > 0) ? vMO / vTot * 100 : (_n(obra.pct_servico) != null ? _n(obra.pct_servico) * 100 : null);
          const pct   = pctN != null ? parseFloat(pctN).toFixed(1) + '%' : '—';
          const moField = podeEditar
            ? `<div class="obra-info-value edit-field">
                <i data-lucide="wrench"></i>
                <input class="inline-input" type="number" min="0" step="0.01"
                  value="${vMO != null ? vMO : ''}" placeholder="0.00"
                  onblur="salvarValorFinanceiro('valor_servico', this.value)">
                <span id="save-indicator-valor_servico" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">&#10003;</span>
               </div>`
            : `<div class="obra-info-value"><i data-lucide="wrench"></i>${fmt(vMO)}</div>`;
          const prodField = podeEditar
            ? `<div class="obra-info-value edit-field">
                <i data-lucide="package"></i>
                <input class="inline-input" type="number" min="0" step="0.01"
                  value="${vProd != null ? vProd : ''}" placeholder="0.00"
                  onblur="salvarValorFinanceiro('valor_produto', this.value)">
                <span id="save-indicator-valor_produto" class="obs-saved-msg" style="font-size:11px;color:var(--primary);">&#10003;</span>
               </div>`
            : `<div class="obra-info-value"><i data-lucide="package"></i>${fmt(vProd)}</div>`;
          return `
          <div class="obra-info-item">
            <div class="obra-info-label">Mão de Obra</div>
            ${moField}
          </div>
          <div class="obra-info-item">
            <div class="obra-info-label">Produtos</div>
            ${prodField}
          </div>
          <div class="obra-info-item">
            <div class="obra-info-label">Valor Total</div>
            <div class="obra-info-value"><i data-lucide="wallet-cards"></i><span id="fin-total">${fmt(vTot)}</span></div>
          </div>
          <div class="obra-info-item">
            <div class="obra-info-label">% MO / Total</div>
            <div class="obra-info-value"><i data-lucide="percent"></i><span id="fin-pct">${pct}</span></div>
          </div>`;
        })()}
      </div>

      ${editRow}
    </div>

    <div id="docs-section">${renderDocsSecao(obra, podeEditar)}</div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num">${total}</div>
        <div class="stat-label">Total de OS</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:var(--primary)">${concluidas}</div>
        <div class="stat-label">Concluídas</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#F59E0B">${pendentes}</div>
        <div class="stat-label">Pendentes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:#818CF8">${nFotos}</div>
        <div class="stat-label">Fotos</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn tab-active" id="tab-os" onclick="setTab('os')">
        <i data-lucide="clipboard-list"></i> Ordens de Serviço
        <span class="section-count">${total}</span>
      </button>
      <button class="tab-btn" id="tab-vistorias" onclick="setTab('vistorias')">
        <i data-lucide="clipboard-check"></i> Vistorias
        <span class="section-count">${totalVistorias}</span>
      </button>
      <button class="tab-btn" id="tab-galeria" onclick="setTab('galeria')">
        <i data-lucide="image"></i> Galeria
        <span class="section-count">${nFotos}</span>
      </button>
      <button class="tab-btn" id="tab-obs" onclick="setTab('obs')">
        <i data-lucide="file-text"></i> Descrição & Obs.
      </button>
    </div>

    <!-- Panel: OSs -->
    <div id="panel-os" class="tab-panel tab-visible">
      <div class="filtros">
        <button class="filtro-btn ativo" onclick="filtrarOS(this,'todos')">Todas</button>
        <button class="filtro-btn" onclick="filtrarOS(this,'pendente')">Pendentes</button>
        <button class="filtro-btn" onclick="filtrarOS(this,'concluida')">Concluídas</button>
        <button class="filtro-btn" onclick="filtrarOS(this,'plantao')">Plantão</button>
      </div>
      <div id="tabela-os" class="os-table-wrap">${renderTabelaOS(todasOS)}</div>
    </div>

    <div id="panel-vistorias" class="tab-panel">
      <div class="vistoria-list">${renderVistorias(todasVistorias)}</div>
    </div>

    <!-- Panel: Galeria -->
    <div id="panel-galeria" class="tab-panel">
      <div class="galeria-grid" id="galeria">${renderGaleria(todasFotos)}</div>
    </div>

    <!-- Panel: Observações -->
    <div id="panel-obs" class="tab-panel">
      <div class="obs-wrap">
        <h3>Descrição & Observações da Obra</h3>
        <p>Registre detalhes técnicos, observações gerais ou qualquer informação relevante sobre esta obra.</p>
        <textarea
          class="obs-textarea"
          id="obs-textarea"
          placeholder="Escreva observações, descrições técnicas, anotações importantes..."
          ${!podeEditar ? 'readonly' : ''}
        >${escHtml(obra.observacoes || '')}</textarea>
        ${podeEditar ? `
        <div class="obs-footer">
          <button class="btn-salvar-obs" id="btn-salvar-obs" onclick="salvarObservacoes()">
            <i data-lucide="save"></i> Salvar
          </button>
          <span id="obs-saved-msg" class="obs-saved-msg">✓ Observações salvas</span>
        </div>` : ''}
      </div>
    </div>
  `;

  lucide.createIcons();
}

// ── Tabs ──
function setTab(tab) {
  tabAtiva = tab;
  ['os', 'vistorias', 'galeria', 'obs'].forEach(t => {
    document.getElementById('tab-' + t)?.classList.toggle('tab-active', t === tab);
    document.getElementById('panel-' + t)?.classList.toggle('tab-visible', t === tab);
  });
}

// ── Tabela de OS ──
function renderTabelaOS(lista) {
  if (!lista.length) return `
    <div class="empty">
      <i data-lucide="file-text"></i>
      Nenhuma OS registrada para esta obra.
    </div>`;

  const rows = lista.map((os, idx) => {
    const stKey = (os.status_aprovacao === 'aprovada') ? 'concluida' : (os.status_aprovacao === 'reprovada') ? 'pendente' : (os.status_aprovacao || 'pendente');
    const st    = STATUS_LABELS[stKey] || { label: stKey, cls: '' };
    const tec   = os.tecnicos?.nome || '—';
    const dataRef = os.data_servico || os.criado_em;
    const data  = dataRef ? new Date(dataRef + (dataRef.length === 10 ? 'T12:00' : '')).toLocaleDateString('pt-BR') : '—';
    const nF    = (os.fotos_urls || []).length;

    const minisFotos = (os.fotos_urls || []).slice(0,3).map((url, fi) =>
      isVideoUrl(url)
        ? `<span title="Clique para ver o vídeo" onclick="event.stopPropagation();abrirLightboxOS(${os.id},${fi})"
              style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:4px;background:var(--surface-3);border:1px solid var(--border);font-size:14px;cursor:pointer;">▶</span>`
        : `<img class="foto-mini" src="${fotoSrc(url)}" alt="foto" onclick="event.stopPropagation();abrirLightboxOS(${os.id},${fi})">`
    ).join('');
    const maisTag = nF > 3 ? `<span style="font-size:0.72rem;color:var(--text-3);margin-left:2px">+${nF-3}</span>` : '';
    const descricao = os.descricao_servicos || os.observacoes || os.atividades_realizadas || '—';

    const plantaoBadge = os.tipo_servico === 'plantao'
      ? `<span class="badge" style="background:rgba(79,70,229,0.12);color:#A78BFA;border:1px solid rgba(79,70,229,0.25);margin-left:4px;">🌙 Plantão</span>`
      : '';
    return `<tr style="cursor:pointer;" onclick="verDetalheOS(${os.id})">
      <td style="color:var(--text-3);font-size:0.75rem;white-space:nowrap">${data}</td>
      <td style="color:var(--text-1);font-weight:600">${tec}</td>
      <td style="color:var(--text-2);font-size:0.8rem;max-width:260px">${descricao.length > 80 ? descricao.slice(0,80)+'…' : descricao}</td>
      <td><span class="badge ${st.cls}">${st.label}</span>${plantaoBadge}</td>
      <td onclick="event.stopPropagation()"><div class="fotos-mini">${minisFotos}${maisTag}</div></td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th scope="col">Data</th><th scope="col">Técnico</th><th scope="col">Descrição</th><th scope="col">Status</th><th scope="col">Fotos</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderGaleria(fotos) {
  if (!fotos.length) return `
    <div class="empty" style="grid-column:1/-1">
      <i data-lucide="image"></i>
      Nenhuma foto registrada ainda.
    </div>`;

  return fotos.map((f, i) => `
    <div class="galeria-item" onclick="abrirLightbox(${i})" style="position:relative;">
      ${f.tipo === 'video'
        ? `<video src="${escHtml(fotoSrc(f.url))}" muted preload="metadata"></video>
           <span class="video-badge-lb">▶ VÍD</span>`
        : `<img src="${escHtml(fotoSrc(f.url))}" alt="foto" loading="lazy">`}
      <div class="galeria-info">${escHtml(f.origem || 'Mídia')} · ${escHtml(f.tecnico)} · ${escHtml(f.data)}</div>
    </div>`).join('');
}

function renderVistorias(lista) {
  if (!lista.length) return `
    <div class="empty">
      <i data-lucide="clipboard-check"></i>
      Nenhuma vistoria registrada para esta obra.
    </div>`;

  return lista.map(v => {
    const data = v.data_vistoria ? new Date(v.data_vistoria + 'T12:00').toLocaleDateString('pt-BR') : '—';
    const midias = Array.isArray(v.midias_urls) ? v.midias_urls.length : 0;
    const status = v.status === 'concluido'
      ? '<span class="badge badge-aprov">Concluído</span>'
      : '<span class="badge badge-pend">Pendente</span>';
    return `<div class="vistoria-card" onclick="verDetalheVistoria(${v.id})">
      <div class="vistoria-head">
        <div>
          <div class="vistoria-title">${escHtml(TIPO_VISTORIA_LABELS[v.tipo_vistoria] || v.tipo_vistoria)}</div>
          <div class="vistoria-meta">${data} · ${escHtml(v.agendamentos_vistoria?.hora_inicio?.slice(0,5) || 'horário não informado')} · ${escHtml(v.tecnicos?.nome || '—')}</div>
        </div>
        ${status}
      </div>
      <div class="vistoria-meta">${escHtml(v.objetivo_vistoria || 'Sem objetivo informado')}</div>
      <div class="midia-chip"><i data-lucide="paperclip"></i>${midias} mídia(s)</div>
    </div>`;
  }).join('');
}

function normStatus(s) {
  if (!s || s === 'reprovada') return 'pendente';
  if (s === 'aprovada') return 'concluida';
  return s;
}

function filtrarOS(btn, status) {
  filtroStatus = status;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  let filtradas;
  if (status === 'todos') {
    filtradas = todasOS;
  } else if (status === 'plantao') {
    filtradas = todasOS.filter(o => o.tipo_servico === 'plantao');
  } else {
    filtradas = todasOS.filter(o => normStatus(o.status_aprovacao) === status);
  }
  document.getElementById('tabela-os').innerHTML = renderTabelaOS(filtradas);
  lucide.createIcons();
}

// ── Helper: HTML completo da OS ───────────────────────────────
function buildOSDetalheHTML(os, onFotoClick) {
  const L = (label, valor, full = false, cor = 'var(--text-2)') => valor
    ? `<div style="grid-column:${full ? '1/-1' : 'auto'}">
         <label style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">${label}</label>
         <span style="color:${cor};white-space:pre-line;font-size:0.85rem;line-height:1.5">${valor}</span>
       </div>` : '';

  const stKey = normStatus(os.status_aprovacao);
  const st    = STATUS_LABELS[stKey] || { label: stKey, cls: '' };
  const dataRef = os.data_servico || os.criado_em;
  const dataFmt = dataRef ? new Date(dataRef + (dataRef.length === 10 ? 'T12:00' : '')).toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }) : '—';
  const horario = [os.horario_inicio?.slice(0,5), os.horario_fim?.slice(0,5)].filter(Boolean).join(' – ') || null;

  const equipeIds   = [os.tecnico_id, os.auxiliar_id, os.auxiliar2_id, os.auxiliar3_id].filter(Boolean);
  const equipeNomes = equipeIds.map(id => tecMap[id]?.nome || `#${id}`).join(' · ') || '—';

  let html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:4px;">
    ${L('Equipe', equipeNomes, true, 'var(--text-1)')}
    ${L('Data do serviço', dataFmt)}
    ${L('Horário', horario)}
    <div><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Status</label><span class="badge ${st.cls}">${st.label}</span></div>
    ${L('Serviço planejado', os.servico_planejado, true)}
    ${L('Serviços realizados', os.servicos_realizados, true, 'var(--text-1)')}
    ${os.houve_problema ? L('Problema reportado', os.descricao_problema || 'Sim', true, '#F59E0B') : ''}
    ${os.faltou_material ? L('Material faltante', os.lista_material, true) : ''}
    ${os.retornou_material ? L('Material retornado', os.lista_retorno, true) : ''}
    ${os.retorno_equipamento ? L('Equipamento retornado', os.lista_equipamentos, true) : ''}
    ${L('Sistema de automação', os.sistema_automacao)}
    ${L('Próximas atividades', os.proximas_atividades, true)}
    ${L('Observações finais', os.observacoes, true)}
    ${os.observacao_supervisor ? L('Obs. do supervisor', os.observacao_supervisor, true, '#F59E0B') : ''}
  </div>`;

  if (os.fotos_urls && os.fotos_urls.length > 0) {
    const fotosHtml = os.fotos_urls.map((url, i) => {
      const isVid = isVideoUrl(url);
      return `<div style="position:relative;aspect-ratio:1;cursor:pointer;border-radius:6px;overflow:hidden;border:1px solid var(--border);"
                   onclick="${onFotoClick(i, os.fotos_urls)}">
        ${isVid
          ? `<video src="${escHtml(fotoSrc(url))}" muted preload="metadata"
                style="width:100%;height:100%;object-fit:cover;pointer-events:none;"></video>
             <span class="video-badge-lb">▶ VÍD</span>`
          : `<img src="${escHtml(fotoSrc(url))}" alt="foto ${i+1}" loading="lazy"
                style="width:100%;height:100%;object-fit:cover;">`}
      </div>`;
    }).join('');
    html += `<div style="margin-top:20px;">
      <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">Fotos e vídeos (${os.fotos_urls.length})</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;">${fotosHtml}</div>
    </div>`;
  }

  return html;
}

function verDetalheOS(id) {
  const os = todasOS.find(o => o.id === id);
  if (!os) return;

  const html = buildOSDetalheHTML(os, (i, fotos) =>
    `abrirLightboxFromModal(${JSON.stringify(fotos).replace(/"/g,"'")}, ${i})`
  );

  let modal = document.getElementById('modal-os-detalhe');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'modal-os-detalhe';
    modal.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);padding:20px;';
    modal.addEventListener('click', e => { if (e.target === modal) fecharDetalheOS(); });
    document.body.appendChild(modal);
  }

  modal.innerHTML = `
    <div role="dialog" aria-modal="true" aria-labelledby="modal-os-titulo" style="background:var(--surface-1);border:1px solid var(--border);border-radius:12px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 id="modal-os-titulo" style="font-size:16px;font-weight:700;color:var(--text-1);">Detalhes da OS</h3>
        <button onclick="fecharDetalheOS()" aria-label="Fechar detalhes da OS" style="background:none;border:1px solid var(--border);cursor:pointer;color:var(--text-2);font-size:13px;padding:6px 10px;border-radius:6px;font-family:inherit;">Fechar</button>
      </div>
      ${html}
    </div>`;
  modal.style.display = 'flex';
  // Move foco para o modal
  setTimeout(() => { const d = modal.querySelector('[role="dialog"]'); if (d) d.focus?.(); }, 50);
  lucide.createIcons();
}

function fecharDetalheOS() {
  const modal = document.getElementById('modal-os-detalhe');
  if (modal) modal.style.display = 'none';
}

function verDetalheVistoria(id) {
  const v = todasVistorias.find(item => item.id === id);
  if (!v) return;
  const midias = Array.isArray(v.midias_urls) ? v.midias_urls : [];
  const checklist = v.checklist || {};
  const checklistLabels = CHECKLIST_VISTORIA[v.tipo_vistoria] || [];
  const checks = Object.entries(checklist).map(([idx, ok]) =>
    `<div style="color:${ok ? 'var(--primary)' : 'var(--text-3)'};font-size:.82rem;">${ok ? '✓' : '○'} ${escHtml(checklistLabels[Number(idx)] || `Item ${Number(idx) + 1}`)}</div>`
  ).join('');
  const midiasHtml = midias.map((m, i) => `
    <div class="galeria-item" style="aspect-ratio:1.2" onclick="${m.tipo === 'video' ? '' : `abrirLightboxFromModal(${JSON.stringify(midias.filter(x => x.tipo !== 'video').map(x => x.url)).replace(/"/g,"'")}, ${Math.max(0, midias.filter(x => x.tipo !== 'video').findIndex(x => x.url === m.url))})`}">
      ${m.tipo === 'video' ? `<video src="${escHtml(fotoSrc(m.url))}" controls></video>` : `<img src="${escHtml(fotoSrc(m.url))}" alt="mídia">`}
    </div>
  `).join('');

  let modal = document.getElementById('modal-os-detalhe');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'modal-os-detalhe';
    modal.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);padding:20px;';
    modal.addEventListener('click', e => { if (e.target === modal) fecharDetalheOS(); });
    document.body.appendChild(modal);
  }

  modal.innerHTML = `
    <div role="dialog" aria-modal="true" aria-labelledby="modal-vist-titulo" style="background:var(--surface-1);border:1px solid var(--border);border-radius:12px;max-width:760px;width:100%;max-height:85vh;overflow-y:auto;padding:28px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 id="modal-vist-titulo" style="font-size:16px;font-weight:700;color:var(--text-1);">Relatório de Vistoria</h3>
        <button onclick="fecharDetalheOS()" aria-label="Fechar relatório de vistoria" style="background:none;border:1px solid var(--border);cursor:pointer;color:var(--text-2);font-size:13px;padding:6px 10px;border-radius:6px;font-family:inherit;">Fechar</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;">
        <div><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Tipo</label><div style="margin-top:5px;color:var(--text-1);">${escHtml(TIPO_VISTORIA_LABELS[v.tipo_vistoria] || v.tipo_vistoria)}</div></div>
        <div><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Vistoriador</label><div style="margin-top:5px;color:var(--text-1);">${escHtml(v.tecnicos?.nome || '—')}</div></div>
        <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Objetivo</label><div style="margin-top:5px;color:var(--text-2);white-space:pre-line">${escHtml(v.objetivo_vistoria || '—')}</div></div>
        <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Situação atual da obra</label><div style="margin-top:5px;color:var(--text-2);white-space:pre-line">${escHtml(v.situacao_atual_obra || '—')}</div></div>
        <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Pontos positivos</label><div style="margin-top:5px;color:var(--text-2);white-space:pre-line">${escHtml(v.pontos_positivos || '—')}</div></div>
        <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Pontos de atenção</label><div style="margin-top:5px;color:var(--text-2);white-space:pre-line">${escHtml(v.pontos_atencao || '—')}</div></div>
        <div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Inconformidade</label><div style="margin-top:5px;color:${v.inconformidade ? '#F59E0B' : 'var(--text-2)'};white-space:pre-line">${v.inconformidade ? escHtml(v.descricao_inconformidade || 'Sim') : 'Não'}</div></div>
        ${checks ? `<div style="grid-column:1/-1"><label style="font-size:11px;color:var(--text-3);text-transform:uppercase;">Checklist</label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:8px;">${checks}</div></div>` : ''}
      </div>
      ${midiasHtml ? `<div style="margin-top:20px;"><div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;">Fotos e vídeos (${midias.length})</div><div class="galeria-grid">${midiasHtml}</div></div>` : ''}
    </div>`;
  modal.style.display = 'flex';
  lucide.createIcons();
}

function _lbMostrar(f, lista) {
  // f = { url, tipo?, tecnico?, data? }
  const isVid = f.tipo === 'video' || isVideoUrl(f.url);
  const imgEl = document.getElementById('lb-img');
  const vidEl = document.getElementById('lb-video');
  if (isVid) {
    if (imgEl) imgEl.style.display = 'none';
    if (vidEl) { vidEl.src = fotoSrc(f.url); vidEl.style.display = ''; }
  } else {
    if (vidEl) { try { vidEl.pause(); } catch(e){} vidEl.src = ''; vidEl.style.display = 'none'; }
    if (imgEl) { imgEl.src = fotoSrc(f.url); imgEl.style.display = ''; }
  }
  const total = lista ? lista.length : (fotosLightbox.length || 1);
  document.getElementById('lb-caption').textContent =
    `${f.tecnico ? f.tecnico + ' · ' : ''}${f.data ? f.data + ' · ' : ''}${lbIndex + 1}/${total}`;
}

function abrirLightboxFromModal(fotos, idx) {
  fotosLightbox = fotos.map(url => ({ url, tipo: isVideoUrl(url) ? 'video' : 'image', tecnico: '', data: '' }));
  lbIndex = idx;
  _lbMostrar(fotosLightbox[idx], fotosLightbox);
  document.getElementById('lightbox').classList.add('aberto');
}

function abrirLightbox(idx) {
  const item = todasFotos[idx];
  if (!item) return;
  fotosLightbox = todasFotos; // inclui vídeos na navegação
  lbIndex = idx;
  mostrarFotoLb();
  document.getElementById('lightbox').classList.add('aberto');
}

function abrirLightboxOS(osId, fotoIdx) {
  const osIdx = todasOS.findIndex(o => o.id == osId);
  if (osIdx < 0) return;
  let globalIdx = 0;
  for (let i = 0; i < osIdx; i++) globalIdx += (todasOS[i].fotos_urls || []).length;
  globalIdx += fotoIdx;
  abrirLightbox(globalIdx);
}

function fecharLightbox() {
  const vid = document.getElementById('lb-video');
  if (vid) { try { vid.pause(); } catch(e){} vid.src = ''; }
  document.getElementById('lightbox').classList.remove('aberto');
}

function navLightbox(delta) {
  const lista = fotosLightbox.length ? fotosLightbox : todasFotos;
  if (!lista.length) return;
  fotosLightbox = lista;
  lbIndex = (lbIndex + delta + lista.length) % lista.length;
  mostrarFotoLb();
}

function mostrarFotoLb() {
  const lista = fotosLightbox.length ? fotosLightbox : todasFotos;
  const f = lista[lbIndex];
  if (!f) return;
  _lbMostrar(f, lista);
}

// Fechar ao clicar no fundo escuro
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) fecharLightbox();
});

// Swipe para navegar no mobile
let _lbTX = null;
document.getElementById('lightbox').addEventListener('touchstart', e => { _lbTX = e.touches[0].clientX; }, { passive: true });
document.getElementById('lightbox').addEventListener('touchend', e => {
  if (_lbTX === null) return;
  const dx = e.changedTouches[0].clientX - _lbTX;
  _lbTX = null;
  if (Math.abs(dx) < 50) return;
  navLightbox(dx < 0 ? 1 : -1);
});

// Teclado: setas + Esc
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox')?.classList.contains('aberto')) return;
  if (e.key === 'Escape') fecharLightbox();
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); navLightbox(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); navLightbox(1); }
});

init();
</script>
<script>lucide.createIcons(); applyTheme(localStorage.getItem('tema') || 'auto');</script>
</body>
</html>
