<!DOCTYPE html>
<!-- build: 2026-05-31 -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solução Técnica — Obras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>document.documentElement.dataset.theme=localStorage.getItem('tema')||'auto';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0A0A0A;
      --surface-1: #111111;
      --surface-2: #161616;
      --surface-3: #1B1B1B;
      --primary:   #3ECF8E;
      --secondary: #4F46E5;
      --text-1:    #FFFFFF;
      --text-2:    #A1A1AA;
      --text-3:    #52525B;
      --border:    rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --radius-card:  12px;
      --radius-input: 6px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Topbar (padrão universal) ── */
    .topbar {
      background: var(--surface-1);
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.2px;
      flex: 1;
    }
    .topbar-greeting {
      font-size: 13px;
      color: var(--text-2);
      margin-right: 16px;
    }
    .topbar-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-links a {
      color: var(--text-2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .topbar-links a:hover { color: var(--text-1); background: rgba(255,255,255,0.06); }
    .topbar-links a.active { color: var(--text-1); background: rgba(255,255,255,0.07); }
    .topbar-links a.nav-sair {
      color: var(--text-2);
      border: 1px solid rgba(255,255,255,0.12);
      margin-left: 8px;
    }
    .topbar-links a.nav-sair:hover { color: var(--text-1); background: rgba(255,255,255,0.06); }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-header-left h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }

    .page-header-left p {
      font-size: 0.82rem;
      color: var(--text-2);
      margin-top: 2px;
    }

    /* ── Botão Nova Obra ── */
    .btn-nova-obra {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 150ms, transform 150ms;
      font-family: inherit;
    }

    .btn-nova-obra:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-nova-obra i {
      width: 15px;
      height: 15px;
    }

    /* ── Barra de filtros ── */
    .filtros-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .filtros {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .filtro-btn {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      font-family: inherit;
    }

    .filtro-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-1);
      background: rgba(255,255,255,0.04);
    }

    .filtro-btn.ativo {
      background: rgba(62,207,142,0.12);
      border-color: rgba(62,207,142,0.35);
      color: var(--primary);
    }

    /* ── Campo de busca ── */
    .busca-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 240px;
      flex-shrink: 0;
    }

    .busca-icon {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--text-3);
      pointer-events: none;
      flex-shrink: 0;
    }

    .campo-busca {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 7px 34px 7px 32px;
      color: var(--text-1);
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }

    .campo-busca::placeholder { color: var(--text-3); }

    .campo-busca:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .busca-limpar {
      position: absolute;
      right: 7px;
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 3px;
      display: none;
      align-items: center;
      border-radius: 4px;
      transition: color 150ms, background 150ms;
    }

    .busca-limpar:hover { color: var(--text-2); background: rgba(255,255,255,0.06); }
    .busca-limpar i { width: 12px; height: 12px; }

    /* ── Contador ── */
    .contador {
      font-size: 0.78rem;
      color: var(--text-3);
      margin-bottom: 18px;
    }

    .contador strong {
      color: var(--text-2);
      font-weight: 600;
    }

    /* ── Grid de cards ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* ── Card de obra ── */
    .card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 20px;
      cursor: pointer;
      transition: border-color 200ms, background 200ms, transform 200ms;
      position: relative;
    }

    .card:hover {
      border-color: var(--border-hover);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    .card-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }

    .card-cliente {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-1);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .card-id {
      font-size: 0.72rem;
      color: var(--text-3);
      margin-top: 3px;
      font-weight: 500;
    }

    .card-info {
      font-size: 0.78rem;
      color: var(--text-2);
      margin-bottom: 7px;
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .card-info i {
      width: 13px;
      height: 13px;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .card-footer {
      margin-top: 18px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .badge-projeto_iniciado  { background: rgba(99,102,241,0.15); color: #818CF8; border: 1px solid rgba(99,102,241,0.25); }
    .badge-cabeamento        { background: rgba(245,158,11,0.12); color: #F59E0B; border: 1px solid rgba(245,158,11,0.22); }
    .badge-eletrica          { background: rgba(251,191,36,0.12); color: #FBBF24; border: 1px solid rgba(251,191,36,0.22); }
    .badge-audio_video       { background: rgba(167,139,250,0.12); color: #A78BFA; border: 1px solid rgba(167,139,250,0.22); }
    .badge-automacao         { background: rgba(62,207,142,0.12); color: var(--primary); border: 1px solid rgba(62,207,142,0.22); }
    .badge-em_finalizacao    { background: rgba(45,212,191,0.12); color: #2DD4BF; border: 1px solid rgba(45,212,191,0.22); }
    .badge-nao_iniciado      { background: rgba(82,82,91,0.2); color: var(--text-2); border: 1px solid rgba(82,82,91,0.3); }
    .badge-projeto_concluido { background: rgba(79,70,229,0.15); color: #818CF8; border: 1px solid rgba(79,70,229,0.25); }
    .badge-entrega_comercial { background: rgba(62,207,142,0.15); color: var(--primary); border: 1px solid rgba(62,207,142,0.25); }

    .badge-compra {
      background: rgba(255,255,255,0.04);
      color: var(--text-2);
      border: 1px solid var(--border);
    }

    /* ── Empty state ── */
    .estado {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-3);
    }

    .estado i {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      display: block;
      color: var(--text-3);
    }

    .estado p {
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--text-2);
    }

    .estado small {
      font-size: 0.78rem;
      color: var(--text-3);
      margin-top: 6px;
      display: block;
    }

    /* ── Spinner ── */
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Erro ── */
    .erro-box {
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 20px 24px;
      max-width: 480px;
      margin: 0 auto;
      text-align: left;
    }

    .erro-box h3 {
      color: #f87171;
      margin-bottom: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .erro-box code {
      font-size: 0.76rem;
      color: #fca5a5;
      word-break: break-all;
    }

    .erro-box .dica {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-2);
      line-height: 1.7;
    }

    /* ── Modal Nova Obra ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .modal-header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(62,207,142,0.12);
      border: 1px solid rgba(62,207,142,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-header-icon i {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .modal h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      padding: 9px 12px;
      color: var(--text-1);
      font-size: 0.84rem;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
      font-family: inherit;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--text-3);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    .form-group select option {
      background: var(--surface-2);
      color: var(--text-1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .btn-cancelar {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-input);
      color: var(--text-2);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 150ms, color 150ms;
    }

    .btn-cancelar:hover {
      border-color: var(--border-hover);
      color: var(--text-1);
    }

    .btn-salvar {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-input);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      transition: opacity 150ms;
    }

    .btn-salvar:hover { opacity: 0.88; }
    .btn-salvar:disabled { opacity: 0.4; cursor: not-allowed; }

    .alert-sucesso {
      background: rgba(62,207,142,0.08);
      border: 1px solid rgba(62,207,142,0.25);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--primary);
      margin-bottom: 16px;
      display: none;
    }

    .alert-erro {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #f87171;
      margin-bottom: 16px;
      display: none;
    }
  
  /* ── TEMA CLARO ── */
  :root[data-theme="light"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); }
  @media (prefers-color-scheme: light) { :root[data-theme="auto"] { --bg:#F4F4F5; --surface-1:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F0F0F1; --text-1:#09090B; --text-2:#71717A; --text-3:#A1A1AA; --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14); --border-hover:rgba(0,0,0,0.16); --primary-muted:rgba(62,207,142,0.15); } }
  .tema-btn { background:transparent; border:1px solid var(--border-strong,rgba(255,255,255,.12)); border-radius:6px; color:var(--text-2,#A1A1AA); font-size:15px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-right:8px; flex-shrink:0; }
  .tema-btn:hover { background:rgba(128,128,128,.1); }

  /* ── RESPONSIVO ── */
  @media (max-width: 1024px) {
    .topbar-links a { font-size: 12px; padding: 5px 9px; }
  }
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; }
    .topbar-greeting { display: none !important; }
    .topbar-links { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .topbar-links a { font-size: 12px; padding: 5px 8px; white-space: nowrap; }
    .container { padding: 0 12px !important; margin-top: 16px !important; margin-bottom: 16px !important; }
    main { padding: 20px 12px !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .form-row { grid-template-columns: 1fr !important; }
    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .card { padding: 16px !important; }
    .page-header h1 { font-size: 18px !important; }
    .modal, .modal-content { border-radius: 0 !important; max-width: 100% !important; max-height: 100dvh !important; }
    .modal-overlay, .overlay { padding: 0 !important; align-items: flex-end !important; }
    table { font-size: 12px; min-width: 500px; }
    .table-wrap, .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }
  @media (max-width: 480px) {
    .topbar-logo { font-size: 13px; }
    .stats-grid { grid-template-columns: 1fr !important; }
    .stat-card { padding: 14px !important; }
    .btn, button { font-size: 12px; }
  }

  /* ── Mobile: evita auto-zoom iOS (inputs precisam de 16px) ── */
  @media (max-width: 768px) {
    input, select, textarea { font-size: 16px !important; }
  }
</style>
<link rel="stylesheet" href="app-shell.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-logo">Solução Técnica</span>
  <span id="topbar-greeting" class="topbar-greeting"></span>
  <button id="tema-btn" class="tema-btn" onclick="ciclarTema()" title="Alternar tema">🖥️</button>
  <nav class="topbar-links" id="topbar-nav"></nav>
</header>

<main>

  <div class="page-header">
    <div class="page-header-left">
      <h2>Obras</h2>
      <p>Gerencie e acompanhe todas as obras em andamento</p>
    </div>
    <button class="btn-nova-obra" onclick="abrirModal()">
      <i data-lucide="plus"></i>
      Nova Obra
    </button>
  </div>

  <!-- Filtros + Busca -->
  <div class="filtros-bar">
    <div class="filtros" role="group" aria-label="Filtrar por fase">
      <button class="filtro-btn ativo" data-fase="todas" aria-pressed="true">Todas</button>
      <button class="filtro-btn" data-fase="projeto_iniciado" aria-pressed="false">Projeto Iniciado</button>
      <button class="filtro-btn" data-fase="cabeamento" aria-pressed="false">Cabeamento</button>
      <button class="filtro-btn" data-fase="eletrica" aria-pressed="false">Elétrica</button>
      <button class="filtro-btn" data-fase="audio_video" aria-pressed="false">Áudio e Vídeo</button>
      <button class="filtro-btn" data-fase="automacao" aria-pressed="false">Automação</button>
      <button class="filtro-btn" data-fase="em_finalizacao" aria-pressed="false">Em Finalização</button>
      <button class="filtro-btn" data-fase="entrega_comercial" aria-pressed="false">Entregues</button>
    </div>
    <div class="busca-wrap">
      <i data-lucide="search" class="busca-icon" aria-hidden="true"></i>
      <input
        type="text"
        id="campo-busca"
        class="campo-busca"
        placeholder="Buscar cliente, endereço, código..."
        aria-label="Buscar obras"
        oninput="if(!this._dFn)this._dFn=debounce(v=>buscar(v));this._dFn(this.value)"
        autocomplete="off"
      >
      <button class="busca-limpar" id="busca-limpar" onclick="limparBusca()" title="Limpar busca" aria-label="Limpar busca">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="contador" id="contador" aria-live="polite" aria-atomic="true"></div>

  <!-- Conteúdo dinâmico -->
  <div id="conteudo">
    <div class="estado">
      <div class="spinner"></div>
      <p>Carregando obras...</p>
    </div>
  </div>

</main>

<!-- Modal Nova Obra -->
<div class="overlay" id="overlay" onclick="fecharModalFora(event)" role="dialog" aria-modal="true" aria-labelledby="modal-obras-titulo">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-icon">
        <i data-lucide="building-2"></i>
      </div>
      <h2 id="modal-obras-titulo">Nova Obra</h2>
    </div>

    <div class="alert-sucesso" id="alertSucesso" role="status" aria-live="polite"></div>
    <div class="alert-erro" id="alertErro" role="alert" aria-live="assertive"></div>

    <div class="form-group">
      <label for="f-cliente">Nome do Cliente *</label>
      <input type="text" id="f-cliente" placeholder="Ex: João Silva" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="f-endereco">Endereço da Obra</label>
      <input type="text" id="f-endereco" placeholder="Rua, número, bairro, cidade" autocomplete="off">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="f-arquiteto">Arquiteto Responsável</label>
        <input type="text" id="f-arquiteto" placeholder="Nome do arquiteto" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="f-consultor">Consultor</label>
        <select id="f-consultor">
          <option value="">Selecione...</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="f-fase">Fase Atual</label>
        <select id="f-fase">
          <option value="nao_iniciado">Não Iniciado</option>
          <option value="projeto_iniciado">Projeto Iniciado</option>
          <option value="projeto_concluido">Projeto Concluído</option>
          <option value="cabeamento">Cabeamento</option>
          <option value="eletrica">Elétrica</option>
          <option value="audio_video">Áudio e Vídeo</option>
          <option value="automacao">Automação</option>
          <option value="em_finalizacao">Em Finalização</option>
          <option value="entrega_comercial">Entrega Comercial</option>
        </select>
      </div>
      <div class="form-group">
        <label for="f-status-compra">Status de Compra</label>
        <select id="f-status-compra">
          <option value="">Selecione...</option>
          <option value="Aguardando orçamento">Aguardando orçamento</option>
          <option value="Material pendente">Material pendente</option>
          <option value="Material entregue">Material entregue</option>
          <option value="Sem pendência">Sem pendência</option>
          <option value="Pausado">Pausado</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="f-shankya">Código Shankya</label>
      <input type="text" id="f-shankya" placeholder="Ex: SHK-001" autocomplete="off">
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarObra()">
        <i data-lucide="save"></i>
        Salvar
      </button>
    </div>
  </div>
</div>

<script>

  const FASES = {
    nao_iniciado:     { label: 'Não Iniciado',     prazo: '—'           },
    projeto_iniciado: { label: 'Projeto Iniciado', prazo: '> 180 dias'  },
    projeto_concluido:{ label: 'Projeto Concluído',prazo: '—'           },
    cabeamento:       { label: 'Cabeamento',        prazo: '~120 dias'  },
    eletrica:         { label: 'Elétrica',          prazo: 'Imediato'   },
    audio_video:      { label: 'Áudio e Vídeo',    prazo: 'Imediato'   },
    automacao:        { label: 'Automação',         prazo: 'Imediato'   },
    em_finalizacao:   { label: 'Em Finalização',   prazo: '—'          },
    entrega_comercial:{ label: 'Entrega Comercial', prazo: '—'          },
  };

  let todasObras  = [];
  let faseFiltro  = 'todas';
  let termoBusca  = '';
  // ── Auth check ──────────────────────────────────────────────
  let userRole = 'tecnico';

  async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    // Buscar role e nome do usuário
    const { data: eu } = await db.from('tecnicos').select('role, nome').eq('auth_user_id', session.user.id).single();
    userRole = eu?.role || 'tecnico';

    renderTopbar(eu?.nome, eu?.role, 'obras');

    // Técnicos só visualizam — esconder botão Nova Obra
    if (userRole === 'tecnico') {
      const btnNova = document.querySelector('.btn-nova-obra');
      if (btnNova) btnNova.style.display = 'none';
    }

    await Promise.all([carregarObras(), carregarConsultores()]);
  }

  // ── Carregar consultores para o modal ───────────────────────
  async function carregarConsultores() {
    const data = await cachedQuery('consultores', 600, async () => {
      const { data: d } = await db.from('consultores').select('id, nome').order('nome');
      return d || [];
    });
    const sel = document.getElementById('f-consultor');
    data.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.nome;
      sel.appendChild(opt);
    });
  }

  // ── Buscar obras do banco ───────────────────────────────────
  async function carregarObras() {
    const { data, error } = await db
      .from('obras')
      .select('*, consultores(nome)')
      .order('criado_em', { ascending: false });

    if (error) { mostrarErro(error); return; }
    todasObras = data;
    aplicarFiltroSalvo(); // pré-selecionar filtro se veio de obra_detail
    renderizar();
  }

  // ── Busca em tempo real ──────────────────────────────────────
  function buscar(val) {
    termoBusca = val.trim().toLowerCase();
    const limpar = document.getElementById('busca-limpar');
    if (limpar) limpar.style.display = termoBusca ? 'flex' : 'none';
    renderizar();
  }

  function limparBusca() {
    termoBusca = '';
    const campo  = document.getElementById('campo-busca');
    const limpar = document.getElementById('busca-limpar');
    if (campo)  campo.value          = '';
    if (limpar) limpar.style.display = 'none';
    renderizar();
    if (campo) campo.focus();
  }

  // ── Renderizar cards ────────────────────────────────────────
  function renderizar() {
    let obras = faseFiltro === 'todas'
      ? todasObras.filter(o => o.fase_atual !== 'entrega_comercial')
      : todasObras.filter(o => o.fase_atual === faseFiltro);

    if (termoBusca) {
      obras = obras.filter(o =>
        (o.nome_cliente          || '').toLowerCase().includes(termoBusca) ||
        (o.endereco              || '').toLowerCase().includes(termoBusca) ||
        (o.arquiteto_responsavel || '').toLowerCase().includes(termoBusca) ||
        (o.cod_shankya           || '').toLowerCase().includes(termoBusca) ||
        (o.consultores?.nome     || '').toLowerCase().includes(termoBusca)
      );
    }

    const contador = document.getElementById('contador');
    if (termoBusca) {
      contador.innerHTML = `<strong>${obras.length}</strong> resultado${obras.length !== 1 ? 's' : ''} para "<strong>${escHtml(termoBusca)}</strong>"`;
    } else {
      contador.innerHTML = `Exibindo <strong>${obras.length}</strong> obra${obras.length !== 1 ? 's' : ''}`;
    }

    const conteudo = document.getElementById('conteudo');

    if (obras.length === 0) {
      if (termoBusca) {
        conteudo.innerHTML = `
          <div class="estado">
            <i data-lucide="search-x"></i>
            <p>Nenhuma obra encontrada para "<strong style="color:var(--text-2)">${escHtml(termoBusca)}</strong>".</p>
            <small>Tente outro termo ou <button onclick="limparBusca()" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:inherit;padding:0;text-decoration:underline;">limpar a busca</button>.</small>
          </div>`;
      } else {
        conteudo.innerHTML = `
          <div class="estado">
            <i data-lucide="building-2"></i>
            <p>Nenhuma obra encontrada para este filtro.</p>
            <small>Tente selecionar outra fase ou criar uma nova obra.</small>
          </div>`;
      }
      lucide.createIcons();
      return;
    }

    conteudo.innerHTML = `<div class="grid">${obras.map(cardHTML).join('')}</div>`;
    lucide.createIcons();
  }

  // ── HTML de um card ─────────────────────────────────────────
  function cardHTML(obra) {
    const fase = FASES[obra.fase_atual] || { label: obra.fase_atual, prazo: '' };
    const consultor = obra.consultores?.nome ?? '—';
    const status = obra.status_compra ?? fase.prazo;

    return `
      <div class="card" onclick="window.location.href='obra_detail.html?id=${obra.id}'" title="Ver OS e fotos desta obra">
        <div class="card-topo">
          <div>
            <div class="card-cliente">${escHtml(obra.nome_cliente)}</div>
            <div class="card-id">#${String(obra.id).padStart(3,'0')}</div>
          </div>
          <span class="badge badge-${escHtml(obra.fase_atual)}">${escHtml(fase.label)}</span>
        </div>

        <div class="card-info">
          <i data-lucide="map-pin"></i>
          ${escHtml(obra.endereco || '—')}
        </div>
        ${obra.arquiteto_responsavel ? `<div class="card-info"><i data-lucide="hard-hat"></i>Arq: ${escHtml(obra.arquiteto_responsavel)}</div>` : ''}
        <div class="card-info">
          <i data-lucide="user"></i>
          Consultor: ${escHtml(consultor)}
        </div>

        <div class="card-footer">
          <span class="badge badge-compra">${escHtml(status)}</span>
        </div>
      </div>`;
  }

  // ── Mostrar erro amigável ───────────────────────────────────
  function mostrarErro(error) {
    document.getElementById('conteudo').innerHTML = `
      <div class="estado">
        <div class="erro-box">
          <h3>Erro ao carregar obras</h3>
          <code>${escHtml(error.message)}</code>
          <div class="dica">
            <strong>Solução recomendada:</strong> mantenha o Row Level Security (RLS) ativo
            e revise as políticas de acesso para cada perfil.
          </div>
        </div>
      </div>`;
    lucide.createIcons();
  }

  // ── Filtros de fase ──────────────────────────────────────────
  document.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro-btn').forEach(b => {
        b.classList.remove('ativo');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('ativo');
      btn.setAttribute('aria-pressed', 'true');
      faseFiltro = btn.dataset.fase;
      renderizar();
    });
  });

  // ── Pré-selecionar filtro ao voltar de obra_detail ──────────
  function aplicarFiltroSalvo() {
    try {
      const savedFase = sessionStorage.getItem('obraFaseFilter');
      if (!savedFase) return;
      sessionStorage.removeItem('obraFaseFilter');
      const btn = document.querySelector(`.filtro-btn[data-fase="${savedFase}"]`);
      if (btn) {
        document.querySelectorAll('.filtro-btn').forEach(b => {
          b.classList.remove('ativo');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('ativo');
        btn.setAttribute('aria-pressed', 'true');
        faseFiltro = savedFase;
        // pisca o botão para indicar o filtro ativo
        btn.style.transition = 'none';
        btn.style.transform = 'scale(1.08)';
        setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 300);
      }
    } catch(e) {}
  }

  // ── Modal Nova Obra ─────────────────────────────────────────
  function abrirModal() {
    if (userRole === 'tecnico') return; // técnicos não podem criar obras
    document.getElementById('f-cliente').value      = '';
    document.getElementById('f-endereco').value     = '';
    document.getElementById('f-arquiteto').value    = '';
    document.getElementById('f-consultor').value    = '';
    document.getElementById('f-fase').value          = 'nao_iniciado';
    document.getElementById('f-status-compra').value = '';
    document.getElementById('f-shankya').value      = '';
    document.getElementById('alertSucesso').style.display = 'none';
    document.getElementById('alertErro').style.display    = 'none';
    document.getElementById('overlay').classList.add('aberto');
  }

  function fecharModal() {
    document.getElementById('overlay').classList.remove('aberto');
  }

  function fecharModalFora(e) {
    if (e.target === document.getElementById('overlay')) fecharModal();
  }

  async function salvarObra() {
    const cliente = document.getElementById('f-cliente').value.trim();
    if (!cliente) {
      mostrarErroModal('O nome do cliente é obrigatório.');
      return;
    }

    const btn = document.getElementById('btn-salvar');
    btn.disabled = true; btn.textContent = 'Salvando...';

    const payload = {
      nome_cliente:          cliente,
      endereco:              document.getElementById('f-endereco').value.trim()      || null,
      arquiteto_responsavel: document.getElementById('f-arquiteto').value.trim()    || null,
      consultor_id:          document.getElementById('f-consultor').value            || null,
      fase_atual:            document.getElementById('f-fase').value,
      status_compra:         document.getElementById('f-status-compra').value.trim()|| null,
      cod_shankya:           document.getElementById('f-shankya').value.trim()      || null,
    };

    const { data, error } = await db
      .from('obras')
      .insert(payload)
      .select('*, consultores(nome)')
      .single();

    btn.disabled = false; btn.innerHTML = '<i data-lucide="save"></i> Salvar'; lucide.createIcons();

    if (error) {
      mostrarErroModal('Erro ao salvar: ' + error.message);
      return;
    }

    // Adicionar no topo da lista
    todasObras.unshift(data);
    renderizar();

    document.getElementById('alertSucesso').textContent = `Obra "${data.nome_cliente}" criada com sucesso!`;
    document.getElementById('alertSucesso').style.display = 'block';
    document.getElementById('alertErro').style.display = 'none';

    setTimeout(() => fecharModal(), 1800);
  }

  function mostrarErroModal(msg) {
    document.getElementById('alertErro').textContent = msg;
    document.getElementById('alertErro').style.display = 'block';
    document.getElementById('alertSucesso').style.display = 'none';
  }
  // ── Iniciar ─────────────────────────────────────────────────
  init();
</script>

<script>lucide.createIcons(); applyTheme(localStorage.getItem('tema') || 'auto');</script>
</body>
</html>
